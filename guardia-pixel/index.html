anas después, con IC progresiva y elevación persistente del ST."],"ref":"ESC 2023 SCA"},{"topic":"sca","subj":"cardio","id":"sca-10","dif":2,"stem":"Hombre de 60 años, 7 semanas después de un IAM anterior extenso tratado tarde. Tiene disnea de esfuerzo. ECG: elevación persistente del ST en V1–V4 con ondas Q. ¿Diagnóstico?","opts":["Reinfarto agudo","Aneurisma del ventrículo izquierdo","Pericarditis aguda","Síndrome de Brugada","Hiperkalemia"],"ans":1,"exp":"La elevación del ST que persiste semanas después de un IAM, con ondas Q, sugiere aneurisma ventricular: una zona de cicatriz que se mueve en sentido contrario (discinesia). Complicaciones: IC, arritmias ventriculares y trombo mural con embolia. Se confirma con ecocardiograma.","why":["Un reinfarto tendría dolor agudo y elevación nueva de troponina.","","La pericarditis da elevación difusa del ST con infradesnivel del PR.","Brugada es un patrón en V1–V2 en personas jóvenes, sin relación con un infarto.","La hiperkalemia da T picudas y QRS ancho."],"ref":"ESC 2023 SCA"},{"topic":"sca","subj":"cardio","id":"sca-11","dif":2,"stem":"Mujer de 74 años con hemorragia digestiva: Hb 6.2 g/dL y FC 128. Refiere opresión torácica. Troponina de alta sensibilidad elevada y en ascenso; ECG con infradesnivel difuso leve del ST. ¿Conducta más adecuada?","opts":["Coronariografía inmediata y doble antiagregación","Fibrinólisis","Tratar la causa: transfusión, control del sangrado y de la frecuencia cardiaca","Ignorar la troponina: es un falso positivo","Heparina a dosis plenas"],"ans":2,"exp":"IAM tipo 2: necrosis por desequilibrio entre aporte y demanda de oxígeno (anemia grave, taquicardia, hipotensión), sin ruptura de placa. Se trata corrigiendo la causa. Antiagregar o anticoagular a una paciente que sangra empeora todo.","why":["La doble antiagregación con sangrado activo es peligrosa, y la causa no es trombótica.","Contraindicada por el sangrado activo.","","Es una lesión miocárdica real con mal pronóstico.","Empeora la hemorragia."],"ref":"4ª definición universal de IAM"},{"topic":"sca","subj":"cardio","id":"sca-12","dif":2,"stem":"Hombre de 59 años con dolor torácico típico. ECG: infradesnivel del ST de 2 mm en V1–V3 con ondas R altas y T positivas. ¿Qué haces?","opts":["Tratarlo como SCASEST de bajo riesgo","Tomar derivaciones posteriores V7–V9","Tomar derivaciones derechas V3R–V4R","Repetir el ECG en 24 h","Hacer prueba de esfuerzo"],"ans":1,"exp":"El infradesnivel del ST en V1–V3 con R alta es la imagen en espejo de un IAM posterior (circunfleja o CD). Una elevación ≥0.5 mm en V7–V9 confirma IAMCEST posterior, que necesita reperfusión urgente.","why":["Es un equivalente de IAMCEST, no un SCASEST de bajo riesgo.","","V4R busca el VD; la pared posterior se ve en V7–V9.","Retrasa una posible reperfusión.","Está contraindicada en un SCA con dolor."],"ref":"ESC 2023 SCA"},{"topic":"sca","subj":"cardio","id":"sca-13","dif":3,"stem":"Hombre de 52 años que ayer tuvo dolor torácico; hoy está asintomático. ECG: T profundamente invertidas y simétricas en V2–V3, sin elevación del ST ni ondas Q. Troponina levemente elevada. ¿Qué significa y qué debes evitar?","opts":["Patrón de Wellens: estenosis crítica de la DA proximal; evitar la prueba de esfuerzo y programar coronariografía","Repolarización precoz benigna; alta","IAM antiguo cicatrizado; prueba de esfuerzo","Hipertrofia ventricular izquierda; ecocardiograma ambulatorio","Pericarditis; AINE y colchicina"],"ans":0,"exp":"El síndrome de Wellens (T bifásicas o profundamente invertidas en V2–V3 en un paciente sin dolor) indica estenosis crítica proximal de la descendente anterior, con alto riesgo de un IAM anterior extenso. Una prueba de esfuerzo puede desencadenarlo: va a coronariografía.","why":["","La repolarización precoz da elevación del ST, no T invertidas profundas.","Un IAM antiguo dejaría ondas Q, y la prueba de esfuerzo es peligrosa aquí.","La HVI da voltaje alto con sobrecarga lateral, no T profundas aisladas en V2–V3.","La pericarditis da elevación difusa del ST e infradesnivel del PR."],"ref":"ESC 2023 SCA"},{"topic":"sca","subj":"cardio","id":"sca-14","dif":1,"stem":"Hombre de 60 años con dolor torácico típico de 20 min. SatO₂ 96% al aire ambiente, PA 138/84. ¿Cuál de estas medidas iniciales es correcta?","opts":["Oxígeno a 10 L/min por mascarilla a todo paciente con SCA","Aspirina 150–300 mg VO masticada y ECG en ≤10 min","Morfina IV a todo paciente con dolor","Esperar la troponina antes de dar aspirina","Betabloqueador IV de rutina"],"ans":1,"exp":"Lo que siempre va: ECG en ≤10 min y aspirina masticada. Oxígeno solo si la SatO₂ es \u003c90%: el exceso no ayuda y puede dañar. La morfina se reserva para dolor intenso. El “MONA para todos” ya no se usa.","why":["Oxígeno solo si la SatO₂ es \u003c90%.","","Solo si el dolor es intenso y persistente; retrasa la absorción de los P2Y12.","La aspirina no espera la troponina.","No es rutina por riesgo de choque; el betabloqueador oral se inicia en las primeras 24 h si no hay contraindicaciones."],"ref":"ESC 2023 SCA"},{"topic":"sca","subj":"cardio","id":"sca-15","dif":2,"stem":"Hombre de 58 años, 6 semanas después de un IAMSEST. Toma atorvastatina 80 mg/día con buen apego. LDL 84 mg/dL (antes del evento era 160). ¿Qué haces?","opts":["Nada: ya bajó más del 50%","Agregar ezetimiba","Cambiar a simvastatina 80 mg","Agregar un fibrato","Suspender la estatina y dejar solo ezetimiba"],"ans":1,"exp":"Después de un SCA (muy alto riesgo) la meta es LDL \u003c55 mg/dL y reducción ≥50% de la basal. Si no se alcanza con estatina de alta intensidad a dosis máxima tolerada en 4–6 semanas, se agrega ezetimiba; si aun así no llega, un iPCSK9.","why":["Necesita las dos cosas: reducción ≥50% y LDL \u003c55.","","La simvastatina 80 mg es menos potente y tiene más riesgo de miopatía.","Los fibratos no reducen eventos sobre la estatina; se usan para triglicéridos muy altos.","Perderías el efecto de la estatina de alta intensidad."],"ref":"ESC 2023 SCA · ESC/EAS dislipidemias"},{"topic":"lra","subj":"nefro","id":"lra-01","dif":1,"stem":"Hombre de 68 años con 3 días de vómito y diarrea. FC 108, PA 98/60, mucosas secas. Cr 2.1 mg/dL (basal 1.0), BUN 58 mg/dL. Na urinario 12 mEq/L, FENa 0.4%, sedimento con cilindros hialinos. ¿Diagnóstico y manejo?","opts":["NTA; restricción de líquidos","LRA prerrenal; reposición con cristaloides","Nefritis intersticial; esteroides","LRA posrenal; sonda vesical","Glomerulonefritis; biopsia renal"],"ans":1,"exp":"Hipovolemia + FENa \u003c1% + Na urinario \u003c20 + BUN/Cr >20 (58/2.1 ≈ 28) + cilindros hialinos = prerrenal. El túbulo está sano y conserva sodio. Responde al volumen en 24–72 h.","why":["La NTA tiene FENa >2% y cilindros granulosos; restringir líquidos empeoraría la hipoperfusión.","","No hay fármaco desencadenante, exantema, eosinofilia ni cilindros leucocitarios.","No hay datos de obstrucción (globo vesical, hidronefrosis).","No hay hematuria dismórfica, cilindros eritrocitarios ni proteinuria."],"ref":"KDIGO LRA 2012"},{"topic":"lra","subj":"nefro","id":"lra-02","dif":1,"stem":"Mujer de 60 años hospitalizada. Creatinina basal 0.8 mg/dL; hoy 2.0 mg/dL. Uresis conservada. ¿Estadio KDIGO?","opts":["Estadio 1","Estadio 2","Estadio 3","No es LRA","No se puede estadificar sin la uresis"],"ans":1,"exp":"2.0 ÷ 0.8 = 2.5 veces la basal → estadio 2 (2.0–2.9). Estadio 1: 1.5–1.9 veces o ↑ ≥0.3 mg/dL. Estadio 3: ≥3 veces, Cr ≥4.0 o inicio de terapia de reemplazo renal.","why":["1.5–1.9 veces es estadio 1; ella tiene 2.5 veces.","","Necesitaría ≥3 veces (≥2.4 mg/dL), Cr ≥4.0 o diálisis.","Supera por mucho el aumento de 0.3 mg/dL.","Basta la creatinina; se toma el criterio que dé el estadio más alto."],"ref":"KDIGO LRA 2012"},{"topic":"lra","subj":"nefro","id":"lra-03","dif":2,"stem":"Hombre de 70 años (80 kg) en terapia intensiva. Creatinina de 1.0 a 1.6 mg/dL en 48 h. Uresis de 20 mL/h durante las últimas 26 horas. ¿Estadio KDIGO?","opts":["Estadio 1, por creatinina","Estadio 2","Estadio 3, por uresis","No es LRA","Estadio 1, porque se toma el criterio menor"],"ans":2,"exp":"20 mL/h ÷ 80 kg = 0.25 mL/kg/h por más de 24 h → estadio 3 (uresis \u003c0.3 mL/kg/h por ≥24 h o anuria ≥12 h). Cuando la creatinina y la uresis dan estadios distintos, se toma el más alto.","why":["Por creatinina sería estadio 1, pero se toma el criterio que dé el estadio mayor.","El estadio 2 es uresis \u003c0.5 por ≥12 h; él está por debajo de 0.3 por más de 24 h.","","Cumple criterios por creatinina y por uresis.","Es al revés: se toma el criterio mayor."],"ref":"KDIGO LRA 2012"},{"topic":"lra","subj":"nefro","id":"lra-04","dif":2,"stem":"Mujer de 54 años en choque séptico por pielonefritis, con hipotensión sostenida por 18 h. Día 3: Cr 3.8 mg/dL, FENa 3.1%, osmolaridad urinaria 290 mOsm/kg y sedimento con cilindros granulosos pardos. ¿Diagnóstico?","opts":["LRA prerrenal","Necrosis tubular aguda isquémica","Glomerulonefritis postinfecciosa","Nefropatía obstructiva","Síndrome hepatorrenal"],"ans":1,"exp":"La hipoperfusión prolongada mata a las células tubulares: ya no reabsorben sodio (FENa >2%) ni concentran la orina (≈300 mOsm/kg). Los cilindros granulosos “café lodoso” son el sello de la NTA.","why":["La prerrenal tendría FENa \u003c1% y orina concentrada (>500).","","Tendría cilindros eritrocitarios, hematuria y C3 bajo 1–3 semanas después de la infección.","No hay datos de obstrucción.","No tiene cirrosis, y el SHR tiene FENa \u003c1%."],"ref":"KDIGO LRA 2012"},{"topic":"lra","subj":"nefro","id":"lra-05","dif":2,"stem":"Hombre de 75 años con IC tratado con furosemida. Cr de 1.2 a 2.0 mg/dL después de un cuadro de diarrea. FENa 2.6%, FEUrea 24%. ¿Cómo lo interpretas?","opts":["NTA, por la FENa >2%","Prerrenal: la furosemida eleva falsamente la FENa, y la FEUrea \u003c35% es confiable","Posrenal","No se puede interpretar sin biopsia","Nefritis intersticial por furosemida"],"ans":1,"exp":"Los diuréticos aumentan la excreción de sodio y elevan la FENa aunque el riñón esté hipoperfundido. La urea se reabsorbe en el túbulo proximal y el diurético casi no la afecta: FEUrea \u003c35% = prerrenal; >50% = NTA.","why":["La FENa no es confiable con diuréticos.","","No hay datos de obstrucción.","Los índices urinarios bastan; la biopsia no está indicada.","No hay exantema, eosinofilia ni sedimento sugestivo, y la FEUrea indica prerrenal."],"ref":"KDIGO LRA 2012"},{"topic":"lra","subj":"nefro","id":"lra-06","dif":1,"stem":"Hombre de 78 años con HPB. Lleva 18 h sin orinar, con dolor suprapúbico y globo vesical palpable. Cr 3.4 (basal 1.1). USG: hidronefrosis bilateral. ¿Primer paso?","opts":["Furosemida IV","Colocar sonda vesical","Hemodiálisis urgente","Biopsia renal","Tomografía con contraste"],"ans":1,"exp":"LRA posrenal por obstrucción de la salida vesical. La sonda vesical es diagnóstica y terapéutica. Después vigila la diuresis posobstructiva: poliuria con pérdida de agua, sodio y potasio.","why":["El problema es mecánico; el diurético no destapa la uretra.","","Primero se libera la obstrucción; no hay indicación AEIOU descrita.","No está indicada con una causa obstructiva evidente.","El contraste es nefrotóxico y el USG ya dio el diagnóstico."],"ref":"KDIGO LRA 2012"},{"topic":"lra","subj":"nefro","id":"lra-07","dif":2,"stem":"Mujer de 72 años con HTA tratada con losartán e hidroclorotiazida. Empieza ibuprofeno por gonartrosis. A los 10 días, Cr de 0.9 a 2.2 mg/dL. ¿Cómo contribuye el losartán a la caída del filtrado?","opts":["Contrae la arteriola aferente","Dilata la arteriola eferente al bloquear el efecto de la angiotensina II","Es tóxico directo para el túbulo","Precipita cristales en el túbulo","Produce nefritis intersticial alérgica"],"ans":1,"exp":"Cuando baja la perfusión, el riñón sostiene el filtrado dilatando la aferente (prostaglandinas) y contrayendo la eferente (angiotensina II). El AINE quita la dilatación aferente, el ARA-II quita la contracción eferente y el diurético reduce el volumen: es el “triple golpe”.","why":["Eso lo hace el AINE al bloquear las prostaglandinas vasodilatadoras.","","Los ARA-II no son tóxicos para el túbulo.","Dan cristaluria fármacos como aciclovir, metotrexato, sulfas e indinavir.","La NIA la causan fármacos como betalactámicos, AINE o IBP; no es este mecanismo."],"ref":"Fisiología renal · KDIGO LRA 2012"},{"topic":"lra","subj":"nefro","id":"lra-08","dif":1,"stem":"Hombre de 66 años con ERC y LRA. K 7.2 mEq/L. ECG: T picudas, PR prolongado y QRS de 130 ms. ¿Qué das primero?","opts":["Poliestireno sulfonato de sodio oral","Gluconato de calcio al 10% IV","Furosemida IV","Bicarbonato de sodio IV a todos los pacientes","Hemodiálisis antes de cualquier medicamento"],"ans":1,"exp":"Con cambios en el ECG, lo primero es estabilizar la membrana del miocardio con calcio IV (10 mL de gluconato de calcio al 10% en 2–3 min; se repite si el ECG no mejora). No baja el potasio: después se redistribuye (insulina con glucosa, salbutamol) y se elimina (diurético, quelantes, diálisis).","why":["Tarda horas en actuar.","","Elimina potasio, pero lento y solo si orina.","Solo si hay acidosis metabólica.","Puede necesitarla, pero primero se protege el corazón con calcio mientras se prepara."],"ref":"KDIGO 2020 controversias del potasio"},{"topic":"lra","subj":"nefro","id":"lra-09","dif":1,"stem":"¿Cuál de estos hallazgos en un paciente con LRA es indicación de diálisis urgente?","opts":["Creatinina de 6.5 mg/dL en un paciente asintomático","BUN de 110 mg/dL sin síntomas","Frote pericárdico con dolor pleurítico (pericarditis urémica)","K de 5.8 mEq/L sin cambios en el ECG","pH 7.29 con HCO₃ de 17"],"ans":2,"exp":"AEIOU: Acidosis grave refractaria, Electrolitos (hiperkalemia refractaria), Intoxicaciones dializables, sobrecarga de volumen (Overload) refractaria y Uremia sintomática (pericarditis, encefalopatía, sangrado). Ninguna cifra aislada de creatinina o BUN es indicación.","why":["La cifra sola no indica diálisis.","Sin síntomas urémicos no es indicación urgente.","","Una hiperkalemia leve sin cambios en el ECG se maneja con medicamentos.","Es una acidosis leve; la indicación es acidosis grave (pH \u003c7.1–7.15) que no responde."],"ref":"KDIGO LRA 2012"},{"topic":"lra","subj":"nefro","id":"lra-10","dif":2,"stem":"Hombre de 24 años después de correr 42 km con calor. Orina oscura y mialgias. Tira reactiva: sangre +++. Sedimento: 0–2 eritrocitos por campo. CK 52 000 U/L, K 5.9, Cr 2.3. ¿Tratamiento principal?","opts":["Restricción de líquidos","Cristaloides IV abundantes para lograr una uresis alta (≈200–300 mL/h)","Furosemida sin reponer volumen","Esteroides IV","Biopsia renal"],"ans":1,"exp":"Tira positiva para sangre sin eritrocitos en el sedimento = pigmento (mioglobina). La rabdomiólisis daña el túbulo por obstrucción con cilindros, toxicidad del grupo hem y vasoconstricción. Lo que más ayuda es hidratar temprano y en abundancia. Vigila potasio y fósforo (altos), calcio (bajo al inicio) y síndrome compartimental.","why":["Empeoraría la precipitación de mioglobina.","","Los diuréticos sin volumen empeoran la hipoperfusión.","No hay un proceso inflamatorio que tratar.","El diagnóstico es clínico y de laboratorio."],"ref":"Bosch X, et al. N Engl J Med 2009"},{"topic":"lra","subj":"nefro","id":"lra-11","dif":2,"stem":"Mujer de 45 años que empezó amoxicilina hace 9 días por sinusitis. Tiene fiebre, exantema maculopapular y Cr de 0.8 a 2.4. EGO: leucocituria estéril y cilindros leucocitarios. Eosinofilia en sangre. ¿Diagnóstico y manejo?","opts":["Pielonefritis; cambiar de antibiótico","Nefritis intersticial aguda; suspender el fármaco (± esteroide)","NTA por amoxicilina; diálisis","Glomerulonefritis postinfecciosa; esteroides en pulsos","LRA prerrenal; líquidos"],"ans":1,"exp":"La NIA es una reacción de hipersensibilidad (betalactámicos, AINE, IBP, sulfas, rifampicina). La triada fiebre, exantema y eosinofilia solo aparece completa en una minoría, pero aquí está. Lo clave es suspender el fármaco; los esteroides se consideran si no mejora en pocos días.","why":["La leucocituria es estéril y el exantema apunta a hipersensibilidad, no a infección.","","La amoxicilina no es un tóxico tubular típico, y los cilindros leucocitarios no son de NTA.","Daría cilindros eritrocitarios e hipocomplementemia.","No hay hipovolemia y el sedimento es activo."],"ref":"Perazella MA, et al. Nat Rev Nephrol 2010"},{"topic":"lra","subj":"nefro","id":"lra-12","dif":2,"stem":"Hombre de 71 años, fumador, 3 semanas después de un cateterismo cardiaco. Cr de 1.1 a 2.8. Livedo reticularis en piernas, dedos azules y dolorosos con pulsos pedios presentes, eosinofilia y C3 bajo. ¿Diagnóstico?","opts":["Nefropatía por contraste","Enfermedad renal ateroembólica","Nefritis intersticial por contraste","Trombosis de la arteria renal","LRA prerrenal"],"ans":1,"exp":"Al manipular una aorta con ateromas se sueltan cristales de colesterol que tapan arteriolas: LRA subaguda (semanas), livedo, dedos azules con pulsos presentes, eosinofilia, eosinofiluria e hipocomplementemia. La biopsia muestra hendiduras de colesterol. El tratamiento es de soporte, con estatina.","why":["Aparece a las 24–72 h, sin livedo ni eosinofilia.","","No es una presentación típica del contraste.","Sería abrupta, con dolor en el flanco y LDH alta.","No hay hipovolemia ni fármacos hemodinámicos."],"ref":"Scolari F, Ravani P. Lancet 2010"},{"topic":"lra","subj":"nefro","id":"lra-13","dif":2,"stem":"Mujer de 69 años con ERC G3b (TFG 35) y DM2 que necesita una tomografía con contraste yodado. ¿Qué medida preventiva tiene respaldo?","opts":["N-acetilcisteína oral","Hidratación IV con solución isotónica antes y después del estudio","Hemodiálisis profiláctica después del contraste","Furosemida IV antes del estudio","Cancelar siempre el estudio"],"ans":1,"exp":"En pacientes con riesgo se usa hidratación IV isotónica, la menor dosis posible de contraste de baja osmolaridad y se suspenden los nefrotóxicos. La N-acetilcisteína no mostró beneficio (PRESERVE). ⚠️ El umbral de TFG para hidratar varía entre guías (\u003c30 en el consenso ACR-NKF 2020; algunos protocolos usan \u003c45).","why":["El ensayo PRESERVE no mostró beneficio.","","No previene la nefropatía y tiene riesgos.","Los diuréticos aumentan el riesgo.","Si el estudio es necesario, se hace con prevención."],"ref":"ACR-NKF 2020 · PRESERVE 2018"},{"topic":"lra","subj":"nefro","id":"lra-14","dif":2,"stem":"Paciente de 61 años con NTA oligúrica, euvolémico y sin edema pulmonar. El residente propone furosemida IV para “convertirla en no oligúrica”. ¿Qué es correcto?","opts":["Mejora la supervivencia y acelera la recuperación","No se recomienda para tratar la LRA; solo para manejar la sobrecarga de volumen","Está indicada en todos los pacientes oligúricos","Evita la necesidad de diálisis","Debe darse con manitol de rutina"],"ans":1,"exp":"KDIGO recomienda no usar diuréticos para prevenir ni tratar la LRA, salvo para manejar la sobrecarga de volumen. Producir más orina no cambia el pronóstico ni evita la diálisis.","why":["No mejora la supervivencia ni la recuperación.","","No hay indicación general en la oliguria.","No evita la diálisis.","El manitol tampoco se recomienda para prevenir ni tratar la LRA."],"ref":"KDIGO LRA 2012"},{"topic":"lra","subj":"nefro","id":"lra-15","dif":3,"stem":"Hombre de 56 años con cirrosis alcohólica y ascitis. Cr de 1.0 a 2.3 en 3 días. Se suspendieron los diuréticos y recibió albúmina 1 g/kg por 2 días sin mejoría. Sin choque, sin nefrotóxicos, sedimento normal, sin proteinuria, USG renal normal. FENa 0.2%. ¿Diagnóstico y tratamiento?","opts":["NTA; diálisis","Síndrome hepatorrenal (SHR-LRA); terlipresina con albúmina","Prerrenal por hipovolemia; más diuréticos","Nefropatía por IgA; esteroides","Nefropatía obstructiva; sonda vesical"],"ans":1,"exp":"SHR-LRA: LRA funcional en la cirrosis con ascitis, por vasodilatación esplácnica y vasoconstricción renal intensa. Se diagnostica cuando no responde a 2 días sin diuréticos y con albúmina 1 g/kg, sin choque, nefrotóxicos ni daño estructural. Tratamiento: vasoconstrictor (terlipresina, o norepinefrina en terapia intensiva) con albúmina; el definitivo es el trasplante hepático.","why":["Un sedimento normal con FENa muy baja no es NTA.","","La hipovolemia ya se descartó con la albúmina, y los diuréticos empeoran el cuadro.","No hay hematuria ni proteinuria.","El USG es normal, sin hidronefrosis."],"ref":"ICA/ADQI 2015 · AASLD 2021 ascitis y SHR"}],"cards":[{"id":"dm2-c01","topic":"dm2","f":"Criterios diagnósticos de diabetes (4)","b":"A1c ≥6.5% · glucosa en ayuno ≥126 · CTOG 2 h ≥200 · glucosa al azar ≥200 + síntomas"},{"id":"dm2-c02","topic":"dm2","f":"Rangos de prediabetes","b":"A1c 5.7–6.4% · ayuno 100–125 · CTOG 2 h 140–199 mg/dL"},{"id":"dm2-c03","topic":"dm2","f":"¿Cuántas pruebas anormales necesitas sin hiperglucemia inequívoca?","b":"Dos: dos pruebas distintas en la misma muestra o la misma prueba en otra muestra"},{"id":"dm2-c04","topic":"dm2","f":"¿Cuándo no sirve la A1c?","b":"Cuando cambia la vida del eritrocito: anemia, hemólisis, hemoglobinopatías, transfusión, embarazo, hemodiálisis"},{"id":"dm2-c05","topic":"dm2","f":"Meta general de A1c (ADA)","b":"\u003c7% · más estricta \u003c6.5% sin hipoglucemia · menos estricta \u003c8% en adultos mayores con comorbilidades"},{"id":"dm2-c06","topic":"dm2","f":"Metformina según TFG","b":"≥45: dosis normal · 30–44: no iniciar, máx. 1 000 mg/día · \u003c30: suspender"},{"id":"dm2-c07","topic":"dm2","f":"Efecto adverso de la metformina a largo plazo","b":"Déficit de vitamina B12 (anemia macrocítica, neuropatía)"},{"id":"dm2-c08","topic":"dm2","f":"Efectos adversos clave de los iSGLT2","b":"Micosis genital, depleción de volumen, cetoacidosis euglucémica, gangrena de Fournier (rara)"},{"id":"dm2-c09","topic":"dm2","f":"¿Cuándo suspender un iSGLT2 antes de cirugía?","b":"3 días antes (ertugliflozina 4)"},{"id":"dm2-c10","topic":"dm2","f":"Contraindicación de los arGLP-1","b":"Antecedente personal o familiar de carcinoma medular de tiroides o MEN2"},{"id":"dm2-c11","topic":"dm2","f":"DM2 + insuficiencia cardiaca","b":"iSGLT2"},{"id":"dm2-c12","topic":"dm2","f":"DM2 + ERC (TFG 20–60 o albuminuria)","b":"iSGLT2 (iniciar con TFG ≥20); semaglutida como adición o alternativa"},{"id":"dm2-c13","topic":"dm2","f":"DM2 + ECV aterosclerótica","b":"arGLP-1 o iSGLT2 con beneficio CV probado, sin importar la A1c"},{"id":"dm2-c14","topic":"dm2","f":"DM2 + obesidad (peso como prioridad)","b":"Semaglutida o tirzepatida"},{"id":"dm2-c15","topic":"dm2","f":"¿Cuándo iniciar insulina en DM2?","b":"Catabolismo (pérdida de peso, cetosis), A1c >10% o glucosa ≥300 con síntomas"},{"id":"dm2-c16","topic":"dm2","f":"Dosis inicial de insulina basal","b":"10 U/día o 0.1–0.2 U/kg/día; subir 2 U cada 3 días según la glucosa en ayuno"},{"id":"dm2-c17","topic":"dm2","f":"Niveles de hipoglucemia","b":"1: 54–69 · 2: \u003c54 · 3: grave, necesita ayuda de otra persona"},{"id":"dm2-c18","topic":"dm2","f":"Regla de 15","b":"15–20 g de glucosa oral, revalorar en 15 min y repetir si sigue \u003c70"},{"id":"dm2-c19","topic":"dm2","f":"Sulfonilurea a evitar en adultos mayores y ERC","b":"Glibenclamida: hipoglucemia prolongada"},{"id":"dm2-c20","topic":"dm2","f":"Tamizaje de complicaciones en DM2","b":"Al diagnóstico: fondo de ojo, CAC + TFG y pies con monofilamento; luego cada año"},{"id":"sca-c01","topic":"sca","f":"¿En cuánto tiempo debe tomarse el ECG en dolor torácico?","b":"≤10 min desde el primer contacto"},{"id":"sca-c02","topic":"sca","f":"Criterio de elevación del ST en V2–V3","b":"Hombre ≥40 años: ≥2 mm · hombre \u003c40: ≥2.5 mm · mujer: ≥1.5 mm (resto de derivaciones ≥1 mm)"},{"id":"sca-c03","topic":"sca","f":"DII, DIII, aVF","b":"IAM inferior → coronaria derecha (≈80–90%)"},{"id":"sca-c04","topic":"sca","f":"V1–V4","b":"IAM anterior → descendente anterior"},{"id":"sca-c05","topic":"sca","f":"DI, aVL, V5–V6","b":"IAM lateral → circunfleja o diagonal"},{"id":"sca-c06","topic":"sca","f":"Infradesnivel del ST en V1–V3 con R alta","b":"IAM posterior: toma V7–V9"},{"id":"sca-c07","topic":"sca","f":"Triada del IAM de VD","b":"Hipotensión + ingurgitación yugular + pulmones limpios → volumen, sin nitratos"},{"id":"sca-c08","topic":"sca","f":"Meta de tiempo para ICP primaria","b":"≤120 min desde el diagnóstico (≤60 min si ya está en un hospital con hemodinamia)"},{"id":"sca-c09","topic":"sca","f":"Si la ICP no llega a tiempo","b":"Fibrinólisis en ≤10 min desde el diagnóstico (tenecteplasa)"},{"id":"sca-c10","topic":"sca","f":"¿Cómo sabes que la fibrinólisis funcionó?","b":"El ST baja ≥50% a los 60–90 min y cede el dolor; si no, ICP de rescate"},{"id":"sca-c11","topic":"sca","f":"Después de una fibrinólisis exitosa","b":"Coronariografía en 2–24 h"},{"id":"sca-c12","topic":"sca","f":"Contraindicaciones absolutas de fibrinólisis","b":"HIC previa · EVC isquémico \u003c6 meses · daño o neoplasia del SNC · trauma, cirugía o TCE \u003c1 mes · sangrado GI \u003c1 mes · trastorno hemorrágico · disección aórtica · punciones no compresibles \u003c24 h"},{"id":"sca-c13","topic":"sca","f":"SCASEST: coronariografía inmediata (\u003c2 h) si…","b":"Choque o inestabilidad, dolor refractario, arritmias graves o paro, complicación mecánica, IC aguda, cambios dinámicos recurrentes del ST"},{"id":"sca-c14","topic":"sca","f":"SCASEST: coronariografía temprana (\u003c24 h) si…","b":"IAMSEST confirmado, cambios dinámicos del ST/T, elevación transitoria del ST o GRACE >140"},{"id":"sca-c15","topic":"sca","f":"Prasugrel: contraindicación y ajuste","b":"Contraindicado con EVC o AIT previo; 5 mg/día si ≥75 años o \u003c60 kg"},{"id":"sca-c16","topic":"sca","f":"Ticagrelor: dosis y efecto adverso","b":"Carga 180 mg, luego 90 mg c/12 h; disnea"},{"id":"sca-c17","topic":"sca","f":"¿Cuándo usar clopidogrel en SCA?","b":"Con fibrinólisis, si necesita anticoagulante oral o si no hay ticagrelor ni prasugrel"},{"id":"sca-c18","topic":"sca","f":"Duración de la doble antiagregación","b":"12 meses de forma predeterminada"},{"id":"sca-c19","topic":"sca","f":"Meta de LDL después de un SCA","b":"\u003c55 mg/dL y reducción ≥50%"},{"id":"sca-c20","topic":"sca","f":"Ruptura de músculo papilar","b":"IAM inferior, días 2–7: insuficiencia mitral aguda con edema pulmonar"},{"id":"sca-c21","topic":"sca","f":"Elevación del ST que persiste semanas después de un IAM","b":"Aneurisma ventricular"},{"id":"sca-c22","topic":"sca","f":"Clasificación de Killip","b":"I sin IC · II estertores o S3 · III edema pulmonar · IV choque"},{"id":"sca-c23","topic":"sca","f":"Las 7 variables de TIMI (SCASEST)","b":"Edad ≥65 · ≥3 factores de riesgo · coronariopatía conocida ≥50% · aspirina en 7 días · ≥2 anginas en 24 h · desviación del ST ≥0.5 mm · marcador positivo"},{"id":"lra-c01","topic":"lra","f":"Definición de LRA (KDIGO)","b":"Cr ↑ ≥0.3 mg/dL en 48 h · Cr ↑ ≥1.5 veces la basal en 7 días · uresis \u003c0.5 mL/kg/h por 6 h"},{"id":"lra-c02","topic":"lra","f":"LRA estadio 1","b":"1.5–1.9 veces la basal o ↑ ≥0.3 mg/dL · uresis \u003c0.5 por 6–12 h"},{"id":"lra-c03","topic":"lra","f":"LRA estadio 2","b":"2.0–2.9 veces la basal · uresis \u003c0.5 por ≥12 h"},{"id":"lra-c04","topic":"lra","f":"LRA estadio 3","b":"≥3 veces, Cr ≥4.0 o terapia de reemplazo renal · uresis \u003c0.3 por ≥24 h o anuria ≥12 h"},{"id":"lra-c05","topic":"lra","f":"Fórmula de la FENa","b":"(Na orina × Cr plasma) ÷ (Na plasma × Cr orina) × 100"},{"id":"lra-c06","topic":"lra","f":"FENa \u003c1% sin ser prerrenal","b":"Contraste, mioglobinuria o hemoglobinuria, GN aguda, obstrucción temprana"},{"id":"lra-c07","topic":"lra","f":"Si el paciente toma diurético, usa…","b":"FEUrea: \u003c35% prerrenal, >50% NTA"},{"id":"lra-c08","topic":"lra","f":"Cilindros granulosos “café lodoso”","b":"Necrosis tubular aguda"},{"id":"lra-c09","topic":"lra","f":"Cilindros eritrocitarios","b":"Glomerulonefritis"},{"id":"lra-c10","topic":"lra","f":"Cilindros leucocitarios + exantema + fiebre + eosinofilia","b":"Nefritis intersticial aguda (suspender el fármaco)"},{"id":"lra-c11","topic":"lra","f":"Triple golpe","b":"AINE + IECA o ARA-II + diurético"},{"id":"lra-c12","topic":"lra","f":"Efecto del AINE en el glomérulo","b":"Contrae la aferente (bloquea prostaglandinas)"},{"id":"lra-c13","topic":"lra","f":"Efecto del IECA o ARA-II en el glomérulo","b":"Dilata la eferente (sin angiotensina II) → ↓ presión de filtración"},{"id":"lra-c14","topic":"lra","f":"AEIOU","b":"Acidosis · Electrolitos · Intoxicaciones · Overload · Uremia"},{"id":"lra-c15","topic":"lra","f":"Hiperkalemia con cambios en el ECG: primer paso","b":"Gluconato de calcio al 10%, 10 mL IV"},{"id":"lra-c16","topic":"lra","f":"Hiperkalemia: cómo meter el K a la célula","b":"Insulina rápida 10 U + 25 g de glucosa; salbutamol nebulizado"},{"id":"lra-c17","topic":"lra","f":"ECG de la hiperkalemia, en orden","b":"T picudas → PR largo y P plana → QRS ancho → onda sinusoidal"},{"id":"lra-c18","topic":"lra","f":"Pista de rabdomiólisis en el EGO","b":"Tira positiva para sangre sin eritrocitos en el sedimento"},{"id":"lra-c19","topic":"lra","f":"Primer estudio de imagen en LRA","b":"USG renal: busca hidronefrosis"},{"id":"lra-c20","topic":"lra","f":"Ateroembolia renal","b":"Después de un cateterismo: livedo, dedos azules con pulsos, eosinofilia, C3 bajo"}],"cases":[{"id":"g-dm2","topic":"dm2","subj":"endo","title":"La consulta de don Ramiro","place":"Consulta externa de Medicina Interna","patient":{"name":"Ramiro","age":56,"sex":"H","skin":"#C98B62","hair":"#2A1C14","gown":"#5BA7E0"},"intro":"Chofer de 56 años con IMC 33. Tuvo un IAM hace 2 años (stent en la DA). Lo mandan del trabajo porque le salió “alta el azúcar”.","extra":{"label":"GLU","unit":"mg/dL"},"start":{"FC":78,"PAS":138,"PAD":86,"SpO2":97,"FR":16,"X":"—"},"nodes":[{"tag":"Consulta 1","ecg":"normal","text":"Asintomático. En el laboratorio de la empresa: A1c 6.8%. En esa muestra no se midió glucosa.","q":"¿Qué haces?","A":{"t":"Diagnosticar DM2 hoy e iniciar tratamiento","ok":false,"res":"Etiquetaste diabetes con un solo resultado en un paciente sin síntomas."},"B":{"t":"Confirmar con una segunda prueba: glucosa en ayuno o repetir la A1c","ok":true,"res":"Al día siguiente: glucosa plasmática en ayuno de 141 mg/dL. Diagnóstico confirmado.","vit":{"X":141}},"why":"Sin hiperglucemia inequívoca se necesitan dos resultados alterados, en la misma muestra o en muestras distintas."},{"tag":"Consulta 1 · tratamiento","ecg":"normal","vit":{"X":141},"text":"DM2 confirmada. TFG 82, sin albuminuria. Recuerda que tuvo un IAM hace 2 años.","q":"¿Con qué inicias?","A":{"t":"Metformina más un arGLP-1 o iSGLT2 con beneficio cardiovascular probado","ok":true,"res":"Inicias metformina titulada y semaglutida semanal. Le explicas que la náusea es esperable al subir la dosis.","vit":{"X":118}},"B":{"t":"Metformina sola y cita en 3 meses","ok":false,"res":"La glucosa baja, pero no le diste la protección cardiovascular que necesita alguien con IAM previo.","vit":{"X":128}},"why":"Con ECV aterosclerótica establecida, la ADA indica arGLP-1 o iSGLT2 con beneficio CV probado desde el inicio, sin importar la A1c ni la metformina."},{"tag":"6 meses después","ecg":"normal","vit":{"FC":74,"PAS":128,"PAD":80,"X":112},"text":"Bajó 6 kg y su A1c es 6.6%. Se agregó empagliflozina por albuminuria nueva (CAC 60 mg/g). La próxima semana lo operan de una hernia inguinal.","q":"¿Qué indicas sobre la empagliflozina?","A":{"t":"Seguir tomándola hasta la mañana de la cirugía","ok":false,"res":"Llegaría a cirugía con un iSGLT2 y en ayuno: riesgo alto de cetoacidosis euglucémica."},"B":{"t":"Suspenderla 3 días antes de la cirugía y reiniciarla cuando coma y esté estable","ok":true,"res":"Le das las indicaciones por escrito, para él y para el cirujano."},"why":"Los iSGLT2 se suspenden 3 días antes de una cirugía programada (ertugliflozina, 4) por el riesgo de cetoacidosis euglucémica."},{"tag":"Postoperatorio, día 1","ecg":"tachy","vit":{"FC":116,"PAS":104,"PAD":64,"SpO2":97,"FR":28,"X":196},"text":"En el otro hospital no leyeron tu nota y siguió con la empagliflozina. Lleva 36 h de ayuno. Náusea, vómito, dolor abdominal y respiración profunda. pH 7.18, HCO₃ 11, brecha aniónica 24, β-hidroxibutirato alto.","q":"¿Qué está pasando?","A":{"t":"No es cetoacidosis porque la glucosa es \u003c250: antiemético y observar","ok":false,"res":"Cuatro horas después: pH 7.08 y más taquipnea. Lo pasan a terapia intensiva.","vit":{"FC":128,"PAS":92,"PAD":56,"FR":32}},"B":{"t":"Cetoacidosis euglucémica por iSGLT2: suspenderlo, líquidos, insulina IV con dextrosa y potasio","ok":true,"res":"En 18 h se cierra la brecha aniónica. Pasa a insulina subcutánea y luego a su esquema.","ecg":"normal","vit":{"FC":92,"PAS":122,"PAD":76,"FR":18,"X":150}},"why":"Con iSGLT2 la CAD puede cursar con glucosa \u003c250 mg/dL. Se trata como cualquier CAD, pero con dextrosa desde el inicio para poder dar insulina sin causar hipoglucemia."},{"tag":"Un año después","ecg":"normal","vit":{"FC":76,"PAS":126,"PAD":78,"SpO2":97,"FR":16,"X":124},"text":"Su ERC avanzó: TFG 38 mL/min/1.73 m² y CAC 350 mg/g. Toma metformina 1 g c/12 h, semaglutida y empagliflozina. A1c 6.9%.","q":"¿Qué ajustas?","A":{"t":"Suspender la metformina por la TFG","ok":false,"res":"Pierdes un fármaco útil y barato: con TFG 38 todavía se puede usar a dosis reducida.","vit":{"X":150}},"B":{"t":"Bajar la metformina a 1 000 mg/día y continuar empagliflozina y semaglutida","ok":true,"res":"Agregas losartán titulado y pides CAC y TFG cada 3–6 meses."},"why":"TFG 30–44: metformina máximo 1 000 mg/día (suspender si \u003c30). El iSGLT2 se mantiene aunque la TFG baje, hasta que requiera diálisis. Con albuminuria, agrega IECA o ARA-II a dosis máxima tolerada."},{"tag":"Su papá, en la sala de espera","ecg":"tachy","vit":{"FC":98,"PAS":110,"PAD":70,"SpO2":96,"FR":18,"X":46},"text":"Don Aurelio, 84 años, frágil, TFG 30, toma glibenclamida 5 mg c/12 h. Está somnoliento y sudoroso, pero responde y traga bien. Glucosa capilar 46 mg/dL.","q":"¿Qué haces?","A":{"t":"15–20 g de glucosa oral, repetir en 15 min, observarlo varias horas y suspender la glibenclamida","ok":true,"res":"Sube a 112 mg/dL. Lo observas por la vida media larga de la sulfonilurea, cambias a linagliptina y relajas su meta de A1c.","ecg":"normal","vit":{"FC":84,"X":112}},"B":{"t":"Darle un jugo y mandarlo a casa con la misma dosis","ok":false,"res":"Regresa en la madrugada inconsciente: la glibenclamida seguía actuando.","vit":{"X":38}},"why":"Hipoglucemia nivel 2 (\u003c54 mg/dL). La glibenclamida tiene metabolitos activos de eliminación renal: en adultos mayores con ERC la hipoglucemia es prolongada. Requiere observación y cambio de fármaco."}]},{"id":"g-sca","topic":"sca","subj":"cardio","title":"Dolor a las 3 a. m.","place":"Urgencias · tu hospital tiene hemodinamia 24 h","patient":{"name":"Ernesto","age":61,"sex":"H","skin":"#D9A07A","hair":"#8C8C96","gown":"#7FC8A9"},"intro":"Fumador, con DM2 e HTA. Tuvo un EVC isquémico hace 2 años, sin secuelas. Llega con dolor opresivo retroesternal de 40 min, irradiado a la mandíbula, con diaforesis.","extra":{"label":"DOLOR","unit":"/10"},"start":{"FC":98,"PAS":118,"PAD":72,"SpO2":96,"FR":20,"X":8},"nodes":[{"tag":"Minuto 0","ecg":"normal","text":"Lo pasas a la sala de choque. Está pálido y diaforético.","q":"¿Qué haces primero?","A":{"t":"ECG de 12 derivaciones en los primeros 10 minutos","ok":true,"res":"ECG a los 6 min: elevación del ST de 3 mm en DII, DIII y aVF, con infradesnivel en DI y aVL.","ecg":"stemi"},"B":{"t":"Pedir troponina y esperar el resultado para decidir","ok":false,"res":"Pasan 50 min esperando al laboratorio. Cuando por fin le toman el ECG: elevación del ST en DII, DIII y aVF. Miocardio perdido.","ecg":"stemi","vit":{"FC":104}},"why":"El ECG se toma en ≤10 min desde el primer contacto. En IAMCEST la troponina no se espera para reperfundir."},{"tag":"Minuto 8","ecg":"stemi","vit":{"FC":58,"PAS":84,"PAD":52},"text":"IAMCEST inferior. Ahora está hipotenso, con ingurgitación yugular y campos pulmonares limpios.","q":"¿Siguiente paso?","A":{"t":"Nitroglicerina sublingual para el dolor","ok":false,"res":"La PA cae a 64/40. El VD infartado dependía de su precarga.","vit":{"PAS":64,"PAD":40}},"B":{"t":"Derivaciones derechas (V4R) y carga de cristaloide","ok":true,"res":"V4R con elevación del ST: infarto del VD. Con 500 mL de cristaloide la PA sube a 102/64.","vit":{"PAS":102,"PAD":64}},"why":"IAM inferior + hipotensión + IY + pulmones limpios = IAM de VD. Volumen; evita nitratos, diuréticos y morfina."},{"tag":"Minuto 12","ecg":"stemi","vit":{"PAS":102,"PAD":64},"text":"La sala de hemodinamia está disponible. Lleva 52 min de síntomas.","q":"¿Cómo reperfundes?","A":{"t":"Fibrinólisis con tenecteplasa en urgencias","ok":false,"res":"Podía recibir ICP primaria en menos de 60 min, que es superior a la fibrinólisis."},"B":{"t":"Activar hemodinamia para ICP primaria (meta ≤60 min desde el diagnóstico)","ok":true,"res":"La guía cruza la lesión a los 48 min del diagnóstico."},"why":"Si la ICP primaria puede hacerse en ≤120 min, es la de elección; en un hospital con hemodinamia la meta es ≤60 min. La fibrinólisis es para cuando la ICP no llega a tiempo."},{"tag":"Sala de hemodinamia","ecg":"stemi","text":"Ya recibió aspirina 300 mg masticada. Falta el inhibidor P2Y12. Recuerda su EVC isquémico de hace 2 años.","q":"¿Cuál das?","A":{"t":"Prasugrel 60 mg","ok":false,"res":"El prasugrel está contraindicado con EVC o AIT previo por el riesgo de hemorragia intracraneal. El hemodinamista lo cambia por ticagrelor."},"B":{"t":"Ticagrelor 180 mg","ok":true,"res":"Le colocan un stent farmacoactivo en la CD proximal. Flujo TIMI 3."},"after":{"ecg":"normal","vit":{"FC":72,"PAS":112,"PAD":70,"X":2}},"why":"Prasugrel y ticagrelor se prefieren sobre clopidogrel en SCA, pero el prasugrel está contraindicado con antecedente de EVC o AIT."},{"tag":"Día 4 · Unidad coronaria","ecg":"tachy","vit":{"FC":118,"PAS":88,"PAD":56,"SpO2":86,"FR":30,"X":3},"text":"Disnea súbita. Estertores en ambos campos y un soplo holosistólico nuevo en el ápex que se irradia a la axila.","q":"¿Qué sospechas?","A":{"t":"Ruptura del músculo papilar posteromedial: ecocardiograma urgente y cirugía","ok":true,"res":"El eco muestra una valva mitral flácida con insuficiencia grave. Balón de contrapulsación como puente y cirugía urgente.","vit":{"FC":100,"PAS":98,"PAD":62,"SpO2":93}},"B":{"t":"Pericarditis post-IAM: AINE y colchicina","ok":false,"res":"Pasan horas sin tratar una insuficiencia mitral aguda: edema pulmonar franco y choque.","vit":{"PAS":72,"PAD":44,"SpO2":80}},"why":"IAM inferior + días 2–7 + soplo holosistólico apical nuevo + edema pulmonar = ruptura del papilar posteromedial, que tiene irrigación única. Es una urgencia quirúrgica."},{"tag":"Alta, día 14","ecg":"normal","vit":{"FC":66,"PAS":118,"PAD":72,"SpO2":97,"FR":16,"X":0},"text":"FEVI 38%. Tiene DM2. LDL al ingreso: 128 mg/dL.","q":"¿Qué tratamiento de alta indicas?","A":{"t":"Aspirina + ticagrelor por 12 meses, atorvastatina 80 mg, betabloqueador, IECA, eplerenona e iSGLT2","ok":true,"res":"Lo refieres a rehabilitación cardiaca y a la clínica de tabaquismo."},"B":{"t":"Solo aspirina y atorvastatina 20 mg, porque ya tiene stent","ok":false,"res":"Sin P2Y12 aumenta el riesgo de trombosis del stent, y con FEVI 38% pierde el beneficio en mortalidad de betabloqueador, IECA y ARM."},"why":"Doble antiagregación por 12 meses, estatina de alta intensidad (meta LDL \u003c55) y, con FEVI ≤40%: betabloqueador, IECA o ARA-II, ARM (si hay IC o DM) e iSGLT2."}]},{"id":"g-lra","topic":"lra","subj":"nefro","title":"La rodilla de doña Carmen","place":"Urgencias","patient":{"name":"Carmen","age":74,"sex":"M","skin":"#E2B08A","hair":"#D9D9E3","gown":"#E79AB3"},"intro":"Tiene HTA tratada con losartán 100 mg e hidroclorotiazida 25 mg. Por dolor de rodilla toma ibuprofeno 400 mg c/8 h desde hace 10 días. Lleva 3 días con diarrea. Llega débil y mareada.","extra":{"label":"K⁺","unit":"mEq/L"},"start":{"FC":52,"PAS":96,"PAD":58,"SpO2":97,"FR":20,"X":6.9},"nodes":[{"tag":"Llegada","ecg":"peakedT","text":"Cr 2.6 mg/dL (basal 0.9), K 6.9 mEq/L, HCO₃ 17. El monitor muestra T picudas y PR largo.","q":"¿Qué das primero?","A":{"t":"Gluconato de calcio al 10% IV","ok":true,"res":"Las T siguen picudas, pero el QRS se mantiene angosto. Ganaste tiempo."},"B":{"t":"Poliestireno sulfonato oral y repetir el K en 6 h","ok":false,"res":"El quelante tarda horas. El QRS se ensancha. Tu residente le pasa calcio IV.","ecg":"wide","vit":{"FC":44}},"after":{"ecg":"peakedT","vit":{"FC":52}},"why":"Con cambios en el ECG, lo primero es estabilizar la membrana con calcio IV. No baja el potasio, pero protege del paro."},{"tag":"Minuto 10","ecg":"peakedT","text":"Ya recibió calcio. El potasio sigue en 6.9.","q":"¿Ahora qué?","A":{"t":"Furosemida 80 mg IV para eliminar el potasio","ok":false,"res":"Está hipovolémica: la furosemida empeora la perfusión renal y la hipotensión.","vit":{"PAS":86,"PAD":52}},"B":{"t":"Insulina rápida 10 U IV con 25 g de glucosa, y salbutamol nebulizado","ok":true,"res":"A los 60 min el potasio baja a 5.8 y el ECG mejora."},"after":{"ecg":"normal","vit":{"FC":76,"X":5.8}},"why":"Después del calcio, se mete el potasio a la célula: insulina con glucosa (vigila hipoglucemia) y salbutamol. Los diuréticos solo sirven para eliminarlo si hay buen volumen y orina."},{"tag":"Hora 1","ecg":"normal","vit":{"FC":102,"PAS":98,"PAD":60},"text":"EGO: densidad 1.028, sedimento con cilindros hialinos. Na urinario 11, FENa 0.3%, osmolaridad urinaria 620. BUN 64.","q":"¿Qué tipo de LRA es y qué haces?","A":{"t":"Prerrenal: suspender ibuprofeno, losartán e HCTZ y reponer volumen con cristaloide balanceado","ok":true,"res":"Con 1.5 L de Hartmann mejora la PA y orina 0.8 mL/kg/h.","vit":{"FC":86,"PAS":118,"PAD":70}},"B":{"t":"NTA: restringir líquidos e iniciar furosemida","ok":false,"res":"La hipoperfusión se prolonga… y puede convertir la prerrenal en una NTA de verdad.","vit":{"PAS":88,"PAD":54}},"why":"Hipovolemia + triple golpe (AINE + ARA-II + diurético) + FENa \u003c1% + orina concentrada + cilindros hialinos = prerrenal. Volumen y quitar la causa. El Hartmann no empeora la hiperkalemia y ayuda a corregir la acidosis."},{"tag":"Hora 2","ecg":"normal","vit":{"FC":86,"PAS":118,"PAD":70},"text":"Creatinina basal 0.9 mg/dL; hoy 2.6 mg/dL.","q":"¿Qué estadio KDIGO tiene?","A":{"t":"Estadio 2","ok":true,"res":"2.6 ÷ 0.9 = 2.9 veces la basal: estadio 2."},"B":{"t":"Estadio 3","ok":false,"res":"Para estadio 3 necesitaría ≥3 veces la basal (≥2.7), Cr ≥4.0 o diálisis."},"why":"Estadio 1: 1.5–1.9 veces · Estadio 2: 2.0–2.9 veces · Estadio 3: ≥3 veces, Cr ≥4.0 o terapia de reemplazo renal."},{"tag":"Día 3","ecg":"normal","vit":{"FC":78,"PAS":132,"PAD":78,"SpO2":98,"FR":16,"X":4.6},"text":"Cr 1.2 mg/dL con diuresis adecuada. Su hija pregunta qué medicamentos debe tomar al alta.","q":"¿Qué indicas?","A":{"t":"Reiniciar losartán, HCTZ e ibuprofeno como antes","ok":false,"res":"En 2 semanas regresa con la misma LRA."},"B":{"t":"Reiniciar el ARA-II cuando esté euvolémica con Cr estable, revisar Cr y K en 1–2 semanas, y cambiar el ibuprofeno por paracetamol o AINE tópico","ok":true,"res":"Le das un plan para “días de enfermedad”: si vuelve a tener diarrea o vómito, suspender temporalmente losartán y diurético."},"why":"El ARA-II protege a largo plazo, pero se reinicia con euvolemia y vigilancia. En adultos mayores con HTA o ERC se evitan los AINE orales; para la gonartrosis, AINE tópico o paracetamol."}]}],"lessons":{"dm2":{"hook":"Lo que más preguntan: cómo se confirma el diagnóstico, cuál es la meta y qué fármaco eliges según la comorbilidad del paciente.","anim":"dm2","compare":["sglt2-glp1"],"sections":[{"h":"Diagnóstico","html":"\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>Prueba\u003c/th>\u003cth>Prediabetes\u003c/th>\u003cth>Diabetes\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>A1c\u003c/td>\u003ctd>5.7–6.4%\u003c/td>\u003ctd>\u003cb>≥6.5%\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Glucosa en ayuno (≥8 h)\u003c/td>\u003ctd>100–125 mg/dL\u003c/td>\u003ctd>\u003cb>≥126 mg/dL\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Glucosa 2 h en CTOG 75 g\u003c/td>\u003ctd>140–199 mg/dL\u003c/td>\u003ctd>\u003cb>≥200 mg/dL\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Glucosa plasmática al azar\u003c/td>\u003ctd>—\u003c/td>\u003ctd>\u003cb>≥200 mg/dL\u003c/b> + síntomas clásicos o crisis hiperglucémica\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cb>Sin hiperglucemia inequívoca necesitas dos resultados anormales\u003c/b>: dos pruebas distintas en la misma muestra, o la misma prueba en una segunda muestra.\u003c/li>\n\u003cli>Si dos pruebas no coinciden, repite la que salió por arriba del punto de corte.\u003c/li>\n\u003cli>La A1c no sirve cuando cambia la vida del eritrocito: anemia ferropénica o hemolítica, hemoglobinopatías, transfusión o sangrado reciente, embarazo, hemodiálisis, eritropoyetina. Ahí usa glucosa.\u003c/li>\n\u003cli>\u003cb>Tamizaje\u003c/b>: a todos desde los 35 años; antes si IMC ≥25 (≥23 en asiáticos) con algún factor de riesgo (familiar de primer grado, HTA, HDL &lt;35 o TG &gt;250, SOP, acantosis, ECV, sedentarismo). Si es normal, repetir cada 3 años; si hay prediabetes, cada año.\u003c/li>\n\u003c/ul>"},{"h":"Metas","html":"\n\u003cul>\n\u003cli>\u003cb>A1c &lt;7%\u003c/b> para la mayoría de los adultos.\u003c/li>\n\u003cli>\u003cb>Más estricta (&lt;6.5%)\u003c/b> si se logra sin hipoglucemia: paciente joven, diagnóstico reciente, sin ECV.\u003c/li>\n\u003cli>\u003cb>Menos estricta (&lt;8%)\u003c/b> en adultos mayores con varias enfermedades crónicas o deterioro cognitivo leve-moderado, hipoglucemias graves previas o expectativa de vida corta. En el adulto mayor muy frágil no se persigue la A1c: se evitan la hipoglucemia y la hiperglucemia sintomática.\u003c/li>\n\u003cli>Glucosa capilar antes de comer 80–130 mg/dL; pico después de comer &lt;180 mg/dL.\u003c/li>\n\u003cli>Con monitoreo continuo: tiempo en rango (70–180) &gt;70%, tiempo &lt;70 mg/dL &lt;4% y &lt;54 mg/dL &lt;1%.\u003c/li>\n\u003cli>PA &lt;130/80 mmHg. LDL &lt;70 mg/dL (40–75 años con ≥1 factor de riesgo) y &lt;55 mg/dL si ya tiene ECV aterosclerótica.\u003c/li>\n\u003c/ul>"},{"h":"Los fármacos","html":"\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>Grupo\u003c/th>\u003cth>Cómo funciona\u003c/th>\u003cth>A favor\u003c/th>\u003cth>En contra\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Metformina\u003c/b>\u003c/td>\u003ctd>↓ producción hepática de glucosa (activa AMPK)\u003c/td>\u003ctd>Barata, sin hipoglucemia, peso neutro o ↓ leve\u003c/td>\u003ctd>Diarrea y náusea (iniciar 500 mg y titular). Déficit de B12. Acidosis láctica rara. TFG &lt;30: suspender; 30–44: no iniciar y máx. 1 000 mg/día\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>iSGLT2\u003c/b> (-flozina)\u003c/td>\u003ctd>Bloquea la reabsorción de glucosa y sodio en el túbulo proximal → glucosuria\u003c/td>\u003ctd>↓ hospitalización por IC (FEr y FEp), frena la ERC, ↓ peso y PA, sin hipoglucemia\u003c/td>\u003ctd>Micosis genital, depleción de volumen, cetoacidosis euglucémica (suspender 3 días antes de cirugía). Para proteger riñón y corazón se inicia con TFG ≥20\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>arGLP-1\u003c/b> (-glutida) y tirzepatida\u003c/td>\u003ctd>↑ insulina dependiente de glucosa, ↓ glucagón, vaciamiento gástrico lento, saciedad\u003c/td>\u003ctd>↓ A1c y peso muy marcada; ↓ IAM, EVC y muerte CV (liraglutida, semaglutida, dulaglutida); semaglutida frena la ERC\u003c/td>\u003ctd>Náusea y vómito, colelitiasis, precaución con pancreatitis previa. Contraindicado con antecedente personal o familiar de carcinoma medular de tiroides o MEN2\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>iDPP-4\u003c/b> (-gliptina)\u003c/td>\u003ctd>Evitan que se degraden las incretinas propias\u003c/td>\u003ctd>Bien tolerados, peso neutro, sin hipoglucemia; linagliptina sin ajuste renal\u003c/td>\u003ctd>Potencia modesta (≈0.5–0.8% de A1c). Saxagliptina ↑ hospitalización por IC. No combinar con arGLP-1\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Sulfonilureas\u003c/b>\u003c/td>\u003ctd>Cierran el canal K-ATP de la célula β → liberan insulina\u003c/td>\u003ctd>Baratas y potentes\u003c/td>\u003ctd>Hipoglucemia y ↑ peso. Glibenclamida: hipoglucemia prolongada en adultos mayores y ERC; evítala\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Pioglitazona\u003c/b>\u003c/td>\u003ctd>Agonista PPAR-γ: ↑ sensibilidad a la insulina\u003c/td>\u003ctd>Sin hipoglucemia; útil en hígado graso (MASH)\u003c/td>\u003ctd>Retención de líquidos, ↑ peso, fracturas. Contraindicada en IC NYHA III–IV y no recomendada en IC sintomática\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Insulina basal\u003c/b>\u003c/td>\u003ctd>Reemplazo\u003c/td>\u003ctd>La más potente, sin techo de dosis\u003c/td>\u003ctd>Hipoglucemia y ↑ peso. Iniciar 10 U/día o 0.1–0.2 U/kg/día y subir 2 U cada 3 días según la glucosa en ayuno\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>"},{"h":"Cómo elegir (ADA)","html":"\n\u003cdiv class=\"decide\">\n\u003cp>\u003cspan class=\"if\">ECV aterosclerótica (IAM, EVC, EAP) o riesgo CV alto\u003c/span>\u003cspan class=\"then\">arGLP-1 o iSGLT2 con beneficio CV probado, sin importar la A1c ni si ya toma metformina\u003c/span>\u003c/p>\n\u003cp>\u003cspan class=\"if\">Insuficiencia cardiaca (FEr o FEp)\u003c/span>\u003cspan class=\"then\">iSGLT2\u003c/span>\u003c/p>\n\u003cp>\u003cspan class=\"if\">ERC: TFG 20–60 o albuminuria ≥30 mg/g\u003c/span>\u003cspan class=\"then\">iSGLT2; si no se puede, o como adición, arGLP-1 con beneficio renal (semaglutida)\u003c/span>\u003c/p>\n\u003cp>\u003cspan class=\"if\">Obesidad, si bajar de peso es la prioridad\u003c/span>\u003cspan class=\"then\">Semaglutida o tirzepatida\u003c/span>\u003c/p>\n\u003cp>\u003cspan class=\"if\">Hígado graso con fibrosis (MASH)\u003c/span>\u003cspan class=\"then\">arGLP-1, tirzepatida o pioglitazona\u003c/span>\u003c/p>\n\u003cp>\u003cspan class=\"if\">Sin esas comorbilidades\u003c/span>\u003cspan class=\"then\">Metformina + estilo de vida; agrega según meta, peso, riesgo de hipoglucemia y costo\u003c/span>\u003c/p>\n\u003cp>\u003cspan class=\"if\">Catabolismo (pérdida de peso, cetosis), A1c &gt;10% o glucosa ≥300 con síntomas\u003c/span>\u003cspan class=\"then\">Insulina desde el inicio\u003c/span>\u003c/p>\n\u003cp>\u003cspan class=\"if\">A1c ≥1.5% por arriba de la meta\u003c/span>\u003cspan class=\"then\">Considerar combinación de dos fármacos desde el inicio\u003c/span>\u003c/p>\n\u003c/div>"},{"h":"Hipoglucemia","html":"\n\u003cul>\n\u003cli>\u003cb>Nivel 1\u003c/b>: 54–69 mg/dL · \u003cb>Nivel 2\u003c/b>: &lt;54 mg/dL · \u003cb>Nivel 3\u003c/b>: evento grave con alteración mental o física que requiere ayuda de otra persona, sin importar la cifra.\u003c/li>\n\u003cli>\u003cb>Consciente y puede tragar\u003c/b> → regla de 15: 15–20 g de glucosa oral, revalorar a los 15 min, repetir si sigue &lt;70 y luego dar una colación.\u003c/li>\n\u003cli>\u003cb>Inconsciente o sin vía oral\u003c/b> → glucagón (IM, SC o intranasal) o dextrosa IV.\u003c/li>\n\u003cli>Con sulfonilureas la hipoglucemia puede durar horas: observa más tiempo.\u003c/li>\n\u003cli>Los betabloqueadores ocultan temblor y palpitaciones; la sudoración persiste.\u003c/li>\n\u003c/ul>"},{"h":"Complicaciones y tamizaje","html":"\n\u003cul>\n\u003cli>\u003cb>Retinopatía\u003c/b>: fondo de ojo con dilatación al diagnóstico en DM2 (en DM1, a los 5 años) y luego cada año; cada 1–2 años si es normal y hay buen control.\u003c/li>\n\u003cli>\u003cb>Enfermedad renal\u003c/b>: cociente albúmina/creatinina en orina (CAC) y TFG al diagnóstico y cada año.\u003c/li>\n\u003cli>\u003cb>Neuropatía\u003c/b>: monofilamento de 10 g más otra prueba (diapasón de 128 Hz, pinchazo o temperatura) al diagnóstico y cada año. Revisa los pies en cada consulta.\u003c/li>\n\u003cli>\u003cb>Macrovascular\u003c/b>: estatina de intensidad moderada a todos los diabéticos de 40–75 años; alta intensidad si hay ≥1 factor de riesgo o ECV. IECA o ARA-II si hay HTA con albuminuria. Aspirina en prevención secundaria.\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"FLOZINA = Falla y Filtrado · GLUTIDA = Grasa y Gordura","d":"iSGLT2 (-flozina) para la falla cardiaca y el filtrado renal (ERC). arGLP-1 (-glutida) para la grasa en la arteria (ECV aterosclerótica) y la gordura (obesidad). Ojo: los dos reducen eventos cardiovasculares, así que en ECV aterosclerótica cualquiera de los dos es correcto."},"pearl":"Si el caso menciona IAM previo, EVC, IC o ERC, la respuesta casi nunca es “subir metformina” ni “agregar sulfonilurea”: agrega iSGLT2 o arGLP-1 aunque la A1c ya esté en meta.","trap":"Una A1c de 6.7% en un paciente sin síntomas todavía no es diagnóstico: hay que confirmarla con una segunda prueba. Y la glucosa al azar ≥200 sin síntomas tampoco basta.","guide":["Meta de A1c: la ADA pide \u003c7% para la mayoría; la AACE propone ≤6.5% si se logra sin hipoglucemia. Si la pregunta no da más datos, contesta \u003c7%.","Primer fármaco: muchas guías y libros anteriores ponen la metformina como primer paso para todos. La ADA actual indica iSGLT2 o arGLP-1 desde el inicio, con o sin metformina, cuando hay ECV, IC o ERC. Si el caso trae una comorbilidad cardiorrenal, contesta con la ADA. ⚠️ Confirma con tu profesor qué versión de la GPC mexicana usa."],"refs":["American Diabetes Association. Standards of Care in Diabetes—2026. Diabetes Care 2026;49(Suppl 1).","KDIGO 2022 Clinical Practice Guideline for Diabetes Management in Chronic Kidney Disease.","Samson SL, et al. AACE Consensus Statement: Comprehensive Type 2 Diabetes Management Algorithm, 2023."]},"sca":{"hook":"Aquí se decide en minutos: leer el ECG, saber cuándo reperfundir y no caer en las trampas del IAM de VD y de la fibrinólisis en SCASEST.","anim":"sca","compare":["stemi-nste"],"sections":[{"h":"El espectro","html":"\n\u003cul>\n\u003cli>\u003cb>Angina inestable\u003c/b>: isquemia en reposo, de reciente inicio o en aumento, con troponina normal. Con la troponina de alta sensibilidad es cada vez menos frecuente.\u003c/li>\n\u003cli>\u003cb>IAMSEST\u003c/b>: troponina elevada sin elevación persistente del ST.\u003c/li>\n\u003cli>\u003cb>IAMCEST\u003c/b>: elevación persistente del ST o un equivalente. Casi siempre es una arteria ocluida.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cb>Infarto (4ª definición universal)\u003c/b>: ascenso o descenso de troponina con al menos un valor mayor al percentil 99, más evidencia de isquemia: síntomas, cambios nuevos en el ECG, ondas Q nuevas, imagen con pérdida de miocardio viable o trombo en la angiografía.\u003c/p>\n\u003cp>\u003cb>Tipos\u003c/b>: 1 = ruptura de placa con trombo · 2 = desequilibrio entre aporte y demanda (anemia, taquiarritmia, hipotensión, hipoxemia) · 3 = muerte súbita antes de tener troponina · 4 = asociado a ICP · 5 = asociado a cirugía de revascularización.\u003c/p>"},{"h":"Los primeros 10 minutos","html":"\n\u003cul>\n\u003cli>\u003cb>ECG de 12 derivaciones en ≤10 min\u003c/b> desde el primer contacto. Si no es diagnóstico y sigue el dolor, repítelo cada 15–30 min.\u003c/li>\n\u003cli>Monitor, acceso venoso y troponina de alta sensibilidad a las 0 h y 1 h (o 0 h y 2 h).\u003c/li>\n\u003cli>\u003cb>Aspirina\u003c/b> 150–300 mg VO masticada, sin capa entérica, salvo alergia verdadera.\u003c/li>\n\u003cli>\u003cb>Oxígeno solo si SatO₂ &lt;90%\u003c/b>.\u003c/li>\n\u003cli>\u003cb>Nitroglicerina\u003c/b> sublingual para el dolor, excepto si la PAS es &lt;90, hay IAM de VD o tomó sildenafil en las últimas 24 h (tadalafil, 48 h).\u003c/li>\n\u003cli>\u003cb>Morfina\u003c/b> solo para dolor intenso que no cede: retrasa la absorción de los P2Y12 orales.\u003c/li>\n\u003c/ul>"},{"h":"Leer el ECG","html":"\n\u003cp>\u003cb>IAMCEST\u003c/b>: elevación nueva del ST en el punto J en ≥2 derivaciones contiguas.\u003c/p>\n\u003cul>\n\u003cli>V2–V3: ≥2 mm en hombres ≥40 años · ≥2.5 mm en hombres &lt;40 · ≥1.5 mm en mujeres.\u003c/li>\n\u003cli>Resto de derivaciones: ≥1 mm.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>Derivaciones\u003c/th>\u003cth>Cara\u003c/th>\u003cth>Arteria\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>V1–V4\u003c/td>\u003ctd>Anterior y septal\u003c/td>\u003ctd>Descendente anterior\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>DII, DIII, aVF\u003c/td>\u003ctd>Inferior\u003c/td>\u003ctd>Coronaria derecha (≈80–90%) o circunfleja\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>DI, aVL, V5–V6\u003c/td>\u003ctd>Lateral\u003c/td>\u003ctd>Circunfleja o diagonal\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Infradesnivel V1–V3 con R alta\u003c/td>\u003ctd>Posterior\u003c/td>\u003ctd>Circunfleja o CD: toma V7–V9\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>V3R–V4R\u003c/td>\u003ctd>Ventrículo derecho\u003c/td>\u003ctd>CD proximal\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>En V7–V9 y en V3R–V4R el umbral es ≥0.5 mm (≥1 mm en hombres jóvenes).\u003c/p>\n\u003cp>\u003cb>Se tratan como IAMCEST\u003c/b>: bloqueo de rama (izquierda o derecha) o ritmo de marcapasos con síntomas isquémicos persistentes; IAM posterior aislado. Infradesnivel del ST en ≥6 derivaciones con elevación en aVR o V1 sugiere lesión de tronco o multivaso; con inestabilidad va a coronariografía inmediata.\u003c/p>\n\u003cp>\u003cb>Patrones que debes reconocer\u003c/b>: \u003cb>Wellens\u003c/b> (T bifásicas o profundamente invertidas en V2–V3 en un paciente sin dolor = estenosis crítica de la DA proximal; no hagas prueba de esfuerzo) y \u003cb>De Winter\u003c/b> (infradesnivel ascendente del ST en precordiales con T altas y simétricas = oclusión de la DA).\u003c/p>"},{"h":"IAMCEST: reperfundir ya","html":"\n\u003cul>\n\u003cli>Síntomas de &lt;12 h → reperfusión.\u003c/li>\n\u003cli>\u003cb>ICP primaria\u003c/b> si puede hacerse en ≤120 min desde el diagnóstico. Meta de ≤60 min si el paciente ya está en un hospital con hemodinamia, y ≤90 min si se traslada.\u003c/li>\n\u003cli>Si la ICP no llega en 120 min → \u003cb>fibrinólisis en ≤10 min\u003c/b> desde el diagnóstico (de preferencia tenecteplasa; mitad de dosis si ≥75 años), con aspirina, clopidogrel y anticoagulante. Después, traslado a un centro con ICP: coronariografía en 2–24 h si fue exitosa, o \u003cb>ICP de rescate\u003c/b> inmediata si falló.\u003c/li>\n\u003cli>\u003cb>Fibrinólisis exitosa\u003c/b>: el ST baja ≥50% a los 60–90 min y cede el dolor; puede aparecer un ritmo idioventricular acelerado.\u003c/li>\n\u003cli>&gt;12 h de síntomas: ICP si hay isquemia persistente, IC, choque o arritmias graves; considerarla entre 12 y 48 h. Después de 48 h y asintomático, no se abre de rutina una arteria ocluida.\u003c/li>\n\u003cli>Choque cardiogénico: ICP de la arteria culpable sin importar el tiempo.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cb>Contraindicaciones absolutas de la fibrinólisis\u003c/b>: hemorragia intracraneal previa o EVC de origen desconocido (en cualquier momento) · EVC isquémico en los últimos 6 meses · daño o neoplasia del SNC o malformación AV · trauma mayor, cirugía o TCE en el último mes · sangrado gastrointestinal en el último mes · trastorno hemorrágico conocido · disección aórtica · punciones no compresibles en las últimas 24 h.\u003c/p>\n\u003cp>\u003cb>Relativas\u003c/b>: AIT en los últimos 6 meses, anticoagulación oral, embarazo o primera semana posparto, HTA refractaria (PAS &gt;180 o PAD &gt;110), hepatopatía avanzada, endocarditis, úlcera péptica activa, RCP prolongada o traumática.\u003c/p>"},{"h":"SCASEST: estratificar y decidir cuándo cateterizar","html":"\n\u003cul>\n\u003cli>Troponina de alta sensibilidad con algoritmo 0 h/1 h para descartar o confirmar rápido.\u003c/li>\n\u003cli>\u003cb>Inmediata (&lt;2 h)\u003c/b> si es de muy alto riesgo: inestabilidad hemodinámica o choque, dolor recurrente o refractario, arritmias graves o paro, complicaciones mecánicas, IC aguda por isquemia, cambios dinámicos recurrentes del ST (sobre todo elevación intermitente).\u003c/li>\n\u003cli>\u003cb>Temprana (&lt;24 h)\u003c/b> si es de alto riesgo: IAMSEST confirmado, cambios dinámicos del ST o la T, elevación transitoria del ST, GRACE &gt;140.\u003c/li>\n\u003cli>\u003cb>Selectiva\u003c/b> en el resto: prueba de isquemia o angio-TC coronaria antes de decidir.\u003c/li>\n\u003cli>\u003cb>Nunca fibrinólisis\u003c/b> en SCASEST.\u003c/li>\n\u003cli>Escalas: GRACE (pronóstico; define el &lt;24 h) y TIMI (0–7; riesgo de eventos a 14 días). La calculadora TIMI está en Herramientas.\u003c/li>\n\u003c/ul>"},{"h":"Antitrombóticos y alta","html":"\n\u003cul>\n\u003cli>\u003cb>Doble antiagregación\u003c/b>: aspirina (75–100 mg/día después de la carga) + inhibidor P2Y12 por 12 meses de forma predeterminada.\u003c/li>\n\u003cli>\u003cb>Prasugrel\u003c/b>: carga 60 mg, luego 10 mg/día (5 mg si ≥75 años o &lt;60 kg). Contraindicado con EVC o AIT previo.\u003c/li>\n\u003cli>\u003cb>Ticagrelor\u003c/b>: carga 180 mg, luego 90 mg c/12 h. Puede causar disnea y bradicardia.\u003c/li>\n\u003cli>\u003cb>Clopidogrel\u003c/b>: carga 300–600 mg, luego 75 mg/día. Se usa si recibió fibrinólisis, si necesita anticoagulante oral o si no hay los otros dos.\u003c/li>\n\u003cli>En SCASEST no se da P2Y12 de rutina antes del cateterismo si este se hará en &lt;24 h (ESC 2023).\u003c/li>\n\u003cli>\u003cb>Anticoagulación parenteral\u003c/b>: heparina no fraccionada durante la ICP; enoxaparina como alternativa; fondaparinux si no habrá cateterismo temprano.\u003c/li>\n\u003cli>\u003cb>Al alta\u003c/b>: estatina de alta intensidad (meta LDL &lt;55 mg/dL y ↓ ≥50%; si no se logra, ezetimiba y luego iPCSK9) · betabloqueador (sobre todo con FEVI ≤40%) · IECA o ARA-II (FEVI ≤40%, IC, DM, HTA o ERC) · antagonista mineralocorticoide si FEVI ≤40% con IC o DM · IBP si hay riesgo de sangrado digestivo · rehabilitación cardiaca y dejar de fumar.\u003c/li>\n\u003c/ul>"},{"h":"Complicaciones","html":"\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>Cuándo (aprox.)\u003c/th>\u003cth>Complicación\u003c/th>\u003cth>Pista\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Primeras horas\u003c/td>\u003ctd>FV y otras arritmias\u003c/td>\u003ctd>Principal causa de muerte antes de llegar al hospital\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>IAM inferior\u003c/td>\u003ctd>Bradicardia, bloqueo AV\u003c/td>\u003ctd>El nodo AV lo irriga la CD; suele ser transitorio\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>IAM inferior\u003c/td>\u003ctd>IAM de VD\u003c/td>\u003ctd>Hipotensión + IY + pulmones limpios → volumen, sin nitratos\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Días 1–3\u003c/td>\u003ctd>Pericarditis temprana\u003c/td>\u003ctd>Dolor pleurítico y frote\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Días 2–7\u003c/td>\u003ctd>Ruptura de músculo papilar\u003c/td>\u003ctd>Insuficiencia mitral aguda y edema pulmonar; papilar posteromedial en IAM inferior\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Días 3–5\u003c/td>\u003ctd>Ruptura del septum (CIV)\u003c/td>\u003ctd>Soplo holosistólico paraesternal con frémito; salto oximétrico en el VD\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Días 3–14\u003c/td>\u003ctd>Ruptura de pared libre\u003c/td>\u003ctd>Taponamiento y actividad eléctrica sin pulso\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Semanas\u003c/td>\u003ctd>Aneurisma ventricular\u003c/td>\u003ctd>Elevación persistente del ST, IC, trombo mural\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Semanas\u003c/td>\u003ctd>Síndrome de Dressler\u003c/td>\u003ctd>Pericarditis autoinmune\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>\u003cb>Killip\u003c/b>: I sin IC · II estertores basales o S3 · III edema pulmonar · IV choque cardiogénico.\u003c/p>"}],"mnemo":{"t":"MONA se jubiló: solo la A es para todos","d":"Morfina solo si el dolor es intenso · Oxígeno solo si SatO₂ \u003c90% · Nitratos solo si no hay hipotensión, IAM de VD ni sildenafil · Aspirina a todos, salvo alergia. Y para localizar: “inferior es derecha” (DII, DIII y aVF → coronaria derecha)."},"pearl":"En IAMCEST nunca esperes la troponina: el ECG basta para activar la hemodinamia. Y en SCASEST la fibrinólisis siempre es la respuesta incorrecta.","trap":"IAM inferior con hipotensión: si una opción dice “nitroglicerina” o “furosemida”, es la trampa. Piensa en el VD: V4R y volumen.","guide":["Carga de aspirina: la ESC 2023 da 150–300 mg VO y la ACC/AHA 2025 da 162–325 mg. Las dos son correctas: lo importante es darla masticada y rápido.","Pretratamiento con P2Y12 en SCASEST: la ESC 2023 no lo recomienda de rutina si el cateterismo será en \u003c24 h. En muchos hospitales se sigue dando clopidogrel en urgencias. Si la pregunta dice “según la ESC”, no se pretrata.","Bloqueo de rama izquierda nuevo: libros antiguos lo consideran IAMCEST automático; la ESC 2023 lo maneja como IAMCEST cuando hay síntomas isquémicos persistentes (apóyate en los criterios de Sgarbossa)."],"refs":["Byrne RA, et al. 2023 ESC Guidelines for the management of acute coronary syndromes. Eur Heart J 2023.","Rao SV, et al. 2025 ACC/AHA/ACEP/NAEMSP/SCAI Guideline for the Management of Patients With Acute Coronary Syndromes. Circulation 2025.","Thygesen K, et al. Fourth Universal Definition of Myocardial Infarction. Eur Heart J 2019."]},"lra":{"hook":"Tres preguntas resuelven casi cualquier caso: ¿cumple criterios y en qué estadio?, ¿dónde está el problema (antes, dentro o después del riñón)? y ¿necesita diálisis ya?","anim":"lra","compare":["pre-nta"],"sections":[{"h":"Definición y estadios (KDIGO)","html":"\n\u003cp>LRA es cualquiera de estos:\u003c/p>\n\u003cul>\n\u003cli>Creatinina ↑ ≥0.3 mg/dL en 48 h.\u003c/li>\n\u003cli>Creatinina ↑ ≥1.5 veces la basal (conocida o presumida) en los últimos 7 días.\u003c/li>\n\u003cli>Uresis &lt;0.5 mL/kg/h por 6 h.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>Estadio\u003c/th>\u003cth>Creatinina\u003c/th>\u003cth>Uresis\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>1.5–1.9 veces la basal, o ↑ ≥0.3 mg/dL\u003c/td>\u003ctd>&lt;0.5 mL/kg/h por 6–12 h\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>2.0–2.9 veces la basal\u003c/td>\u003ctd>&lt;0.5 mL/kg/h por ≥12 h\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>≥3 veces la basal, o Cr ≥4.0 mg/dL, o inicio de terapia de reemplazo renal\u003c/td>\u003ctd>&lt;0.3 mL/kg/h por ≥24 h, o anuria ≥12 h\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>Si la creatinina y la uresis dan estadios distintos, se queda el \u003cb>más alto\u003c/b>.\u003c/p>"},{"h":"¿Dónde está el problema?","html":"\n\u003cp>\u003cb>Prerrenal\u003c/b> (la más frecuente): el riñón está sano, pero le llega poca sangre.\u003c/p>\n\u003cul>\n\u003cli>Hipovolemia: vómito, diarrea, hemorragia, diuréticos, quemaduras.\u003c/li>\n\u003cli>Volumen circulante efectivo bajo: IC (cardiorrenal), cirrosis (hepatorrenal), sepsis.\u003c/li>\n\u003cli>Fármacos que alteran la hemodinamia del glomérulo: AINE, IECA o ARA-II, inhibidores de calcineurina.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cb>Intrínseca\u003c/b>: daño del parénquima.\u003c/p>\n\u003cul>\n\u003cli>\u003cb>Necrosis tubular aguda\u003c/b> (la intrínseca más frecuente): isquémica (prerrenal prolongada, choque) o tóxica (aminoglucósidos, vancomicina, anfotericina B, cisplatino, contraste; pigmentos como mioglobina y hemoglobina).\u003c/li>\n\u003cli>\u003cb>Nefritis intersticial aguda\u003c/b>: betalactámicos, AINE, IBP, rifampicina, sulfas. Fiebre, exantema, eosinofilia y cilindros leucocitarios.\u003c/li>\n\u003cli>\u003cb>Glomerular\u003c/b>: hematuria dismórfica, cilindros eritrocitarios, proteinuria e HTA.\u003c/li>\n\u003cli>\u003cb>Vascular\u003c/b>: ateroembolia (después de un cateterismo), microangiopatía trombótica (SHU, PTT), HTA maligna.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cb>Posrenal\u003c/b>: obstrucción bilateral, o de un riñón único: HPB, litiasis, tumores pélvicos, vejiga neurogénica, sonda tapada.\u003c/p>"},{"h":"Abordaje en 5 pasos","html":"\n\u003col>\n\u003cli>\u003cb>Historia\u003c/b>: pérdidas de volumen, fármacos y contraste de los últimos días, síntomas urinarios.\u003c/li>\n\u003cli>\u003cb>Exploración\u003c/b>: volumen (PA, FC, ortostatismo, IY, edema), globo vesical, livedo, exantema.\u003c/li>\n\u003cli>\u003cb>EGO con sedimento\u003c/b>: es la “biopsia líquida” del riñón.\u003c/li>\n\u003cli>\u003cb>Índices urinarios\u003c/b>: FENa (o FEUrea si usa diuréticos), sodio y osmolaridad urinaria.\u003c/li>\n\u003cli>\u003cb>USG renal\u003c/b>: hidronefrosis en la posrenal; riñones pequeños sugieren ERC previa.\u003c/li>\n\u003c/ol>\n\u003cp>Laboratorio clave: creatinina, BUN, potasio, gasometría, BH y CK si sospechas rabdomiólisis.\u003c/p>"},{"h":"Lo que dice el sedimento","html":"\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>Hallazgo\u003c/th>\u003cth>Sugiere\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Cilindros hialinos o sedimento normal\u003c/td>\u003ctd>Prerrenal o posrenal\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Cilindros granulosos “café lodoso” y células tubulares\u003c/td>\u003ctd>Necrosis tubular aguda\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Cilindros eritrocitarios, eritrocitos dismórficos\u003c/td>\u003ctd>Glomerulonefritis\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Cilindros leucocitarios, leucocituria estéril, eosinofiluria\u003c/td>\u003ctd>Nefritis intersticial (pielonefritis si hay bacterias)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Tira con “sangre” sin eritrocitos en el sedimento\u003c/td>\u003ctd>Mioglobina o hemoglobina: rabdomiólisis o hemólisis\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Cristales\u003c/td>\u003ctd>Etilenglicol (oxalato), lisis tumoral (urato), fármacos (aciclovir, metotrexato)\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>"},{"h":"Índices urinarios","html":"\n\u003cp>\u003cb>FENa\u003c/b> = (Na urinario × Cr plasmática) ÷ (Na plasmático × Cr urinaria) × 100. La comparación completa entre prerrenal y NTA está en el comparador de abajo.\u003c/p>\n\u003cul>\n\u003cli>FENa &lt;1% sin ser prerrenal: contraste, mioglobinuria o hemoglobinuria, glomerulonefritis aguda, obstrucción temprana, sepsis temprana.\u003c/li>\n\u003cli>Con diuréticos la FENa sale falsamente alta: usa la \u003cb>FEUrea\u003c/b> (&lt;35% prerrenal, &gt;50% NTA).\u003c/li>\n\u003cli>En ERC la FENa basal ya puede estar alta.\u003c/li>\n\u003c/ul>"},{"h":"Tratamiento","html":"\n\u003cul>\n\u003cli>Trata la causa. Prerrenal: volumen con cristaloides (de preferencia balanceados, como Hartmann o Plasma-Lyte) y vigila la sobrecarga.\u003c/li>\n\u003cli>Suspende nefrotóxicos y ajusta dosis a la TFG. En hipovolemia, suspende temporalmente IECA o ARA-II, diuréticos, metformina e iSGLT2.\u003c/li>\n\u003cli>Los diuréticos \u003cb>no\u003c/b> previenen ni tratan la LRA: solo sirven para la sobrecarga de volumen.\u003c/li>\n\u003cli>Posrenal: sonda vesical (HPB) o nefrostomía o catéter JJ (obstrucción alta). Después vigila la poliuria posobstructiva.\u003c/li>\n\u003cli>Monitorea a diario uresis, peso, creatinina, potasio y gasometría.\u003c/li>\n\u003cli>En la recuperación de la NTA hay una fase poliúrica, con riesgo de hipokalemia e hipovolemia.\u003c/li>\n\u003c/ul>"},{"h":"Hiperkalemia: el peligro inmediato","html":"\n\u003cp>Cambios del ECG en orden: T picudas → PR largo y P aplanada → QRS ancho → onda sinusoidal → FV o asistolia.\u003c/p>\n\u003col>\n\u003cli>\u003cb>Proteger el corazón\u003c/b>: gluconato de calcio al 10%, 10 mL IV en 2–3 min; se repite si siguen los cambios. No baja el potasio.\u003c/li>\n\u003cli>\u003cb>Meter el K a la célula\u003c/b>: insulina rápida 10 U IV con 25 g de glucosa (vigila hipoglucemia); salbutamol nebulizado 10–20 mg; bicarbonato solo si hay acidosis metabólica.\u003c/li>\n\u003cli>\u003cb>Sacar el K del cuerpo\u003c/b>: diurético de asa (si orina), quelantes (patiromer, ciclosilicato de zirconio sódico) o diálisis.\u003c/li>\n\u003cli>Suspende lo que lo sube: IECA o ARA-II, espironolactona, AINE, TMP-SMX y suplementos de potasio.\u003c/li>\n\u003c/ol>"},{"h":"Diálisis urgente: AEIOU","html":"\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>\u003c/th>\u003cth>Indicación\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>A\u003c/b>\u003c/td>\u003ctd>Acidosis metabólica grave y refractaria (pH &lt;7.1–7.15)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>E\u003c/b>\u003c/td>\u003ctd>Electrolitos: hiperkalemia refractaria (&gt;6.5 o con cambios en el ECG pese al tratamiento)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>I\u003c/b>\u003c/td>\u003ctd>Intoxicaciones dializables: metanol, etilenglicol, litio, salicilatos, metformina con acidosis láctica, valproato\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>O\u003c/b>\u003c/td>\u003ctd>Sobrecarga (\u003ci>overload\u003c/i>) de volumen que no responde a diuréticos: edema pulmonar\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>U\u003c/b>\u003c/td>\u003ctd>Uremia sintomática: pericarditis, encefalopatía, sangrado urémico\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>Ninguna cifra aislada de creatinina o BUN es indicación por sí sola.\u003c/p>"},{"h":"Escenarios de examen","html":"\n\u003cul>\n\u003cli>\u003cb>Triple golpe\u003c/b>: AINE + IECA o ARA-II + diurético en un adulto mayor → prerrenal.\u003c/li>\n\u003cli>\u003cb>Contraste\u003c/b>: la creatinina sube a las 24–72 h; se previene con hidratación isotónica en pacientes de riesgo. La N-acetilcisteína no sirve.\u003c/li>\n\u003cli>\u003cb>Rabdomiólisis\u003c/b>: CK &gt;5 veces el límite, tira con sangre sin eritrocitos, potasio y fósforo altos, calcio bajo → cristaloides abundantes.\u003c/li>\n\u003cli>\u003cb>Ateroembolia\u003c/b>: semanas después de un cateterismo, con livedo, dedos azules con pulsos presentes, eosinofilia y C3 bajo.\u003c/li>\n\u003cli>\u003cb>Síndrome hepatorrenal\u003c/b>: cirrosis con ascitis que no responde a 2 días de albúmina (1 g/kg) y suspensión de diuréticos → terlipresina con albúmina.\u003c/li>\n\u003cli>\u003cb>Lisis tumoral\u003c/b>: después de quimioterapia; ácido úrico, potasio y fósforo altos, calcio bajo.\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"AEIOU: las vocales de la diálisis urgente","d":"Acidosis · Electrolitos (potasio) · Intoxicaciones · Overload (sobrecarga) · Uremia. Y el “triple golpe” = AINE + IECA o ARA-II + diurético."},"pearl":"Si el paciente toma diurético, la FENa no sirve: pide FEUrea. Y si la FENa es \u003c1% en un paciente con contraste o rabdomiólisis, no es prerrenal.","trap":"La opción “furosemida para aumentar la uresis” en una NTA oligúrica es incorrecta: no mejora el pronóstico. Tampoco “dializar porque la creatinina es 6”: sin AEIOU no hay urgencia.","guide":["Definición: los criterios KDIGO 2012 son los que se usan (RIFLE y AKIN son versiones anteriores). ⚠️ KDIGO está actualizando su guía de LRA; pregunta si tu profesor menciona cambios.","Líquidos: KDIGO 2012 dice “cristaloides isotónicos”. Los ensayos posteriores (SMART) favorecen las soluciones balanceadas sobre la salina al 0.9% en pacientes críticos. Si te dan a elegir, balanceada.","Umbral de TFG para prevenir la nefropatía por contraste: varía según la guía (\u003c30 mL/min en el consenso ACR-NKF 2020; algunos protocolos usan \u003c45)."],"refs":["KDIGO Clinical Practice Guideline for Acute Kidney Injury. Kidney Int Suppl 2012;2:1–138.","Semler MW, et al. Balanced crystalloids versus saline in critically ill adults (SMART). N Engl J Med 2018.","Weisbord SD, et al. Outcomes after angiography with sodium bicarbonate and acetylcysteine (PRESERVE). N Engl J Med 2018.","Davenport MS, et al. ACR–NKF consensus: use of IV iodinated contrast media in patients with kidney disease. Radiology 2020."]}},"compares":{"sglt2-glp1":{"topic":"dm2","a":"iSGLT2","b":"arGLP-1","rows":[["Ejemplos","Empagliflozina, dapagliflozina, canagliflozina","Semaglutida, liraglutida, dulaglutida (tirzepatida es dual GIP/GLP-1)"],["Dónde actúa","Túbulo contorneado proximal","Páncreas, cerebro (saciedad) y estómago"],["Mecanismo","Glucosuria y natriuresis","↑ insulina dependiente de glucosa, ↓ glucagón, vaciamiento gástrico lento"],["Baja la A1c","Moderado (≈0.5–0.8%; menos si TFG \u003c45)","Alto (≈1–1.5% o más)"],["Peso","↓ 2–3 kg","↓ de moderado a muy alto (semaglutida y tirzepatida, las de mayor efecto)"],["Hipoglucemia","No, si se usa solo","No, si se usa solo"],["Beneficio estrella","IC (FEr y FEp) y ERC","ECV aterosclerótica y obesidad (semaglutida también ERC)"],["Vía","Oral, una vez al día","Subcutánea semanal o diaria (semaglutida también oral)"],["Efecto adverso clásico","Micosis genital, cetoacidosis euglucémica","Náusea y vómito, colelitiasis"],["Contraindicación clásica","TFG \u003c20 para iniciarlo; diálisis","Carcinoma medular de tiroides o MEN2, personal o familiar"]]},"stemi-nste":{"topic":"sca","a":"IAMCEST","b":"SCASEST","rows":[["En la arteria","Oclusión total (trombo rojo, rico en fibrina)","Oclusión parcial o intermitente (trombo blanco, rico en plaquetas)"],["Daño","Transmural","Subendocárdico"],["ECG","Elevación persistente del ST o equivalente","Infradesnivel del ST, T invertidas o ECG normal"],["Troponina","Elevada, pero no se espera para reperfundir","Elevada en IAMSEST; normal en angina inestable"],["Decisión clave","Reperfundir ya: ICP primaria ≤120 min o fibrinólisis ≤10 min","Estratificar el riesgo (troponina, GRACE) y decidir cuándo cateterizar"],["Fibrinólisis","Sí, si la ICP no llega a tiempo","Nunca: no beneficia y aumenta el sangrado"],["Cateterismo","Inmediato (ICP primaria)","Inmediato \u003c2 h si muy alto riesgo; \u003c24 h si alto riesgo; selectivo si bajo riesgo"],["Antiagregación","Aspirina + ticagrelor o prasugrel (clopidogrel si hubo fibrinólisis)","Aspirina + P2Y12; sin pretratamiento de rutina si el cateterismo es en \u003c24 h"]]},"pre-nta":{"topic":"lra","a":"Prerrenal","b":"NTA","rows":[["Mecanismo","Llega menos sangre; el túbulo está sano y reabsorbe sodio con avidez","La célula tubular está dañada (isquemia prolongada o tóxicos) y no reabsorbe sodio"],["FENa","\u003c1%",">2%"],["FEUrea (si usa diurético)","\u003c35%",">50%"],["Na urinario","\u003c20 mEq/L",">40 mEq/L"],["Osmolaridad urinaria",">500 mOsm/kg (orina concentrada)","\u003c350 mOsm/kg (isostenuria, ≈300)"],["BUN/Cr",">20","10–15"],["Sedimento","Normal o cilindros hialinos","Cilindros granulosos “café lodoso” y células tubulares"],["Respuesta a volumen","Mejora en 24–72 h","No mejora; tarda días a semanas"],["Tratamiento","Volumen y quitar la causa (AINE, IECA o ARA-II, diurético)","Soporte: evitar nefrotóxicos, balance de líquidos y diálisis si hay AEIOU"]]}},"anims":{"dm2":{"title":"De la insulina a los fármacos","steps":[{"cap":"\u003cb>Así entra la glucosa.\u003c/b> La insulina se une a su receptor en la célula muscular. La señal manda las vesículas con GLUT4 a la membrana, y por esos canales entra la glucosa.","labels":[[26,9,"Insulina"],[40,70,"Receptor"],[112,49,"GLUT4"],[128,9,"Glucosa"],[24,108,"Músculo"]]},{"cap":"\u003cb>Resistencia a la insulina.\u003c/b> La insulina llega, pero la señal se bloquea dentro de la célula. El GLUT4 se queda atrapado en el citoplasma y la glucosa se acumula en la sangre.","labels":[[64,86,"Señal bloqueada"],[124,9,"Glucosa ↑"],[112,108,"GLUT4 atrapado"]]},{"cap":"\u003cb>El páncreas compensa… y se agota.\u003c/b> Al principio la célula β produce más insulina (hiperinsulinemia) y la glucosa se mantiene. Con los años la célula β falla, la insulina cae y aparece la DM2.","labels":[[40,70,"Islote"],[126,104,"INS"],[146,104,"GLU"]]},{"cap":"\u003cb>Metformina.\u003c/b> Activa la AMPK en el hígado y frena la gluconeogénesis: sale menos glucosa a la sangre. No estimula la insulina, por eso sola no causa hipoglucemia.","labels":[[44,108,"Hígado"],[44,20,"Gluconeogénesis"],[126,40,"Vena"]]},{"cap":"\u003cb>iSGLT2 (-flozina).\u003c/b> En el túbulo proximal, el SGLT2 reabsorbe glucosa y sodio. La flozina lo bloquea: la glucosa y el sodio se van por la orina. La natriuresis explica el beneficio e

diopatía grave. No es candidato a quimioterapia intensiva. ¿Tratamiento recomendado?","opts":["“7+3”","Venetoclax + azacitidina","Solo cuidados paliativos sin tratamiento","ATRA","Imatinib"],"ans":1,"exp":"En LMA no apta para quimioterapia intensiva, venetoclax + azacitidina mejoró la supervivencia frente a azacitidina sola (VIALE-A).","why":["Toxicidad inaceptable en este paciente.","","Hay opción eficaz de menor intensidad.","Solo en LPA.","Es para leucemias BCR::ABL1."],"ref":"VIALE-A, NEJM 2020 · ELN 2022"},{"topic":"leucemias","subj":"hemato","id":"leucemias-05","dif":2,"stem":"Paciente con LLA y leucocitos de 180,000 inicia quimioterapia. A las 36 h: K 6.8, fósforo 9, calcio 6.5, ácido úrico 14, creatinina 2.9. ¿Diagnóstico?","opts":["Hipercalcemia maligna","Síndrome de lisis tumoral","SIADH","Insuficiencia suprarrenal","Rabdomiólisis por estatinas"],"ans":1,"exp":"La destrucción masiva de células libera potasio, fósforo y ácido nucleico (ácido úrico). El fósforo atrapa calcio. Manejo: hidratación agresiva, rasburicasa, tratar la hiperkalemia, diálisis si es necesario.","why":["El calcio está bajo.","","No explica el patrón.","No explica fósforo y ácido úrico.","No hay estatina ni CK."],"ref":"Cairo-Bishop · Harrison 21e"},{"topic":"leucemias","subj":"hemato","id":"leucemias-06","dif":2,"stem":"Mujer de 74 años con anemia macrocítica, leucopenia y plaquetas 90,000. B12 y folato normales. Frotis con neutrófilos hiposegmentados e hipogranulares. Médula con displasia en 2 líneas y 4% de blastos. ¿Diagnóstico?","opts":["LMA","Síndrome mielodisplásico","Anemia perniciosa","Aplasia medular","LLC"],"ans":1,"exp":"Citopenias + displasia + blastos \u003c20% en un adulto mayor: SMD. Los neutrófilos pseudo-Pelger-Huët son característicos.","why":["Requiere ≥20% de blastos (salvo genética definitoria).","","B12 normal y no hay hipersegmentación.","La médula estaría hipocelular sin displasia.","Daría linfocitosis."],"ref":"OMS 2022"},{"topic":"leucemias","subj":"hemato","id":"leucemias-07","dif":2,"stem":"Paciente con SMD de bajo riesgo, dependiente de transfusiones, con deleción aislada del brazo largo del cromosoma 5. ¿Fármaco de elección?","opts":["Lenalidomida","Imatinib","ATRA","Rituximab","Hidroxiurea"],"ans":0,"exp":"El SMD con del(5q) aislada responde muy bien a lenalidomida, con independencia transfusional en una gran proporción.","why":["","Es para BCR::ABL1.","Es para LPA.","Es para linfomas B.","No es tratamiento del SMD."],"ref":"NCCN MDS"},{"topic":"leucemias","subj":"hemato","id":"leucemias-08","dif":1,"stem":"Paciente en quimioterapia de inducción por LMA con neutrófilos de 200/µL y fiebre de 38.6 °C. Estable. ¿Qué haces?","opts":["Esperar resultados de cultivos","Hemocultivos y cefepime (u otro antipseudomonas) en menos de 1 hora","Paracetamol y vigilar","Factor estimulante de colonias solo","Vancomicina sola"],"ans":1,"exp":"Fiebre neutropénica: urgencia. Antibiótico de amplio espectro con cobertura contra Pseudomonas en la primera hora; vancomicina solo con indicaciones específicas (catéter infectado, piel, inestabilidad, MRSA).","why":["El retraso aumenta la mortalidad.","","Insuficiente.","No sustituye al antibiótico.","No cubre gramnegativos."],"ref":"IDSA/ASCO fiebre neutropénica"},{"topic":"leucemias","subj":"hemato","id":"leucemias-09","dif":3,"stem":"Adulto de 45 años con LLA de precursores B. La citogenética muestra t(9;22). ¿Qué agregas a la quimioterapia?","opts":["ATRA","Inhibidor de tirosina cinasa (dasatinib o ponatinib)","Lenalidomida","Midostaurina","Nada; no cambia el tratamiento"],"ans":1,"exp":"La LLA Filadelfia positiva (BCR::ABL1) se trata con inhibidor de tirosina cinasa junto con quimioterapia o blinatumomab, con mejor pronóstico que en la era previa.","why":["Solo en LPA.","","Para SMD del(5q) y mieloma.","Para LMA con FLT3.","Cambia el tratamiento y el pronóstico."],"ref":"NCCN ALL"},{"topic":"leucemias","subj":"hemato","id":"leucemias-10","dif":2,"stem":"Hombre de 60 años con LMA y leucocitos de 160,000 presenta disnea, SpO2 86% y confusión. Rx con infiltrados difusos. ¿Qué sospechas?","opts":["Síndrome de diferenciación","Leucostasis","Neumonía por Pneumocystis","TEP","Hemorragia alveolar por PTI"],"ans":1,"exp":"Hiperleucocitosis (>100,000) con afección pulmonar y neurológica: leucostasis. Requiere citorreducción urgente (hidroxiurea e inducción); la leucoféresis tiene papel limitado.","why":["Requiere ATRA o arsénico.","","No explica el contexto agudo con hiperleucocitosis.","No explica la confusión ni los infiltrados.","No es PTI."],"ref":"ELN 2022"},{"topic":"erge","subj":"gastro","id":"erge-01","dif":1,"stem":"Mujer de 32 años con pirosis postprandial 3 veces por semana, sin disfagia ni pérdida de peso. ¿Siguiente paso?","opts":["Endoscopia","IBP por 8 semanas y medidas generales","pH-metría de 24 h","Manometría esofágica","Serie esofagogastroduodenal"],"ans":1,"exp":"ERGE típica sin datos de alarma: tratamiento empírico con IBP. La endoscopia se reserva para alarma, falta de respuesta o tamizaje de Barrett.","why":["No es necesaria sin alarma.","","Se usa si hay duda diagnóstica o refractariedad.","Se usa en disfagia sin obstrucción o antes de cirugía.","No es el estudio de elección."],"ref":"ACG 2022 ERGE"},{"topic":"erge","subj":"gastro","id":"erge-02","dif":1,"stem":"Hombre de 62 años con pirosis de años que ahora tiene disfagia a sólidos progresiva y pérdida de 6 kg. ¿Qué haces?","opts":["Doble dosis de IBP","Endoscopia alta","Funduplicatura","Antiácidos","Repetir la prueba con IBP"],"ans":1,"exp":"Disfagia y pérdida de peso son datos de alarma: estenosis péptica o adenocarcinoma sobre Barrett. Se requiere endoscopia con biopsias.","why":["No antes de descartar cáncer.","","No sin diagnóstico.","Insuficiente.","Retrasa el diagnóstico."],"ref":"ACG 2022 ERGE"},{"topic":"erge","subj":"gastro","id":"erge-03","dif":2,"stem":"Endoscopia en un hombre de 55 años con ERGE: lengüeta de mucosa color salmón de 4 cm sobre la unión esofagogástrica. Biopsia con metaplasia intestinal sin displasia. ¿Manejo?","opts":["Esofagectomía","IBP y vigilancia endoscópica cada 3 años","Ablación inmediata","Ningún seguimiento","Endoscopia cada 6 meses"],"ans":1,"exp":"Barrett largo (≥3 cm) sin displasia: IBP y vigilancia cada 3 años (cada 5 si mide menos de 3 cm). La ablación se reserva para displasia.","why":["Excesivo para Barrett sin displasia.","","No está indicada sin displasia.","Requiere vigilancia.","Demasiado frecuente."],"ref":"ACG 2022 Barrett"},{"topic":"erge","subj":"gastro","id":"erge-04","dif":2,"stem":"Paciente con Barrett y displasia de alto grado confirmada, con una lesión nodular visible. ¿Tratamiento?","opts":["Vigilancia a 12 meses","Resección endoscópica de la lesión + ablación del Barrett restante","Esofagectomía de entrada","Aumentar el IBP","Quimiorradioterapia"],"ans":1,"exp":"La terapia endoscópica de erradicación es el estándar: resección mucosa de lesiones visibles (estadifica) y ablación por radiofrecuencia del resto.","why":["Riesgo alto de progresión.","","Se reserva para invasión profunda.","No trata la displasia.","No indicada en displasia."],"ref":"ACG 2022 Barrett"},{"topic":"erge","subj":"gastro","id":"erge-05","dif":2,"stem":"Mujer de 45 años con pirosis que persiste pese a omeprazol 20 mg que toma por la noche. Endoscopia normal. ¿Primer ajuste?","opts":["Cirugía antirreflujo","Tomar el IBP 30–60 min antes del desayuno y verificar adherencia","Agregar antibióticos","Suspender el IBP","Manometría urgente"],"ans":1,"exp":"El IBP actúa sobre bombas activas: se toma antes de la primera comida. Muchas “refractariedades” son por mal horario o mala adherencia. Si persiste: dos dosis y luego pH-impedancia.","why":["No antes de optimizar y confirmar ERGE.","","No hay indicación.","Primero optimiza.","No es el primer paso."],"ref":"ACG 2022 ERGE"},{"topic":"erge","subj":"gastro","id":"erge-06","dif":2,"stem":"Hombre con pirosis refractaria y endoscopia normal. Se planea cirugía antirreflujo. ¿Qué estudio es indispensable antes?","opts":["pH-impedancia sin IBP y manometría esofágica","TC de abdomen","Colonoscopia","Ultrasonido de vesícula","Prueba de aliento para H. pylori"],"ans":0,"exp":"Antes de operar hay que confirmar reflujo patológico (pH-impedancia) y descartar acalasia u otro trastorno motor (manometría), que empeorarían con una funduplicatura.","why":["","No evalúa reflujo.","No tiene relación.","No evalúa reflujo.","No confirma ERGE."],"ref":"ACG 2022 ERGE"},{"topic":"erge","subj":"gastro","id":"erge-07","dif":1,"stem":"¿Cuál de estos pacientes con ERGE crónica cumple criterios de tamizaje de Barrett según la ACG 2022?","opts":["Mujer de 30 años sin otros factores","Hombre de 58 años, fumador, con obesidad central","Mujer de 40 años delgada","Hombre de 25 años con pirosis ocasional","Ninguno; nunca se tamiza"],"ans":1,"exp":"Se tamiza a quien tiene ERGE crónica y ≥3 factores: hombre, >50 años, raza blanca, obesidad central, tabaquismo, antecedente familiar. Este paciente reúne cuatro.","why":["No reúne factores.","","Solo uno o ninguno.","Joven y sin factores.","Sí se tamiza en grupos de riesgo."],"ref":"ACG 2022 Barrett"},{"topic":"erge","subj":"gastro","id":"erge-08","dif":2,"stem":"Hombre de 50 años con tos crónica nocturna y ronquera. Rx de tórax normal, sin asma ni goteo posnasal, no usa IECA. ¿Qué causa consideras?","opts":["Cáncer de pulmón","ERGE con manifestaciones extraesofágicas","Insuficiencia cardiaca","Tuberculosis","Sarcoidosis"],"ans":1,"exp":"Tos crónica con Rx normal: las tres causas principales son goteo posnasal, asma y ERGE. Excluidas las otras, el reflujo es probable. Si hay pirosis, prueba con IBP; si no, confirma con pH-impedancia.","why":["La Rx es normal.","","No hay datos.","La Rx es normal.","La Rx es normal."],"ref":"ACG 2022 ERGE"},{"topic":"erge","subj":"gastro","id":"erge-09","dif":1,"stem":"Endoscopia: erosiones confluentes que abarcan más del 75% de la circunferencia del esófago. ¿Grado de Los Ángeles?","opts":["A","B","C","D","No se clasifica"],"ans":3,"exp":"LA A: erosiones \u003c5 mm. B: >5 mm sin confluir. C: confluyen pero \u003c75% de la circunferencia. D: ≥75% de la circunferencia.","why":["Erosiones \u003c5 mm.","Erosiones >5 mm sin confluencia.","Confluyen pero \u003c75%.","","Sí se clasifica."],"ref":"Clasificación de Los Ángeles"},{"topic":"erge","subj":"gastro","id":"erge-10","dif":2,"stem":"Paciente con esofagitis LA grado C que cicatrizó tras 8 semanas de IBP. ¿Qué sigue?","opts":["Suspender el IBP","IBP de mantenimiento a largo plazo","IBP solo a demanda","Cirugía obligatoria","Cambiar a antiácidos"],"ans":1,"exp":"La esofagitis grave (LA C/D) recae casi siempre al suspender: se mantiene IBP a la dosis mínima eficaz de forma indefinida (o cirugía si el paciente lo prefiere).","why":["Alta recaída.","","Solo para ERGE no erosiva o LA A/B.","Es una alternativa, no obligatoria.","Insuficiente."],"ref":"ACG 2022 ERGE"},{"topic":"diarrea","subj":"gastro","id":"diarrea-01","dif":1,"stem":"Hombre de 28 años con diarrea acuosa de 2 días, sin fiebre ni sangre, tolera la vía oral. ¿Manejo?","opts":["Coprocultivo y ciprofloxacino","Hidratación oral y vigilancia","Colonoscopia","Metronidazol empírico","Hospitalización"],"ans":1,"exp":"Diarrea aguda acuosa sin datos de alarma: casi siempre viral y autolimitada. No requiere estudios ni antibióticos.","why":["No hay indicación.","","No hay indicación.","No hay indicación.","Tolera la vía oral."],"ref":"ACG 2016 diarrea aguda"},{"topic":"diarrea","subj":"gastro","id":"diarrea-02","dif":2,"stem":"Mujer de 70 años que terminó amoxicilina-clavulanato hace 5 días presenta 6 evacuaciones líquidas al día, leucocitos 14,000 y creatinina normal. PCR para C. difficile positiva. ¿Tratamiento?","opts":["Metronidazol oral","Fidaxomicina o vancomicina oral","Vancomicina IV","Loperamida","Trasplante de microbiota fecal de entrada"],"ans":1,"exp":"Primer episodio no fulminante: fidaxomicina (preferida) o vancomicina oral por 10 días. La vancomicina IV no llega a la luz del colon. El trasplante de microbiota es para recurrencias.","why":["Ya no es primera línea; solo si no hay otra opción en casos leves.","","No alcanza la luz intestinal.","No trata la infección y puede empeorarla.","Para recurrencias múltiples."],"ref":"IDSA/SHEA 2021"},{"topic":"diarrea","subj":"gastro","id":"diarrea-03","dif":2,"stem":"Niño con diarrea sanguinolenta tras comer hamburguesa en una feria. Coprocultivo: E. coli O157:H7. ¿Qué evitas?","opts":["Hidratación","Antibióticos","Vigilar creatinina y plaquetas","Biometría hemática seriada","Aislamiento de contacto"],"ans":1,"exp":"Los antibióticos aumentan la liberación de toxina Shiga y el riesgo de síndrome urémico hemolítico. Se da soporte y se vigila hemólisis, plaquetas y función renal.","why":["Es el pilar.","","Es lo correcto.","Es lo correcto.","Es lo correcto."],"ref":"ACG 2016 diarrea aguda"},{"topic":"diarrea","subj":"gastro","id":"diarrea-04","dif":2,"stem":"Mujer de 35 años con anemia ferropénica que no responde a hierro oral, distensión y diarrea intermitente. ¿Mejor prueba inicial?","opts":["Colonoscopia","Anti-transglutaminasa tisular IgA + IgA total","Prueba de aliento con lactosa","Elastasa fecal","HLA-DQ2/DQ8"],"ans":1,"exp":"Sospecha de celiaca: serología con anti-TTG IgA e IgA total (para no pasar por alto un déficit de IgA). El HLA sirve para descartar (alto valor predictivo negativo), no para diagnosticar.","why":["No es la primera prueba.","","No explica la ferropenia refractaria.","Evalúa el páncreas.","Solo descarta si es negativo."],"ref":"ACG 2023 celiaca"},{"topic":"diarrea","subj":"gastro","id":"diarrea-05","dif":2,"stem":"Paciente con anti-TTG positiva. Antes de la endoscopia, decidió dejar el gluten por su cuenta hace 2 meses. ¿Qué le indicas?","opts":["Continuar sin gluten y no hacer biopsia","Reintroducir gluten (prueba de provocación) antes de la biopsia","Hacer la biopsia de inmediato","Pedir HLA y con eso confirmar","Iniciar budesonida"],"ans":1,"exp":"Sin gluten, la mucosa se recupera y la biopsia puede salir normal. Se reintroduce gluten (~3 g/día por 2–6 semanas o más) antes de la biopsia.","why":["No se confirmaría el diagnóstico.","","Podría salir falsamente normal.","El HLA no confirma.","No está indicada."],"ref":"ACG 2023 celiaca"},{"topic":"diarrea","subj":"gastro","id":"diarrea-06","dif":2,"stem":"Hombre con diarrea crónica que mejora completamente cuando ayuna. Na fecal 30, K fecal 25 mEq/L. ¿Tipo de diarrea?","opts":["Secretora","Osmótica","Inflamatoria","Por dismotilidad","Facticia secretora"],"ans":1,"exp":"Brecha osmótica = 290 − 2 × (30 + 25) = 180 mOsm/kg (>125): diarrea osmótica. Además, cede con el ayuno. Causas: intolerancia a lactosa, laxantes osmóticos, malabsorción de carbohidratos.","why":["La brecha sería \u003c50 y persistiría con ayuno.","","No hay sangre ni fiebre.","No se define por brecha.","La brecha es alta."],"ref":"BSG 2018"},{"topic":"diarrea","subj":"gastro","id":"diarrea-07","dif":2,"stem":"Mujer de 68 años con diarrea acuosa de 3 meses; toma ibuprofeno y omeprazol. Colonoscopia macroscópicamente normal. ¿Qué te falta?","opts":["Nada; el colon es normal","Biopsias aleatorias del colon para descartar colitis microscópica","TC de abdomen","Cápsula endoscópica","Repetir colonoscopia en 1 año"],"ans":1,"exp":"La colitis microscópica (linfocítica o colágena) se ve normal en la colonoscopia: se diagnostica con biopsias. AINE e IBP la favorecen. Tratamiento: budesonida y suspender fármacos asociados.","why":["La mucosa normal no la descarta.","","No hace el diagnóstico.","No está indicada.","Retrasa el diagnóstico."],"ref":"AGA 2016 colitis microscópica"},{"topic":"diarrea","subj":"gastro","id":"diarrea-08","dif":3,"stem":"Paciente con DM de larga evolución, diarrea, distensión y anemia macrocítica. B12 baja y folato alto. ¿Diagnóstico más probable?","opts":["Anemia perniciosa","Sobrecrecimiento bacteriano del intestino delgado","Celiaca","Insuficiencia pancreática","Déficit de lactasa"],"ans":1,"exp":"La dismotilidad diabética favorece el sobrecrecimiento: las bacterias consumen B12 y producen folato. Diagnóstico con prueba de aliento; tratamiento con rifaximina.","why":["No explica el folato alto ni la diarrea.","","Bajaría también el folato.","No eleva el folato.","No altera B12 y folato."],"ref":"ACG 2020 SIBO"},{"topic":"diarrea","subj":"gastro","id":"diarrea-09","dif":1,"stem":"Paciente con celiaca confirmada. ¿Tratamiento?","opts":["Glucocorticoides","Dieta sin gluten (trigo, cebada, centeno) de por vida","Dieta sin lactosa por 3 meses","Enzimas pancreáticas","Mesalazina"],"ans":1,"exp":"La única terapia eficaz es la dieta estricta sin gluten. La avena pura suele tolerarse. Se vigila con serología y, si no mejora, se buscan transgresiones o celiaca refractaria.","why":["Solo en celiaca refractaria.","","Puede ayudar temporalmente, pero no es el tratamiento.","Para insuficiencia pancreática.","Para colitis ulcerosa."],"ref":"ACG 2023 celiaca"},{"topic":"diarrea","subj":"gastro","id":"diarrea-10","dif":2,"stem":"Viajero con 5 evacuaciones al día, fiebre de 38.8 °C y moco con sangre. ¿Antibiótico empírico?","opts":["Ciprofloxacino de primera elección en cualquier región","Azitromicina","Amoxicilina","Metronidazol","Ninguno; está contraindicado"],"ans":1,"exp":"Diarrea del viajero con disentería y fiebre: azitromicina, por la alta resistencia de Campylobacter a quinolonas. Las quinolonas son alternativa en ciertas regiones.","why":["Alta resistencia de Campylobacter.","","No cubre bien los agentes.","Para C. difficile o parásitos.","Está indicado en esta situación."],"ref":"ACG 2016 · ISTM 2017"},{"topic":"espondilo","subj":"reuma","id":"espondilo-01","dif":1,"stem":"Hombre de 24 años con lumbalgia de 8 meses que lo despierta a las 4 a. m. y mejora al hacer ejercicio. Tuvo un episodio de ojo rojo doloroso con fotofobia. ¿Diagnóstico más probable?","opts":["Hernia de disco","Espondiloartritis axial","Lumbalgia mecánica","Artritis reumatoide","Osteoartritis"],"ans":1,"exp":"Lumbalgia inflamatoria en un joven + uveítis anterior: espondiloartritis axial. Siguiente paso: HLA-B27, PCR y Rx o RM de sacroiliacas.","why":["Empeora con el movimiento y tiene radiculopatía.","","Mejora con reposo.","No afecta la columna lumbar.","Es de mayores y mecánica."],"ref":"ASAS 2009 · ASAS-EULAR 2022"},{"topic":"espondilo","subj":"reuma","id":"espondilo-02","dif":2,"stem":"Hombre de 28 años con lumbalgia inflamatoria y HLA-B27 positivo. Rx de sacroiliacas normal. ¿Mejor estudio para buscar sacroileítis temprana?","opts":["TC de columna","RM de articulaciones sacroiliacas","Gammagrama óseo","Ultrasonido","Densitometría"],"ans":1,"exp":"La RM detecta el edema de médula ósea antes de que haya cambios estructurales visibles en la Rx (espondiloartritis axial no radiográfica).","why":["Radiación y no ve inflamación activa.","","Poco específico.","No evalúa la articulación sacroiliaca.","Mide densidad ósea."],"ref":"ASAS-EULAR 2022"},{"topic":"espondilo","subj":"reuma","id":"espondilo-03","dif":2,"stem":"Paciente con espondilitis anquilosante sigue con actividad alta tras 4 semanas de naproxeno y luego otras 4 de celecoxib a dosis completas. ¿Siguiente paso?","opts":["Metotrexato","Anti-TNF o anti-IL-17","Prednisona oral crónica","Sulfasalazina","Hidroxicloroquina"],"ans":1,"exp":"Falla a 2 AINE en enfermedad axial: biológico (anti-TNF o anti-IL-17) o inhibidor de JAK. Los FAME convencionales y los esteroides sistémicos no funcionan para la columna.","why":["No sirve para la enfermedad axial.","","No se recomienda.","Solo para artritis periférica.","No tiene papel."],"ref":"ASAS-EULAR 2022"},{"topic":"espondilo","subj":"reuma","id":"espondilo-04","dif":1,"stem":"Hombre de 26 años con artritis de rodilla y tobillo derechos, conjuntivitis y disuria, 3 semanas después de una relación sexual sin protección. ¿Diagnóstico?","opts":["Artritis séptica gonocócica","Artritis reactiva","Gota","Artritis reumatoide","Fiebre reumática"],"ans":1,"exp":"Oligoartritis asimétrica de miembros inferiores + uretritis + conjuntivitis tras infección por Chlamydia: artritis reactiva.","why":["Daría tenosinovitis, pústulas o monoartritis purulenta.","","No explica uretritis y conjuntivitis.","Es poliartritis simétrica de manos.","Sigue a faringitis estreptocócica."],"ref":"Harrison 21e"},{"topic":"espondilo","subj":"reuma","id":"espondilo-05","dif":2,"stem":"Mujer de 45 años con psoriasis en placas, dolor e inflamación en IFD de varias manos y piqueteado ungueal. FR negativo. ¿Diagnóstico?","opts":["Osteoartritis erosiva","Artritis psoriásica","Artritis reumatoide","Gota tofácea","Lupus"],"ans":1,"exp":"Psoriasis + artritis de IFD + afección ungueal + FR negativo: artritis psoriásica (CASPAR ≥3 puntos).","why":["No tiene inflamación ni asociación con uñas.","","Respeta IFD y suele tener FR o anti-CCP.","No hay datos de tofos ni cristales.","No explica psoriasis y uñas."],"ref":"CASPAR 2006"},{"topic":"espondilo","subj":"reuma","id":"espondilo-06","dif":2,"stem":"Hombre de 50 años con artritis psoriásica periférica poliarticular activa y psoriasis cutánea moderada. ¿FAME convencional de elección?","opts":["Hidroxicloroquina","Metotrexato","Azatioprina","Prednisona en dosis altas","Colchicina"],"ans":1,"exp":"El metotrexato es el FAME convencional preferido en artritis periférica con psoriasis, porque también mejora la piel. Si no responde: biológicos.","why":["Puede empeorar la psoriasis.","","No es de elección.","Los esteroides sistémicos pueden desencadenar psoriasis pustulosa al retirarlos.","Para gota y pericarditis."],"ref":"EULAR PsA 2023"},{"topic":"espondilo","subj":"reuma","id":"espondilo-07","dif":2,"stem":"Paciente con espondilitis anquilosante de larga evolución presenta disnea y soplo diastólico en el borde esternal izquierdo. ¿Qué complicación sospechas?","opts":["Estenosis mitral","Insuficiencia aórtica por aortitis","Pericarditis constrictiva","Comunicación interauricular","Miocardiopatía hipertrófica"],"ans":1,"exp":"La inflamación de la raíz aórtica en espondiloartritis puede causar insuficiencia aórtica y bloqueos de conducción.","why":["No se asocia.","","No se asocia típicamente.","Es congénita.","No se asocia."],"ref":"Harrison 21e"},{"topic":"espondilo","subj":"reuma","id":"espondilo-08","dif":1,"stem":"¿Qué hallazgo de laboratorio caracteriza a las espondiloartritis?","opts":["FR y anti-CCP positivos","FR y anti-CCP negativos (seronegativas), con frecuencia HLA-B27 positivo","ANA positivos a títulos altos","Complemento bajo","ANCA positivos"],"ans":1,"exp":"Son artritis “seronegativas”: sin factor reumatoide ni anti-CCP. El HLA-B27 está presente en ~90% de la espondilitis anquilosante, menos en las otras.","why":["Sugiere AR.","","Sugiere LES y otras conectivopatías.","Sugiere LES.","Sugiere vasculitis."],"ref":"Harrison 21e"},{"topic":"espondilo","subj":"reuma","id":"espondilo-09","dif":3,"stem":"Hombre de 35 años con colitis ulcerosa activa presenta artritis de rodilla que empeora con los brotes intestinales. ¿Qué la mejora?","opts":["Tratar la actividad intestinal","AINE en dosis altas por tiempo prolongado","Colchicina","Alopurinol","Antibióticos"],"ans":0,"exp":"La artritis periférica enteropática (tipo 1) sigue la actividad de la EII: mejora al controlar el intestino. Los AINE pueden exacerbar la colitis.","why":["","Pueden empeorar la EII.","No es gota.","No es gota.","No es infecciosa."],"ref":"Harrison 21e"},{"topic":"espondilo","subj":"reuma","id":"espondilo-10","dif":2,"stem":"Mujer con artritis psoriásica y dedo de la mano completamente inflamado, “en salchicha”. ¿Cómo se llama el hallazgo?","opts":["Tofo","Dactilitis","Nódulo de Heberden","Tenosinovitis de De Quervain","Contractura de Dupuytren"],"ans":1,"exp":"La dactilitis es la inflamación de todo un dedo (articulaciones, tendones y tejidos blandos); es típica de la artritis psoriásica y reactiva.","why":["Depósito de urato.","","Osteofito de IFD en OA.","Afecta el pulgar en la muñeca.","Fibrosis de la fascia palmar."],"ref":"CASPAR 2006"},{"topic":"oa","subj":"reuma","id":"oa-01","dif":1,"stem":"Mujer de 64 años con dolor en ambas rodillas al caminar y subir escaleras, que mejora con reposo. Rigidez matutina de 10 min. Crepitación a la exploración. VSG normal. ¿Diagnóstico?","opts":["Artritis reumatoide","Osteoartritis","Gota","Polimialgia reumática","Artritis séptica"],"ans":1,"exp":"Dolor mecánico, rigidez breve, crepitación y laboratorio normal en mayor de 45 años: osteoartritis. El diagnóstico es clínico.","why":["Daría rigidez >1 h y sinovitis de manos.","","Sería aguda e inflamatoria.","Afecta cinturas y eleva la VSG.","Sería aguda, monoarticular y febril."],"ref":"NICE 2022 · ACR 2019"},{"topic":"oa","subj":"reuma","id":"oa-02","dif":1,"stem":"Mujer de 58 años con OA de rodilla, IMC 33. ¿Cuál medida tiene mayor beneficio y debe recomendarse a todos?","opts":["Glucosamina","Ejercicio y bajar de peso","Ácido hialurónico intraarticular","Opioides","Artroscopia con lavado"],"ans":1,"exp":"Ejercicio y pérdida de peso (≥5%) son recomendaciones fuertes de la ACR 2019 para todos los pacientes con OA de rodilla.","why":["No recomendada.","","Recomendación en contra en rodilla (ACR 2019).","No como tratamiento crónico.","No tiene beneficio en OA."],"ref":"ACR 2019"},{"topic":"oa","subj":"reuma","id":"oa-03","dif":2,"stem":"Hombre de 72 años con OA de rodilla, ERC G3b y antecedente de úlcera péptica. ¿Primera opción farmacológica?","opts":["Naproxeno oral","AINE tópico (diclofenaco gel)","Prednisona oral","Morfina","Colchicina"],"ans":1,"exp":"El AINE tópico tiene eficacia similar en rodilla con mínima absorción sistémica: ideal con ERC, riesgo gastrointestinal o cardiovascular.","why":["Riesgo renal y gastrointestinal alto.","","No se usan esteroides orales en OA.","No como primera línea.","No tiene papel en OA."],"ref":"ACR 2019"},{"topic":"oa","subj":"reuma","id":"oa-04","dif":2,"stem":"¿Cuál hallazgo radiográfico es característico de la osteoartritis?","opts":["Erosiones marginales con osteopenia periarticular","Disminución asimétrica del espacio articular con osteofitos","Erosiones en sacabocado con borde colgante","Condrocalcinosis aislada","Lápiz en copa"],"ans":1,"exp":"La OA pierde cartílago en las zonas de carga (asimétrica) y forma osteofitos, esclerosis y quistes subcondrales.","why":["Típico de AR.","","Típico de gota.","Típico de pirofosfato.","Típico de artritis psoriásica."],"ref":"Harrison 21e"},{"topic":"oa","subj":"reuma","id":"oa-05","dif":2,"stem":"Hombre de 52 años con artropatía de 2ª y 3ª MCF, osteofitos en gancho, DM de reciente diagnóstico y piel bronceada. ¿Qué estudio pides?","opts":["Factor reumatoide","Ferritina y saturación de transferrina","Ácido úrico","HLA-B27","ANA"],"ans":1,"exp":"OA de MCF (sitio atípico) + diabetes + hiperpigmentación: hemocromatosis hereditaria. Saturación de transferrina >45% y ferritina alta; luego HFE.","why":["No explica el cuadro.","","No explica DM ni piel.","No es espondiloartritis.","No orienta."],"ref":"Harrison 21e"},{"topic":"oa","subj":"reuma","id":"oa-06","dif":1,"stem":"Paciente con OA de cadera derecha te pregunta en qué mano debe usar el bastón. ¿Respuesta?","opts":["Derecha","Izquierda","Da igual","En ambas manos","No debe usar bastón"],"ans":1,"exp":"El bastón en la mano contralateral reduce la carga sobre la articulación afectada al desplazar el centro de gravedad durante la marcha.","why":["Es menos eficaz.","","No da igual.","No es necesario.","Sí ayuda."],"ref":"ACR 2019"},{"topic":"oa","subj":"reuma","id":"oa-07","dif":2,"stem":"Mujer con OA de rodilla que pregunta por glucosamina con condroitina. Según la ACR 2019, ¿qué le dices?","opts":["Son la primera línea","No se recomiendan: no hay beneficio consistente","Solo con AINE","Solo si hay derrame","Regeneran el cartílago"],"ans":1,"exp":"Los estudios de calidad no muestran beneficio clínico consistente; la ACR 2019 recomienda fuertemente en contra.","why":["No lo son.","","No cambia la recomendación.","No cambia la recomendación.","No hay evidencia."],"ref":"ACR 2019"},{"topic":"oa","subj":"reuma","id":"oa-08","dif":2,"stem":"Paciente con OA de rodilla que tiene un brote de dolor con derrame y no responde a AINE tópico. ¿Qué opción da alivio de semanas?","opts":["Esteroide intraarticular","Antibiótico intraarticular","Colchicina","Metotrexato","Hidroxicloroquina"],"ans":0,"exp":"La infiltración de esteroide en rodilla o cadera da alivio a corto plazo (semanas). No se repite con mucha frecuencia por posible daño al cartílago.","why":["","No hay infección.","No tiene papel en OA.","No funciona en OA.","No funciona en OA."],"ref":"ACR 2019"},{"topic":"oa","subj":"reuma","id":"oa-09","dif":1,"stem":"¿Qué característica distingue el dolor de la OA del de la AR?","opts":["La OA mejora con la actividad","La OA tiene rigidez matutina corta (\u003c30 min) y empeora con el uso","La OA eleva la PCR","La OA afecta las MCF","La OA es simétrica con sinovitis"],"ans":1,"exp":"OA: dolor mecánico y rigidez breve. AR: dolor inflamatorio con rigidez prolongada (>1 h) que mejora con la actividad, sinovitis de MCF e IFP y reactantes elevados.","why":["Eso es inflamatorio.","","La PCR es normal.","Las respeta.","Eso es AR."],"ref":"Harrison 21e"},{"topic":"oa","subj":"reuma","id":"oa-10","dif":2,"stem":"Hombre de 70 años con OA de cadera grado 4 de Kellgren-Lawrence, dolor nocturno y que ya no camina una cuadra pese a ejercicio, AINE y esteroide intraarticular. ¿Siguiente paso?","opts":["Opioides fuertes crónicos","Artroplastia total de cadera","Ácido hialurónico","Glucosamina","Reposo absoluto"],"ans":1,"exp":"Dolor y limitación funcional graves a pesar del tratamiento conservador: artroplastia, con excelentes resultados en dolor y función.","why":["Riesgos sin beneficio sostenido.","","No recomendado.","No recomendado.","Empeora la función."],"ref":"ACR 2019"},{"topic":"mitral","subj":"cardio","id":"mitral-01","dif":1,"stem":"Mujer de 34 años con antecedente de fiebre reumática, disnea de esfuerzo y palpitaciones. Se ausculta R1 intenso, chasquido de apertura y retumbo diastólico apical. ¿Diagnóstico?","opts":["Insuficiencia mitral","Estenosis mitral","Estenosis aórtica","Insuficiencia aórtica","Comunicación interventricular"],"ans":1,"exp":"R1 intenso + chasquido de apertura + retumbo diastólico apical: estenosis mitral, casi siempre reumática.","why":["Daría soplo holosistólico.","","Soplo sistólico eyectivo en foco aórtico.","Soplo diastólico en borde esternal izquierdo.","Soplo holosistólico paraesternal."],"ref":"ACC/AHA 2020 VHD"},{"topic":"mitral","subj":"cardio","id":"mitral-02","dif":2,"stem":"Mujer con estenosis mitral reumática moderada que desarrolla fibrilación auricular. ¿Anticoagulante?","opts":["Apixabán","Warfarina con INR 2–3","Aspirina","Rivaroxabán","No requiere; CHA2DS2-VA de 0"],"ans":1,"exp":"En estenosis mitral moderada-grave con FA, la anticoagulación está indicada sin importar el puntaje, y con warfarina: INVICTUS mostró más muertes y eventos con rivaroxabán.","why":["No se recomiendan los ACOD en EM reumática moderada-grave.","","No previene embolia de forma suficiente.","Peor que warfarina en INVICTUS.","El puntaje no aplica en EM."],"ref":"INVICTUS 2022 · ESC 2025"},{"topic":"mitral","subj":"cardio","id":"mitral-03","dif":2,"stem":"Mujer de 30 años con estenosis mitral grave sintomática (área 1.0 cm²), puntaje de Wilkins 7, sin trombo en la aurícula e insuficiencia mitral trivial. ¿Tratamiento de elección?","opts":["Reemplazo valvular quirúrgico","Comisurotomía mitral percutánea con balón","Solo diuréticos","TEER","Esperar a que tenga FA"],"ans":1,"exp":"Anatomía favorable (Wilkins ≤8), sin trombo y sin insuficiencia significativa: valvuloplastia con balón, con buenos resultados y sin cirugía abierta.","why":["Se reserva para anatomía desfavorable.","","Es sintomática y grave.","Es para insuficiencia mitral.","No se espera."],"ref":"ACC/AHA 2020 · ESC 2025"},{"topic":"mitral","subj":"cardio","id":"mitral-04","dif":2,"stem":"Hombre de 62 años en el día 4 de un IAM inferior presenta edema pulmonar súbito, hipotensión y un soplo sistólico apical nuevo. ¿Diagnóstico?","opts":["Rotura de pared libre","Rotura del músculo papilar posteromedial","Pericarditis","Reinfarto","Aneurisma ventricular"],"ans":1,"exp":"El músculo papilar posteromedial tiene irrigación única (coronaria derecha o circunfleja), por eso se rompe en IAM inferior. Da insuficiencia mitral aguda: cirugía urgente.","why":["Causa taponamiento, no soplo.","","No causa edema pulmonar súbito.","No explica el soplo nuevo.","Es tardío y no agudo."],"ref":"ESC 2023 SCA"},{"topic":"mitral","subj":"cardio","id":"mitral-05","dif":2,"stem":"Hombre de 55 años asintomático con insuficiencia mitral primaria grave por prolapso. Eco: FEVI 58%, diámetro telesistólico 42 mm. ¿Manejo?","opts":["Vigilancia anual","Reparación quirúrgica de la válvula mitral","IECA y revisar en 6 meses","TEER","Esperar a que tenga síntomas"],"ans":1,"exp":"IM primaria grave con datos de disfunción del VI (FEVI ≤60% o DTS ≥40 mm) aunque no tenga síntomas: cirugía, de preferencia reparación.","why":["Ya hay disfunción del VI.","","Los vasodilatadores no cambian la historia en IM primaria.","Para alto riesgo quirúrgico.","El daño del VI puede ser irreversible."],"ref":"ACC/AHA 2020 VHD"},{"topic":"mitral","subj":"cardio","id":"mitral-06","dif":2,"stem":"Paciente con miocardiopatía isquémica, FEVI 30% e insuficiencia mitral grave secundaria. Primer paso:","opts":["Reemplazo valvular mitral","Tratamiento óptimo de la insuficiencia cardiaca (y resincronización si está indicada)","Valvuloplastia con balón","Anticoagulación sola","Reparación quirúrgica inmediata"],"ans":1,"exp":"En IM secundaria el problema es el ventrículo: se optimiza el tratamiento de la IC con FE reducida. Si persiste la IM grave con síntomas, se considera TEER.","why":["No es el primer paso.","","Es para estenosis mitral.","No trata la causa.","No es el primer paso."],"ref":"ESC 2025 VHD · COAPT"},{"topic":"mitral","subj":"cardio","id":"mitral-07","dif":1,"stem":"Mujer de 28 años con clic mesosistólico seguido de soplo sistólico tardío. Al ponerse de pie, el clic aparece antes. ¿Diagnóstico?","opts":["Estenosis aórtica","Prolapso de válvula mitral","Miocardiopatía hipertrófica","Comunicación interauricular","Estenosis mitral"],"ans":1,"exp":"Al ponerse de pie baja la precarga, el ventrículo se hace más pequeño y la válvula prolapsa antes: el clic se adelanta.","why":["No tiene clic.","","El soplo aumenta de pie pero no hay clic.","Desdoblamiento fijo del R2.","Es un soplo diastólico."],"ref":"Harrison 21e"},{"topic":"mitral","subj":"cardio","id":"mitral-08","dif":2,"stem":"Embarazada de 24 semanas con estenosis mitral moderada presenta disnea y FC de 118 en ritmo sinusal. ¿Primer fármaco?","opts":["Digoxina","Betabloqueador (metoprolol)","IECA","Amiodarona","Espironolactona"],"ans":1,"exp":"La taquicardia acorta la diástole y eleva la presión en la aurícula. El betabloqueador alarga el llenado diastólico. Diuréticos de asa si hay congestión. Los IECA están contraindicados en el embarazo.","why":["Poco útil en ritmo sinusal.","","Teratógeno.","No es el primer fármaco.","Antiandrogénico; no recomendada."],"ref":"ESC 2025 VHD · ESC 2018 Embarazo"},{"topic":"mitral","subj":"cardio","id":"mitral-09","dif":3,"stem":"¿Qué hallazgo auscultatorio indica una estenosis mitral más grave?","opts":["Retumbo más corto","Intervalo R2–chasquido de apertura más corto","R1 más suave","Ausencia de chasquido siempre","Soplo holosistólico"],"ans":1,"exp":"Con más presión en la aurícula, la válvula se abre antes tras el cierre aórtico: el chasquido se acerca al R2. Además el retumbo se alarga.","why":["El retumbo se alarga.","","El R1 suave aparece con válvula muy calcificada, no indica gravedad por sí solo.","Ocurre en válvulas calcificadas, no siempre.","Eso es insuficiencia."],"ref":"Harrison 21e"},{"topic":"mitral","subj":"cardio","id":"mitral-10","dif":2,"stem":"Hombre de 82 años con insuficiencia mitral primaria grave sintomática y riesgo quirúrgico muy alto (STS 12%). Anatomía adecuada. ¿Opción?","opts":["Reparación quirúrgica abierta","Reparación transcatéter borde a borde (TEER)","Valvuloplastia con balón","Solo diuréticos sin otra opción","Trasplante cardiaco"],"ans":1,"exp":"Con riesgo quirúrgico prohibitivo y anatomía favorable, la TEER mejora síntomas y calidad de vida.","why":["Riesgo muy alto.","","Para estenosis mitral.","Existe una opción intervencionista.","No es candidato."],"ref":"ACC/AHA 2020 VHD"},{"topic":"linfo","subj":"hemato","id":"linfo-01","dif":1,"stem":"Mujer de 24 años con adenopatía cervical indolora de 6 semanas, masa mediastinal en la Rx y prurito. ¿Cómo confirmas el diagnóstico?","opts":["Aspiración con aguja fina","Biopsia escisional del ganglio","Solo PET-CT","Antibióticos y revalorar","Biopsia de médula ósea"],"ans":1,"exp":"Sospecha de linfoma de Hodgkin: se necesita la arquitectura ganglionar y las células de Reed-Sternberg en su contexto. La biopsia escisional es el estándar.","why":["No da la arquitectura.","","Estadifica pero no diagnostica.","Retrasa el diagnóstico.","No es el primer paso."],"ref":"Lugano 2014"},{"topic":"linfo","subj":"hemato","id":"linfo-02","dif":1,"stem":"Biopsia ganglionar con células grandes binucleadas “en ojos de búho”, CD15+ y CD30+, en un fondo de linfocitos y eosinófilos. ¿Diagnóstico?","opts":["Linfoma folicular","Linfoma de Hodgkin","Linfoma de Burkitt","LLC","Linfoma del manto"],"ans":1,"exp":"Las células de Reed-Sternberg (CD15+, CD30+) en un fondo inflamatorio son el sello del linfoma de Hodgkin clásico.","why":["Folículos con células pequeñas, BCL2.","","Cielo estrellado, MYC.","Linfocitos pequeños maduros.","Ciclina D1."],"ref":"OMS 2022"},{"topic":"linfo","subj":"hemato","id":"linfo-03","dif":2,"stem":"Hombre de 74 años con linfocitos de 22,000/µL, células en mancha, CD5+ CD23+. Sin adenopatías grandes, sin síntomas, Hb y plaquetas normales. ¿Manejo?","opts":["Ibrutinib de inmediato","Vigilancia (“vigilar y esperar”)","R-CHOP","Trasplante alogénico","Esplenectomía"],"ans":1,"exp":"LLC en estadio temprano sin criterios de actividad: observación cada 3–12 meses. El tratamiento temprano no mejora la supervivencia.","why":["No hay indicación.","","Es para linfoma agresivo.","No está indicado.","No está indicada."],"ref":"iwCLL 2018"},{"topic":"linfo","subj":"hemato","id":"linfo-04","dif":2,"stem":"Paciente con LLC presenta Hb 6.8, reticulocitos altos, esferocitos y Coombs directo positivo. ¿Complicación?","opts":["Infiltración medular","Anemia hemolítica autoinmune caliente","Transformación de Richter","Déficit de B12","Hiperesplenismo"],"ans":1,"exp":"La LLC se asocia a autoinmunidad: AHAI caliente (la más común) y PTI. Se trata con esteroides y, si es necesario, tratamiento de la LLC.","why":["Daría reticulocitos bajos y Coombs negativo.","","Sería crecimiento ganglionar rápido con LDH alta.","No explica Coombs positivo.","No da Coombs positivo."],"ref":"iwCLL 2018"},{"topic":"linfo","subj":"hemato","id":"linfo-05","dif":2,"stem":"Adolescente con masa abdominal de crecimiento rápido. Biopsia: patrón en “cielo estrellado” y t(8;14). ¿Qué complicación debes prevenir al iniciar quimioterapia?","opts":["Hipercalcemia","Síndrome de lisis tumoral","CID","Hiperviscosidad","Insuficiencia suprarrenal"],"ans":1,"exp":"El Burkitt tiene altísima tasa de proliferación: al tratarlo, la destrucción masiva causa lisis tumoral. Se previene con hidratación y rasburicasa.","why":["No es la complicación típica.","","Típica de LPA.","Típica de Waldenström.","No se asocia."],"ref":"Harrison 21e"},{"topic":"linfo","subj":"hemato","id":"linfo-06","dif":2,"stem":"Hombre de 58 años con adenopatías generalizadas indoloras de lento crecimiento desde hace 2 años, asintomático. Biopsia: linfoma folicular, t(14;18). Baja carga tumoral. ¿Manejo?","opts":["R-CHOP de inmediato","Vigilancia activa","ABVD","Radioterapia corporal total","Trasplante"],"ans":1,"exp":"El linfoma folicular avanzado con baja carga y sin síntomas se vigila: el tratamiento temprano no mejora la supervivencia global.","why":["No hay indicación aún.","","Es para Hodgkin.","No está indicada.","No está indicado."],"ref":"NCCN B-cell lymphomas"},{"topic":"linfo","subj":"hemato","id":"linfo-07","dif":2,"stem":"Paciente con dispepsia; biopsia gástrica: linfoma MALT de bajo grado localizado y H. pylori positivo. ¿Tratamiento inicial?","opts":["Gastrectomía total","Erradicación de H. pylori","R-CHOP","Radioterapia","IBP solo"],"ans":1,"exp":"El MALT gástrico depende del estímulo antigénico de H. pylori: la erradicación logra remisión en la mayoría de los casos localizados.","why":["Excesivo.","","No como primera opción.","Se reserva si no responde.","No elimina la bacteria."],"ref":"NCCN · Maastricht VI"},{"topic":"linfo","subj":"hemato","id":"linfo-08","dif":1,"stem":"¿Cuál es el linfoma no Hodgkin más común en adultos?","opts":["Folicular","Difuso de células B grandes","Burkitt","Manto","MALT"],"ans":1,"exp":"El linfoma difuso de células B grandes representa ~30% de los LNH: agresivo pero curable con R-CHOP en un 60–70%.","why":["Es el segundo.","","Es raro en adultos.","Es poco común.","Es poco común."],"ref":"OMS 2022"},{"topic":"linfo","subj":"hemato","id":"linfo-09","dif":2,"stem":"Paciente con linfoma de Hodgkin con adenopatías cervicales y axilares izquierdas, y mediastinales. Nada debajo del diafragma, sin afección extraganglionar. ¿Estadio de Lugano?","opts":["I","II","III","IV","No aplica"],"ans":1,"exp":"Estadio II: dos o más regiones ganglionares del mismo lado del diafragma. III sería a ambos lados; IV, afección extraganglionar difusa.","why":["Sería una sola región.","","Requiere ambos lados del diafragma.","Requiere afección extraganglionar difusa.","Sí aplica."],"ref":"Lugano 2014"},{"topic":"linfo","subj":"hemato","id":"linfo-10","dif":3,"stem":"Sobreviviente de linfoma de Hodgkin tratado a los 20 años con ABVD y radioterapia en el mediastino. Ahora tiene 38 años. ¿Qué tamizaje está especialmente indicado?","opts":["Colonoscopia anual","Mastografía y RM de mama tempranas","PSA","Endoscopia anual","Ninguno especial"],"ans":1,"exp":"La radiación torácica en la juventud aumenta mucho el riesgo de cáncer de mama: tamizaje anual con RM y mastografía desde los 25–30 años o 8 años tras la radiación. También vigilar tiroides y función cardiaca.","why":["No es el riesgo principal.","","No tiene relación.","No tiene relación.","Hay riesgos tardíos específicos."],"ref":"COG Long-Term Follow-Up Guidelines"},{"topic":"hipofisis","subj":"endo","id":"hipofisis-01","dif":1,"stem":"Mujer de 27 años con amenorrea de 6 meses y galactorrea. Prueba de embarazo negativa, TSH normal, no toma fármacos. PRL 180 ng/mL. RM: adenoma de 7 mm. ¿Tratamiento?","opts":["Cirugía transesfenoidal","Cabergolina","Radioterapia","Octreotida","Observación sin tratamiento"],"ans":1,"exp":"Microprolactinoma sintomático: agonista dopaminérgico. La cabergolina normaliza la PRL y reduce el tumor en la mayoría.","why":["Segunda línea.","","No es primera línea.","Es para acromegalia.","Tiene amenorrea; requiere tratamiento."],"ref":"Endocrine Society 2011"},{"topic":"hipofisis","subj":"endo","id":"hipofisis-02","dif":2,"stem":"Hombre de 45 años con cefalea, hemianopsia bitemporal y disfunción eréctil. RM: macroadenoma de 3.5 cm. PRL 3,800 ng/mL. ¿Tratamiento inicial?","opts":["Cirugía urgente","Cabergolina, con vigilancia de campos visuales","Radioterapia","Observación","Pegvisomant"],"ans":1,"exp":"Aun los macroprolactinomas con compresión del quiasma se tratan primero con agonista dopaminérgico: reducen el tumor y mejoran la visión en días a semanas. La cirugía se reserva si no mejora.","why":["No es la primera opción en prolactinoma.","","No es la primera opción.","Hay compromiso visual.","Es para acromegalia."],"ref":"Endocrine Society 2011"},{"topic":"hipofisis","subj":"endo","id":"hipofisis-03","dif":2,"stem":"Mujer de 34 años con galactorrea, fatiga, estreñimiento y aumento de peso. PRL 58 ng/mL, TSH 32 mUI/L. ¿Qué haces?","opts":["RM de hipófisis y cabergolina","Levotiroxina y repetir PRL","Cirugía","Bromocriptina","Octreotida"],"ans":1,"exp":"En el hipotiroidismo primario la TRH elevada estimula la PRL (y puede agrandar la hipófisis). Se corrige el tiroides y se repite la PRL.","why":["No antes de tratar el hipotiroidismo.","","No hay indicación.","No es el problema principal.","No tiene relación."],"ref":"Endocrine Society 2011"},{"topic":"hipofisis","subj":"endo","id":"hipofisis-04","dif":1,"stem":"Hombre de 50 años que ya no le quedan sus anillos, con prognatismo, sudoración y diabetes reciente. ¿Mejor prueba de tamizaje?","opts":["GH al azar","IGF-1","Prolactina","Cortisol urinario","TSH"],"ans":1,"exp":"La GH es pulsátil y una medición aislada no sirve. El IGF-1 refleja la GH integrada y es el tamizaje. Se confirma con la falta de supresión de GH tras glucosa oral.","why":["Es pulsátil; poco útil.","","No evalúa el eje de GH.","Es para Cushing.","No evalúa el eje de GH."],"ref":"Endocrine Society 2014 · Consenso 2024"},{"topic":"hipofisis","subj":"endo","id":"hipofisis-05","dif":2,"stem":"Paciente con IGF-1 elevado. ¿Prueba confirmatoria de acromegalia?","opts":["Supresión con dexametasona","GH tras 75 g de glucosa oral (no suprime \u003c1 ng/mL)","Estimulación con ACTH","Prueba de privación de agua","Hipoglucemia inducida por insulina"],"ans":1,"exp":"Normalmente la glucosa suprime la GH; en la acromegalia, el tumor no se frena.","why":["Es para Cushing.","","Es para insuficiencia suprarrenal.","Es para diabetes insípida.","Evalúa deficiencia de GH o ACTH."],"ref":"Consenso de acromegalia 2024"},{"topic":"hipofisis","subj":"endo","id":"hipofisis-06","dif":2,"stem":"Hombre de 60 años con macroadenoma conocido presenta cefalea súbita “la peor de su vida”, diplopía, pérdida visual y PA 82/50. ¿Primer paso?","opts":["Cabergolina","Hidrocortisona IV","Punción lumbar","Levotiroxina IV","Desmopresina"],"ans":1,"exp":"Apoplejía hipofisaria con datos de insuficiencia suprarrenal aguda: hidrocortisona IV inmediata (100 mg) y luego RM y valoración neuroquirúrgica.","why":["No es el primer paso.","","No es lo prioritario y puede ser riesgosa.","Sin cortisol puede precipitar crisis suprarrenal.","No trata la hipotensión."],"ref":"UK guidelines on pituitary apoplexy"},{"topic":"hipofisis","subj":"endo","id":"hipofisis-07","dif":2,"stem":"Mujer de 38 años con obesidad central, estrías violáceas, debilidad proximal e HTA. Cortisol urinario elevado en 2 ocasiones, no suprime con 1 mg de dexametasona. ACTH 78 pg/mL (alta). ¿Siguiente estudio?","opts":["TC de suprarrenales","RM de hipófisis","TC de tórax","Gammagrafía con octreotida","Cateterismo de senos petrosos de entrada"],"ans":1,"exp":"Cushing dependiente de ACTH: la causa más probable es un adenoma hipofisario (enfermedad de Cushing). Si la RM no muestra un adenoma claro (>6 mm), se hace cateterismo de senos petrosos.","why":["Sería si la ACTH estuviera suprimida.","","Se busca ACTH ectópica si las pruebas lo sugieren.","No es el primer estudio.","Va después de la RM si no es concluyente."],"ref":"Fleseriu, Lancet Diabetes Endocrinol 2021"},{"topic":"hipofisis","subj":"endo","id":"hipofisis-08","dif":2,"stem":"Hallazgo incidental: adenoma hipofisario de 6 mm en una RM por migraña. Sin síntomas. ¿Qué estudios pides?","opts":["Ninguno","PRL, IGF-1 y tamizaje de Cushing","Solo campimetría","Cirugía","Biopsia"],"ans":1,"exp":"Todo incidentaloma se evalúa por hipersecreción (aunque no dé síntomas evidentes). Al ser micro y sin contacto con el quiasma, no requiere campimetría; se repite la RM en 1 año.","why":["Debe evaluarse la función.","","Solo si es macro o cercano al quiasma.","No hay indicación.","No se biopsia."],"ref":"Endocrine Society 2011"},{"topic":"hipofisis","subj":"endo","id":"hipofisis-09","dif":3,"stem":"Mujer con macroadenoma de 4 cm que invade el seno cavernoso, con cefalea y alteración visual. PRL 42 ng/mL. ¿Qué debes pedir antes de concluir que no es prolactinoma?","opts":["Nada; con 42 no es prolactinoma","PRL con dilución (descartar efecto gancho)","Macroprolactina","Cortisol urinario","TSH"],"ans":1,"exp":"En tumores gigantes la PRL muy alta satura el inmunoensayo y da un valor falsamente bajo (efecto gancho). Con la muestra diluida aparece el valor real.","why":["Puede ser un falso bajo.","","Explica PRL alta sin síntomas, no baja.","No responde la pregunta.","No responde la pregunta."],"ref":"Endocrine Society 2011"},{"topic":"hipofisis","subj":"endo","id":"hipofisis-10","dif":2,"stem":"Dos días después de una cirugía transesfenoidal, el paciente orina 6 L/día de orina diluida con sodio sérico de 149. ¿Diagnóstico y tratamiento?","opts":["SIADH; restricción de líquidos","Deficiencia de arginina vasopresina (diabetes insípida central); desmopresina","Diuresis osmótica; insulina","Polidipsia primaria; restricción de líquidos","Insuficiencia renal; diálisis"],"ans":1,"exp":"La manipulación del tallo hipofisario puede reducir la ADH: poliuria con orina diluida e hipernatremia. Se trata con desmopresina y líquidos, vigilando el sodio (puede seguir una fase de SIADH).","why":["Daría hiponatremia y orina concentrada.","","No hay hiperglucemia.","El sodio estaría bajo o normal.","No hay datos."],"ref":"Harrison 21e"},{"topic":"hp","subj":"cardio","id":"hp-01","dif":1,"stem":"Según la ESC/ERS 2022, ¿cuál es la definición hemodinámica de hipertensión pulmonar?","opts":["PSAP >35 mmHg por eco","PAPm >20 mmHg en reposo por cateterismo derecho","PAPm ≥25 mmHg con ejercicio","Velocidad tricuspídea >2 m/s","PAWP >15 mmHg"],"ans":1,"exp":"La guía de 2022 bajó el umbral a PAPm >20 mmHg en reposo, medida por cateterismo. El eco solo estima la probabilidad.","why":["El eco no hace el diagnóstico.","","No se define con ejercicio.","Es un dato de probabilidad, con otro umbral.","Define el componente poscapilar."],"ref":"ESC/ERS 2022 HP"},{"topic":"hp","subj":"cardio","id":"hp-02","dif":2,"stem":"Mujer de 32 años con disnea progresiva y síncope de esfuerzo. Eco: VD dilatado, velocidad tricuspídea 3.8 m/s, VI normal. PFP y TC de tórax normales. Gammagrama V/Q normal. ¿Siguiente paso?","opts":["Iniciar sildenafil empírico","Cateterismo cardiaco derecho con prueba de vasorreactividad","Anticoagulación de por vida","Biopsia pulmonar","Repetir el eco en 1 año"],"ans":1,"exp":"Alta probabilidad de HAP (grupo 1) tras descartar grupos 2, 3 y 4: el cateterismo confirma y la prueba de vasorreactividad identifica a quienes responderán a calcioantagonistas.","why":["No sin confirmar el diagnóstico.","","No hay HPTEC.","No está indicada.","Retrasa el tratamiento."],"ref":"ESC/ERS 2022 HP"},{"topic":"hp","subj":"cardio","id":"hp-03","dif":2,"stem":"Paciente con disnea persistente 6 meses después de un TEP, pese a anticoagulación. Eco con datos de hipertensión pulmonar. ¿Estudio para buscar HPTEC?","opts":["Dímero D","Gammagrama de ventilación/perfusión","Ultrasonido Doppler de piernas","Prueba de esfuerzo","Ecocardiograma transesofágico"],"ans":1,"exp":"El gammagrama V/Q es el estudio de tamizaje de HPTEC: un V/Q normal la descarta. Si hay defectos, se confirma con cateterismo y angiografía pulmonar.","why":["No sirve para HPTEC.","","No evalúa la circulación pulmonar.","No es diagnóstico.","No evalúa las arterias pulmonares distales."],"ref":"ESC/ERS 2022 HP"},{"topic":"hp","subj":"cardio","id":"hp-04","dif":2,"stem":"Hombre con HPTEC confirmada, con trombos organizados en arterias lobares accesibles. ¿Tratamiento?","opts":["Solo oxígeno","Anticoagulación de por vida + endarterectomía pulmonar","Trombólisis","Calcioantagonista","Filtro de vena cava como único tratamiento"],"ans":1,"exp":"La endarterectomía pulmonar puede curar la HPTEC operable. La anticoagulación se mantiene de por vida.","why":["Insuficiente.","","Los trombos están organizados; no responden.","No tiene papel.","No trata la enfermedad."],"ref":"ESC/ERS 2022 HP"},{"topic":"hp","subj":"cardio","id":"hp-05","dif":1,"stem":"¿Cuál es la causa más común de hipertensión pulmonar?","opts":["HAP idiopática","Cardiopatía izquierda","HPTEC","Esquistosomiasis","Sarcoidosis"],"ans":1,"exp":"El grupo 2 (IC con FE reducida o preservada, valvulopatías) es la causa más frecuente, seguido del grupo 3 (enfermedad pulmonar).","why":["Es rara.","","Es poco común.","Común en zonas endémicas, no en general.","Es poco común."],"ref":"ESC/ERS 2022 HP"},{"topic":"hp","subj":"cardio","id":"hp-06","dif":2,"stem":"Paciente con HAP idiopática y prueba de vasorreactividad positiva. ¿Tratamiento inicial?","opts":["Bosentán + tadalafil","Calcioantagonista en dosis altas (nifedipino, diltiazem o amlodipino)","Epoprostenol IV","Riociguat","Solo diuréticos"],"ans":1,"exp":"Los respondedores a vasorreactividad (~10%) mejoran con calcioantagonistas en dosis altas; se reevalúa a los 3–6 meses.","why":["Para no respondedores.","","Para alto riesgo sin respuesta.","Para HPTEC no operable o HAP.","Insuficiente."],"ref":"ESC/ERS 2022 HP"},{"topic":"hp","subj":"cardio","id":"hp-07","dif":2,"stem":"Mujer con HAP idiopática de riesgo intermedio-bajo, vasorreactividad negativa y sin comorbilidades cardiopulmonares. ¿Tratamiento inicial?","opts":["Calcioantagonista","Antagonista de receptores de endotelina + inhibidor de PDE5","Monoterapia con sildenafil siempre","Anticoagulación sola","Trasplante pulmonar"],"ans":1,"exp":"La terapia combinada inicial (por ejemplo, ambrisentán + tadalafil, estudio AMBITION) mejora los desenlaces frente a monoterapia.","why":["Contraindicado sin vasorreactividad.","","La combinación es superior.","No es tratamiento de HAP.","Se reserva para refractarios."],"ref":"ESC/ERS 2022 HP · AMBITION"},{"topic":"hp","subj":"cardio","id":"hp-08","dif":2,"stem":"Hombre con EPOC grave, PaO2 52 mmHg y datos de hipertensión pulmonar leve. ¿Tratamiento principal de su hipertensión pulmonar?","opts":["Sildenafil","Oxígeno suplementario y tratar la EPOC","Bosentán","Epoprostenol","Calcioantagonista"],"ans":1,"exp":"En el grupo 3, la hipoxia causa vasoconstricción pulmonar: el oxígeno (si PaO2 \u003c55–60) y el tratamiento del pulmón son la base. Los vasodilatadores de HAP pueden empeorar la oxigenación.","why":["Puede empeorar la relación V/Q.","","No indicado en grupo 3.","No indicado.","No indicado."],"ref":"ESC/ERS 2022 HP"},{"topic":"hp","subj":"cardio","id":"hp-09","dif":1,"stem":"¿Qué enfermedad reumatológica requiere tamizaje periódico de HAP?","opts":["Artritis reumatoide","Esclerosis sistémica","Gota","Osteoartritis","Polimialgia reumática"],"ans":1,"exp":"La HAP afecta a ~10% de las personas con esclerosis sistémica (sobre todo la limitada) y es causa principal de muerte. Se tamiza cada año con eco, DLCO y NT-proBNP (algoritmo DETECT).","why":["No es la asociación típica.","","No se asocia.","No se asocia.","No se asocia."],"ref":"ESC/ERS 2022 HP"},{"topic":"hp","subj":"cardio","id":"hp-10","dif":3,"stem":"Paciente con HAP en tratamiento con sildenafil. Otro médico quiere agregar riociguat. ¿Qué le dices?","opts":["Es una buena combinación","Está contraindicado: riesgo de hipotensión grave","Solo si toma calcioantagonista","Solo si hay HPTEC","Solo a la mitad de dosis"],"ans":1,"exp":"Ambos aumentan la vía del GMPc (uno inhibe su degradación, el otro estimula su síntesis): la combinación causa hipotensión y está contraindicada.","why":["No lo es.","","No cambia la contraindicación.","No cambia la contraindicación.","No es seguro."],"ref":"ESC/ERS 2022 HP"},{"topic":"deglucion","subj":"gastro","id":"deglucion-01","dif":1,"stem":"Hombre de 72 años con EVC previo que tose al tragar líquidos y tiene regurgitación nasal. ¿Tipo de disfagia y estudio?","opts":["Esofágica; endoscopia","Orofaríngea; videofluoroscopia de la deglución","Esofágica; manometría","Orofaríngea; pH-metría","Funcional; ninguno"],"ans":1,"exp":"Tos al tragar y regurgitación nasal tras un EVC: disfagia orofaríngea neurológica. La videofluoroscopia evalúa la fase oral y faríngea y el riesgo de aspiración.","why":["Es orofaríngea.","","Es orofaríngea.","No evalúa la deglución.","Tiene causa clara."],"ref":"ACG · Harrison 21e"},{"topic":"deglucion","subj":"gastro","id":"deglucion-02","dif":1,"stem":"Mujer de 40 años con disfagia a sólidos y líquidos desde el inicio, regurgitación de comida sin digerir y pérdida de 5 kg en un año. Esofagograma: dilatación con estrechamiento distal en “pico de pájaro”. ¿Diagnóstico?","opts":["Cáncer de esófago","Acalasia","Esofagitis eosinofílica","Anillo de Schatzki","ERGE"],"ans":1,"exp":"Disfagia motora (sólidos y líquidos) + regurgitación + pico de pájaro: acalasia. Se confirma con manometría y se hace endoscopia para descartar pseudoacalasia.","why":["Empezaría con sólidos y sería más rápida.","","Disfagia intermitente a sólidos.","Intermitente a sólidos.","Pirosis, no esta imagen."],"ref":"ACG 2020 Acalasia"},{"topic":"deglucion","subj":"gastro","id":"deglucion-03","dif":2,"stem":"Hombre de 66 años, fumador, con disfagia de 3 meses primero a sólidos y ahora a líquidos, con pérdida de 9 kg. ¿Estudio inicial?","opts":["Manometría","Endoscopia con biopsias","pH-metría","Prueba con IBP","Videofluoroscopia"],"ans":1,"exp":"Disfagia mecánica progresiva + pérdida de peso: sospecha de cáncer. Endoscopia con biopsias primero.","why":["No es el primer estudio.","","No evalúa obstrucción.","Retrasa el diagnóstico.","Es para disfagia orofaríngea."],"ref":"ACG"},{"topic":"deglucion","subj":"gastro","id":"deglucion-04","dif":2,"stem":"Hombre de 24 años con asma y rinitis alérgica llega a urgencias con un trozo de carne atorado; ya le pasó antes. ¿Qué esperas en las biopsias?","opts":["Metaplasia intestinal","≥15 eosinófilos por campo de alto poder","Células en anillo de sello","Granulomas","Inclusiones virales"],"ans":1,"exp":"Esofagitis eosinofílica: hombre joven, atopia e impactación alimentaria. Se diagnostica con ≥15 eosinófilos por campo en biopsias esofágicas.","why":["Es Barrett.","","Es adenocarcinoma gástrico difuso.","Sugiere Crohn.","Sugiere CMV o herpes."],"ref":"ACG 2025 EoE"},{"topic":"deglucion","subj":"gastro","id":"deglucion-05","dif":2,"stem":"Hombre de 75 años con halitosis, regurgitación de comida que comió días antes y gorgoteo al tragar. ¿Diagnóstico y estudio?","opts":["Acalasia; manometría","Divertículo de Zenker; esofagograma con bario","Cáncer; endoscopia","ERGE; IBP","Esofagitis eosinofílica; biopsias"],"ans":1,"exp":"El Zenker es una bolsa de pulsión sobre el cricofaríngeo. El esofagograma lo muestra; la endoscopia a ciegas tiene riesgo de perforarlo.","why":["No explica la halitosis ni el gorgoteo.","","La endoscopia tiene riesgo de perforación aquí.","No explica el cuadro.","No explica el cuadro."],"ref":"Harrison 21e"},{"topic":"deglucion","subj":"gastro","id":"deglucion-06","dif":2,"stem":"Hombre de 50 años con disfagia intermitente a carne desde hace 2 años, sin pérdida de peso. Endoscopia: anillo delgado en la unión esofagogástrica. ¿Diagnóstico y tratamiento?","opts":["Acalasia; Heller","Anillo de Schatzki; dilatación endoscópica","Cáncer; esofagectomía","Zenker; miotomía","Espasmo; nitratos"],"ans":1,"exp":"El anillo de Schatzki causa disfagia intermitente a sólidos (sobre todo carne). Se trata con dilatación y IBP.","why":["No hay trastorno motor.","","Es un anillo benigno.","Es proximal.","No hay dolor ni patrón motor."],"ref":"Harrison 21e"},{"topic":"deglucion","subj":"gastro","id":"deglucion-07","dif":3,"stem":"Hombre de 70 años con “acalasia” en la manometría pero con disfagia de 2 meses y pérdida de 12 kg. ¿Qué haces antes de tratar?","opts":["POEM de inmediato","Endoscopia (± ultrasonido endoscópico o TC) para descartar pseudoacalasia","Toxina botulínica","Dilatación neumática","Nitratos"],"ans":1,"exp":"Edad avanzada, evolución corta y pérdida de peso marcada sugieren pseudoacalasia por cáncer de la unión esofagogástrica que infiltra el plexo.","why":["No sin descartar cáncer.","","No sin descartar cáncer.","Riesgo de perforar un tumor.","No resuelve."],"ref":"ACG 2020 Acalasia"},{"topic":"deglucion","subj":"gastro","id":"deglucion-08","dif":2,"stem":"Paciente con VIH y CD4 de 80 refiere dolor intenso al tragar. ¿Causa más probable?","opts":["Acalasia","Esofagitis infecciosa (Candida en primer lugar)","Anillo de Schatzki","Divertículo de Zenker","Esófago de Barrett"],"ans":1,"exp":"Odinofagia en inmunosupresión: Candida (la más común; tratamiento empírico con fluconazol), luego CMV (úlceras grandes) y herpes (úlceras pequeñas).","why":["No causa odinofagia.","","Causa disfagia intermitente.","No causa odinofagia.","No causa odinofagia."],"ref":"Guías de infecciones oportunistas en VIH"},{"topic":"deglucion","subj":"gastro","id":"deglucion-09","dif":2,"stem":"Mujer con acalasia tipo III (espástica) confirmada por manometría. ¿Tratamiento de elección?","opts":["Dilatación neumática","POEM (miotomía endoscópica peroral)","IBP","Funduplicatura de Nissen","Dieta líquida"],"ans":1,"exp":"En el tipo III, la miotomía debe ser larga (incluye el segmento espástico): el POEM la permite y tiene mejores resultados que la dilatación o Heller.","why":["Menos eficaz en tipo III.","","No trata la acalasia.","Agravaría la obstrucción.","No es tratamiento."],"ref":"ACG 2020 Acalasia"},{"topic":"deglucion","subj":"gastro","id":"deglucion-10","dif":1,"stem":"Mujer de 52 años con fenómeno de Raynaud, esclerodactilia y pirosis intensa. Disfagia a sólidos y líquidos. ¿Hallazgo manométrico esperado?","opts":["Esfínter inferior hipertónico que no relaja","Hipomotilidad del cuerpo esofágico con esfínter inferior hipotónico","Contracciones de alta amplitud","Manometría normal","Relajación incompleta con presurización panesofágica"],"ans":1,"exp":"En la esclerodermia, la fibrosis del músculo liso causa peristalsis débil o ausente y un esfínter inferior incompetente: reflujo grave y estenosis.","why":["Es acalasia.","","Es esófago hipercontráctil.","No en esclerodermia.","Es acalasia tipo II."],"ref":"Chicago 4.0"},{"topic":"sii","subj":"gastro","id":"sii-01","dif":1,"stem":"Mujer de 28 años con dolor abdominal 2 días por semana desde hace 8 meses, que mejora al evacuar y se acompaña de evacuaciones más frecuentes y blandas. Sin datos de alarma. ¿Diagnóstico?","opts":["Enfermedad celiaca confirmada","Síndrome de intestino irritable (predominio diarrea)","Colitis ulcerosa","Dispepsia funcional","Gastroparesia"],"ans":1,"exp":"Cumple Roma IV: dolor ≥1 día por semana por ≥3 meses (inicio hace ≥6) + relación con la defecación + cambio en frecuencia y forma. Subtipo D. Se pide serología de celiaca y calprotectina para completar.","why":["No hay estudios que lo confirmen.","","Habría sangre y datos inflamatorios.","Es dolor epigástrico relacionado con comidas.","Náusea y saciedad, no diarrea."],"ref":"Roma IV · ACG 2021"},{"topic":"sii","subj":"gastro","id":"sii-02","dif":2,"stem":"Paciente con sospecha de SII-D sin datos de alarma. Según la ACG 2021, ¿qué estudios pides?","opts":["Colonoscopia y TC","Serología de celiaca y calprotectina fecal (o lactoferrina) + PCR","Ninguno","Coproparasitoscópico seriado y prueba de aliento con lactulosa a todos","Endoscopia alta"],"ans":1,"exp":"Se descartan las dos imitadoras más relevantes con pruebas simples: celiaca (serología) y EII (calprotectina). No se recomiendan estudios extensos de rutina.","why":["No sin datos de alarma.","","Se recomiendan estudios mínimos en SII-D.","No se recomiendan de rutina.","No está indicada."],"ref":"ACG 2021 SII"},{"topic":"sii","subj":"gastro","id":"sii-03","dif":1,"stem":"Hombre de 58 años con cambio reciente del hábito intestinal, dolor abdominal y anemia ferropénica. Cree que tiene colitis. ¿Qué haces?","opts":["Diagnosticar SII y dar antiespasmódico","Colonoscopia","Dieta baja en FODMAP","Amitriptilina","Rifaximina"],"ans":1,"exp":"Edad >45–50, inicio reciente y anemia ferropénica son datos de alarma: hay que descartar cáncer colorrectal antes de pensar en SII.","why":["Tiene datos de alarma.","","No antes de descartar cáncer.","No antes de descartar cáncer.","No antes de descartar cáncer."],"ref":"ACG 2021 SII"},{"topic":"sii","subj":"gastro","id":"sii-04","dif":2,"stem":"Mujer con SII-E. Toma polietilenglicol, evacúa mejor, pero persisten el dolor y la distensión. ¿Qué agregas?","opts":["Loperamida","Linaclotida","Alosetrón","Rifaximina","Salvado de trigo"],"ans":1,"exp":"La linaclotida (agonista de guanilato ciclasa C) aumenta la secreción intestinal y reduce el dolor visceral: útil en SII-E con dolor.","why":["Empeora el estreñimiento.","","Para SII-D.","Para SII-D.","La fibra insoluble aumenta la distensión."],"ref":"ACG 2021 SII"},{"topic":"sii","subj":"gastro","id":"sii-05","dif":2,"stem":"Hombre con SII-D y dolor abdominal persistente pese a dieta y antiespasmódicos. ¿Fármaco que actúa sobre el dolor y la diarrea?","opts":["Polietilenglicol","Amitriptilina en dosis baja","Linaclotida","Lactulosa","Prednisona"],"ans":1,"exp":"Los tricíclicos en dosis bajas (10–50 mg) modulan la percepción visceral del dolor y, por su efecto anticolinérgico, enlentecen el tránsito: útiles en SII-D.","why":["Empeora la diarrea.","","Empeora la diarrea.","Empeora la diarrea.","No tiene papel."],"ref":"ACG 2021 SII"},{"topic":"sii","subj":"gastro","id":"sii-06","dif":1,"stem":"¿Cuál de estas recomendaciones dietéticas tiene más evidencia en SII?","opts":["Dieta sin gluten para todos","Dieta baja en FODMAP con reintroducción","Dieta alta en salvado","Dieta sin lactosa para todos","Ayuno intermitente"],"ans":1,"exp":"La dieta baja en FODMAP (carbohidratos fermentables) reduce los síntomas en muchos pacientes; debe hacerse en 3 fases (eliminar, reintroducir, personalizar).","why":["No sin celiaca.","","Puede empeorar la distensión.","Solo si hay intolerancia.","No tiene evidencia."],"ref":"ACG 2021 SII"},{"topic":"sii","subj":"gastro","id":"sii-07","dif":2,"stem":"Una paciente cumple criterios de SII, pero sus evacuaciones son tipo 1–2 en el 40% de los días y tipo 6–7 en el 35%. ¿Subtipo?","opts":["SII-E","SII-D","SII-M","SII-NC","No es SII"],"ans":2,"exp":"Más del 25% de heces duras y más del 25% de heces líquidas: subtipo mixto.","why":["Requiere \u003c25% de heces líquidas.","Requiere \u003c25% de heces duras.","","Cumple el patrón mixto.","Sí cumple criterios."],"ref":"Roma IV"},{"topic":"sii","subj":"gastro","id":"sii-08","dif":2,"stem":"Hombre con SII-D y distensión importante que no respondió a dieta. ¿Antibiótico con evidencia en SII-D?","opts":["Metronidazol","Rifaximina","Ciprofloxacino","Amoxicilina","Vancomicina"],"ans":1,"exp":"La rifaximina (no absorbible) por 14 días mejora la distensión y la diarrea en SII-D (estudios TARGET); puede repetirse si recae.","why":["No tiene evidencia en SII.","","No tiene evidencia.","No tiene evidencia.","No tiene evidencia."],"ref":"ACG 2021 SII · TARGET"},{"topic":"sii","subj":"gastro","id":"sii-09","dif":1,"stem":"Según Roma IV, ¿cuánto tiempo deben tener los síntomas antes de diagnosticar SII?","opts":["1 mes","Inicio hace ≥6 meses, con criterios cumplidos en los últimos 3","2 semanas","1 año","No importa el tiempo"],"ans":1,"exp":"Los síntomas deben haber iniciado al menos 6 meses antes, y cumplir los criterios en los últimos 3 meses.","why":["Muy corto.","","Muy corto.","Excesivo.","Sí importa."],"ref":"Roma IV"},{"topic":"sii","subj":"gastro","id":"sii-10","dif":3,"stem":"Mujer de 35 años con SII-D grave que no respondió a otros tratamientos. Se considera alosetrón. ¿Qué efecto adverso grave debes advertir?","opts":["Hepatitis fulminante","Colitis isquémica y estreñimiento grave","Arritmias por QT largo","Pancreatitis","Agranulocitosis"],"ans":1,"exp":"El alosetrón (antagonista 5-HT3) está restringido a mujeres con SII-D grave por el riesgo de colitis isquémica y complicaciones del estreñimiento.","why":["No es su efecto adverso típico.","","No es su efecto adverso principal.","Es de eluxadolina.","No es su efecto adverso."],"ref":"ACG 2021 SII"},{"topic":"dialisis","subj":"nefro","id":"dialisis-01","dif":1,"stem":"Hombre con LRA oligúrica, K 7.2 con ondas T picudas que no baja con gluconato de calcio, insulina con glucosa y salbutamol. ¿Siguiente paso?","opts":["Más furosemida","Hemodiálisis urgente","Resinas de intercambio y esperar 24 h","Bicarbonato oral","Observación"],"ans":1,"exp":"Hiperkalemia refractaria con cambios en el ECG: indicación urgente de diálisis (la “E” de AEIOU).","why":["Está oligúrico.","","Demasiado lento.","Demasiado lento.","Riesgo de arritmia."],"ref":"KDIGO LRA"},{"topic":"dialisis","subj":"nefro","id":"dialisis-02","dif":2,"stem":"Paciente con intoxicación por litio, nivel de 4.8 mEq/L, confusión y LRA. ¿Manejo?","opts":["Solo líquidos IV","Hemodiálisis","Carbón activado","Diálisis peritoneal","Fomepizol"],"ans":1,"exp":"El litio es pequeño, no se une a proteínas y se dializa bien. Con nivel alto, síntomas neurológicos o falla renal está indicada la hemodiálisis.","why":["Insuficiente con estos datos.","","No adsorbe litio.","Mucho menos eficaz.","Es para metanol y etilenglicol."],"ref":"EXTRIP"},{"topic":"dialisis","subj":"nefro","id":"dialisis-03","dif":2,"stem":"Hombre con ERC G5, TFG 9, sin síntomas, sin hiperkalemia, sin acidosis grave y bien nutrido. Pregunta si debe iniciar diálisis ya. ¿Respuesta?","opts":["Sí, con TFG \u003c10 siempre se inicia","No necesariamente: se inicia por síntomas o complicaciones; preparar acceso y vigilar de cerca","Solo si la TFG baja de 2","Nunca se dializa a pacientes asintomáticos","Iniciar diálisis peritoneal urgente"],"ans":1,"exp":"El estudio IDEAL mostró que iniciar temprano (TFG 10–14) no mejora la supervivencia frente a iniciar tarde (5–7). Se decide por clínica, con el acceso ya preparado.","why":["No por cifra sola.","","Arbitrario y peligroso.","Puede requerirla por otras razones.","No hay urgencia."],"ref":"IDEAL 2010 · KDIGO 2024"},{"topic":"dialisis","subj":"nefro","id":"dialisis-04","dif":2,"stem":"Paciente con BUN de 190 mg/dL en su primera sesión de hemodiálisis presenta cefalea, náusea, desorientación y una convulsión al final de la sesión. ¿Diagnóstico?","opts":["Hipoglucemia","Síndrome de desequilibrio por diálisis","Embolia gaseosa","Hemorragia subaracnoidea por heparina","Hiperkalemia"],"ans":1,"exp":"La urea baja rápido en sangre pero no en el cerebro: el agua entra a las neuronas (edema cerebral). Se previene con sesiones iniciales cortas y de baja eficiencia.","why":["No explica el contexto.","","Sería súbita con disnea o colapso.","Menos probable en este contexto.","El potasio baja con la diálisis."],"ref":"Harrison 21e"},{"topic":"dialisis","subj":"nefro","id":"dialisis-05","dif":2,"stem":"Mujer en diálisis peritoneal con dolor abdominal y líquido turbio. Recuento del dializado: 680 leucocitos/µL, 85% neutrófilos. ¿Manejo?","opts":["Laparotomía urgente","Cultivo del líquido y antibióticos intraperitoneales empíricos (cobertura de grampositivos y gramnegativos)","Suspender la diálisis y pasar a hemodiálisis definitiva","Solo analgésicos","Antibiótico oral"],"ans":1,"exp":"Peritonitis asociada a DP: la vía intraperitoneal es la preferida. Se cubre grampositivos (vancomicina o cefalosporina de 1ª) y gramnegativos (ceftazidima o aminoglucósido), y se ajusta por cultivo.","why":["Solo si hay sospecha de peritonitis secundaria.","","No de entrada.","Insuficiente.","Menos eficaz."],"ref":"ISPD 2022"},{"topic":"dialisis","subj":"nefro","id":"dialisis-06","dif":1,"stem":"¿Cuál es el acceso vascular preferido para hemodiálisis crónica?","opts":["Catéter venoso central tunelizado","Fístula arteriovenosa nativa","Injerto arteriovenoso protésico","Catéter femoral temporal","Catéter subclavio"],"ans":1,"exp":"La fístula tiene menos infecciones y trombosis y mayor duración. Requiere semanas a meses para madurar, por eso se planea con anticipación.","why":["Más infecciones y mortalidad.","","Segunda opción.","Solo temporal.","Causa estenosis venosa central."],"ref":"KDOQI Vascular Access 2019"},{"topic":"dialisis","subj":"nefro","id":"dialisis-07","dif":2,"stem":"Paciente con trasplante renal hace 2 años, en tacrolimus, inicia claritromicina por neumonía. A los 5 días: creatinina de 1.2 a 2.1, K 5.8, temblor. ¿Causa más probable?","opts":["Rechazo crónico","Toxicidad por tacrolimus por inhibición del CYP3A4","Nefropatía por BK","Obstrucción ureteral","Rechazo hiperagudo"],"ans":1,"exp":"Los macrólidos (claritromicina) inhiben el CYP3A4 y elevan el tacrolimus: vasoconstricción aferente, hiperkalemia y temblor. Se miden niveles y se ajusta la dosis.","why":["Es de años y no explica el temblor.","","Más lenta y sin relación con el fármaco.","No explica temblor ni el contexto.","Ocurre en minutos tras el trasplante."],"ref":"KDIGO Trasplante"},{"topic":"dialisis","subj":"nefro","id":"dialisis-08","dif":2,"stem":"En la cirugía de trasplante, minutos después de restablecer el flujo, el riñón se torna cianótico y moteado. ¿Qué ocurrió?","opts":["Rechazo agudo celular","Rechazo hiperagudo por anticuerpos preformados","Rechazo crónico","Nefrotoxicidad por tacrolimus","Infección por CMV"],"ans":1,"exp":"Anticuerpos preformados (ABO o anti-HLA) activan complemento y trombosis inmediatamente. Se previene con compatibilidad ABO y prueba cruzada negativa. El injerto se pierde.","why":["Ocurre en semanas a meses.","","Ocurre en años.","No es inmediata.","Ocurre en meses."],"ref":"Harrison 21e"},{"topic":"dialisis","subj":"nefro","id":"dialisis-09","dif":1,"stem":"Para un paciente con ERC terminal y sin contraindicaciones, ¿qué tratamiento ofrece mejor supervivencia y calidad de vida?","opts":["Hemodiálisis en centro","Trasplante renal","Diálisis peritoneal","Hemodiálisis nocturna","Tratamiento conservador"],"ans":1,"exp":"El trasplante reduce la mortalidad frente a permanecer en diálisis en lista de espera, y mejora la calidad de vida. Mejor aún si es anticipado y de donador vivo.","why":["Inferior al trasplante.","","Inferior al trasplante.","Inferior al trasplante.","Para quien no desea o no puede recibir diálisis."],"ref":"KDIGO 2024"},{"topic":"dialisis","subj":"nefro","id":"dialisis-10","dif":2,"stem":"Paciente en hemodiálisis por 12 años presenta parestesias en ambas manos de predominio nocturno. ¿Causa asociada a la diálisis?","opts":["Neuropatía por B12","Amiloidosis por β2-microglobulina (síndrome del túnel del carpo)","Hipercalcemia","Hipotiroidismo","Gota"],"ans":1,"exp":"La β2-microglobulina no se elimina bien con la diálisis y se deposita como amiloide en articulaciones y en el túnel del carpo tras años de tratamiento.","why":["No es la causa asociada a diálisis.","","No causa este cuadro.","Posible, pero no es la asociada a diálisis.","No causa este cuadro."],"ref":"Harrison 21e"},{"topic":"abordaje","subj":"reuma","id":"abordaje-01","dif":1,"stem":"Hombre de 55 años con rodilla derecha caliente, roja y con derrame desde hace 24 h, y fiebre de 38.5 °C. ¿Primer paso?","opts":["Iniciar colchicina","Artrocentesis con Gram, cultivo, conteo celular y cristales","Infiltrar esteroide","Rx y alta con AINE","Pedir ácido úrico y decidir con él"],"ans":1,"exp":"Monoartritis aguda con fiebre: la artritis séptica es la urgencia a descartar. Solo el líquido sinovial diferencia infección de cristales (y pueden coexistir).","why":["No antes de descartar infección.","","Peligroso si hay infección.","Pasa por alto una artritis séptica.","Puede ser normal en gota y no descarta infección."],"ref":"Harrison 21e"},{"topic":"abordaje","subj":"reuma","id":"abordaje-02","dif":2,"stem":"Líquido sinovial: 85,000 leucocitos/µL, 92% neutrófilos, Gram sin bacterias, sin cristales. ¿Cómo lo manejas?","opts":["Como gota; colchicina","Como artritis séptica: antibiótico IV empírico y drenaje","Como OA; AINE","Repetir la punción en 1 semana","Esteroide intraarticular"],"ans":1,"exp":"Un líquido con >50,000 leucocitos y predominio de neutrófilos se trata como séptico aunque el Gram sea negativo (sensibilidad ~50%). Antibiótico empírico (vancomicina ± cefalosporina) y drenaje.","why":["No hay cristales.","","Es un líquido muy inflamatorio.","Retraso peligroso.","Contraindicado si hay infección."],"ref":"Harrison 21e"},{"topic":"abordaje","subj":"reuma","id":"abordaje-03","dif":1,"stem":"Mujer de 22 años con vida sexual activa: poliartralgias migratorias, tenosinovitis del dorso de la mano y pústulas en las extremidades. ¿Diagnóstico más probable?","opts":["Artritis reumatoide","Infección gonocócica diseminada","Fiebre reumática","Lupus","Artritis reactiva"],"ans":1,"exp":"Tríada de infección gonocócica diseminada: tenosinovitis, dermatitis pustulosa y poliartralgias migratorias. Se busca N. gonorrhoeae en mucosas y se trata con ceftriaxona.","why":["No es migratoria ni con pústulas.","","Sigue a faringitis; no da pústulas.","No da tenosinovitis con pústulas.","Es estéril; no da pústulas."],"ref":"CDC STI 2021"},{"topic":"abordaje","subj":"reuma","id":"abordaje-04","dif":2,"stem":"Mujer de 45 años con dolor en el hombro derecho al elevar el brazo activamente entre 60° y 120°; el movimiento pasivo es casi completo y menos doloroso. ¿Origen más probable?","opts":["Artritis glenohumeral","Periarticular: tendinopatía del manguito rotador","Capsulitis adhesiva","Artritis séptica","Polimialgia reumática"],"ans":1,"exp":"Dolor con arco doloroso en el movimiento activo y pasivo conservado sugiere un problema periarticular (tendón del supraespinoso, bursa subacromial).","why":["Limitaría activo y pasivo.","","Limita activo y pasivo en todas las direcciones.","Sería aguda, febril y limitante.","Bilateral, con rigidez y VSG alta."],"ref":"Harrison 21e"},{"topic":"abordaje","subj":"reuma","id":"abordaje-05","dif":2,"stem":"Mujer de 30 años con artralgias inespecíficas, sin otros síntomas ni hallazgos. ANA 1:80 moteado. ¿Interpretación?","opts":["Diagnóstico de lupus","Hallazgo frecuente en sanos; sin clínica no indica enfermedad autoinmune","Iniciar hidroxicloroquina","Pedir biopsia renal","Iniciar prednisona"],"ans":1,"exp":"Hasta 15–30% de personas sanas tienen ANA 1:40–1:80. Sin manifestaciones clínicas, no se diagnostica lupus ni se trata.","why":["No cumple criterios.","","No hay indicación.","No hay indicación.","No hay indicación."],"ref":"EULAR/ACR 2019 LES"},{"topic":"abordaje","subj":"reuma","id":"abordaje-06","dif":1,"stem":"¿Qué anticuerpo es más específico para artritis reumatoide?","opts":["Factor reumatoide","Anti-CCP","ANA","Anti-dsDNA","ANCA"],"ans":1,"exp":"El anti-CCP tiene especificidad ~95% para AR y predice enfermedad más erosiva. El FR es menos específico (hepatitis C, endocarditis, edad).","why":["Es menos específico.","","No es específico de AR.","Es específico de LES.","Es de vasculitis."],"ref":"ACR/EULAR 2010"},{"topic":"abordaje","subj":"reuma","id":"abordaje-07","dif":2,"stem":"Mujer de 34 años con poliartritis simétrica aguda de manos de 10 días y exantema reticular, tras convivir con su hijo que tuvo “mejillas abofeteadas”. ¿Diagnóstico más probable?","opts":["Artritis reumatoide","Artritis por parvovirus B19","Gota","Espondiloartritis","Osteoartritis"],"ans":1,"exp":"El parvovirus B19 en adultos causa poliartritis simétrica aguda que imita a la AR; suele resolverse en semanas. Se confirma con IgM anti-parvovirus.","why":["Requiere ≥6 semanas; considera primero causas virales.","","No es poliarticular de manos aguda.","No es el patrón.","No es aguda ni inflamatoria."],"ref":"Harrison 21e"},{"topic":"abordaje","subj":"reuma","id":"abordaje-08","dif":2,"stem":"Líquido sinovial con 1,200 leucocitos/µL y 15% de neutrófilos, viscoso y claro. ¿Cómo se clasifica?","opts":["Normal","No inflamatorio","Inflamatorio","Séptico","Hemorrágico"],"ans":1,"exp":"Entre 200 y 2,000 leucocitos con predominio de mononucleares: no inflamatorio, típico de osteoartritis o trauma.","why":["Normal es \u003c200.","","Inflamatorio es 2,000–50,000.","Séptico suele ser >50,000.","Tendría eritrocitos abundantes."],"ref":"Harrison 21e"},{"topic":"abordaje","subj":"reuma","id":"abordaje-09"

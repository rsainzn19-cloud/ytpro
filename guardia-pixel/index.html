,"dif":1,"stem":"Hombre de 30 años con rigidez matutina de 90 minutos en manos y rodillas que mejora al moverse, y aumento de volumen blando en varias articulaciones. ¿Qué tipo de dolor es?","opts":["Mecánico","Inflamatorio","Neuropático","Psicógeno","Referido"],"ans":1,"exp":"Rigidez prolongada que mejora con la actividad y sinovitis (aumento de volumen blando) son datos de patrón inflamatorio.","why":["Empeoraría con el uso y la rigidez sería breve.","","Daría ardor o parestesias.","No hay datos.","No hay datos."],"ref":"Harrison 21e"},{"topic":"abordaje","subj":"reuma","id":"abordaje-10","dif":2,"stem":"En una monoartritis aguda de rodilla, el líquido muestra cristales en forma de aguja con birrefringencia negativa y 30,000 leucocitos. El Gram es negativo, pero el paciente tiene fiebre alta y una prótesis valvular. ¿Qué haces?","opts":["Tratar solo la gota","Tratar la gota y esperar el cultivo antes de descartar infección (± antibiótico empírico)","Infiltrar esteroide de inmediato","Dar alta","Iniciar alopurinol"],"ans":1,"exp":"Cristales y una infección pueden coexistir. En un paciente de alto riesgo con fiebre, se espera el cultivo y se considera antibiótico empírico hasta descartarla.","why":["Puede coexistir con infección.","","Peligroso sin descartar infección.","No es seguro.","No se inicia en el ataque como tratamiento del dolor."],"ref":"Harrison 21e"}],"cards":[{"id":"dm2-c01","topic":"dm2","f":"Criterios diagnósticos de diabetes (4)","b":"A1c ≥6.5% · glucosa en ayuno ≥126 · CTOG 2 h ≥200 · glucosa al azar ≥200 + síntomas"},{"id":"dm2-c02","topic":"dm2","f":"Rangos de prediabetes","b":"A1c 5.7–6.4% · ayuno 100–125 · CTOG 2 h 140–199 mg/dL"},{"id":"dm2-c03","topic":"dm2","f":"¿Cuántas pruebas anormales necesitas sin hiperglucemia inequívoca?","b":"Dos: dos pruebas distintas en la misma muestra o la misma prueba en otra muestra"},{"id":"dm2-c04","topic":"dm2","f":"¿Cuándo no sirve la A1c?","b":"Cuando cambia la vida del eritrocito: anemia, hemólisis, hemoglobinopatías, transfusión, embarazo, hemodiálisis"},{"id":"dm2-c05","topic":"dm2","f":"Meta general de A1c (ADA)","b":"\u003c7% · más estricta \u003c6.5% sin hipoglucemia · menos estricta \u003c8% en adultos mayores con comorbilidades"},{"id":"dm2-c06","topic":"dm2","f":"Metformina según TFG","b":"≥45: dosis normal · 30–44: no iniciar, máx. 1 000 mg/día · \u003c30: suspender"},{"id":"dm2-c07","topic":"dm2","f":"Efecto adverso de la metformina a largo plazo","b":"Déficit de vitamina B12 (anemia macrocítica, neuropatía)"},{"id":"dm2-c08","topic":"dm2","f":"Efectos adversos clave de los iSGLT2","b":"Micosis genital, depleción de volumen, cetoacidosis euglucémica, gangrena de Fournier (rara)"},{"id":"dm2-c09","topic":"dm2","f":"¿Cuándo suspender un iSGLT2 antes de cirugía?","b":"3 días antes (ertugliflozina 4)"},{"id":"dm2-c10","topic":"dm2","f":"Contraindicación de los arGLP-1","b":"Antecedente personal o familiar de carcinoma medular de tiroides o MEN2"},{"id":"dm2-c11","topic":"dm2","f":"DM2 + insuficiencia cardiaca","b":"iSGLT2"},{"id":"dm2-c12","topic":"dm2","f":"DM2 + ERC (TFG 20–60 o albuminuria)","b":"iSGLT2 (iniciar con TFG ≥20); semaglutida como adición o alternativa"},{"id":"dm2-c13","topic":"dm2","f":"DM2 + ECV aterosclerótica","b":"arGLP-1 o iSGLT2 con beneficio CV probado, sin importar la A1c"},{"id":"dm2-c14","topic":"dm2","f":"DM2 + obesidad (peso como prioridad)","b":"Semaglutida o tirzepatida"},{"id":"dm2-c15","topic":"dm2","f":"¿Cuándo iniciar insulina en DM2?","b":"Catabolismo (pérdida de peso, cetosis), A1c >10% o glucosa ≥300 con síntomas"},{"id":"dm2-c16","topic":"dm2","f":"Dosis inicial de insulina basal","b":"10 U/día o 0.1–0.2 U/kg/día; subir 2 U cada 3 días según la glucosa en ayuno"},{"id":"dm2-c17","topic":"dm2","f":"Niveles de hipoglucemia","b":"1: 54–69 · 2: \u003c54 · 3: grave, necesita ayuda de otra persona"},{"id":"dm2-c18","topic":"dm2","f":"Regla de 15","b":"15–20 g de glucosa oral, revalorar en 15 min y repetir si sigue \u003c70"},{"id":"dm2-c19","topic":"dm2","f":"Sulfonilurea a evitar en adultos mayores y ERC","b":"Glibenclamida: hipoglucemia prolongada"},{"id":"dm2-c20","topic":"dm2","f":"Tamizaje de complicaciones en DM2","b":"Al diagnóstico: fondo de ojo, CAC + TFG y pies con monofilamento; luego cada año"},{"id":"sca-c01","topic":"sca","f":"¿En cuánto tiempo debe tomarse el ECG en dolor torácico?","b":"≤10 min desde el primer contacto"},{"id":"sca-c02","topic":"sca","f":"Criterio de elevación del ST en V2–V3","b":"Hombre ≥40 años: ≥2 mm · hombre \u003c40: ≥2.5 mm · mujer: ≥1.5 mm (resto de derivaciones ≥1 mm)"},{"id":"sca-c03","topic":"sca","f":"DII, DIII, aVF","b":"IAM inferior → coronaria derecha (≈80–90%)"},{"id":"sca-c04","topic":"sca","f":"V1–V4","b":"IAM anterior → descendente anterior"},{"id":"sca-c05","topic":"sca","f":"DI, aVL, V5–V6","b":"IAM lateral → circunfleja o diagonal"},{"id":"sca-c06","topic":"sca","f":"Infradesnivel del ST en V1–V3 con R alta","b":"IAM posterior: toma V7–V9"},{"id":"sca-c07","topic":"sca","f":"Triada del IAM de VD","b":"Hipotensión + ingurgitación yugular + pulmones limpios → volumen, sin nitratos"},{"id":"sca-c08","topic":"sca","f":"Meta de tiempo para ICP primaria","b":"≤120 min desde el diagnóstico (≤60 min si ya está en un hospital con hemodinamia)"},{"id":"sca-c09","topic":"sca","f":"Si la ICP no llega a tiempo","b":"Fibrinólisis en ≤10 min desde el diagnóstico (tenecteplasa)"},{"id":"sca-c10","topic":"sca","f":"¿Cómo sabes que la fibrinólisis funcionó?","b":"El ST baja ≥50% a los 60–90 min y cede el dolor; si no, ICP de rescate"},{"id":"sca-c11","topic":"sca","f":"Después de una fibrinólisis exitosa","b":"Coronariografía en 2–24 h"},{"id":"sca-c12","topic":"sca","f":"Contraindicaciones absolutas de fibrinólisis","b":"HIC previa · EVC isquémico \u003c6 meses · daño o neoplasia del SNC · trauma, cirugía o TCE \u003c1 mes · sangrado GI \u003c1 mes · trastorno hemorrágico · disección aórtica · punciones no compresibles \u003c24 h"},{"id":"sca-c13","topic":"sca","f":"SCASEST: coronariografía inmediata (\u003c2 h) si…","b":"Choque o inestabilidad, dolor refractario, arritmias graves o paro, complicación mecánica, IC aguda, cambios dinámicos recurrentes del ST"},{"id":"sca-c14","topic":"sca","f":"SCASEST: coronariografía temprana (\u003c24 h) si…","b":"IAMSEST confirmado, cambios dinámicos del ST/T, elevación transitoria del ST o GRACE >140"},{"id":"sca-c15","topic":"sca","f":"Prasugrel: contraindicación y ajuste","b":"Contraindicado con EVC o AIT previo; 5 mg/día si ≥75 años o \u003c60 kg"},{"id":"sca-c16","topic":"sca","f":"Ticagrelor: dosis y efecto adverso","b":"Carga 180 mg, luego 90 mg c/12 h; disnea"},{"id":"sca-c17","topic":"sca","f":"¿Cuándo usar clopidogrel en SCA?","b":"Con fibrinólisis, si necesita anticoagulante oral o si no hay ticagrelor ni prasugrel"},{"id":"sca-c18","topic":"sca","f":"Duración de la doble antiagregación","b":"12 meses de forma predeterminada"},{"id":"sca-c19","topic":"sca","f":"Meta de LDL después de un SCA","b":"\u003c55 mg/dL y reducción ≥50%"},{"id":"sca-c20","topic":"sca","f":"Ruptura de músculo papilar","b":"IAM inferior, días 2–7: insuficiencia mitral aguda con edema pulmonar"},{"id":"sca-c21","topic":"sca","f":"Elevación del ST que persiste semanas después de un IAM","b":"Aneurisma ventricular"},{"id":"sca-c22","topic":"sca","f":"Clasificación de Killip","b":"I sin IC · II estertores o S3 · III edema pulmonar · IV choque"},{"id":"sca-c23","topic":"sca","f":"Las 7 variables de TIMI (SCASEST)","b":"Edad ≥65 · ≥3 factores de riesgo · coronariopatía conocida ≥50% · aspirina en 7 días · ≥2 anginas en 24 h · desviación del ST ≥0.5 mm · marcador positivo"},{"id":"lra-c01","topic":"lra","f":"Definición de LRA (KDIGO)","b":"Cr ↑ ≥0.3 mg/dL en 48 h · Cr ↑ ≥1.5 veces la basal en 7 días · uresis \u003c0.5 mL/kg/h por 6 h"},{"id":"lra-c02","topic":"lra","f":"LRA estadio 1","b":"1.5–1.9 veces la basal o ↑ ≥0.3 mg/dL · uresis \u003c0.5 por 6–12 h"},{"id":"lra-c03","topic":"lra","f":"LRA estadio 2","b":"2.0–2.9 veces la basal · uresis \u003c0.5 por ≥12 h"},{"id":"lra-c04","topic":"lra","f":"LRA estadio 3","b":"≥3 veces, Cr ≥4.0 o terapia de reemplazo renal · uresis \u003c0.3 por ≥24 h o anuria ≥12 h"},{"id":"lra-c05","topic":"lra","f":"Fórmula de la FENa","b":"(Na orina × Cr plasma) ÷ (Na plasma × Cr orina) × 100"},{"id":"lra-c06","topic":"lra","f":"FENa \u003c1% sin ser prerrenal","b":"Contraste, mioglobinuria o hemoglobinuria, GN aguda, obstrucción temprana"},{"id":"lra-c07","topic":"lra","f":"Si el paciente toma diurético, usa…","b":"FEUrea: \u003c35% prerrenal, >50% NTA"},{"id":"lra-c08","topic":"lra","f":"Cilindros granulosos “café lodoso”","b":"Necrosis tubular aguda"},{"id":"lra-c09","topic":"lra","f":"Cilindros eritrocitarios","b":"Glomerulonefritis"},{"id":"lra-c10","topic":"lra","f":"Cilindros leucocitarios + exantema + fiebre + eosinofilia","b":"Nefritis intersticial aguda (suspender el fármaco)"},{"id":"lra-c11","topic":"lra","f":"Triple golpe","b":"AINE + IECA o ARA-II + diurético"},{"id":"lra-c12","topic":"lra","f":"Efecto del AINE en el glomérulo","b":"Contrae la aferente (bloquea prostaglandinas)"},{"id":"lra-c13","topic":"lra","f":"Efecto del IECA o ARA-II en el glomérulo","b":"Dilata la eferente (sin angiotensina II) → ↓ presión de filtración"},{"id":"lra-c14","topic":"lra","f":"AEIOU","b":"Acidosis · Electrolitos · Intoxicaciones · Overload · Uremia"},{"id":"lra-c15","topic":"lra","f":"Hiperkalemia con cambios en el ECG: primer paso","b":"Gluconato de calcio al 10%, 10 mL IV"},{"id":"lra-c16","topic":"lra","f":"Hiperkalemia: cómo meter el K a la célula","b":"Insulina rápida 10 U + 25 g de glucosa; salbutamol nebulizado"},{"id":"lra-c17","topic":"lra","f":"ECG de la hiperkalemia, en orden","b":"T picudas → PR largo y P plana → QRS ancho → onda sinusoidal"},{"id":"lra-c18","topic":"lra","f":"Pista de rabdomiólisis en el EGO","b":"Tira positiva para sangre sin eritrocitos en el sedimento"},{"id":"lra-c19","topic":"lra","f":"Primer estu t":"Esquistocitos, coagulación normal, alteración neurológica. Puntaje PLASMIC 7 (alto). ADAMTS13 tardará 3 días.","q":"¿Qué haces?","A":{"t":"Esperar el ADAMTS13 para confirmar","ok":false,"res":"Al día siguiente presenta una crisis convulsiva.","vit":{"FC":124,"X":8}},"B":{"t":"Recambio plasmático hoy + glucocorticoides","ok":true,"res":"Se coloca catéter y se inicia el recambio en las primeras horas."},"why":"El PTT se trata con la sospecha: cada hora sin recambio aumenta la mortalidad."},{"tag":"Enfermería pregunta","ecg":"normal","vit":{"FC":96,"X":18},"text":"La enfermera ve que tiene 18,000 plaquetas y propone transfundir dos aféresis antes del catéter.","q":"¿Qué contestas?","A":{"t":"Sí, transfundir para colocar el catéter con seguridad","ok":false,"res":"La transfusión puede alimentar los microtrombos."},"B":{"t":"No de rutina: se coloca el catéter con técnica cuidadosa; plaquetas solo si hay sangrado grave","ok":true,"res":"El catéter se coloca guiado por ultrasonido sin complicaciones."},"why":"En PTT la transfusión de plaquetas se reserva para sangrado que amenaza la vida."},{"tag":"Día 3","ecg":"normal","vit":{"FC":84,"PAS":120,"PAD":74,"X":96},"text":"ADAMTS13 \u003c5% con inhibidor positivo. Plaquetas subiendo, LDH bajando.","q":"¿Qué agregas para reducir recaídas?","A":{"t":"Rituximab (± caplacizumab mientras persista la enzima baja)","ok":true,"res":"Egresa al día 9 con plaquetas de 180,000.","vit":{"X":180}},"B":{"t":"Esplenectomía urgente","ok":false,"res":"No es el siguiente paso; existe inmunosupresión eficaz."},"why":"El PTT inmune se debe a autoanticuerpos anti-ADAMTS13: rituximab reduce las recaídas."}]},{"id":"g-leucemias","topic":"leucemias","subj":"hemato","title":"Encías que no dejan de sangrar","place":"Urgencias","patient":{"name":"Andrés","age":38,"sex":"H","skin":"#C98E66","hair":"#1A1412","gown":"#FF8FD0"},"intro":"Lleva una semana con cansancio y moretones. Hoy no le para el sangrado de las encías tras cepillarse.","extra":{"label":"FIB","unit":"mg/dL"},"start":{"FC":104,"PAS":118,"PAD":70,"SpO2":98,"FR":18,"X":88},"nodes":[{"tag":"BH","ecg":"tachy","text":"Hb 8.1, plaquetas 16,000, leucocitos 1,800. TP y TTPa prolongados, dímero D muy alto. El frotis muestra promielocitos con múltiples bastones de Auer.","q":"¿Qué indicas ahora?","A":{"t":"Ácido transretinoico (ATRA) hoy mismo","ok":true,"res":"Se inicia ATRA a las 2 horas de llegar."},"B":{"t":"Esperar el PML::RARA para confirmar","ok":false,"res":"A las 18 h presenta cefalea intensa: hemorragia intracraneal.","vit":{"PAS":168,"PAD":98}},"why":"En la LPA, el ATRA se inicia con la sospecha morfológica: la muerte temprana es por hemorragia."},{"tag":"Coagulopatía","ecg":"tachy","text":"Fibrinógeno 88 mg/dL, plaquetas 16,000, sangrado gingival activo.","q":"¿Cómo manejas la CID?","A":{"t":"Heparina en infusión","ok":false,"res":"Aumenta el sangrado."},"B":{"t":"Crioprecipitado (fibrinógeno >150) y plaquetas (>30–50 mil)","ok":true,"res":"Fibrinógeno 168; el sangrado cede.","vit":{"X":168}},"why":"En la LPA se repone agresivamente: plaquetas, fibrinógeno y plasma, mientras el ATRA corrige la coagulopatía."},{"tag":"Día 6","ecg":"tachy","vit":{"FC":116,"SpO2":89,"FR":28},"text":"Fiebre de 38.4 °C, disnea, infiltrados bilaterales y derrame pleural; subió 4 kg. Creatinina en aumento.","q":"¿Qué agregas?","A":{"t":"Dexametasona 10 mg IV cada 12 h","ok":true,"res":"A las 48 h mejora la oxigenación.","vit":{"FC":94,"SpO2":95,"FR":20}},"B":{"t":"Suspender el ATRA de forma definitiva","ok":false,"res":"Pierdes el tratamiento que cura la enfermedad."},"why":"Síndrome de diferenciación: dexametasona; el ATRA solo se pausa si es grave."}]}],"lessons":{"dm2":{"hook":"Lo que más preguntan: cómo se confirma el diagnóstico, cuál es la meta y qué fármaco eliges según la comorbilidad del paciente.","nn":[["diabetes-mellitus-type-i-and-type-ii-diabetes-mellitus","Diabetes Mellitus (Type I and Type II)"]],"yt":"type 2 diabetes treatment","anim":"dm2","compare":["sglt2-glp1"],"sections":[{"h":"Diagnóstico","html":"\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>Prueba\u003c/th>\u003cth>Prediabetes\u003c/th>\u003cth>Diabetes\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>A1c\u003c/td>\u003ctd>5.7–6.4%\u003c/td>\u003ctd>\u003cb>≥6.5%\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Glucosa en ayuno (≥8 h)\u003c/td>\u003ctd>100–125 mg/dL\u003c/td>\u003ctd>\u003cb>≥126 mg/dL\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Glucosa 2 h en CTOG 75 g\u003c/td>\u003ctd>140–199 mg/dL\u003c/td>\u003ctd>\u003cb>≥200 mg/dL\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Glucosa plasmática al azar\u003c/td>\u003ctd>—\u003c/td>\u003ctd>\u003cb>≥200 mg/dL\u003c/b> + síntomas clásicos o crisis hiperglucémica\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cb>Sin hiperglucemia inequívoca necesitas dos resultados anormales\u003c/b>: dos pruebas distintas en la misma muestra, o la misma prueba en una segunda muestra.\u003c/li>\n\u003cli>Si dos pruebas no coinciden, repite la que salió por arriba del punto de corte.\u003c/li>\n\u003cli>La A1c no sirve cuando cambia la vida del eritrocito: anemia ferropénica o hemolítica, hemoglobinopatías, transfusión o sangrado reciente, embarazo, hemodiálisis, eritropoyetina. Ahí usa glucosa.\u003c/li>\n\u003cli>\u003cb>Tamizaje\u003c/b>: a todos desde los 35 años; antes si IMC ≥25 (≥23 en asiáticos) con algún factor de riesgo (familiar de primer grado, HTA, HDL &lt;35 o TG &gt;250, SOP, acantosis, ECV, sedentarismo). Si es normal, repetir cada 3 años; si hay prediabetes, cada año.\u003c/li>\n\u003c/ul>"},{"h":"Metas","html":"\n\u003cul>\n\u003cli>\u003cb>A1c &lt;7%\u003c/b> para la mayoría de los adultos.\u003c/li>\n\u003cli>\u003cb>Más estricta (&lt;6.5%)\u003c/b> si se logra sin hipoglucemia: paciente joven, diagnóstico reciente, sin ECV.\u003c/li>\n\u003cli>\u003cb>Menos estricta (&lt;8%)\u003c/b> en adultos mayores con varias enfermedades crónicas o deterioro cognitivo leve-moderado, hipoglucemias graves previas o expectativa de vida corta. En el adulto mayor muy frágil no se persigue la A1c: se evitan la hipoglucemia y la hiperglucemia sintomática.\u003c/li>\n\u003cli>Glucosa capilar antes de comer 80–130 mg/dL; pico después de comer &lt;180 mg/dL.\u003c/li>\n\u003cli>Con monitoreo continuo: tiempo en rango (70–180) &gt;70%, tiempo &lt;70 mg/dL &lt;4% y &lt;54 mg/dL &lt;1%.\u003c/li>\n\u003cli>PA &lt;130/80 mmHg. LDL &lt;70 mg/dL (40–75 años con ≥1 factor de riesgo) y &lt;55 mg/dL si ya tiene ECV aterosclerótica.\u003c/li>\n\u003c/ul>"},{"h":"Los fármacos","html":"\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>Grupo\u003c/th>\u003cth>Cómo funciona\u003c/th>\u003cth>A favor\u003c/th>\u003cth>En contra\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Metformina\u003c/b>\u003c/td>\u003ctd>↓ producción hepática de glucosa (activa AMPK)\u003c/td>\u003ctd>Barata, sin hipoglucemia, peso neutro o ↓ leve\u003c/td>\u003ctd>Diarrea y náusea (iniciar 500 mg y titular). Déficit de B12. Acidosis láctica rara. TFG &lt;30: suspender; 30–44: no iniciar y máx. 1 000 mg/día\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>iSGLT2\u003c/b> (-flozina)\u003c/td>\u003ctd>Bloquea la reabsorción de glucosa y sodio en el túbulo proximal → glucosuria\u003c/td>\u003ctd>↓ hospitalización por IC (FEr y FEp), frena la ERC, ↓ peso y PA, sin hipoglucemia\u003c/td>\u003ctd>Micosis genital, depleción de volumen, cetoacidosis euglucémica (suspender 3 días antes de cirugía). Para proteger riñón y corazón se inicia con TFG ≥20\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>arGLP-1\u003c/b> (-glutida) y tirzepatida\u003c/td>\u003ctd>↑ insulina dependiente de glucosa, ↓ glucagón, vaciamiento gástrico lento, saciedad\u003c/td>\u003ctd>↓ A1c y peso muy marcada; ↓ IAM, EVC y muerte CV (liraglutida, semaglutida, dulaglutida); semaglutida frena la ERC\u003c/td>\u003ctd>Náusea y vómito, colelitiasis, precaución con pancreatitis previa. Contraindicado con antecedente personal o familiar de carcinoma medular de tiroides o MEN2\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>iDPP-4\u003c/b> (-gliptina)\u003c/td>\u003ctd>Evitan que se degraden las incretinas propias\u003c/td>\u003ctd>Bien tolerados, peso neutro, sin hipoglucemia; linagliptina sin ajuste renal\u003c/td>\u003ctd>Potencia modesta (≈0.5–0.8% de A1c). Saxagliptina ↑ hospitalización por IC. No combinar con arGLP-1\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Sulfonilureas\u003c/b>\u003c/td>\u003ctd>Cierran el canal K-ATP de la célula β → liberan insulina\u003c/td>\u003ctd>Baratas y potentes\u003c/td>\u003ctd>Hipoglucemia y ↑ peso. Glibenclamida: hipoglucemia prolongada en adultos mayores y ERC; evítala\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Pioglitazona\u003c/b>\u003c/td>\u003ctd>Agonista PPAR-γ: ↑ sensibilidad a la insulina\u003c/td>\u003ctd>Sin hipoglucemia; útil en hígado graso (MASH)\u003c/td>\u003ctd>Retención de líquidos, ↑ peso, fracturas. Contraindicada en IC NYHA III–IV y no recomendada en IC sintomática\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Insulina basal\u003c/b>\u003c/td>\u003ctd>Reemplazo\u003c/td>\u003ctd>La más potente, sin techo de dosis\u003c/td>\u003ctd>Hipoglucemia y ↑ peso. Iniciar 10 U/día o 0.1–0.2 U/kg/día y subir 2 U cada 3 días según la glucosa en ayuno\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>"},{"h":"Cómo elegir (ADA)","html":"\n\u003cdiv class=\"decide\">\n\u003cp>\u003cspan class=\"if\">ECV aterosclerótica (IAM, EVC, EAP) o riesgo CV alto\u003c/span>\u003cspan class=\"then\">arGLP-1 o iSGLT2 con beneficio CV probado, sin importar la A1c ni si ya toma metformina\u003c/span>\u003c/p>\n\u003cp>\u003cspan class=\"if\">Insuficiencia cardiaca (FEr o FEp)\u003c/span>\u003cspan class=\"then\">iSGLT2\u003c/span>\u003c/p>\n\u003cp>\u003cspan class=\"if\">ERC: TFG 20–60 o albuminuria ≥30 mg/g\u003c/span>\u003cspan class=\"then\">iSGLT2; si no se puede, o como adición, arGLP-1 con beneficio renal (semaglutida)\u003c/span>\u003c/p>\n\u003cp>\u003cspan class=\"if\">Obesidad, si bajar de peso es la prioridad\u003c/span>\u003cspan class=\"then\">Semaglutida o tirzepatida\u003c/span>\u003c/p>\n\u003cp>\u003cspan class=\"if\">Hígado graso con fibrosis (MASH)\u003c/span>\u003cspan class=\"then\">arGLP-1, tirzepatida o pioglitazona\u003c/span>\u003c/p>\n\u003cp>\u003cspan class=\"if\">Sin esas comorbilidades\u003c/span>\u003cspan class=\"then\">Metformina + estilo de vida; agrega según meta, peso, riesgo de hipoglucemia y costo\u003c/span>\u003c/p>\n\u003cp>\u003cspan class=\"if\">Catabolismo (pérdida de peso, cetosis), A1c &gt;10% o glucosa ≥300 con síntomas\u003c/span>\u003cspan class=\"then\">Insulina desde el inicio\u003c/span>\u003c/p>\n\u003cp>\u003cspan class=\"if\">A1c ≥1.5% por arriba de la meta\u003c/span>\u003cspan class=\"then\">Considerar combinación de dos fármacos desde el inicio\u003c/span>\u003c/p>\n\u003c/div>"},{"h":"Hipoglucemia","html":"\n\u003cul>\n\u003cli>\u003cb>Nivel 1\u003c/b>: 54–69 mg/dL · \u003cb>Nivel 2\u003c/b>: &lt;54 mg/dL · \u003cb>Nivel 3\u003c/b>: evento grave con alteración mental o física que requiere ayuda de otra persona, sin importar la cifra.\u003c/li>\n\u003cli>\u003cb>Consciente y puede tragar\u003c/b> → regla de 15: 15–20 g de glucosa oral, revalorar a los 15 min, repetir si sigue &lt;70 y luego dar una colación.\u003c/li>\n\u003cli>\u003cb>Inconsciente o sin vía oral\u003c/b> → glucagón (IM, SC o intranasal) o dextrosa IV.\u003c/li>\n\u003cli>Con sulfonilureas la hipoglucemia puede durar horas: observa más tiempo.\u003c/li>\n\u003cli>Los betabloqueadores ocultan temblor y palpitaciones; la sudoración persiste.\u003c/li>\n\u003c/ul>"},{"h":"Complicaciones y tamizaje","html":"\n\u003cul>\n\u003cli>\u003cb>Retinopatía\u003c/b>: fondo de ojo con dilatación al diagnóstico en DM2 (en DM1, a los 5 años) y luego cada año; cada 1–2 años si es normal y hay buen control.\u003c/li>\n\u003cli>\u003cb>Enfermedad renal\u003c/b>: cociente albúmina/creatinina en orina (CAC) y TFG al diagnóstico y cada año.\u003c/li>\n\u003cli>\u003cb>Neuropatía\u003c/b>: monofilamento de 10 g más otra prueba (diapasón de 128 Hz, pinchazo o temperatura) al diagnóstico y cada año. Revisa los pies en cada consulta.\u003c/li>\n\u003cli>\u003cb>Macrovascular\u003c/b>: estatina de intensidad moderada a todos los diabéticos de 40–75 años; alta intensidad si hay ≥1 factor de riesgo o ECV. IECA o ARA-II si hay HTA con albuminuria. Aspirina en prevención secundaria.\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"FLOZINA = Falla y Filtrado · GLUTIDA = Grasa y Gordura","d":"iSGLT2 (-flozina) para la falla cardiaca y el filtrado renal (ERC). arGLP-1 (-glutida) para la grasa en la arteria (ECV aterosclerótica) y la gordura (obesidad). Ojo: los dos reducen eventos cardiovasculares, así que en ECV aterosclerótica cualquiera de los dos es correcto."},"pearl":"Si el caso menciona IAM previo, EVC, IC o ERC, la respuesta casi nunca es “subir metformina” ni “agregar sulfonilurea”: agrega iSGLT2 o arGLP-1 aunque la A1c ya esté en meta.","trap":"Una A1c de 6.7% en un paciente sin síntomas todavía no es diagnóstico: hay que confirmarla con una segunda prueba. Y la glucosa al azar ≥200 sin síntomas tampoco basta.","guide":["Meta de A1c: la ADA pide \u003c7% para la mayoría; la AACE propone ≤6.5% si se logra sin hipoglucemia. Si la pregunta no da más datos, contesta \u003c7%.","Primer fármaco: muchas guías y libros anteriores ponen la metformina como primer paso para todos. La ADA actual indica iSGLT2 o arGLP-1 desde el inicio, con o sin metformina, cuando hay ECV, IC o ERC. Si el caso trae una comorbilidad cardiorrenal, contesta con la ADA. ⚠️ Confirma con tu profesor qué versión de la GPC mexicana usa."],"refs":["American Diabetes Association. Standards of Care in Diabetes—2026. Diabetes Care 2026;49(Suppl 1).","KDIGO 2022 Clinical Practice Guideline for Diabetes Management in Chronic Kidney Disease.","Samson SL, et al. AACE Consensus Statement: Comprehensive Type 2 Diabetes Management Algorithm, 2023."]},"sca":{"hook":"Aquí se decide en minutos: leer el ECG, saber cuándo reperfundir y no caer en las trampas del IAM de VD y de la fibrinólisis en SCASEST.","nn":[["ischemic-heart-disease","Coronary Artery Disease"],["case-study-18-presenting-with-myocardial-infarction","Case Study #18: Myocardial Infarction"]],"yt":"acute coronary syndrome STEMI NSTEMI","anim":"sca","compare":["stemi-nste"],"sections":[{"h":"El espectro","html":"\n\u003cul>\n\u003cli>\u003cb>Angina inestable\u003c/b>: isquemia en reposo, de reciente inicio o en aumento, con troponina normal. Con la troponina de alta sensibilidad es cada vez menos frecuente.\u003c/li>\n\u003cli>\u003cb>IAMSEST\u003c/b>: troponina elevada sin elevación persistente del ST.\u003c/li>\n\u003cli>\u003cb>IAMCEST\u003c/b>: elevación persistente del ST o un equivalente. Casi siempre es una arteria ocluida.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cb>Infarto (4ª definición universal)\u003c/b>: ascenso o descenso de troponina con al menos un valor mayor al percentil 99, más evidencia de isquemia: síntomas, cambios nuevos en el ECG, ondas Q nuevas, imagen con pérdida de miocardio viable o trombo en la angiografía.\u003c/p>\n\u003cp>\u003cb>Tipos\u003c/b>: 1 = ruptura de placa con trombo · 2 = desequilibrio entre aporte y demanda (anemia, taquiarritmia, hipotensión, hipoxemia) · 3 = muerte súbita antes de tener troponina · 4 = asociado a ICP · 5 = asociado a cirugía de revascularización.\u003c/p>"},{"h":"Los primeros 10 minutos","html":"\n\u003cul>\n\u003cli>\u003cb>ECG de 12 derivaciones en ≤10 min\u003c/b> desde el primer contacto. Si no es diagnóstico y sigue el dolor, repítelo cada 15–30 min.\u003c/li>\n\u003cli>Monitor, acceso venoso y troponina de alta sensibilidad a las 0 h y 1 h (o 0 h y 2 h).\u003c/li>\n\u003cli>\u003cb>Aspirina\u003c/b> 150–300 mg VO masticada, sin capa entérica, salvo alergia verdadera.\u003c/li>\n\u003cli>\u003cb>Oxígeno solo si SatO₂ &lt;90%\u003c/b>.\u003c/li>\n\u003cli>\u003cb>Nitroglicerina\u003c/b> sublingual para el dolor, excepto si la PAS es &lt;90, hay IAM de VD o tomó sildenafil en las últimas 24 h (tadalafil, 48 h).\u003c/li>\n\u003cli>\u003cb>Morfina\u003c/b> solo para dolor intenso que no cede: retrasa la absorción de los P2Y12 orales.\u003c/li>\n\u003c/ul>"},{"h":"Leer el ECG","html":"\n\u003cp>\u003cb>IAMCEST\u003c/b>: elevación nueva del ST en el punto J en ≥2 derivaciones contiguas.\u003c/p>\n\u003cul>\n\u003cli>V2–V3: ≥2 mm en hombres ≥40 años · ≥2.5 mm en hombres &lt;40 · ≥1.5 mm en mujeres.\u003c/li>\n\u003cli>Resto de derivaciones: ≥1 mm.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>Derivaciones\u003c/th>\u003cth>Cara\u003c/th>\u003cth>Arteria\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>V1–V4\u003c/td>\u003ctd>Anterior y septal\u003c/td>\u003ctd>Descendente anterior\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>DII, DIII, aVF\u003c/td>\u003ctd>Inferior\u003c/td>\u003ctd>Coronaria derecha (≈80–90%) o circunfleja\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>DI, aVL, V5–V6\u003c/td>\u003ctd>Lateral\u003c/td>\u003ctd>Circunfleja o diagonal\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Infradesnivel V1–V3 con R alta\u003c/td>\u003ctd>Posterior\u003c/td>\u003ctd>Circunfleja o CD: toma V7–V9\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>V3R–V4R\u003c/td>\u003ctd>Ventrículo derecho\u003c/td>\u003ctd>CD proximal\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>En V7–V9 y en V3R–V4R el umbral es ≥0.5 mm (≥1 mm en hombres jóvenes).\u003c/p>\n\u003cp>\u003cb>Se tratan como IAMCEST\u003c/b>: bloqueo de rama (izquierda o derecha) o ritmo de marcapasos con síntomas isquémicos persistentes; IAM posterior aislado. Infradesnivel del ST en ≥6 derivaciones con elevación en aVR o V1 sugiere lesión de tronco o multivaso; con inestabilidad va a coronariografía inmediata.\u003c/p>\n\u003cp>\u003cb>Patrones que debes reconocer\u003c/b>: \u003cb>Wellens\u003c/b> (T bifásicas o profundamente invertidas en V2–V3 en un paciente sin dolor = estenosis crítica de la DA proximal; no hagas prueba de esfuerzo) y \u003cb>De Winter\u003c/b> (infradesnivel ascendente del ST en precordiales con T altas y simétricas = oclusión de la DA).\u003c/p>"},{"h":"IAMCEST: reperfundir ya","html":"\n\u003cul>\n\u003cli>Síntomas de &lt;12 h → reperfusión.\u003c/li>\n\u003cli>\u003cb>ICP primaria\u003c/b> si puede hacerse en ≤120 min desde el diagnóstico. Meta de ≤60 min si el paciente ya está en un hospital con hemodinamia, y ≤90 min si se traslada.\u003c/li>\n\u003cli>Si la ICP no llega en 120 min → \u003cb>fibrinólisis en ≤10 min\u003c/b> desde el diagnóstico (de preferencia tenecteplasa; mitad de dosis si ≥75 años), con aspirina, clopidogrel y anticoagulante. Después, traslado a un centro con ICP: coronariografía en 2–24 h si fue exitosa, o \u003cb>ICP de rescate\u003c/b> inmediata si falló.\u003c/li>\n\u003cli>\u003cb>Fibrinólisis exitosa\u003c/b>: el ST baja ≥50% a los 60–90 min y cede el dolor; puede aparecer un ritmo idioventricular acelerado.\u003c/li>\n\u003cli>&gt;12 h de síntomas: ICP si hay isquemia persistente, IC, choque o arritmias graves; considerarla entre 12 y 48 h. Después de 48 h y asintomático, no se abre de rutina una arteria ocluida.\u003c/li>\n\u003cli>Choque cardiogénico: ICP de la arteria culpable sin importar el tiempo.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cb>Contraindicaciones absolutas de la fibrinólisis\u003c/b>: hemorragia intracraneal previa o EVC de origen desconocido (en cualquier momento) · EVC isquémico en los últimos 6 meses · daño o neoplasia del SNC o malformación AV · trauma mayor, cirugía o TCE en el último mes · sangrado gastrointestinal en el último mes · trastorno hemorrágico conocido · disección aórtica · punciones no compresibles en las últimas 24 h.\u003c/p>\n\u003cp>\u003cb>Relativas\u003c/b>: AIT en los últimos 6 meses, anticoagulación oral, embarazo o primera semana posparto, HTA refractaria (PAS &gt;180 o PAD &gt;110), hepatopatía avanzada, endocarditis, úlcera péptica activa, RCP prolongada o traumática.\u003c/p>"},{"h":"SCASEST: estratificar y decidir cuándo cateterizar","html":"\n\u003cul>\n\u003cli>Troponina de alta sensibilidad con algoritmo 0 h/1 h para descartar o confirmar rápido.\u003c/li>\n\u003cli>\u003cb>Inmediata (&lt;2 h)\u003c/b> si es de muy alto riesgo: inestabilidad hemodinámica o choque, dolor recurrente o refractario, arritmias graves o paro, complicaciones mecánicas, IC aguda por isquemia, cambios dinámicos recurrentes del ST (sobre todo elevación intermitente).\u003c/li>\n\u003cli>\u003cb>Temprana (&lt;24 h)\u003c/b> si es de alto riesgo: IAMSEST confirmado, cambios dinámicos del ST o la T, elevación transitoria del ST, GRACE &gt;140.\u003c/li>\n\u003cli>\u003cb>Selectiva\u003c/b> en el resto: prueba de isquemia o angio-TC coronaria antes de decidir.\u003c/li>\n\u003cli>\u003cb>Nunca fibrinólisis\u003c/b> en SCASEST.\u003c/li>\n\u003cli>Escalas: GRACE (pronóstico; define el &lt;24 h) y TIMI (0–7; riesgo de eventos a 14 días). La calculadora TIMI está en Más → Calculadoras.\u003c/li>\n\u003c/ul>"},{"h":"Antitrombóticos y alta","html":"\n\u003cul>\n\u003cli>\u003cb>Doble antiagregación\u003c/b>: aspirina (75–100 mg/día después de la carga) + inhibidor P2Y12 por 12 meses de forma predeterminada.\u003c/li>\n\u003cli>\u003cb>Prasugrel\u003c/b>: carga 60 mg, luego 10 mg/día (5 mg si ≥75 años o &lt;60 kg). Contraindicado con EVC o AIT previo.\u003c/li>\n\u003cli>\u003cb>Ticagrelor\u003c/b>: carga 180 mg, luego 90 mg c/12 h. Puede causar disnea y bradicardia.\u003c/li>\n\u003cli>\u003cb>Clopidogrel\u003c/b>: carga 300–600 mg, luego 75 mg/día. Se usa si recibió fibrinólisis, si necesita anticoagulante oral o si no hay los otros dos.\u003c/li>\n\u003cli>En SCASEST no se da P2Y12 de rutina antes del cateterismo si este se hará en &lt;24 h (ESC 2023).\u003c/li>\n\u003cli>\u003cb>Anticoagulación parenteral\u003c/b>: heparina no fraccionada durante la ICP; enoxaparina como alternativa; fondaparinux si no habrá cateterismo temprano.\u003c/li>\n\u003cli>\u003cb>Al alta\u003c/b>: estatina de alta intensidad (meta LDL &lt;55 mg/dL y ↓ ≥50%; si no se logra, ezetimiba y luego iPCSK9) · betabloqueador (sobre todo con FEVI ≤40%) · IECA o ARA-II (FEVI ≤40%, IC, DM, HTA o ERC) · antagonista mineralocorticoide si FEVI ≤40% con IC o DM · IBP si hay riesgo de sangrado digestivo · rehabilitación cardiaca y dejar de fumar.\u003c/li>\n\u003c/ul>"},{"h":"Complicaciones","html":"\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>Cuándo (aprox.)\u003c/th>\u003cth>Complicación\u003c/th>\u003cth>Pista\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Primeras horas\u003c/td>\u003ctd>FV y otras arritmias\u003c/td>\u003ctd>Principal causa de muerte antes de llegar al hospital\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>IAM inferior\u003c/td>\u003ctd>Bradicardia, bloqueo AV\u003c/td>\u003ctd>El nodo AV lo irriga la CD; suele ser transitorio\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>IAM inferior\u003c/td>\u003ctd>IAM de VD\u003c/td>\u003ctd>Hipotensión + IY + pulmones limpios → volumen, sin nitratos\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Días 1–3\u003c/td>\u003ctd>Pericarditis temprana\u003c/td>\u003ctd>Dolor pleurítico y frote\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Días 2–7\u003c/td>\u003ctd>Ruptura de músculo papilar\u003c/td>\u003ctd>Insuficiencia mitral aguda y edema pulmonar; papilar posteromedial en IAM inferior\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Días 3–5\u003c/td>\u003ctd>Ruptura del septum (CIV)\u003c/td>\u003ctd>Soplo holosistólico paraesternal con frémito; salto oximétrico en el VD\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Días 3–14\u003c/td>\u003ctd>Ruptura de pared libre\u003c/td>\u003ctd>Taponamiento y actividad eléctrica sin pulso\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Semanas\u003c/td>\u003ctd>Aneurisma ventricular\u003c/td>\u003ctd>Elevación persistente del ST, IC, trombo mural\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Semanas\u003c/td>\u003ctd>Síndrome de Dressler\u003c/td>\u003ctd>Pericarditis autoinmune\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>\u003cb>Killip\u003c/b>: I sin IC · II estertores basales o S3 · III edema pulmonar · IV choque cardiogénico.\u003c/p>"}],"mnemo":{"t":"MONA se jubiló: solo la A es para todos","d":"Morfina solo si el dolor es intenso · Oxígeno solo si SatO₂ \u003c90% · Nitratos solo si no hay hipotensión, IAM de VD ni sildenafil · Aspirina a todos, salvo alergia. Y para localizar: “inferior es derecha” (DII, DIII y aVF → coronaria derecha)."},"pearl":"En IAMCEST nunca esperes la troponina: el ECG basta para activar la hemodinamia. Y en SCASEST la fibrinólisis siempre es la respuesta incorrecta.","trap":"IAM inferior con hipotensión: si una opción dice “nitroglicerina” o “furosemida”, es la trampa. Piensa en el VD: V4R y volumen.","guide":["Carga de aspirina: la ESC 2023 da 150–300 mg VO y la ACC/AHA 2025 da 162–325 mg. Las dos son correctas: lo importante es darla masticada y rápido.","Pretratamiento con P2Y12 en SCASEST: la ESC 2023 no lo recomienda de rutina si el cateterismo será en \u003c24 h. En muchos hospitales se sigue dando clopidogrel en urgencias. Si la pregunta dice “según la ESC”, no se pretrata.","Bloqueo de rama izquierda nuevo: libros antiguos lo consideran IAMCEST automático; la ESC 2023 lo maneja como IAMCEST cuando hay síntomas isquémicos persistentes (apóyate en los criterios de Sgarbossa)."],"refs":["Byrne RA, et al. 2023 ESC Guidelines for the management of acute coronary syndromes. Eur Heart J 2023.","Rao SV, et al. 2025 ACC/AHA/ACEP/NAEMSP/SCAI Guideline for the Management of Patients With Acute Coronary Syndromes. Circulation 2025.","Thygesen K, et al. Fourth Universal Definition of Myocardial Infarction. Eur Heart J 2019."]},"lra":{"hook":"Tres preguntas resuelven casi cualquier caso: ¿cumple criterios y en qué estadio?, ¿dónde está el problema (antes, dentro o después del riñón)? y ¿necesita diálisis ya?","nn":[["acute-kidney-injury","Acute Kidney Injury"]],"yt":"acute kidney injury","anim":"lra","compare":["pre-nta"],"sections":[{"h":"Definición y estadios (KDIGO)","html":"\n\u003cp>LRA es cualquiera de estos:\u003c/p>\n\u003cul>\n\u003cli>Creatinina ↑ ≥0.3 mg/dL en 48 h.\u003c/li>\n\u003cli>Creatinina ↑ ≥1.5 veces la basal (conocida o presumida) en los últimos 7 días.\u003c/li>\n\u003cli>Uresis &lt;0.5 mL/kg/h por 6 h.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>Estadio\u003c/th>\u003cth>Creatinina\u003c/th>\u003cth>Uresis\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>1.5–1.9 veces la basal, o ↑ ≥0.3 mg/dL\u003c/td>\u003ctd>&lt;0.5 mL/kg/h por 6–12 h\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>2.0–2.9 veces la basal\u003c/td>\u003ctd>&lt;0.5 mL/kg/h por ≥12 h\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>≥3 veces la basal, o Cr ≥4.0 mg/dL, o inicio de terapia de reemplazo renal\u003c/td>\u003ctd>&lt;0.3 mL/kg/h por ≥24 h, o anuria ≥12 h\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>Si la creatinina y la uresis dan estadios distintos, se queda el \u003cb>más alto\u003c/b>.\u003c/p>"},{"h":"¿Dónde está el problema?","html":"\n\u003cp>\u003cb>Prerrenal\u003c/b> (la más frecuente): el riñón está sano, pero le llega poca sangre.\u003c/p>\n\u003cul>\n\u003cli>Hipovolemia: vómito, diarrea, hemorragia, diuréticos, quemaduras.\u003c/li>\n\u003cli>Volumen circulante efectivo bajo: IC (cardiorrenal), cirrosis (hepatorrenal), sepsis.\u003c/li>\n\u003cli>Fármacos que alteran la hemodinamia del glomérulo: AINE, IECA o ARA-II, inhibidores de calcineurina.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cb>Intrínseca\u003c/b>: daño del parénquima.\u003c/p>\n\u003cul>\n\u003cli>\u003cb>Necrosis tubular aguda\u003c/b> (la intrínseca más frecuente): isquémica (prerrenal prolongada, choque) o tóxica (aminoglucósidos, vancomicina, anfotericina B, cisplatino, contraste; pigmentos como mioglobina y hemoglobina).\u003c/li>\n\u003cli>\u003cb>Nefritis intersticial aguda\u003c/b>: betalactámicos, AINE, IBP, rifampicina, sulfas. Fiebre, exantema, eosinofilia y cilindros leucocitarios.\u003c/li>\n\u003cli>\u003cb>Glomerular\u003c/b>: hematuria dismórfica, cilindros eritrocitarios, proteinuria e HTA.\u003c/li>\n\u003cli>\u003cb>Vascular\u003c/b>: ateroembolia (después de un cateterismo), microangiopatía trombótica (SHU, PTT), HTA maligna.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cb>Posrenal\u003c/b>: obstrucción bilateral, o de un riñón único: HPB, litiasis, tumores pélvicos, vejiga neurogénica, sonda tapada.\u003c/p>"},{"h":"Abordaje en 5 pasos","html":"\n\u003col>\n\u003cli>\u003cb>Historia\u003c/b>: pérdidas de volumen, fármacos y contraste de los últimos días, síntomas urinarios.\u003c/li>\n\u003cli>\u003cb>Exploración\u003c/b>: volumen (PA, FC, ortostatismo, IY, edema), globo vesical, livedo, exantema.\u003c/li>\n\u003cli>\u003cb>EGO con sedimento\u003c/b>: es la “biopsia líquida” del riñón.\u003c/li>\n\u003cli>\u003cb>Índices urinarios\u003c/b>: FENa (o FEUrea si usa diuréticos), sodio y osmolaridad urinaria.\u003c/li>\n\u003cli>\u003cb>USG renal\u003c/b>: hidronefrosis en la posrenal; riñones pequeños sugieren ERC previa.\u003c/li>\n\u003c/ol>\n\u003cp>Laboratorio clave: creatinina, BUN, potasio, gasometría, BH y CK si sospechas rabdomiólisis.\u003c/p>"},{"h":"Lo que dice el sedimento","html":"\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>Hallazgo\u003c/th>\u003cth>Sugiere\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Cilindros hialinos o sedimento normal\u003c/td>\u003ctd>Prerrenal o posrenal\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Cilindros granulosos “café lodoso” y células tubulares\u003c/td>\u003ctd>Necrosis tubular aguda\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Cilindros eritrocitarios, eritrocitos dismórficos\u003c/td>\u003ctd>Glomerulonefritis\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Cilindros leucocitarios, leucocituria estéril, eosinofiluria\u003c/td>\u003ctd>Nefritis intersticial (pielonefritis si hay bacterias)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Tira con “sangre” sin eritrocitos en el sedimento\u003c/td>\u003ctd>Mioglobina o hemoglobina: rabdomiólisis o hemólisis\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Cristales\u003c/td>\u003ctd>Etilenglicol (oxalato), lisis tumoral (urato), fármacos (aciclovir, metotrexato)\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>"},{"h":"Índices urinarios","html":"\n\u003cp>\u003cb>FENa\u003c/b> = (Na urinario × Cr plasmática) ÷ (Na plasmático × Cr urinaria) × 100. La comparación completa entre prerrenal y NTA está en el comparador de abajo.\u003c/p>\n\u003cul>\n\u003cli>FENa &lt;1% sin ser prerrenal: contraste, mioglobinuria o hemoglobinuria, glomerulonefritis aguda, obstrucción temprana, sepsis temprana.\u003c/li>\n\u003cli>Con diuréticos la FENa sale falsamente alta: usa la \u003cb>FEUrea\u003c/b> (&lt;35% prerrenal, &gt;50% NTA).\u003c/li>\n\u003cli>En ERC la FENa basal ya puede estar alta.\u003c/li>\n\u003c/ul>"},{"h":"Tratamiento","html":"\n\u003cul>\n\u003cli>Trata la causa. Prerrenal: volumen con cristaloides (de preferencia balanceados, como Hartmann o Plasma-Lyte) y vigila la sobrecarga.\u003c/li>\n\u003cli>Suspende nefrotóxicos y ajusta dosis a la TFG. En hipovolemia, suspende temporalmente IECA o ARA-II, diuréticos, metformina e iSGLT2.\u003c/li>\n\u003cli>Los diuréticos \u003cb>no\u003c/b> previenen ni tratan la LRA: solo sirven para la sobrecarga de volumen.\u003c/li>\n\u003cli>Posrenal: sonda vesical (HPB) o nefrostomía o catéter JJ (obstrucción alta). Después vigila la poliuria posobstructiva.\u003c/li>\n\u003cli>Monitorea a diario uresis, peso, creatinina, potasio y gasometría.\u003c/li>\n\u003cli>En la recuperación de la NTA hay una fase poliúrica, con riesgo de hipokalemia e hipovolemia.\u003c/li>\n\u003c/ul>"},{"h":"Hiperkalemia: el peligro inmediato","html":"\n\u003cp>Cambios del ECG en orden: T picudas → PR largo y P aplanada → QRS ancho → onda sinusoidal → FV o asistolia.\u003c/p>\n\u003col>\n\u003cli>\u003cb>Proteger el corazón\u003c/b>: gluconato de calcio al 10%, 10 mL IV en 2–3 min; se repite si siguen los cambios. No baja el potasio.\u003c/li>\n\u003cli>\u003cb>Meter el K a la célula\u003c/b>: insulina rápida 10 U IV con 25 g de glucosa (vigila hipoglucemia); salbutamol nebulizado 10–20 mg; bicarbonato solo si hay acidosis metabólica.\u003c/li>\n\u003cli>\u003cb>Sacar el K del cuerpo\u003c/b>: diurético de asa (si orina), quelantes (patiromer, ciclosilicato de zirconio sódico) o diálisis.\u003c/li>\n\u003cli>Suspende lo que lo sube: IECA o ARA-II, espironolactona, AINE, TMP-SMX y suplementos de potasio.\u003c/li>\n\u003c/ol>"},{"h":"Diálisis urgente: AEIOU","html":"\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>\u003c/th>\u003cth>Indicación\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>A\u003c/b>\u003c/td>\u003ctd>Acidosis metabólica grave y refractaria (pH &lt;7.1–7.15)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>E\u003c/b>\u003c/td>\u003ctd>Electrolitos: hiperkalemia refractaria (&gt;6.5 o con cambios en el ECG pese al tratamiento)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>I\u003c/b>\u003c/td>\u003ctd>Intoxicaciones dializables: metanol, etilenglicol, litio, salicilatos, metformina con acidosis láctica, valproato\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>O\u003c/b>\u003c/td>\u003ctd>Sobrecarga (\u003ci>overload\u003c/i>) de volumen que no responde a diuréticos: edema pulmonar\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>U\u003c/b>\u003c/td>\u003ctd>Uremia sintomática: pericarditis, encefalopatía, sangrado urémico\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>Ninguna cifra aislada de creatinina o BUN es indicación por sí sola.\u003c/p>"},{"h":"Escenarios de examen","html":"\n\u003cul>\n\u003cli>\u003cb>Triple golpe\u003c/b>: AINE + IECA o ARA-II + diurético en un adulto mayor → prerrenal.\u003c/li>\n\u003cli>\u003cb>Contraste\u003c/b>: la creatinina sube a las 24–72 h; se previene con hidratación isotónica en pacientes de riesgo. La N-acetilcisteína no sirve.\u003c/li>\n\u003cli>\u003cb>Rabdomiólisis\u003c/b>: CK &gt;5 veces el límite, tira con sangre sin eritrocitos, potasio y fósforo altos, calcio bajo → cristaloides abundantes.\u003c/li>\n\u003cli>\u003cb>Ateroembolia\u003c/b>: semanas después de un cateterismo, con livedo, dedos azules con pulsos presentes, eosinofilia y C3 bajo.\u003c/li>\n\u003cli>\u003cb>Síndrome hepatorrenal\u003c/b>: cirrosis con ascitis que no responde a 2 días de albúmina (1 g/kg) y suspensión de diuréticos → terlipresina con albúmina.\u003c/li>\n\u003cli>\u003cb>Lisis tumoral\u003c/b>: después de quimioterapia; ácido úrico, potasio y fósforo altos, calcio bajo.\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"AEIOU: las vocales de la diálisis urgente","d":"Acidosis · Electrolitos (potasio) · Intoxicaciones · Overload (sobrecarga) · Uremia. Y el “triple golpe” = AINE + IECA o ARA-II + diurético."},"pearl":"Si el paciente toma diurético, la FENa no sirve: pide FEUrea. Y si la FENa es \u003c1% en un paciente con contraste o rabdomiólisis, no es prerrenal.","trap":"La opción “furosemida para aumentar la uresis” en una NTA oligúrica es incorrecta: no mejora el pronóstico. Tampoco “dializar porque la creatinina es 6”: sin AEIOU no hay urgencia.","guide":["Definición: los criterios KDIGO 2012 son los que se usan (RIFLE y AKIN son versiones anteriores). ⚠️ KDIGO está actualizando su guía de LRA; pregunta si tu profesor menciona cambios.","Líquidos: KDIGO 2012 dice “cristaloides isotónicos”. Los ensayos posteriores (SMART) favorecen las soluciones balanceadas sobre la salina al 0.9% en pacientes críticos. Si te dan a elegir, balanceada.","Umbral de TFG para prevenir la nefropatía por contraste: varía según la guía (\u003c30 mL/min en el consenso ACR-NKF 2020; algunos protocolos usan \u003c45)."],"refs":["KDIGO Clinical Practice Guideline for Acute Kidney Injury. Kidney Int Suppl 2012;2:1–138.","Semler MW, et al. Balanced crystalloids versus saline in critically ill adults (SMART). N Engl J Med 2018.","Weisbord SD, et al. Outcomes after angiography with sodium bicarbonate and acetylcysteine (PRESERVE). N Engl J Med 2018.","Davenport MS, et al. ACR–NKF consensus: use of IV iodinated contrast media in patients with kidney disease. Radiology 2020."]},"smdl":{"hook":"Se pregunta con números: cuántos criterios hacen síndrome metabólico, en qué categoría de riesgo está el paciente, cuál es su meta de LDL y qué agregas si no llega.","anim":"smdl","compare":["ldl-tg"],"nn":[["hyperlipidemia","Hyperlipidemia"],["drugs-for-hyperlipidemia","Drugs for Hyperlipidemia"]],"yt":"hyperlipidemia statins","sections":[{"h":"Síndrome metabólico","html":"\n\u003cp>\u003cb>Criterios armonizados (2009): 3 de 5\u003c/b> (cuenta también si ya recibe tratamiento para ese criterio).\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>Criterio\u003c/th>\u003cth>Umbral\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Cintura\u003c/td>\u003ctd>Según población: ATP III ≥102 cm hombres / ≥88 cm mujeres; IDF para Latinoamérica ≥90 / ≥80 cm\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Triglicéridos\u003c/td>\u003ctd>≥150 mg/dL\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>HDL\u003c/td>\u003ctd>&lt;40 mg/dL hombres · &lt;50 mg/dL mujeres\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Presión arterial\u003c/td>\u003ctd>≥130/85 mmHg\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Glucosa en ayuno\u003c/td>\u003ctd>≥100 mg/dL\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>La IDF 2005 exigía obesidad central obligatoria; los criterios armonizados ya no.\u003c/li>\n\u003cli>Duplica el riesgo cardiovascular y multiplica el de DM2 (~5 veces).\u003c/li>\n\u003cli>Tratamiento: bajar 7–10% del peso, ≥150 min/semana de actividad aeróbica, dieta mediterránea, y tratar cada componente.\u003c/li>\n\u003c/ul>"},{"h":"Lipoproteínas en 1 minuto","html":"\n\u003cul>\n\u003cli>\u003cb>LDL\u003c/b> lleva colesterol a los tejidos y a la pared arterial: es el blanco del tratamiento.\u003c/li>\n\u003cli>\u003cb>HDL\u003c/b> hace el transporte reverso de colesterol al hígado.\u003c/li>\n\u003cli>\u003cb>VLDL\u003c/b> transporta triglicéridos hechos en el hígado; \u003cb>quilomicrones\u003c/b>, los de la dieta.\u003c/li>\n\u003cli>\u003cb>LDL calculado (Friedewald)\u003c/b> = colesterol total − HDL − TG/5. No sirve si los TG son ≥400 mg/dL: pide LDL directo.\u003c/li>\n\u003cli>\u003cb>Colesterol no-HDL\u003c/b> = total − HDL. Su meta es la del LDL + 30.\u003c/li>\n\u003cli>La ESC sugiere medir \u003cb>Lp(a)\u003c/b> al menos una vez en la vida.\u003c/li>\n\u003c/ul>"},{"h":"Riesgo y metas de LDL (ESC/EAS)","html":"\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>Riesgo\u003c/th>\u003cth>Quién\u003c/th>\u003cth>Meta LDL\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Muy alto\u003c/b>\u003c/td>\u003ctd>ECV aterosclerótica establecida (clínica o en imagen); DM con daño a órgano blanco o ≥3 FR mayores; ERC con TFG &lt;30; SCORE2 ≥7.5% (&lt;50 años) o ≥10% (50–69); HF con ECV u otro FR mayor\u003c/td>\u003ctd>\u003cb>&lt;55 mg/dL\u003c/b> y ↓ ≥50%\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Alto\u003c/b>\u003c/td>\u003ctd>Un FR muy elevado (LDL &gt;190, CT &gt;310 o PA ≥180/110); HF sin otros FR; DM sin daño a órgano blanco con ≥10 años de evolución u otro FR; ERC con TFG 30–59; SCORE2 2.5–7.5% o 5–10%\u003c/td>\u003ctd>\u003cb>&lt;70 mg/dL\u003c/b> y ↓ ≥50%\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Moderado\u003c/td>\u003ctd>DM joven (DM1 &lt;35 años, DM2 &lt;50) con &lt;10 años y sin FR; SCORE2 bajo-moderado\u003c/td>\u003ctd>&lt;100 mg/dL\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Bajo\u003c/td>\u003ctd>SCORE2 bajo\u003c/td>\u003ctd>&lt;116 mg/dL\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>Si tuvo un segundo evento vascular en 2 años con estatina a dosis máxima, se puede considerar LDL &lt;40 mg/dL.\u003c/p>\n\u003cp>\u003cb>Secuencia\u003c/b>: estatina de alta intensidad a dosis máxima tolerada → si no llega en 4–6 semanas, + ezetimiba → si aún no, + iPCSK9.\u003c/p>"},{"h":"Estatinas","html":"\n\u003cul>\n\u003cli>Inhiben la HMG-CoA reductasa: baja el colesterol dentro del hepatocito, que responde fabricando más receptores de LDL y limpia la sangre.\u003c/li>\n\u003cli>\u003cb>Alta intensidad (↓ ≥50%)\u003c/b>: atorvastatina 40–80 mg, rosuvastatina 20–40 mg.\u003c/li>\n\u003cli>\u003cb>Moderada (↓ 30–49%)\u003c/b>: atorvastatina 10–20, rosuvastatina 5–10, simvastatina 20–40, pravastatina 40–80.\u003c/li>\n\u003cli>\u003cb>Efectos adversos\u003c/b>: mialgias (lo más común), miopatía con CK alta, rabdomiólisis (rara), ↑ transaminasas, leve ↑ del riesgo de DM (el beneficio cardiovascular es mucho mayor).\u003c/li>\n\u003cli>Más miopatía con gemfibrozilo, macrólidos, azoles, ciclosporina (interacciones por CYP3A4 con simva-, lova- y atorvastatina).\u003c/li>\n\u003cli>Con mialgias: medir CK y TSH, suspender temporalmente y reintentar con otra estatina o dosis menor; si CK &gt;10× con síntomas, suspender.\u003c/li>\n\u003cli>Contraindicadas en embarazo y lactancia y en hepatopatía activa descompensada.\u003c/li>\n\u003c/ul>"},{"h":"Otros hipolipemiantes","html":"\n\u003cul>\n\u003cli>\u003cb>Ezetimiba\u003c/b>: bloquea NPC1L1 en el intestino (absorción de colesterol). ↓ LDL ~20–25%. Redujo eventos sumada a estatina (IMPROVE-IT).\u003c/li>\n\u003cli>\u003cb>iPCSK9\u003c/b> (evolocumab, alirocumab; inclisirán es un ARN de interferencia): evitan que se destruya el receptor de LDL. ↓ LDL ~50–60% adicional. Redujeron eventos (FOURIER, ODYSSEY OUTCOMES).\u003c/li>\n\u003cli>\u003cb>Ácido bempedoico\u003c/b>: inhibe la ATP-citrato liasa antes de la HMG-CoA reductasa; no da mialgias porque no actúa en músculo. Útil con intolerancia a estatinas (CLEAR Outcomes).\u003c/li>\n\u003cli>\u003cb>Fibratos\u003c/b> (fenofibrato): bajan TG; se usan para prevenir pancreatitis con TG muy altos. Con estatina, fenofibrato sí; gemfibrozilo no.\u003c/li>\n\u003cli>\u003cb>Icosapento de etilo\u003c/b> (EPA purificado 2 g c/12 h): con TG 135–499 mg/dL y alto riesgo pese a estatina, redujo eventos (REDUCE-IT).\u003c/li>\n\u003cli>\u003cb>Secuestradores de ácidos biliares\u003c/b> (colestiramina): suben los TG; se pueden usar en el embarazo.\u003c/li>\n\u003c/ul>"},{"h":"Hipertrigliceridemia","html":"\n\u003cul>\n\u003cli>TG ≥150 mg/dL = elevados. Con TG muy altos (≥500 según ACC/AHA; &gt;880 mg/dL o 10 mmol/L según ESC) aumenta el riesgo de \u003cb>pancreatitis\u003c/b>.\u003c/li>\n\u003cli>\u003cb>Causas secundarias\u003c/b>: DM descontrolada, alcohol, obesidad, hipotiroidismo, ERC y síndrome nefrótico, embarazo; fármacos (estrógenos orales, tamoxifeno, glucocorticoides, betabloqueadores, tiazidas, retinoides, antipsicóticos atípicos, inhibidores de proteasa).\u003c/li>\n\u003cli>\u003cb>TG muy altos\u003c/b>: dieta muy baja en grasa, cero alcohol, controlar la glucosa y fenofibrato.\u003c/li>\n\u003cli>\u003cb>TG 150–499\u003c/b>: lo primero es el LDL (estatina); si persisten con ECV o DM, considerar icosapento de etilo.\u003c/li>\n\u003cli>Signos de quilomicronemia: xantomas eruptivos, lipemia retinalis, hepatoesplenomegalia, dolor abdominal.\u003c/li>\n\u003c/ul>"},{"h":"Hipercolesterolemia familiar","html":"\n\u003cul>\n\u003cli>Autosómica dominante (receptor de LDL, ApoB o PCSK9). Heterocigota ~1 de cada 250 personas.\u003c/li>\n\u003cli>Sospecha: LDL ≥190 mg/dL en adultos, xantomas tendinosos (Aquiles, extensores de manos), arco corneal antes de los 45 años, familiar con ECV prematura.\u003c/li>\n\u003cli>Criterios de la Dutch Lipid Clinic Network para clasificarla.\u003c/li>\n\u003cli>Tratamiento: estatina de alta intensidad desde joven, casi siempre con ezetimiba y a menudo iPCSK9. Tamizaje en cascada de los familiares.\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"Las 3 escaleras del LDL: Estatina → Ezetimiba → iPCSK9","d":"Primero la estatina de alta intensidad a dosis máxima tolerada; a las 4–6 semanas, si no llega a la meta, agrega ezetimiba; si aún no llega, iPCSK9. Para los TG muy altos la escalera es otra: dieta sin grasa + cero alcohol + fenofibrato."},"pearl":"La meta de LDL en muy alto riesgo tiene dos condiciones: \u003c55 mg/dL Y reducción ≥50% de la basal. Si el paciente llegó a 60 bajando de 160, todavía no cumple.","trap":"Estatina + gemfibrozilo = rabdomiólisis. Si necesitas un fibrato con estatina, que sea fenofibrato.","guide":["Metas vs umbrales: la ESC/EAS fija metas numéricas (\u003c55, \u003c70, \u003c100). La ACC/AHA habla de intensidad de estatina por grupos (ECV, LDL ≥190, DM 40–75 años, riesgo a 10 años ≥7.5%) y de umbrales para agregar ezetimiba o iPCSK9 (LDL ≥70, o ≥55 en muy alto riesgo según la vía de decisión 2022). Si te preguntan “meta”, contesta con la ESC.","Cintura: el umbral cambia según la guía y la población (102/88 en ATP III; 90/80 para Latinoamérica según IDF). ⚠️ Pregunta cuál usa tu profesor; en los casos de esta app los números funcionan con ambos."],"refs":["Mach F, et al. 2019 ESC/EAS Guidelines for the management of dyslipidaemias. Eur Heart J 2020; y la actualización focalizada ESC/EAS 2025.","Grundy SM, et al. 2018 AHA/ACC Guideline on the Management of Blood Cholesterol. Circulation 2019.","Alberti KG, et al. Harmonizing the Metabolic Syndrome. Circulation 2009."]},"hta":{"hook":"Tres decisiones que se preguntan siempre: cómo confirmar el diagnóstico, con qué combinación empezar y cómo distinguir una urgencia de una emergencia.","anim":"hta","compare":["urg-emerg"],"nn":[["hypertension-updated","Hypertension"],["antihypertensive-drugs","Antihypertensive Drugs"]],"yt":"hypertension antihypertensives","sections":[{"h":"Diagnóstico y clasificación","html":"\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>ESC 2024 (consultorio)\u003c/th>\u003cth>AHA/ACC 2025\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>No elevada: &lt;120/70\u003c/td>\u003ctd>Normal: &lt;120/&lt;80\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Elevada: 120–139 / 70–89\u003c/td>\u003ctd>Elevada: 120–129 / &lt;80\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Hipertensión: ≥140/90\u003c/td>\u003ctd>Estadio 1: 130–139 / 80–89 · Estadio 2: ≥140/90\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cb>Confirma fuera del consultorio\u003c/b>: MAPA (24 h ≥130/80; diurno ≥135/85; nocturno ≥120/70) o automedición en casa (≥135/85).\u003c/li>\n\u003cli>\u003cb>HTA de bata blanca\u003c/b>: alta en consultorio, normal fuera. \u003cb>Enmascarada\u003c/b>: normal en consultorio, alta fuera (más riesgo).\u003c/li>\n\u003cli>Técnica: 5 min sentado, brazalete adecuado, brazo a la altura del corazón, 2–3 mediciones; la primera vez en ambos brazos.\u003c/li>\n\u003cli>\u003cb>Estudios iniciales\u003c/b>: creatinina y TFG, electrolitos, glucosa o A1c, perfil de lípidos, EGO con cociente albúmina/creatinina, ECG (HVI). Fondo de ojo y eco según el caso.\u003c/li>\n\u003c/ul>"},{"h":"Tratamiento","html":"\n\u003cul>\n\u003cli>\u003cb>Estilo de vida\u003c/b>: sodio &lt;2 g/día, dieta DASH rica en potasio (si no hay ERC avanzada), bajar de peso, ejercicio, limitar alcohol, dejar de fumar.\u003c/li>\n\u003cli>\u003cb>Primera línea\u003c/b>: IECA o ARA-II, calcioantagonista dihidropiridínico (amlodipino) y diurético tiazídico o tipo tiazida (clortalidona, indapamida).\u003c/li>\n\u003cli>\u003cb>Iniciar con dos fármacos en una sola pastilla\u003c/b> (IECA/ARA-II + calcioantagonista o + tiazida) en la mayoría. Monoterapia en PA elevada de bajo riesgo, en adultos muy mayores o frágiles.\u003c/li>\n\u003cli>Si no se controla: triple combinación \u003cb>A + C + D\u003c/b> (ARA-II/IECA + calcioantagonista + diurético).\u003c/li>\n\u003cli>\u003cb>Betabloqueadores\u003c/b> solo con indicación propia: post-IAM, IC con FEr, FA (control de frecuencia), angina.\u003c/li>\n\u003cli>\u003cb>Nunca\u003c/b> combinar IECA + ARA-II (ni con aliskirén): más hiperkalemia y LRA sin beneficio.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"decide\">\n\u003cp>\u003cspan class=\"if\">DM con albuminuria o ERC con albuminuria\u003c/span>\u003cspan class=\"then\">IECA o ARA-II\u003c/span>\u003c/p>\n\u003cp>\u003cspan class=\"if\">IC con FE reducida\u003c/span>\u003cspan class=\"then\">IECA/ARA-II/ARNI + betabloqueador + ARM (+ iSGLT2)\u003c/span>\u003c/p>\n\u003cp>\u003cspan class=\"if\">Post-IAM\u003c/span>\u003cspan class=\"then\">IECA + betabloqueador\u003c/span>\u003c/p>\n\u003cp>\u003cspan class=\"if\">Embarazo\u003c/span>\u003cspan class=\"then\">Labetalol, nifedipino o metildopa; IECA/ARA-II contraindicados\u003c/span>\u003c/p>\n\u003cp>\u003cspan class=\"if\">Gota\u003c/span>\u003cspan class=\"then\">Evita tiazidas; losartán baja el ácido úrico\u003c/span>\u003c/p>\n\u003cp>\u003cspan class=\"if\">HPB\u003c/span>\u003cspan class=\"then\">Un alfabloqueador puede ayudar, pero no como primera línea de HTA\u003c/span>\u003c/p>\n\u003c/div>"},{"h":"Efectos adversos clásicos","html":"\n\u003cul>\n\u003cli>\u003cb>IECA\u003c/b>: tos seca (bradicinina) → cambia a ARA-II; angioedema; hiperkalemia; la creatinina puede subir hasta 30% al iniciar (aceptable). Contraindicados en estenosis bilateral de arteria renal y embarazo.\u003c/li>\n\u003cli>\u003cb>Calcioantagonistas dihidropiridínicos\u003c/b>: edema maleolar, cefalea, rubor. Verapamilo y diltiazem: bradicardia, estreñimiento; evitarlos en IC con FEr.\u003c/li>\n\u003cli>\u003cb>Tiazidas\u003c/b>: hipokalemia, hiponatremia, hiperuricemia (gota), hiperglucemia, hipercalcemia.\u003c/li>\n\u003cli>\u003cb>Espironolactona\u003c/b>: hiperkalemia, ginecomastia (la eplerenona no la da).\u003c/li>\n\u003cli>\u003cb>Betabloqueadores\u003c/b>: bradicardia, fatiga, broncoespasmo (no selectivos), ocultan síntomas de hipoglucemia.\u003c/li>\n\u003c/ul>"},{"h":"HTA resistente y secundaria","html":"\n\u003cp>\u003cb>Resistente\u003c/b>: no controlada con 3 fármacos a dosis máximas, uno de ellos diurético. Antes confirma apego, técnica y MAPA (pseudorresistencia). Cuarto fármaco: \u003cb>espironolactona\u003c/b> (PATHWAY-2).\u003c/p>\n\u003cp>\u003cb>Sospecha HTA secundaria\u003c/b> si: inicio joven, resistente, empeoramiento brusco, hipokalemia, daño a órgano blanco desproporcionado, HTA grave.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>Causa\u003c/th>\u003cth>Pista\u003c/th>\u003cth>Estudio\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Hiperaldosteronismo primario (la endocrina más frecuente)\u003c/td>\u003ctd>HTA resistente, hipokalemia (no siempre)\u003c/td>\u003ctd>Cociente aldosterona/renina\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Apnea obstructiva del sueño\u003c/td>\u003ctd>Ronquido, somnolencia, obesidad, HTA nocturna\u003c/td>\u003ctd>Polisomnografía\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Renovascular\u003c/td>\u003ctd>Mujer joven (displasia fibromuscular, “cuentas de rosario”) o adulto mayor aterosclerótico; soplo abdominal; Cr ↑ &gt;30% con IECA; edema pulmonar súbito\u003c/td>\u003ctd>Doppler renal, angio-TC o angio-RM\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Enfermedad renal parenquimatosa\u003c/td>\u003ctd>TFG baja, albuminuria\u003c/td>\u003ctd>Creatinina, EGO, USG\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Feocromocitoma\u003c/td>\u003ctd>Crisis de cefalea, palpitaciones y sudoración\u003c/td>\u003ctd>Metanefrinas libres en plasma (o fraccionadas en orina)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Coartación aórtica\u003c/td>\u003ctd>PA alta en brazos y baja en piernas, pulsos femorales retrasados, muescas costales\u003c/td>\u003ctd>Ecocardiograma, angio-TC\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Cushing, hiper/hipotiroidismo\u003c/td>\u003ctd>Fenotipo sugestivo\u003c/td>\u003ctd>Pruebas hormonales\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Fármacos\u003c/td>\u003ctd>AINE, anticonceptivos, descongestionantes, glucocorticoides, ciclosporina, EPO, cocaína\u003c/td>\u003ctd>Interrogatorio\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>"},{"h":"Urgencia vs emergencia","html":"\n\u003cul>\n\u003cli>\u003cb>Emergencia\u003c/b>: PA muy alta (habitualmente ≥180/110–120) \u003cb>con daño agudo a órgano blanco\u003c/b>: encefalopatía, EVC, SCA, edema pulmonar agudo, disección aórtica, LRA, eclampsia, HTA maligna con retinopatía grado III–IV, microangiopatía.\u003c/li>\n\u003cli>Manejo: terapia intensiva y fármaco IV titulable. Bajar la PAM \u003cb>no más de ~25% en la primera hora\u003c/b>, luego a ~160/100 en 2–6 h y a lo normal en 24–48 h.\u003c/li>\n\u003cli>\u003cb>Excepciones\u003c/b>: disección aórtica → PAS &lt;120 y FC &lt;60 en la primera hora (esmolol o labetalol primero, después vasodilatador). EVC isquémico candidato a trombólisis → &lt;185/110 antes y &lt;180/105 después; sin trombólisis, tratar solo si &gt;220/120. Preeclampsia → labetalol, hidralazina o nifedipino + sulfato de magnesio.\u003c/li>\n\u003cli>Fármacos: labetalol, nicardipino, clevidipino, esmolol, nitroglicerina (SCA, edema pulmonar), nitroprusiato (toxicidad por cianuro). Cocaína o feocromocitoma: fentolamina; evita el betabloqueador solo.\u003c/li>\n\u003cli>\u003cb>Urgencia\u003c/b> (sin daño agudo): fármacos orales y descenso gradual en 24–48 h, a menudo solo reiniciar su tratamiento y cita cercana. \u003cb>Nunca nifedipino sublingual.\u003c/b>\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"A + C + D","d":"La escalera de casi todo hipertenso: A (ARA-II o IECA) + C (calcioantagonista) + D (diurético tiazídico). Si con A + C + D no se controla y el apego es bueno, la cuarta letra es la espironolactona."},"pearl":"Lo que separa la urgencia de la emergencia no es la cifra: es el daño agudo a órgano blanco. 220/130 sin daño es urgencia; 190/110 con edema pulmonar es emergencia.","trap":"Bajar la PA a la normalidad en una hora en una emergencia (o con nifedipino sublingual) causa isquemia cerebral, coronaria o renal. Máximo ~25% de la PAM en la primera hora.","guide":["Definición y meta: la ESC 2024 diagnostica HTA con ≥140/90 y busca PAS de 120–129 si se tolera. La AHA/ACC 2025 diagnostica estadio 1 desde 130/80 y recomienda meta \u003c130/80 para la mayoría, con sugerencia de acercarse a una PAS \u003c120. ⚠️ Confirma qué guía y qué cifras usa tu profesor.","Inicio con combinación: ambas guías favorecen dos fármacos de inicio en la mayoría; la ESC lo pide en una sola pastilla."],"refs":["McEvoy JW, et al. 2024 ESC Guidelines for the management of elevated blood pressure and hypertension. Eur Heart J 2024.","2025 AHA/ACC/AANP/AAPA/ABC/ACCP/ACPM/AGS/AMA/ASPC/NMA/PCNA/SGIM Guideline for the Prevention, Detection, Evaluation and Management of High Blood Pressure in Adults. Hypertension 2025.","Williams B, et al. PATHWAY-2. Lancet 2015."]},"erc":{"hook":"Clasificar bien (G y A), proteger el riñón con los fármacos correctos y manejar las complicaciones: anemia, mineral óseo, acidosis y potasio.","compare":["lra-erc"],"nn":[["chronic-kidney-disease","Chronic Kidney Disease"]],"yt":"chronic kidney disease","sections":[{"h":"Definición y clasificación (KDIGO 2024)","html":"\n\u003cp>\u003cb>ERC\u003c/b> = alteración de estructura o función renal por \u003cb>más de 3 meses\u003c/b>: TFG &lt;60 o algún marcador de daño (albuminuria ≥30 mg/g, sedimento anormal, alteraciones tubulares, histología, imagen o trasplante).\u003c/p>\n\u003cp>Se clasifica por \u003cb>Causa, G (TFG) y A (albuminuria)\u003c/b>.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>G\u003c/th>\u003cth>TFG (mL/min/1.73 m²)\u003c/th>\u003cth>A\u003c/th>\u003cth>Albúmina/creatinina\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>G1\u003c/td>\u003ctd>≥90\u003c/td>\u003ctd>A1\u003c/td>\u003ctd>&lt;30 mg/g\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>G2\u003c/td>\u003ctd>60–89\u003c/td>\u003ctd>A2\u003c/td>\u003ctd>30–300 mg/g\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>G3a\u003c/td>\u003ctd>45–59\u003c/td>\u003ctd>A3\u003c/td>\u003ctd>&gt;300 mg/g\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>G3b\u003c/td>\u003ctd>30–44\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>G4\u003c/td>\u003ctd>15–29\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>G5\u003c/td>\u003ctd>&lt;15\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>Causas principales: DM (la primera), HTA, glomerulonefritis, poliquistosis.\u003c/li>\n\u003cli>Estima la TFG con CKD-EPI 2021 (sin raza); confirma con cistatina C si hay duda (sarcopenia, amputación).\u003c/li>\n\u003cli>Pista de cronicidad: riñones pequeños en el USG. Excepciones con riñones grandes: DM, amiloidosis, poliquistosis, VIH.\u003c/li>\n\u003c/ul>"},{"h":"Nefroprotección","html":"\n\u003cul>\n\u003cli>\u003cb>PA\u003c/b>: KDIGO propone PAS &lt;120 si se tolera (medición estandarizada).\u003c/li>\n\u003cli>\u003cb>IECA o ARA-II\u003c/b> a dosis máxima tolerada si hay albuminuria. La creatinina puede subir hasta 30% al iniciar: es esperable; si sube más, revisa volumen, fármacos y estenosis renal.\u003c/li>\n\u003cli>\u003cb>iSGLT2\u003c/b>: en DM2 con ERC y TFG ≥20; sin DM si TFG ≥20 con albuminuria ≥200 mg/g o IC (y se sugieren con TFG 20–45 aunque la albuminuria sea menor).\u003c/li>\n\u003cli>\u003cb>Finerenona\u003c/b> (ARM no esteroideo): DM2 con albuminuria persistente pese a IECA/ARA-II, con K normal.\u003c/li>\n\u003cli>\u003cb>arGLP-1\u003c/b> (semaglutida): en DM2 con ERC, reduce progresión y eventos (FLOW).\u003c/li>\n\u003cli>\u003cb>Estatina\u003c/b> (o estatina + ezetimiba) en ≥50 años con ERC sin diálisis; no se inicia en diálisis.\u003c/li>\n\u003cli>Evita nefrotóxicos (AINE), ajusta dosis a la TFG, deja de fumar, sodio &lt;2 g/día, proteína ~0.8 g/kg/día en G3–G5 sin diálisis.\u003c/li>\n\u003c/ul>"},{"h":"Complicaciones","html":"\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>Complicación\u003c/th>\u003cth>Por qué\u003c/th>\u003cth>Qué haces\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Anemia\u003c/b> normocítica\u003c/td>\u003ctd>Menos eritropoyetina; también ferropenia e inflamación\u003c/td>\u003ctd>Primero hierro (si TSAT ≤30% y ferritina ≤500). Agente estimulante de eritropoyesis si Hb &lt;10. Meta Hb ≤11.5: normalizarla aumenta EVC y trombosis\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Mineral óseo\u003c/b>\u003c/td>\u003ctd>↓ excreción de fósforo, ↓ calcitriol, ↑ FGF-23 → hipocalcemia → \u003cb>hiperparatiroidismo secundario\u003c/b>\u003c/td>\u003ctd>Restringir fósforo, quelantes (sevelamer si hay hipercalcemia o calcificación vascular; carbonato de calcio), calcitriol o análogos, cinacalcet, paratiroidectomía\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Acidosis metabólica\u003c/b>\u003c/td>\u003ctd>No se excreta la carga ácida\u003c/td>\u003ctd>Bicarbonato oral si HCO₃ &lt;18\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Hiperkalemia\u003c/b>\u003c/td>\u003ctd>Menos excreción; IECA/ARA-II/ARM\u003c/td>\u003ctd>Dieta, suspender AINE, quelantes (patiromer, ciclosilicato de zirconio) para poder mantener el bloqueo del SRAA\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Volumen e HTA\u003c/b>\u003c/td>\u003ctd>Retención de sodio\u003c/td>\u003ctd>Restricción de sodio y diuréticos de asa\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Uremia\u003c/b>\u003c/td>\u003ctd>Toxinas no eliminadas\u003c/td>\u003ctd>Pericarditis, encefalopatía, prurito, neuropatía, sangrado por disfunción plaquetaria (desmopresina antes de procedimientos)\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>La \u003cb>enfermedad cardiovascular\u003c/b> es la principal causa de muerte en ERC.\u003c/p>"},{"h":"Fármacos y estudios a cuidar","html":"\n\u003cul>\n\u003cli>Metformina: TFG 30–44 máx 1 000 mg/día; &lt;30 suspender.\u003c/li>\n\u003cli>Evita AINE, ajusta antibióticos, gabapentina, enoxaparina, digoxina, colchicina.\u003c/li>\n\u003cli>Gadolinio: evitar con TFG &lt;30 (fibrosis sistémica nefrogénica); contraste yodado con prevención.\u003c/li>\n\u003cli>Glibenclamida: evitar (hipoglucemia prolongada).\u003c/li>\n\u003c/ul>"},{"h":"Referencia y preparación para terapia de reemplazo","html":"\n\u003cul>\n\u003cli>\u003cb>Envía a Nefrología\u003c/b> si: TFG &lt;30, albuminuria ≥300 mg/g, caída rápida de la TFG, cilindros eritrocitarios o hematuria no urológica, HTA refractaria, potasio persistentemente alterado, litiasis recurrente o causa hereditaria.\u003c/li>\n\u003cli>Con TFG &lt;30: educar sobre opciones (hemodiálisis, diálisis peritoneal, trasplante preventivo, manejo conservador).\u003c/li>\n\u003cli>\u003cb>Fístula arteriovenosa\u003c/b> (acceso de elección) meses antes de necesitar diálisis; protege las venas del brazo no dominante (sin venopunciones ni catéteres).\u003c/li>\n\u003cli>La diálisis se inicia por síntomas o complicaciones (uremia, volumen, potasio, acidosis, desnutrición), no por una cifra aislada de TFG (estudio IDEAL).\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"Las 4 llaves de la nefroprotección","d":"Controlar la PA, IECA o ARA-II si hay albuminuria, iSGLT2 con TFG ≥20 y finerenona si es DM2 con albuminuria. Encima: estatina, sin AINE y dosis ajustadas."},"pearl":"Que la creatinina suba hasta 30% al iniciar un IECA o ARA-II no es motivo para suspenderlo: es el efecto hemodinámico esperado.","trap":"Dar eritropoyetina a un paciente con ERC y ferropenia sin reponer hierro primero, o buscar una Hb de 13: aumenta los EVC y las trombosis sin beneficio.","guide":["Meta de PA en ERC: KDIGO 2021 propone PAS \u003c120 si se tolera; la ESC 2024 y la AHA/ACC 2025 usan metas de 120–129 o \u003c130/80. ⚠️ Pregunta cuál usa tu profesor.","iSGLT2 sin diabetes: KDIGO 2024 los recomienda con TFG ≥20 y albuminuria ≥200 mg/g o IC, y los sugiere con TFG 20–45 aunque la albuminuria sea menor."],"refs":["KDIGO 2024 Clinical Practice Guideline for the Evaluation and Management of Chronic Kidney Disease. Kidney Int 2024.","KDIGO 2022 Diabetes in CKD; KDIGO 2021 Blood Pressure in CKD; KDIGO 2012 Anemia in CKD; KDIGO 2017 CKD-MBD."]},"glomerulo":{"hook":"Primero decide el patrón (nefrótico o nefrítico); luego la edad, el complemento y dónde están los depósitos te dan el nombre.","anim":"glomerulo","compare":["nefrotico-nefritico"],"nn":[["nephrotic-syndrome","Nephrotic Syndrome"],["nephritic-syndrome","Nephritic Syndrome"]],"yt":"nephrotic nephritic syndrome","sections":[{"h":"Dos patrones","html":"\n\u003cul>\n\u003cli>\u003cb>Nefrótico\u003c/b>: proteinuria &gt;3.5 g/24 h (cociente proteína/creatinina &gt;3–3.5 g/g), albúmina &lt;3 g/dL, edema, hiperlipidemia y lipiduria (cuerpos ovales grasos con “cruz de Malta”). La lesión está en el podocito o la membrana basal.\u003c/li>\n\u003cli>\u003cb>Nefrítico\u003c/b>: hematuria con eritrocitos dismórficos y \u003cb>cilindros eritrocitarios\u003c/b>, HTA, oliguria, edema, LRA y proteinuria &lt;3.5 g. Hay inflamación.\u003c/li>\n\u003cli>\u003cb>Complicaciones del nefrótico\u003c/b>: trombosis (pérdida de antitrombina III; trombosis de vena renal, sobre todo en membranosa), infecciones (pérdida de IgG; peritonitis por neumococo), hiperlipidemia, LRA, pérdida de proteína transportadora de vitamina D y de TBG.\u003c/li>\n\u003c/ul>"},{"h":"Causas de síndrome nefrótico","html":"\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>Enfermedad\u003c/th>\u003cth>Pistas\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Cambios mínimos\u003c/b>\u003c/td>\u003ctd>La más común en niños. IF negativa, microscopía de luz normal, fusión de pedicelos en microscopía electrónica. Asociada a AINE y linfoma de Hodgkin. Responde a esteroides\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Nefropatía membranosa\u003c/b>\u003c/td>\u003ctd>Adultos. Anti-PLA2R positivo en ~70–80% de las primarias. Depósitos subepiteliales con “espigas”. Secundaria a cáncer sólido, LES (clase V), VHB, fármacos. Mayor riesgo de trombosis\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>GEFS\u003c/b> (glomeruloesclerosis focal y segmentaria)\u003c/td>\u003ctd>Adultos; frecuente en población afrodescendiente e hispana. Secundaria a VIH (variante colapsante), heroína, obesidad, nefronas reducidas, variantes de APOL1\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Nefropatía diabética\u003c/b>\u003c/td>\u003ctd>Causa secundaria más frecuente. Expansión mesangial, nódulos de Kimmelstiel-Wilson. Primer signo: albuminuria\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Amiloidosis\u003c/b>\u003c/td>\u003ctd>Mieloma (AL) o inflamación crónica (AA). Rojo Congo con birrefringencia verde manzana. Macroglosia, hepatomegalia, cardiomiopatía\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>"},{"h":"Causas de síndrome nefrítico","html":"\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>Enfermedad\u003c/th>\u003cth>Pistas\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>GN postinfecciosa\u003c/b> (postestreptocócica)\u003c/td>\u003ctd>1–3 semanas después de faringitis o 3–6 después de piodermitis. ASLO o anti-DNasa B, \u003cb>C3 bajo\u003c/b>. “Jorobas” subepiteliales. Niños; soporte (diurético, antihipertensivo)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Nefropatía por IgA\u003c/b>\u003c/td>\u003ctd>La GN primaria más común del mundo. Hematuria macroscópica 1–2 días después de una infección respiratoria (sinfaringítica). \u003cb>C3 normal\u003c/b>. Depósitos mesangiales de IgA\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Vasculitis por IgA\u003c/b> (Henoch-Schönlein)\u003c/td>\u003ctd>Púrpura palpable en piernas, artralgias, dolor abdominal y nefritis\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Nefritis lúpica\u003c/b>\u003c/td>\u003ctd>LES con \u003cb>C3 y C4 bajos\u003c/b>, anti-dsDNA alto. Clase IV (difusa) es la más frecuente y grave. Depósitos subendoteliales (“asas de alambre”)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Membranoproliferativa\u003c/b>\u003c/td>\u003ctd>C3 bajo, “doble contorno” de la membrana basal; VHC con crioglobulinemia (C4 bajo, púrpura)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>GN rápidamente progresiva\u003c/b> (semilunas)\u003c/td>\u003ctd>Tipo I anti-MBG (IF lineal; con hemoptisis = Goodpasture). Tipo II por inmunocomplejos (IF granular: LES, IgA, postinfecciosa). Tipo III pauciinmune (ANCA: granulomatosis con poliangeítis c-ANCA/PR3; poliangeítis microscópica p-ANCA/MPO; EGPA con asma y eosinofilia)\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>"},{"h":"Complemento y depósitos","html":"\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>Complemento bajo\u003c/th>\u003cth>Complemento normal\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Postinfecciosa (C3), lúpica (C3 y C4), membranoproliferativa (C3), crioglobulinemia (C4), endocarditis\u003c/td>\u003ctd>IgA, anti-MBG, ANCA, cambios mínimos, membranosa, GEFS\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>Dónde está el depósito\u003c/th>\u003cth>Enfermedad\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Subepitelial\u003c/td>\u003ctd>Postinfecciosa (jorobas), membranosa (espigas)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Subendotelial\u003c/td>\u003ctd>Lúpica (asas de alambre), membranoproliferativa tipo I\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Mesangial\u003c/td>\u003ctd>IgA\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Lineal en la membrana basal\u003c/td>\u003ctd>Anti-MBG\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Sin depósitos (pauciinmune)\u003c/td>\u003ctd>ANCA\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>"},{"h":"Abordaje y tratamiento","html":"\n\u003cul>\n\u003cli>\u003cb>Estudios\u003c/b>: EGO con sedimento, cociente proteína/creatinina, creatinina, complemento C3/C4, ANA y anti-dsDNA, ANCA, anti-MBG, ASLO, VHB, VHC, VIH, anti-PLA2R; en &gt;50 años electroforesis y cadenas ligeras libres.\u003c/li>\n\u003cli>\u003cb>Biopsia renal\u003c/b>: adulto con nefrótico (puede omitirse en membranosa anti-PLA2R+ con TFG normal), todo nefrítico rápidamente progresivo (urgente) y LES con afección renal. Los niños con nefrótico típico reciben esteroides sin biopsia.\u003c/li>\n\u003cli>\u003cb>Soporte\u003c/b>: IECA o ARA-II para la proteinuria, diurético de asa, restricción de sodio, estatina; anticoagulación en membranosa con albúmina muy baja (&lt;2–2.5 g/dL) y bajo riesgo de sangrado.\u003c/li>\n\u003cli>\u003cb>Específico\u003c/b>: cambios mínimos → prednisona; membranosa → según riesgo, rituximab; GNRP por ANCA → pulsos de metilprednisolona + rituximab o ciclofosfamida; anti-MBG → recambio plasmático + esteroides + ciclofosfamida; lúpica III/IV → esteroides + micofenolato o ciclofosfamida (± belimumab o voclosporina); IgA → IECA/ARA-II, iSGLT2; postestreptocócica → soporte.\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"Complemento bajo: “PoLiMeroS”","d":"Postinfecciosa, Lupus, Membranoproliferativa (y crioglobulinemia). IgA, anti-MBG y ANCA tienen complemento normal."},"pearl":"Hematuria a los 1–2 días de una faringitis = IgA (C3 normal). Hematuria a las 2–3 semanas = postestreptocócica (C3 bajo).","trap":"Un adulto con hemoptisis y GN rápidamente progresiva no puede esperar resultados: recambio plasmático y pulsos de esteroides en cuanto se sospecha (anti-MBG o ANCA), y biopsia urgente.","guide":["Biopsia en membranosa: KDIGO 2021 acepta no biopsiar a un adulto con nefrótico, anti-PLA2R positivo y TFG normal. Muchos profesores siguen enseñando “biopsia a todo nefrótico adulto”. ⚠️ Pregunta cuál prefieren en el examen."],"refs":["KDIGO 2021 Clinical Practice Guideline for the Management of Glomerular Diseases. Kidney Int 2021.","KDIGO 2024 Lupus Nephritis y ANCA-associated vasculitis guidelines."]},"anemias":{"hook":"Dos números ordenan todo: el VCM (micro, normo o macrocítica) y los reticulocitos (¿la médula produce o no?). Después, la ferritina y la B12 hacen el resto.","compare":["ferro-inflam","b12-folato"],"nn":[["microcytic-anemia","Microcytic Anemia"],["macrocytic-anemia","Macrocytic Anemia"],["cbc-approach-to-anemia","CBC: Approach to Anemia"]],"yt":"anemia microcytic macrocytic","sections":[{"h":"Abordaje","html":"\n\u003cul>\n\u003cli>\u003

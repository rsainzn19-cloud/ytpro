en rodilla o cadera: alivio de semanas.\u003c/li>\n\u003cli>Paracetamol: efecto mínimo; duloxetina y tramadol: recomendación condicional.\u003c/li>\n\u003cli>\u003cb>No recomendados\u003c/b> (ACR 2019): glucosamina y condroitina, ácido hialurónico en rodilla, opioides fuertes de forma crónica, bisfosfonatos, hidroxicloroquina.\u003c/li>\n\u003cli>Falla del tratamiento con dolor y limitación importantes: \u003cb>artroplastia\u003c/b>.\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"Heberden arriba, Bouchard en medio","d":"H de Heberden = la articulación más Hacia la punta (IFD). B de Bouchard = la del medio (IFP)."},"pearl":"Hay que bajar de peso: cada kilo menos quita unos 4 kg de carga a la rodilla en cada paso.","trap":"OA en MCF, muñeca u hombro: busca pirofosfato de calcio (condrocalcinosis) o hemocromatosis (ferritina y saturación de transferrina).","guide":["Ácido hialurónico intraarticular: la ACR 2019 recomienda en contra en rodilla; ESCEO y otras guías europeas lo aceptan en casos seleccionados. Para el examen, sigue la ACR/OARSI que pida tu curso.","Glucosamina y condroitina: ACR 2019 recomienda fuertemente en contra; ESCEO acepta formulaciones de sulfato de glucosamina cristalino de prescripción."],"refs":["Kolasinski SL, et al. 2019 ACR/Arthritis Foundation Guideline for the Management of Osteoarthritis of the Hand, Hip, and Knee. Arthritis Rheumatol 2020.","Bannuru RR, et al. OARSI guidelines for the non-surgical management of knee, hip, and polyarticular OA. Osteoarthritis Cartilage 2019.","NICE NG226: Osteoarthritis in over 16s, 2022."]},"mitral":{"hook":"Estenosis mitral: fiebre reumática, aurícula grande y fibrilación auricular. Insuficiencia mitral: primero define si es primaria (la válvula) o secundaria (el ventrículo), porque el tratamiento cambia.","compare":["em-im"],"nn":[["valvular-heart-diseases-overview","Valvular Heart Diseases"]],"yt":"mitral stenosis mitral regurgitation","sections":[{"h":"Estenosis mitral","html":"\n\u003cul>\n\u003cli>Causa principal: \u003cb>fiebre reumática\u003c/b> (aún frecuente en México); más en mujeres. En adultos mayores: calcificación del anillo.\u003c/li>\n\u003cli>Fisiopatología: ↑ presión en aurícula izquierda → congestión pulmonar, \u003cb>fibrilación auricular\u003c/b>, embolia, hipertensión pulmonar.\u003c/li>\n\u003cli>Clínica: disnea (empeora con taquicardia, embarazo o FA), hemoptisis, ronquera (compresión del laríngeo recurrente: síndrome de Ortner), embolia sistémica.\u003c/li>\n\u003cli>Exploración: \u003cb>R1 intenso\u003c/b>, \u003cb>chasquido de apertura\u003c/b>, \u003cb>retumbo diastólico\u003c/b> en el ápex en decúbito lateral izquierdo, con refuerzo presistólico (desaparece en FA). Más grave cuanto más corto el intervalo R2–chasquido.\u003c/li>\n\u003cli>Gravedad (eco): área valvular \u003cb>≤1.5 cm²\u003c/b> = significativa; ≤1.0 cm² = muy grave.\u003c/li>\n\u003cli>Tratamiento: diuréticos, control de la FC (betabloqueador). \u003cb>Anticoagulación con warfarina\u003c/b> si hay FA, embolia previa o trombo en la aurícula (los ACOD no se usan en estenosis mitral reumática moderada-grave).\u003c/li>\n\u003cli>Intervención en estenosis significativa sintomática: \u003cb>comisurotomía mitral percutánea\u003c/b> (valvuloplastia con balón) si la anatomía es favorable (Wilkins ≤8), sin trombo en la aurícula y sin insuficiencia mitral más que leve. Si no: cirugía.\u003c/li>\n\u003c/ul>"},{"h":"Insuficiencia mitral","html":"\n\u003cul>\n\u003cli>\u003cb>Primaria\u003c/b> (la válvula está dañada): prolapso o rotura de cuerdas (degenerativa), endocarditis, reumática.\u003c/li>\n\u003cli>\u003cb>Secundaria o funcional\u003c/b> (válvula normal, ventrículo o aurícula dilatados): miocardiopatía isquémica o dilatada, FA de larga evolución.\u003c/li>\n\u003cli>Clínica: \u003cb>soplo holosistólico apical irradiado a la axila\u003c/b>, R3, desplazamiento del ápex.\u003c/li>\n\u003cli>\u003cb>Aguda\u003c/b>: rotura de músculo papilar (posteromedial, tras IAM inferior, días 3–5), rotura de cuerdas o endocarditis → edema pulmonar súbito y choque, con soplo a veces breve o ausente → cirugía urgente.\u003c/li>\n\u003cli>Grave (eco): orificio regurgitante ≥40 mm², volumen regurgitante ≥60 mL, fracción regurgitante ≥50%.\u003c/li>\n\u003c/ul>"},{"h":"Cuándo intervenir en IM","html":"\n\u003cul>\n\u003cli>\u003cb>Primaria grave\u003c/b>: cirugía si hay \u003cb>síntomas\u003c/b>, o sin síntomas con \u003cb>FEVI ≤60%\u003c/b> o \u003cb>diámetro telesistólico ≥40 mm\u003c/b>. Considerarla con FA nueva o PSAP &gt;50 mmHg.\u003c/li>\n\u003cli>Se prefiere \u003cb>reparar\u003c/b> la válvula sobre reemplazarla.\u003c/li>\n\u003cli>Alto riesgo quirúrgico: reparación transcatéter borde a borde (TEER).\u003c/li>\n\u003cli>\u003cb>Secundaria\u003c/b>: primero tratamiento óptimo de la insuficiencia cardiaca (incluye resincronización si está indicada). Si persisten los síntomas con anatomía adecuada: TEER (COAPT).\u003c/li>\n\u003cli>\u003cb>Prolapso mitral\u003c/b>: clic mesosistólico ± soplo tardío. Con Valsalva o al ponerse de pie (menos precarga) el clic se adelanta y el soplo se alarga.\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"Estenosis mitral = “Chasquido y Retumbo”","d":"Chasquido de apertura y Retumbo diastólico. Cuanto más pegado está el chasquido al R2, más estrecha la válvula."},"pearl":"Embarazada con estenosis mitral que se descompensa en el segundo trimestre: el aumento del volumen y de la FC acorta la diástole. Betabloqueador y, si no basta, valvuloplastia con balón.","trap":"Estenosis mitral reumática con FA: el anticoagulante es warfarina, no apixabán ni rivaroxabán (INVICTUS mostró más eventos con rivaroxabán).","guide":["Umbrales para operar IM primaria asintomática: ACC/AHA 2020 usa FEVI ≤60% o DTSVI ≥40 mm. La ESC/EACTS 2025 mantiene FEVI ≤60% y considera índices ajustados por superficie corporal; confirma la cifra que use tu curso.","Área para estenosis mitral significativa: ESC/EACTS usa ≤1.5 cm²; ACC/AHA 2020 define “grave” como ≤1.5 cm² y “muy grave” ≤1.0 cm²."],"refs":["Otto CM, et al. 2020 ACC/AHA Guideline for the Management of Valvular Heart Disease. Circulation 2021.","Praz F, et al. 2025 ESC/EACTS Guidelines for the management of valvular heart disease. Eur Heart J 2025.","Connolly SJ, et al. INVICTUS. N Engl J Med 2022.","Stone GW, et al. COAPT. N Engl J Med 2018."]},"linfo":{"hook":"Adenopatía que no se va: biopsia escisional. Distingue Hodgkin de no Hodgkin, reconoce los linfomas por su translocación y sabe cuándo tratar (y cuándo no) la LLC.","nn":[["hodgkins-lymphoma","Hodgkin Lymphoma"],["non-hodgkins-lymphoma","Non-Hodgkin Lymphoma"],["chronic-lymphocytic-leukemia","Chronic Lymphocytic Leukemia"]],"yt":"Hodgkin non-Hodgkin lymphoma CLL","sections":[{"h":"Abordaje","html":"\n\u003cul>\n\u003cli>Adenopatía sospechosa: &gt;2 cm, dura, no dolorosa, &gt;4–6 semanas, supraclavicular, con síntomas B.\u003c/li>\n\u003cli>\u003cb>Síntomas B\u003c/b>: fiebre &gt;38 °C, diaforesis nocturna, pérdida &gt;10% del peso en 6 meses.\u003c/li>\n\u003cli>Diagnóstico: \u003cb>biopsia escisional\u003c/b> del ganglio (la aspiración con aguja fina no basta: se pierde la arquitectura).\u003c/li>\n\u003cli>Estadificación de \u003cb>Lugano\u003c/b> con PET-CT: I (una región), II (≥2 del mismo lado del diafragma), III (ambos lados), IV (afección extraganglionar difusa: médula, hígado, pulmón).\u003c/li>\n\u003c/ul>"},{"h":"Linfoma de Hodgkin","html":"\n\u003cul>\n\u003cli>Distribución bimodal (20–30 y &gt;55 años). Adenopatía \u003cb>cervical o mediastinal\u003c/b> que se extiende de forma \u003cb>contigua\u003c/b>.\u003c/li>\n\u003cli>Células de \u003cb>Reed-Sternberg\u003c/b> (CD15+, CD30+) en un fondo inflamatorio. Asociado a virus de Epstein-Barr.\u003c/li>\n\u003cli>Subtipo más común: esclerosis nodular. Datos curiosos: prurito y dolor ganglionar con el alcohol.\u003c/li>\n\u003cli>Tratamiento: \u003cb>ABVD\u003c/b> (± radioterapia en estadios limitados); en avanzados, brentuximab vedotina + AVD. Curación &gt;80%.\u003c/li>\n\u003cli>Efectos tardíos: segundas neoplasias (mama tras radioterapia de tórax), cardiotoxicidad (antraciclina), fibrosis pulmonar (bleomicina), hipotiroidismo.\u003c/li>\n\u003c/ul>"},{"h":"Linfomas no Hodgkin","html":"\n\u003cul>\n\u003cli>Más frecuentes que el Hodgkin, en adultos mayores, diseminación \u003cb>no contigua\u003c/b> y extraganglionar.\u003c/li>\n\u003cli>\u003cb>Difuso de células B grandes\u003c/b> (el más común): agresivo, masa de crecimiento rápido. Tratamiento: R-CHOP (o pola-R-CHP). Pronóstico con IPI.\u003c/li>\n\u003cli>\u003cb>Folicular\u003c/b>: indolente, \u003cb>t(14;18) BCL2\u003c/b>. Asintomático y con baja carga: “vigilar y esperar”. Si hay síntomas: rituximab ± quimioterapia. Puede transformarse en agresivo.\u003c/li>\n\u003cli>\u003cb>Burkitt\u003c/b>: \u003cb>t(8;14) MYC\u003c/b>, “cielo estrellado”, crecimiento rapidísimo; alto riesgo de lisis tumoral.\u003c/li>\n\u003cli>\u003cb>Manto\u003c/b>: t(11;14) ciclina D1. \u003cb>MALT gástrico\u003c/b>: asociado a H. pylori → la erradicación puede curarlo.\u003c/li>\n\u003cli>Infecciones asociadas: VIH, VEB, VHC (linfoma esplénico de zona marginal), HTLV-1 (linfoma T del adulto).\u003c/li>\n\u003c/ul>"},{"h":"Leucemia linfocítica crónica","html":"\n\u003cul>\n\u003cli>La leucemia más común en adultos de países occidentales; mediana ~70 años.\u003c/li>\n\u003cli>Diagnóstico: \u003cb>≥5,000 linfocitos B monoclonales/µL\u003c/b>; frotis con \u003cb>células en mancha\u003c/b> (smudge); citometría: CD5+, CD19+, CD23+, CD20 débil.\u003c/li>\n\u003cli>Estadios de Rai (0–IV) o Binet (A–C); IV/C = anemia o trombocitopenia por infiltración medular.\u003c/li>\n\u003cli>\u003cb>Se trata solo si hay enfermedad activa\u003c/b>: síntomas B, citopenias progresivas, adenopatías o bazo masivos o que crecen, duplicación de linfocitos en &lt;6 meses.\u003c/li>\n\u003cli>Tratamiento: inhibidores de BTK (ibrutinib, acalabrutinib, zanubrutinib) o venetoclax + obinutuzumab. Con del(17p) o TP53 mutado no se usa quimioinmunoterapia.\u003c/li>\n\u003cli>Complicaciones: \u003cb>AHAI caliente\u003c/b>, PTI, hipogammaglobulinemia (infecciones), transformación de Richter a linfoma agresivo.\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"Translocaciones: “14 con 18 Folicular, 8 con 14 Burkitt, 11 con 14 Manto”","d":"Folicular = BCL2 (bloquea la muerte celular, crece lento). Burkitt = MYC (acelera, crece rapidísimo). Manto = ciclina D1."},"pearl":"LLC en estadio temprano sin síntomas: no se trata. Tratar antes no mejora la supervivencia.","trap":"No diagnostiques linfoma con aspiración con aguja fina: necesitas la arquitectura del ganglio (biopsia escisional o con aguja gruesa).","guide":["LDCBG: pola-R-CHP (POLARIX 2022) mejoró la supervivencia libre de progresión frente a R-CHOP en riesgo intermedio-alto; R-CHOP sigue siendo el estándar en muchos centros y libros.","Hodgkin avanzado: brentuximab + AVD (ECHELON-1) o nivolumab + AVD (S1826, 2024) son opciones nuevas; ABVD sigue en el examen como esquema clásico."],"refs":["Cheson BD, et al. Lugano classification. J Clin Oncol 2014.","Hallek M, et al. iwCLL guidelines for diagnosis, indications for treatment, response assessment, and supportive management of CLL. Blood 2018.","Alaggio R, et al. WHO Classification of Haematolymphoid Tumours, 5th ed: Lymphoid Neoplasms. Leukemia 2022."]},"hipofisis":{"hook":"Un adenoma hipofisario da problemas de dos formas: por lo que secreta y por lo que comprime. Sabe qué pedir ante un incidentaloma y el tratamiento de cada tumor funcionante.","nn":[["pituitary-disorders","Pituitary Disorders"],["cushings-syndrome","Cushing's Syndrome"]],"yt":"pituitary adenoma prolactinoma acromegaly","sections":[{"h":"Masa y efecto de masa","html":"\n\u003cul>\n\u003cli>\u003cb>Microadenoma\u003c/b> &lt;1 cm; \u003cb>macroadenoma\u003c/b> ≥1 cm.\u003c/li>\n\u003cli>Efecto de masa: cefalea, \u003cb>hemianopsia bitemporal\u003c/b> (compresión del quiasma), parálisis de pares III, IV y VI (seno cavernoso).\u003c/li>\n\u003cli>\u003cb>Hipopituitarismo\u003c/b>: se pierden en orden GH → LH/FSH → TSH → ACTH. El déficit de ACTH es el más peligroso.\u003c/li>\n\u003cli>No funcionante: el macroadenoma más común; se presenta por efecto de masa. Tratamiento: cirugía transesfenoidal si comprime.\u003c/li>\n\u003cli>\u003cb>Apoplejía hipofisaria\u003c/b>: hemorragia o infarto del adenoma. Cefalea súbita intensa, oftalmoplejía, pérdida visual, hipotensión → \u003cb>hidrocortisona IV de inmediato\u003c/b>, RM, neurocirugía si hay deterioro visual.\u003c/li>\n\u003cli>\u003cb>Incidentaloma\u003c/b>: pide a todos PRL, IGF-1 y tamizaje de Cushing (y función hipofisaria y campimetría si es macroadenoma).\u003c/li>\n\u003c/ul>"},{"h":"Prolactinoma","html":"\n\u003cul>\n\u003cli>El adenoma funcionante \u003cb>más común\u003c/b>.\u003c/li>\n\u003cli>Mujer: galactorrea, amenorrea, infertilidad (microadenoma). Hombre: hipogonadismo, disfunción eréctil; suele llegar como macroadenoma.\u003c/li>\n\u003cli>Prolactina &gt;250 ng/mL casi siempre es prolactinoma; 25–100 puede ser por otra causa.\u003c/li>\n\u003cli>\u003cb>Descarta antes\u003c/b>: embarazo, hipotiroidismo primario (la TRH estimula la PRL), fármacos (antipsicóticos, metoclopramida, verapamilo, ISRS), ERC, compresión del tallo por otra masa (PRL generalmente &lt;100–150), macroprolactina.\u003c/li>\n\u003cli>\u003cb>Efecto gancho\u003c/b>: macroadenoma gigante con PRL falsamente normal o poco elevada → pedir dilución.\u003c/li>\n\u003cli>Tratamiento: \u003cb>agonista dopaminérgico\u003c/b> (\u003cb>cabergolina\u003c/b> &gt; bromocriptina), incluso con macroadenoma y alteración visual. Cirugía si no tolera o no responde.\u003c/li>\n\u003c/ul>"},{"h":"Acromegalia","html":"\n\u003cul>\n\u003cli>Exceso de GH en el adulto: crecimiento de manos y pies (anillos y zapatos), prognatismo, macroglosia, separación dental, piel gruesa y sudorosa, apnea del sueño, túnel del carpo.\u003c/li>\n\u003cli>Comorbilidades: DM, HTA, miocardiopatía, pólipos de colon (colonoscopia), artropatía.\u003c/li>\n\u003cli>Tamizaje: \u003cb>IGF-1\u003c/b>. Confirmación: GH no se suprime (&lt;1 ng/mL) tras 75 g de glucosa oral. Luego RM.\u003c/li>\n\u003cli>Tratamiento: \u003cb>cirugía transesfenoidal\u003c/b>. Si persiste: análogos de somatostatina (octreotida, lanreotida), pegvisomant (antagonista del receptor de GH; se vigila con IGF-1), radioterapia.\u003c/li>\n\u003c/ul>"},{"h":"Enfermedad de Cushing","html":"\n\u003cul>\n\u003cli>Adenoma productor de ACTH: la causa más común de Cushing endógeno.\u003c/li>\n\u003cli>Tamizaje (2 pruebas positivas): cortisol libre en orina de 24 h, cortisol salival nocturno, supresión con 1 mg de dexametasona (cortisol &gt;1.8 µg/dL = no suprime).\u003c/li>\n\u003cli>ACTH normal o alta = dependiente de ACTH → RM de hipófisis. Si la RM no es concluyente: cateterismo de senos petrosos inferiores.\u003c/li>\n\u003cli>Tratamiento: cirugía transesfenoidal; si falla, fármacos (ketoconazol, metirapona, osilodrostat, pasireotida) o suprarrenalectomía bilateral.\u003c/li>\n\u003cli>Tras la cirugía: \u003cb>deficiencia de arginina vasopresina\u003c/b> (antes diabetes insípida central) transitoria o SIADH (patrón trifásico).\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"Se va en orden: “Go Look For The Adenoma”","d":"GH, LH, FSH, TSH, ACTH: el orden típico en que se pierden las hormonas cuando un adenoma comprime la hipófisis."},"pearl":"Antes de dar levotiroxina en hipopituitarismo, revisa y repón el cortisol: si no, puedes precipitar una crisis suprarrenal.","trap":"Hiperprolactinemia moderada + TSH alta: es hipotiroidismo primario. Trata el tiroides antes de pensar en prolactinoma.","guide":["Nombre: desde 2022 se recomienda “deficiencia de arginina vasopresina (AVP-D)” en lugar de “diabetes insípida central”. Tu examen puede usar cualquiera de los dos.","Supresión de GH tras glucosa: el punto de corte clásico es \u003c1 ng/mL; con ensayos ultrasensibles algunos consensos usan \u003c0.4 ng/mL."],"refs":["Melmed S, et al. Diagnosis and treatment of hyperprolactinemia: Endocrine Society Guideline. J Clin Endocrinol Metab 2011.","Giustina A, et al. Consensus on criteria for acromegaly diagnosis and remission. Pituitary 2024.","Fleseriu M, et al. Consensus on diagnosis and management of Cushing's disease: a guideline update. Lancet Diabetes Endocrinol 2021.","Freda PU, et al. Pituitary incidentaloma: Endocrine Society Guideline. J Clin Endocrinol Metab 2011."]},"hp":{"hook":"La hipertensión pulmonar se sospecha con el eco, pero se confirma con cateterismo derecho. Clasifícala en uno de 5 grupos: el tratamiento depende del grupo.","nn":[["pulmonary-hypertension","Pulmonary Hypertension"]],"yt":"pulmonary hypertension","sections":[{"h":"Definición (ESC/ERS 2022)","html":"\n\u003cul>\n\u003cli>\u003cb>Presión arterial pulmonar media &gt;20 mmHg\u003c/b> en reposo, medida por \u003cb>cateterismo cardiaco derecho\u003c/b>.\u003c/li>\n\u003cli>\u003cb>Precapilar\u003c/b>: presión de enclavamiento (PAWP) ≤15 mmHg y resistencia vascular pulmonar &gt;2 unidades Wood.\u003c/li>\n\u003cli>\u003cb>Poscapilar\u003c/b> (cardiopatía izquierda): PAWP &gt;15 mmHg; aislada si RVP ≤2, combinada si &gt;2.\u003c/li>\n\u003c/ul>"},{"h":"Los 5 grupos","html":"\n\u003cul>\n\u003cli>\u003cb>Grupo 1 – Hipertensión arterial pulmonar (HAP)\u003c/b>: idiopática, hereditaria (BMPR2), fármacos y tóxicos (anorexígenos, metanfetaminas, dasatinib), enfermedades del tejido conectivo (\u003cb>esclerosis sistémica\u003c/b>), VIH, hipertensión portal (portopulmonar), cardiopatías congénitas, esquistosomiasis.\u003c/li>\n\u003cli>\u003cb>Grupo 2 – Cardiopatía izquierda\u003c/b>: IC con FE reducida o preservada, valvulopatías. \u003cb>La causa más común.\u003c/b>\u003c/li>\n\u003cli>\u003cb>Grupo 3 – Enfermedad pulmonar o hipoxia\u003c/b>: EPOC, enfermedad pulmonar intersticial, apnea del sueño, altitud.\u003c/li>\n\u003cli>\u003cb>Grupo 4 – Obstrucción de arterias pulmonares\u003c/b>: hipertensión pulmonar tromboembólica crónica (HPTEC).\u003c/li>\n\u003cli>\u003cb>Grupo 5 – Mecanismos multifactoriales\u003c/b>: sarcoidosis, anemias hemolíticas crónicas, ERC en diálisis, neoplasias mieloproliferativas.\u003c/li>\n\u003c/ul>"},{"h":"Clínica y abordaje","html":"\n\u003cul>\n\u003cli>Disnea de esfuerzo progresiva, fatiga, síncope de esfuerzo, angina; luego datos de falla derecha (ingurgitación yugular, edema, hepatomegalia, ascitis).\u003c/li>\n\u003cli>Exploración: \u003cb>R2 pulmonar intenso\u003c/b>, soplo de insuficiencia tricuspídea, levantamiento paraesternal.\u003c/li>\n\u003cli>ECG: hipertrofia del VD, eje a la derecha. Rx: arterias pulmonares prominentes.\u003c/li>\n\u003cli>\u003cb>Ecocardiograma\u003c/b>: primer estudio; estima la probabilidad (velocidad de regurgitación tricuspídea &gt;2.8 m/s y signos del VD).\u003c/li>\n\u003cli>Busca primero los grupos 2 y 3 (eco, pruebas de función pulmonar, TC de tórax, oximetría nocturna).\u003c/li>\n\u003cli>\u003cb>Gammagrama V/Q\u003c/b> para descartar HPTEC: es más sensible que la angio-TC para tamizaje.\u003c/li>\n\u003cli>\u003cb>Cateterismo derecho\u003c/b> para confirmar y clasificar. En HAP idiopática, hereditaria o por fármacos: \u003cb>prueba de vasorreactividad\u003c/b> (óxido nítrico inhalado).\u003c/li>\n\u003c/ul>"},{"h":"Tratamiento por grupo","html":"\n\u003cul>\n\u003cli>\u003cb>Grupo 1\u003c/b>: según riesgo. Bajo-intermedio: \u003cb>terapia combinada inicial\u003c/b> con antagonista de receptores de endotelina (ambrisentán, macitentán, bosentán) + inhibidor de PDE5 (sildenafil, tadalafil). Alto riesgo: agregar prostaciclina IV o SC (epoprostenol, treprostinil). Otras: selexipag, riociguat (no combinar con PDE5i), sotatercept.\u003c/li>\n\u003cli>Respondedores a vasorreactividad (~10% de HAP idiopática): \u003cb>calcioantagonistas en dosis altas\u003c/b>. Si no responden, los calcioantagonistas están contraindicados.\u003c/li>\n\u003cli>\u003cb>Grupo 2\u003c/b>: tratar la cardiopatía izquierda. No usar vasodilatadores de HAP.\u003c/li>\n\u003cli>\u003cb>Grupo 3\u003c/b>: tratar la enfermedad pulmonar + \u003cb>oxígeno\u003c/b> si hay hipoxemia. Treprostinil inhalado en enfermedad intersticial seleccionada.\u003c/li>\n\u003cli>\u003cb>Grupo 4\u003c/b>: \u003cb>anticoagulación de por vida\u003c/b> + \u003cb>endarterectomía pulmonar\u003c/b> (potencialmente curativa); si no es operable: angioplastia con balón o riociguat.\u003c/li>\n\u003cli>General: diuréticos, oxígeno si PaO2 &lt;60, ejercicio supervisado, vacunas, evitar el embarazo (mortalidad materna alta). Trasplante pulmonar en casos refractarios.\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"“Arteria, Corazón, Pulmón, Coágulo, Otros”","d":"Grupo 1 arterial (HAP), 2 corazón izquierdo, 3 pulmón e hipoxia, 4 coágulos crónicos (HPTEC), 5 multifactorial."},"pearl":"Paciente con esclerosis sistémica: tamizaje anual de HAP con eco, pruebas de función pulmonar (DLCO) y NT-proBNP. Es la principal causa de muerte en esclerosis limitada.","trap":"Sildenafil en hipertensión pulmonar por IC izquierda (grupo 2): no está indicado y puede causar edema pulmonar.","guide":["Umbral diagnóstico: la ESC/ERS 2022 bajó la PAPm de ≥25 a >20 mmHg y la RVP de >3 a >2 UW. Muchos libros todavía dicen ≥25 mmHg.","Sotatercept (inhibidor de la señalización de activina) fue aprobado en 2024 para HAP; puede no estar en tu bibliografía."],"refs":["Humbert M, et al. 2022 ESC/ERS Guidelines for the diagnosis and treatment of pulmonary hypertension. Eur Heart J 2022.","Hoeper MM, et al. Sotatercept for PAH (STELLAR). N Engl J Med 2023."]},"deglucion":{"hook":"Tres preguntas resuelven casi toda disfagia: ¿cuesta iniciar el trago o se atora abajo?, ¿solo sólidos o sólidos y líquidos?, ¿progresiva o intermitente?","nn":[["dysphagia","Dysphagia"],["esophageal-motility-disorders","Esophageal Motility Disorders"]],"yt":"dysphagia achalasia","sections":[{"h":"Orofaríngea vs esofágica","html":"\n\u003cul>\n\u003cli>\u003cb>Orofaríngea\u003c/b>: dificultad para \u003cb>iniciar\u003c/b> el trago, tos o atragantamiento, regurgitación nasal, voz húmeda. Causas neurológicas (EVC, Parkinson, ELA, miastenia) y estructurales (divertículo de Zenker). Estudio: videofluoroscopia.\u003c/li>\n\u003cli>\u003cb>Divertículo de Zenker\u003c/b>: adulto mayor, halitosis, regurgitación de comida sin digerir, ruido al tragar. Diagnóstico con esofagograma con bario. Tratamiento: miotomía cricofaríngea (endoscópica o quirúrgica).\u003c/li>\n\u003cli>\u003cb>Esofágica\u003c/b>: sensación de comida “atorada” detrás del esternón segundos después de tragar.\u003c/li>\n\u003c/ul>"},{"h":"Esofágica: el algoritmo","html":"\n\u003cul>\n\u003cli>\u003cb>Solo sólidos\u003c/b> → \u003cb>obstrucción mecánica\u003c/b>:\n  \u003cul>\n  \u003cli>\u003cb>Progresiva + pérdida de peso + &gt;50 años\u003c/b> → \u003cb>cáncer\u003c/b> (epidermoide: tabaco y alcohol; adenocarcinoma: ERGE, Barrett, obesidad).\u003c/li>\n  \u003cli>Progresiva con pirosis crónica → estenosis péptica.\u003c/li>\n  \u003cli>\u003cb>Intermitente\u003c/b> → anillo de Schatzki (“síndrome del asador”) o \u003cb>esofagitis eosinofílica\u003c/b>.\u003c/li>\n  \u003c/ul>\u003c/li>\n\u003cli>\u003cb>Sólidos y líquidos desde el inicio\u003c/b> → \u003cb>trastorno motor\u003c/b>:\n  \u003cul>\n  \u003cli>Progresiva con regurgitación y pérdida de peso → \u003cb>acalasia\u003c/b>.\u003c/li>\n  \u003cli>Con dolor torácico → espasmo esofágico distal, esófago hipercontráctil.\u003c/li>\n  \u003cli>Con pirosis y Raynaud → esclerodermia (hipomotilidad y esfínter hipotónico).\u003c/li>\n  \u003c/ul>\u003c/li>\n\u003cli>Estudio inicial de la disfagia esofágica: \u003cb>endoscopia\u003c/b> (diagnostica, toma biopsias y permite dilatar). Si es normal y persiste: \u003cb>manometría de alta resolución\u003c/b>.\u003c/li>\n\u003cli>\u003cb>Odinofagia\u003c/b> (dolor al tragar): esofagitis infecciosa (Candida, CMV, herpes) o por pastillas (doxiciclina, AINE, bisfosfonatos, cloruro de potasio).\u003c/li>\n\u003c/ul>"},{"h":"Acalasia","html":"\n\u003cul>\n\u003cli>Pérdida de neuronas inhibitorias del plexo mientérico: el esfínter esofágico inferior \u003cb>no se relaja\u003c/b> y \u003cb>no hay peristalsis\u003c/b>.\u003c/li>\n\u003cli>Esofagograma: dilatación con imagen en \u003cb>“pico de pájaro”\u003c/b>.\u003c/li>\n\u003cli>\u003cb>Manometría de alta resolución\u003c/b> (diagnóstica): presión de relajación integrada alta + ausencia de peristalsis. Clasificación de Chicago: tipo I (clásica), II (presurización panesofágica, la de mejor respuesta), III (espástica).\u003c/li>\n\u003cli>Siempre \u003cb>endoscopia\u003c/b> para descartar \u003cb>pseudoacalasia\u003c/b> (cáncer de la unión esofagogástrica), sobre todo en adultos mayores con pérdida de peso rápida.\u003c/li>\n\u003cli>Enfermedad de Chagas: acalasia secundaria (y megacolon, miocardiopatía).\u003c/li>\n\u003cli>Tratamiento: dilatación neumática, \u003cb>miotomía de Heller\u003c/b> laparoscópica con funduplicatura parcial, o \u003cb>POEM\u003c/b> (de elección en el tipo III). Toxina botulínica en quien no tolera procedimientos invasivos.\u003c/li>\n\u003c/ul>"},{"h":"Esofagitis eosinofílica","html":"\n\u003cul>\n\u003cli>Hombre joven con atopia (asma, rinitis, dermatitis), disfagia intermitente e \u003cb>impactación de alimentos\u003c/b>.\u003c/li>\n\u003cli>Endoscopia: anillos concéntricos (“traquealización”), surcos longitudinales, exudados blancos. Biopsias: \u003cb>≥15 eosinófilos por campo\u003c/b>.\u003c/li>\n\u003cli>Tratamiento: IBP, esteroides deglutidos (budesonida, fluticasona), dieta de eliminación, dupilumab; dilatación si hay estenosis.\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"Sólidos = Sólido (algo físico) · Ambos = Ambos (motor)","d":"Si solo pasan mal los sólidos, hay algo físico que estorba. Si sólidos y líquidos fallan desde el inicio, el que falla es el motor del esófago."},"pearl":"Hombre de 65 años, fumador y bebedor, con disfagia progresiva de sólidos a líquidos en 3 meses y pérdida de 8 kg: cáncer de esófago hasta demostrar lo contrario.","trap":"Acalasia en un adulto mayor con pérdida de peso rápida: no la trates sin endoscopia; puede ser pseudoacalasia por cáncer.","guide":["Primer estudio: la ACG prefiere endoscopia en disfagia esofágica; algunos libros proponen esofagograma primero si se sospecha lesión proximal compleja, Zenker o acalasia.","Esofagitis eosinofílica: el IBP ya se considera tratamiento (no solo prueba diagnóstica) desde el consenso AGREE 2018."],"refs":["Vaezi MF, et al. ACG Clinical Guidelines: Diagnosis and Management of Achalasia. Am J Gastroenterol 2020.","Yadlapati R, et al. Esophageal motility disorders on HRM: Chicago Classification 4.0. Neurogastroenterol Motil 2021.","Dellon ES, et al. ACG Clinical Guideline: Eosinophilic Esophagitis. Am J Gastroenterol 2025."]},"sii":{"hook":"El SII se diagnostica con criterios positivos (Roma IV), no después de pedir todos los estudios. Lo importante: saber qué datos de alarma lo descartan y tratar según el subtipo.","nn":[["irritable-bowel-syndrome","Irritable Bowel Syndrome"]],"yt":"irritable bowel syndrome Rome IV","sections":[{"h":"Criterios de Roma IV","html":"\n\u003cul>\n\u003cli>\u003cb>Dolor abdominal recurrente\u003c/b>, en promedio \u003cb>≥1 día por semana\u003c/b> en los últimos 3 meses, asociado a \u003cb>≥2\u003c/b> de:\n  \u003cul>\n  \u003cli>Relación con la defecación (mejora o empeora).\u003c/li>\n  \u003cli>Cambio en la \u003cb>frecuencia\u003c/b> de las evacuaciones.\u003c/li>\n  \u003cli>Cambio en la \u003cb>forma\u003c/b> (consistencia) de las heces.\u003c/li>\n  \u003c/ul>\u003c/li>\n\u003cli>Inicio de los síntomas al menos \u003cb>6 meses\u003c/b> antes del diagnóstico.\u003c/li>\n\u003cli>La distensión es frecuente pero no es criterio. Roma IV quitó la palabra “molestia”: se requiere dolor.\u003c/li>\n\u003c/ul>"},{"h":"Subtipos (escala de Bristol)","html":"\n\u003cul>\n\u003cli>Se clasifican según los días con heces anormales:\u003c/li>\n\u003cli>\u003cb>SII-E\u003c/b> (estreñimiento): &gt;25% de evacuaciones tipo 1–2 y &lt;25% tipo 6–7.\u003c/li>\n\u003cli>\u003cb>SII-D\u003c/b> (diarrea): &gt;25% tipo 6–7 y &lt;25% tipo 1–2.\u003c/li>\n\u003cli>\u003cb>SII-M\u003c/b> (mixto): &gt;25% de ambos tipos.\u003c/li>\n\u003cli>\u003cb>SII-NC\u003c/b> (no clasificado): no cumple ninguno.\u003c/li>\n\u003c/ul>"},{"h":"Datos de alarma y estudios","html":"\n\u003cul>\n\u003cli>\u003cb>Alarma\u003c/b>: inicio después de los 45–50 años, sangrado rectal, anemia ferropénica, pérdida de peso no intencional, síntomas nocturnos que despiertan, fiebre, masa, antecedente familiar de cáncer colorrectal, EII o celiaca, cambio progresivo.\u003c/li>\n\u003cli>Sin alarma (ACG 2021): estrategia de \u003cb>diagnóstico positivo\u003c/b>; limitar estudios.\u003c/li>\n\u003cli>En SII-D o SII-M: \u003cb>serología de celiaca\u003c/b>; \u003cb>calprotectina fecal\u003c/b> (o lactoferrina) y PCR para descartar EII.\u003c/li>\n\u003cli>Colonoscopia solo con datos de alarma o si le toca por edad (tamizaje).\u003c/li>\n\u003c/ul>"},{"h":"Tratamiento","html":"\n\u003cul>\n\u003cli>\u003cb>Para todos\u003c/b>: explicar el eje intestino-cerebro, relación médico-paciente, ejercicio.\u003c/li>\n\u003cli>\u003cb>Dieta baja en FODMAP\u003c/b> (eliminar y luego reintroducir), con nutriólogo.\u003c/li>\n\u003cli>\u003cb>Fibra soluble\u003c/b> (psyllium): ayuda; la fibra insoluble (salvado) puede empeorar la distensión.\u003c/li>\n\u003cli>\u003cb>Dolor\u003c/b>: antiespasmódicos (hioscina, aceite de menta) y \u003cb>neuromoduladores\u003c/b>: antidepresivos tricíclicos en dosis bajas (amitriptilina), útiles sobre todo en SII-D.\u003c/li>\n\u003cli>\u003cb>SII-E\u003c/b>: polietilenglicol (mejora la evacuación, no el dolor), linaclotida, plecanatida, lubiprostona, tenapanor.\u003c/li>\n\u003cli>\u003cb>SII-D\u003c/b>: loperamida (diarrea, no dolor), \u003cb>rifaximina\u003c/b>, eluxadolina (evitar sin vesícula o con alcohol o pancreatitis previa), alosetrón (mujeres con SII-D grave; riesgo de colitis isquémica).\u003c/li>\n\u003cli>\u003cb>Terapias psicológicas\u003c/b>: terapia cognitivo-conductual, hipnoterapia dirigida al intestino.\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"Roma IV = “1 día, 3 meses, 6 meses, 2 de 3”","d":"Dolor ≥1 día por semana, en los últimos 3 meses, con inicio hace ≥6 meses, y 2 de 3: defecación, frecuencia, forma."},"pearl":"El SII postinfeccioso existe: hasta 10% de quienes tienen una gastroenteritis bacteriana desarrollan SII después.","trap":"Mujer de 58 años con “colon irritable” nuevo y anemia ferropénica: eso no es SII, es indicación de colonoscopia.","guide":["Roma IV (2016) cambió “molestia” por “dolor” y la frecuencia de 3 días al mes a 1 día por semana: Roma III es más permisivo.","Edad de alarma: la ACG 2021 usa ≥45 años (por el tamizaje colorrectal); muchos libros dicen >50."],"refs":["Lacy BE, et al. ACG Clinical Guideline: Management of Irritable Bowel Syndrome. Am J Gastroenterol 2021.","Mearin F, et al. Bowel Disorders (Rome IV). Gastroenterology 2016.","Consenso mexicano sobre el síndrome de intestino irritable. Rev Gastroenterol Mex 2016."]},"dialisis":{"hook":"Cuándo dializar de urgencia (AEIOU), cómo elegir entre hemodiálisis y diálisis peritoneal, qué complicaciones esperar y por qué el trasplante es el mejor tratamiento de la ERC terminal.","nn":[["hemodialysis-nclex","Hemodialysis"],["chronic-kidney-disease","Chronic Kidney Disease"]],"yt":"dialysis kidney transplant","sections":[{"h":"Indicaciones urgentes: AEIOU","html":"\n\u003cul>\n\u003cli>\u003cb>A\u003c/b>cidosis metabólica grave refractaria (pH &lt;7.1–7.15).\u003c/li>\n\u003cli>\u003cb>E\u003c/b>lectrólitos: hiperkalemia refractaria o con cambios en el ECG.\u003c/li>\n\u003cli>\u003cb>I\u003c/b>ntoxicaciones dializables: metanol, etilenglicol, litio, salicilatos, metformina (acidosis láctica), valproato, teofilina.\u003c/li>\n\u003cli>\u003cb>O\u003c/b>verload: sobrecarga de volumen refractaria a diuréticos (edema pulmonar).\u003c/li>\n\u003cli>\u003cb>U\u003c/b>remia: pericarditis, encefalopatía, sangrado urémico.\u003c/li>\n\u003c/ul>"},{"h":"Diálisis crónica","html":"\n\u003cul>\n\u003cli>Se inicia por \u003cb>síntomas o complicaciones\u003c/b> (uremia, volumen, potasio, acidosis, desnutrición), no por una cifra de TFG sola; suele ser con TFG 5–10 (estudio IDEAL).\u003c/li>\n\u003cli>Referir a Nefrología con TFG &lt;30 para planear. \u003cb>Fístula arteriovenosa\u003c/b> meses antes; cuidar las venas del brazo no dominante (sin venopunciones ni catéteres centrales de inserción periférica).\u003c/li>\n\u003cli>\u003cb>Hemodiálisis\u003c/b>: difusión + ultrafiltración; 3 sesiones por semana de ~4 h. Acceso: fístula (mejor) &gt; injerto &gt; catéter (más infecciones). Adecuación: Kt/V ≥1.2.\u003c/li>\n\u003cli>\u003cb>Diálisis peritoneal\u003c/b> (continua ambulatoria o automatizada nocturna): en casa, preserva la función renal residual, mejor estabilidad hemodinámica. Contraindicaciones: cirugías abdominales extensas, hernias no reparables, incapacidad de autocuidado sin apoyo.\u003c/li>\n\u003cli>Pacientes inestables en UCI: terapia de reemplazo renal continua.\u003c/li>\n\u003c/ul>"},{"h":"Complicaciones","html":"\n\u003cul>\n\u003cli>\u003cb>Hemodiálisis\u003c/b>: \u003cb>hipotensión intradiálisis\u003c/b> (la más común), calambres, \u003cb>síndrome de desequilibrio\u003c/b> (edema cerebral en las primeras sesiones con urea muy alta: cefalea, náusea, convulsiones; se previene con sesiones cortas y de baja eficiencia), bacteriemia por catéter (S. aureus), trombosis o estenosis de la fístula, síndrome de robo, amiloidosis por β2-microglobulina (túnel del carpo).\u003c/li>\n\u003cli>\u003cb>Diálisis peritoneal\u003c/b>: \u003cb>peritonitis\u003c/b> (líquido turbio, dolor; &gt;100 leucocitos/µL con &gt;50% neutrófilos; gérmenes de la piel como estafilococo; antibiótico intraperitoneal), infección del orificio de salida, hiperglucemia y aumento de peso (glucosa del dializado), hipoalbuminemia, hernias.\u003c/li>\n\u003c/ul>"},{"h":"Trasplante renal","html":"\n\u003cul>\n\u003cli>Mejor supervivencia y calidad de vida que cualquier diálisis. Ideal: \u003cb>anticipado\u003c/b> (antes de iniciar diálisis) y de donador vivo.\u003c/li>\n\u003cli>Requisitos inmunológicos: compatibilidad ABO, tipificación HLA, \u003cb>prueba cruzada\u003c/b> negativa.\u003c/li>\n\u003cli>Inmunosupresión de mantenimiento: \u003cb>tacrolimus\u003c/b> + micofenolato + prednisona.\u003c/li>\n\u003cli>Rechazo: \u003cb>hiperagudo\u003c/b> (minutos, anticuerpos preformados), \u003cb>agudo\u003c/b> (semanas a meses; creatinina ↑; biopsia; pulsos de esteroide o tratamiento de rechazo humoral), \u003cb>crónico\u003c/b> (años, fibrosis).\u003c/li>\n\u003cli>Toxicidad de tacrolimus: nefrotoxicidad (vasoconstricción de la arteriola aferente), hiperkalemia, hipomagnesemia, HTA, diabetes postrasplante, temblor. Interacciones: azoles, macrólidos, diltiazem lo elevan; rifampicina y anticonvulsivos lo bajan.\u003c/li>\n\u003cli>Infecciones: CMV, virus BK (nefropatía), Pneumocystis (profilaxis con TMP-SMX). Cáncer: piel (el más común), enfermedad linfoproliferativa postrasplante (VEB).\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"AEIOU","d":"Acidosis, Electrólitos (potasio), Intoxicaciones, Overload (volumen), Uremia: las cinco vocales de la diálisis urgente."},"pearl":"Pericarditis urémica en un paciente con ERC: es indicación de diálisis (no de AINE). En quien ya se dializa, indica diálisis insuficiente.","trap":"Paciente trasplantado que inicia claritromicina o fluconazol: el tacrolimus sube y aparece LRA por toxicidad. Ajusta la dosis y mide niveles.","guide":["Inicio de diálisis crónica: KDIGO 2024 insiste en iniciar por síntomas o complicaciones, no por TFG; libros antiguos daban cifras fijas (TFG \u003c15 o \u003c10).","Peritonitis en diálisis peritoneal: la ISPD 2022 usa >100 leucocitos/µL con >50% de neutrófilos tras un tiempo de permanencia ≥2 h."],"refs":["KDIGO 2024 Clinical Practice Guideline for the Evaluation and Management of CKD. Kidney Int 2024.","Cooper BA, et al. IDEAL trial. N Engl J Med 2010.","Li PK, et al. ISPD peritonitis guideline recommendations: 2022 update. Perit Dial Int 2022.","KDIGO Clinical Practice Guideline for the Care of Kidney Transplant Recipients. Am J Transplant 2009."]},"abordaje":{"hook":"Antes de pedir anticuerpos, cuenta articulaciones, mide el tiempo de rigidez y decide si el dolor es articular o periarticular. Y ante una monoartritis aguda: punciona.","nn":[],"yt":"approach to joint pain arthritis","sections":[{"h":"Cinco preguntas","html":"\n\u003cul>\n\u003cli>\u003cb>¿Articular o periarticular?\u003c/b> Articular: dolor en todo el arco de movimiento, activo y pasivo; derrame, limitación. Periarticular (bursitis, tendinitis, entesitis): dolor localizado, con movimientos activos específicos, el pasivo suele ser menos doloroso.\u003c/li>\n\u003cli>\u003cb>¿Inflamatorio o mecánico?\u003c/b> Inflamatorio: rigidez matutina &gt;60 min (&gt;30 en muchos textos), mejora con la actividad, aumento de volumen blando, calor, síntomas sistémicos, PCR/VSG ↑. Mecánico: empeora con el uso, rigidez &lt;30 min.\u003c/li>\n\u003cli>\u003cb>¿Cuántas?\u003c/b> Monoartritis (1), oligoartritis (2–4), poliartritis (≥5).\u003c/li>\n\u003cli>\u003cb>¿Cuánto tiempo?\u003c/b> Aguda (&lt;6 semanas: infecciones, cristales, viral) vs crónica (≥6 semanas: AR, espondiloartritis, LES).\u003c/li>\n\u003cli>\u003cb>¿Cuáles y cómo?\u003c/b> Simétrica vs asimétrica, pequeñas vs grandes, axial, migratoria o aditiva.\u003c/li>\n\u003c/ul>"},{"h":"Patrones que orientan","html":"\n\u003cul>\n\u003cli>Poliartritis simétrica de MCF, IFP y muñecas → \u003cb>AR\u003c/b>; si es aguda, viral (parvovirus B19, hepatitis B y C, chikungunya) o LES.\u003c/li>\n\u003cli>Oligoartritis asimétrica de miembros inferiores + entesitis o lumbalgia inflamatoria → \u003cb>espondiloartritis\u003c/b> o artritis reactiva.\u003c/li>\n\u003cli>\u003cb>IFD\u003c/b> → osteoartritis o artritis psoriásica.\u003c/li>\n\u003cli>\u003cb>1ª MTF\u003c/b> aguda → gota.\u003c/li>\n\u003cli>Migratoria → fiebre reumática, gonococo, endocarditis.\u003c/li>\n\u003cli>Manifestaciones extraarticulares: piel (psoriasis, eritema malar, nódulos), ojos (uveítis, escleritis, ojo seco), úlceras orales, Raynaud, serositis, diarrea o uretritis.\u003c/li>\n\u003c/ul>"},{"h":"Monoartritis aguda","html":"\n\u003cul>\n\u003cli>\u003cb>Artrocentesis siempre\u003c/b>: Gram, cultivo, conteo celular y cristales. No se puede descartar infección sin líquido.\u003c/li>\n\u003cli>Artritis séptica: \u003cb>S. aureus\u003c/b> la causa más común; \u003cb>gonococo\u003c/b> en jóvenes con vida sexual activa (tríada: tenosinovitis, pústulas en piel, poliartralgias migratorias).\u003c/li>\n\u003cli>Gota y pseudogota pueden coexistir con infección.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\u003ctr>\u003cth>Líquido sinovial\u003c/th>\u003cth>Leucocitos/µL\u003c/th>\u003cth>Neutrófilos\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Normal\u003c/td>\u003ctd>&lt;200\u003c/td>\u003ctd>&lt;25%\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>No inflamatorio (OA, trauma)\u003c/td>\u003ctd>200–2,000\u003c/td>\u003ctd>&lt;25%\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Inflamatorio (AR, gota)\u003c/td>\u003ctd>2,000–50,000\u003c/td>\u003ctd>≥50%\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Séptico\u003c/td>\u003ctd>&gt;50,000 (a menudo &gt;100,000)\u003c/td>\u003ctd>≥75–90%\u003c/td>\u003c/tr>\u003c/table>\u003c/div>"},{"h":"Laboratorio con criterio","html":"\n\u003cul>\n\u003cli>\u003cb>VSG y PCR\u003c/b>: inflamación, no diagnóstico.\u003c/li>\n\u003cli>\u003cb>Factor reumatoide\u003c/b>: sensible pero poco específico (hepatitis C, endocarditis, edad avanzada). \u003cb>Anti-CCP\u003c/b>: especificidad ~95% para AR.\u003c/li>\n\u003cli>\u003cb>ANA\u003c/b>: muy sensible para LES (&gt;95%) pero poco específico (5–15% de sanos positivos a títulos bajos). Pídelos solo con sospecha clínica. Específicos de LES: \u003cb>anti-dsDNA\u003c/b> y \u003cb>anti-Sm\u003c/b>.\u003c/li>\n\u003cli>\u003cb>HLA-B27\u003c/b>: apoya espondiloartritis, no diagnostica.\u003c/li>\n\u003cli>\u003cb>Ácido úrico\u003c/b>: puede ser normal durante un ataque de gota.\u003c/li>\n\u003cli>Complemento, ANCA, CK, anti-Ro/La según la sospecha.\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"Monoartritis caliente = “pica antes de pensar”","d":"Punciona la articulación antes de dar esteroide: una artritis séptica destruye el cartílago en días."},"pearl":"Un ANA positivo a título bajo (1:80) sin clínica no es lupus: es frecuente en personas sanas, sobre todo mujeres y adultos mayores.","trap":"No infiltres esteroide en una articulación caliente sin descartar infección con el líquido sinovial.","guide":["Rigidez matutina “inflamatoria”: unos textos usan >30 min y otros >60 min (los criterios ACR de 1987 para AR pedían ≥1 h). En la práctica, a más tiempo, más probable que sea inflamatoria.","Umbrales del líquido sinovial: son orientativos; una artritis séptica puede tener \u003c50,000 leucocitos (sobre todo en inmunosuprimidos o gonococo) y una gota puede superar los 50,000."],"refs":["Harrison. Principios de Medicina Interna, 21e. Cap. Abordaje de los trastornos articulares y musculoesqueléticos.","Margaretten ME, et al. Does this adult patient have septic arthritis? JAMA 2007.","Firestein & Kelley's Textbook of Rheumatology, 11e. History and physical examination."]}},"compares":{"sglt2-glp1":{"topic":"dm2","a":"iSGLT2","b":"arGLP-1","rows":[["Ejemplos","Empagliflozina, dapagliflozina, canagliflozina","Semaglutida, liraglutida, dulaglutida (tirzepatida es dual GIP/GLP-1)"],["Dónde actúa","Túbulo contorneado proximal","Páncreas, cerebro (saciedad) y estómago"],["Mecanismo","Glucosuria y natriuresis","↑ insulina dependiente de glucosa, ↓ glucagón, vaciamiento gástrico lento"],["Baja la A1c","Moderado (≈0.5–0.8%; menos si TFG \u003c45)","Alto (≈1–1.5% o más)"],["Peso","↓ 2–3 kg","↓ de moderado a muy alto (semaglutida y tirzepatida, las de mayor efecto)"],["Hipoglucemia","No, si se usa solo","No, si se usa solo"],["Beneficio estrella","IC (FEr y FEp) y ERC","ECV aterosclerótica y obesidad (semaglutida también ERC)"],["Vía","Oral, una vez al día","Subcutánea semanal o diaria (semaglutida también oral)"],["Efecto adverso clásico","Micosis genital, cetoacidosis euglucémica","Náusea y vómito, colelitiasis"],["Contraindicación clásica","TFG \u003c20 para iniciarlo; diálisis","Carcinoma medular de tiroides o MEN2, personal o familiar"]]},"stemi-nste":{"topic":"sca","a":"IAMCEST","b":"SCASEST","rows":[["En la arteria","Oclusión total (trombo rojo, rico en fibrina)","Oclusión parcial o intermitente (trombo blanco, rico en plaquetas)"],["Daño","Transmural","Subendocárdico"],["ECG","Elevación persistente del ST o equivalente","Infradesnivel del ST, T invertidas o ECG normal"],["Troponina","Elevada, pero no se espera para reperfundir","Elevada en IAMSEST; normal en angina inestable"],["Decisión clave","Reperfundir ya: ICP primaria ≤120 min o fibrinólisis ≤10 min","Estratificar el riesgo (troponina, GRACE) y decidir cuándo cateterizar"],["Fibrinólisis","Sí, si la ICP no llega a tiempo","Nunca: no beneficia y aumenta el sangrado"],["Cateterismo","Inmediato (ICP primaria)","Inmediato \u003c2 h si muy alto riesgo; \u003c24 h si alto riesgo; selectivo si bajo riesgo"],["Antiagregación","Aspirina + ticagrelor o prasugrel (clopidogrel si hubo fibrinólisis)","Aspirina + P2Y12; sin pretratamiento de rutina si el cateterismo es en \u003c24 h"]]},"pre-nta":{"topic":"lra","a":"Prerrenal","b":"NTA","rows":[["Mecanismo","Llega menos sangre; el túbulo está sano y reabsorbe sodio con avidez","La célula tubular está dañada (isquemia prolongada o tóxicos) y no reabsorbe sodio"],["FENa","\u003c1%",">2%"],["FEUrea (si usa diurético)","\u003c35%",">50%"],["Na urinario","\u003c20 mEq/L",">40 mEq/L"],["Osmolaridad urinaria",">500 mOsm/kg (orina concentrada)","\u003c350 mOsm/kg (isostenuria, ≈300)"],["BUN/Cr",">20","10–15"],["Sedimento","Normal o cilindros hialinos","Cilindros granulosos “café lodoso” y células tubulares"],["Respuesta a volumen","Mejora en 24–72 h","No mejora; tarda días a semanas"],["Tratamiento","Volumen y quitar la causa (AINE, IECA o ARA-II, diurético)","Soporte: evitar nefrotóxicos, balance de líquidos y diálisis si hay AEIOU"]]},"ldl-tg":{"topic":"smdl","a":"LDL alto","b":"TG muy altos","rows":[["Riesgo principal","Enfermedad cardiovascular aterosclerótica","Pancreatitis aguda (y riesgo CV residual)"],["Signos","Xantomas tendinosos, arco corneal \u003c45 años, xantelasmas","Xantomas eruptivos, lipemia retinalis, hepatoesplenomegalia"],["Causas secundarias","Hipotiroidismo, síndrome nefrótico, colestasis, anorexia, fármacos","DM descontrolada, alcohol, obesidad, ERC, estrógenos, tiazidas, antipsicóticos"],["Primer fármaco","Estatina de alta intensidad","Fenofibrato si son muy altos; si no, estatina según el riesgo CV"],["Para agregar","Ezetimiba, luego iPCSK9 (o ácido bempedoico)","Icosapento de etilo con ECV o DM pese a estatina"],["Medidas clave","Dieta baja en grasa saturada, ejercicio","Cero alcohol, dieta muy baja en grasa, control de glucosa"]]},"urg-emerg":{"topic":"hta","a":"Urgencia","b":"Emergencia hipertensiva","rows":[["Daño agudo a órgano blanco","No","Sí: encefalopatía, EVC, SCA, edema pulmonar, disección, LRA, eclampsia"],["Dónde","Urgencias u observación; puede irse a casa","Terapia intensiva"],["Vía","Oral","IV titulable"],["Velocidad","Gradual en 24–48 h","PAM ↓ ≤25% en la 1ª hora (excepto disección y EVC)"],["Fármacos","Reiniciar o ajustar su tratamiento oral","Labetalol, nicardipino, clevidipino, esmolol, nitroglicerina, nitroprusiato"],["Error clásico","Nifedipino sublingual o bajar de golpe","Normalizar la PA en minutos"]]},"lra-erc":{"topic":"erc","a":"Lesión renal aguda","b":"Enfermedad renal crónica","rows":[["Tiempo","Horas a días (≤7 días para la definición)",">3 meses"],["Creatinina previa","Normal hace poco","Ya estaba alta"],["Tamaño renal (USG)","Normal o aumentado","Pequeños y ecogénicos (salvo DM, amiloidosis, poliquistosis, VIH)"],["Anemia","Puede no haber","Normocítica frecuente"],["Mineral óseo","Normal al inicio","Fósforo alto, PTH alta, calcitriol bajo"],["Reversibilidad","Frecuentemente reversible","Progresiva; se busca frenarla"],["TFG estimada","No es válida (creatinina inestable)","Válida con creatinina estable"]]},"nefrotico-nefritico":{"topic":"glomerulo","a":"Nefrótico","b":"Nefrítico","rows":[["Lesión","Podocito o membrana basal (fuga de proteína)","Inflamación glomerular"],["Proteinuria",">3.5 g/24 h","\u003c3.5 g/24 h"],["Sedimento","Cuerpos ovales grasos (cruz de Malta)","Eritrocitos dismórficos y cilindros eritrocitarios"],["Albúmina","Baja (\u003c3 g/dL)","Normal o poco baja"],["Edema","Intenso, generalizado","Moderado, periorbitario"],["PA y función renal","Normales al inicio","HTA, oliguria, LRA"],["Lípidos","Hiperlipidemia","Normales"],["Ejemplos","Cambios mínimos, membranosa, GEFS, diabética, amiloide","Postinfecciosa, IgA, lúpica, ANCA, anti-MBG"]]},"ferro-inflam":{"topic":"anemias","a":"Ferropénica","b":"Inflamación","rows":[["Mecanismo","Falta hierro","Hay hierro, pero la hepcidina lo atrapa"],["VCM","Bajo","Normal o levemente bajo"],["Ferritina","Baja (\u003c30)","Normal o alta"],["TIBC / transferrina","Alta","Baja"],["Saturación","Baja","Baja"],["ADE","Alta","Normal"],["Receptor soluble de transferrina","Alto","Normal"],["Tratamiento","Hierro y buscar la causa","Tratar la enfermedad de base"]]},"b12-folato":{"topic":"anemias","a":"Déficit de B12","b":"Déficit de folato","rows":[["Neuropatía","Sí (cordones posteriores y laterales)","No"],["Ácido metilmalónico","Alto","Normal"],["Homocisteína","Alta","Alta"],["Tiempo para agotar reservas","Años","Semanas a meses"],["Causas típicas","Anemia perniciosa, cirugía gástrica o ileal, metformina, veganos","Dieta, alcohol, embarazo, metotrexato, fenitoína, trimetoprim"],["Tratamiento","B12 IM u oral a dosis altas","Ácido fólico oral (después de descartar déficit de B12)"]]},"duodenal-gastrica":{"topic":"stda","a":"Úlcera duodenal","b":"Úlcera gástrica","rows":[["Frecuencia","Más común","Menos común"],["Dolor y comida","Mejora al comer; regresa 2–3 h después y de noche","Empeora al comer"],["Peso","Puede subir (come para calmar el dolor)","Suele bajar"],["Causa principal","H. pylori","AINE y H. pylori"],["Riesgo de cáncer","Casi nulo","Hay que biopsiar siempre"],["Seguimiento","Confirmar erradicación de H. pylori","Endoscopia de control para confirmar cicatrización"],["Complicación típica","Sangrado (arteria gastroduodenal) y perforación","Sangrado (arteria gástrica izquierda)"]]},"biliar-alcohol":{"topic":"pancrea","a":"Pancreatitis biliar","b":"Pancreatitis alcohólica","rows":[["Perfil típico","Mujer, obesidad, edad media","Hombre con consumo crónico intenso"],["Laboratorio","ALT >150 U/L en 48 h, bilirrubina y fosfatasa alcalina altas","GGT alta; lipasa puede elevarse menos en episodios repetidos"],["Imagen","Litos o lodo en el USG; colédoco dilatado","Calcificaciones si ya hay pancreatitis crónica"],["Procedimiento clave","Colecistectomía en la misma hospitalización (si es leve); CPRE solo con colangitis u obstrucción","Consejería para dejar el alcohol"],["Riesgo a largo plazo","Recurrencia si no se opera","Pancreatitis crónica, insuficiencia exocrina y endocrina"]]},"ar-oa":{"topic":"ar","a":"Artritis reumatoide","b":"Osteoartritis","rows":[["Naturaleza","Inflamatoria, autoinmune","Degenerativa, mecánica"],["Rigidez matutina",">1 h","\u003c30 min"],["Dolor","Mejora con el movimiento","Empeora con el uso y mejora con reposo"],["Manos","MCF, IFP y muñecas; respeta IFD","IFD (Heberden), IFP (Bouchard), 1ª carpometacarpiana"],["Simetría","Simétrica","Asimétrica, suele dominar un lado"],["Laboratorio","FR, anti-CCP, VSG/PCR altas","Normal"],["Rx","Osteopenia yuxtaarticular, erosiones marginales, espacio reducido simétrico","Osteofitos, esclerosis y quistes subcondrales, espacio reducido asimétrico"],["Tratamiento","FAME (metotrexato), biológicos","Ejercicio, bajar de peso, AINE tópico, infiltración"]]},"gota-pseudo":{"topic":"gota","a":"Gota","b":"Pseudogota (CPPD)","rows":[["Cristal","Urato monosódico","Pirofosfato de calcio"],["Forma","Aguja","Romboide"],["Birrefringencia","Negativa, intensa","Positiva, débil"],["Articulación típica","1ª MTF (podagra)","Rodilla, muñeca"],["Edad y perfil","Hombre de edad media, síndrome metabólico","Adulto mayor"],["Rx","Erosiones en sacabocado con borde colgante","Condrocalcinosis"],["Asociaciones","Alcohol, diuréticos, ERC, obesidad","Hiperparatiroidismo, hemocromatosis, hipomagnesemia, hipofosfatasia"],["Tratamiento a largo plazo","Alopurinol con meta de urato \u003c6","No hay tratamiento que disuelva cristales"]]},"ea-ia":{"topic":"aortica","a":"Estenosis aórtica","b":"Insuficiencia aórtica","rows":[["Sobrecarga del VI","De presión (hipertrofia concéntrica)","De volumen (dilatación excéntrica)"],["Soplo","Sistólico expulsivo, foco aórtico, irradia a carótidas","Diastólico temprano decreciente, borde esternal izquierdo"],["Pulso","Parvus et tardus (débil y lento)","Saltón (martillo de agua), presión de pulso amplia"],["Síntomas","Angina, síncope, IC","Disnea, palpitaciones; aguda: edema pulmonar"],["Causa típica","Calcificación degenerativa, bicúspide","Dilatación de raíz, bicúspide, endocarditis"],["Cuándo intervenir","Grave sintomática o FEVI \u003c50%","Grave sintomática o FEVI ≤50% / VI muy dilatado"],["Fármacos a evitar","Nitratos y vasodilatadores potentes en grave","Bradicardizantes (alargan la diástole y el reflujo)"]]},"hemofilia-vwd":{"topic":"sangrado","a":"Hemofilia A","b":"Von Willebrand","rows":[["Herencia","Ligada al X (hombres)","Autosómica dominante (tipo 1)"],["Defecto","Factor VIII","Factor de von Willebrand (y VIII secundariamente)"],["Tipo de sangrado","Profundo: hemartrosis, hematomas","Mucocutáneo: epistaxis, menorragia"],["Plaquetas","Normales","Normales (en número)"],["TTPa","↑","Normal o ↑"],["TP","Normal","Normal"],["Prueba clave","Actividad del VIII","Antígeno y actividad del FvW (ristocetina)"],["Tratamiento","Factor VIII, emicizumab; desmopresina si es leve","Desmopresina (tipo 1), concentrado de FvW/VIII, tranexámico"]]},"intra-extra":{"topic":"hemoliticas","a":"Intravascular","b":"Extravascular","rows":[["Dónde se destruye","Dentro del vaso","Bazo e hígado (macrófagos)"],["Hemoglobinuria","Sí (orina oscura)","No"],["Haptoglobina","Indetectable","Baja"],["Esplenomegalia","Poco común","Frecuente"],["Frotis típico","Esquistocitos, células mordidas","Esferocitos"],["Ejemplos","G6PD, PTT, HPN, ABO, válvulas","Esferocitosis, AHAI caliente, talasemia"],["Complicación crónica","Déficit de hierro (pérdida urinaria)","Litiasis pigmentaria"]]},"lma-lla":{"topic":"leucemias","a":"LMA","b":"LLA","rows":[["Edad típica","Adultos (~68 años)","Niños (2–5 años)"],["Marcadores","Mieloperoxidasa, CD13, CD33, CD117","TdT, CD10, CD19 (B) o CD3 (T)"],["Hallazgo morfológico","Bastones de Auer","Blastos pequeños sin gránulos"],["Infiltración típica","Encías y piel (monocíticas)","SNC, testículo, mediastino (T)"],["Alteración clave","t(15;17) en LPA; NPM1, FLT3","t(9;22) Filadelfia en adultos"],["Complicación característica","CID en LPA","Lisis tumoral, recaída en SNC"],["Tratamiento base","“7+3”; ATRA + arsénico en LPA","Fases + profilaxis intratecal; ITK si Ph+"],["Pronóstico","Curación ~30–40% en adultos","Curación ~90% en niños"]]},"em-im":{"topic":"mitral","a":"Estenosis mitral","b":"Insuficiencia mitral","rows":[["Causa más común","Fiebre reumática","Degenerativa (prolapso) o secundaria (VI dilatado)"],["Soplo","Retumbo diastólico + chasquido de apertura","Holosistólico apical irradiado a axila"],["Ruidos","R1 intenso","R1 suave, R3"],["Cámara que se dilata","Aurícula izquierda (VI normal)","Aurícula y ventrículo izquierdos"],["Complicación típica","FA, embolia, hipertensión pulmonar","Disfunción del VI, FA"],["Anticoagulante en FA","Warfarina","ACOD o warfarina"],["Intervención","Valvuloplastia con balón si es favorable","Reparación quirúrgica; TEER si alto riesgo"]]}},"anims":{"dm2":{"title":"De la insulina a los fármacos","steps":[{"cap":"\u003cb>Así entra la glucosa.\u003c/b> La insulina se une a su receptor en la célula muscular. La señal manda las vesículas con GLUT4 a la membrana, y por esos canales entra la glucosa.","labels":[[26,9,"Insulina"],[40,70,"Receptor"],[112,49,"GLUT4"],[128,9,"Glucosa"],[24,108,"Músculo"]]},{"cap":"\u003cb>Resistencia a la insulina.\u003c/b> La insulina llega, pero la señal se bloquea dentro de la célula. El GLUT4 se queda atrapado en el citoplasma y la glucosa se acumula en la sangre.","labels":[[64,86,"Señal bloqueada"],[124,9,"Glucosa ↑"],[112,108,"GLUT4 atrapado"]]},{"cap":"\u003cb>El páncreas compensa… y se agota.\u003c/b> Al principio la célula β produce más insulina (hiperinsulinemia) y la glucosa se mantiene. Con los años la célula β falla, la insulina cae y aparece la DM2.","labels":[[40,70,"Islote"],[126,104,"INS"],[146,104,"GLU"]]},{"cap":"\u003cb>Metformina.\u003c/b> Activa la AMPK en el hígado y frena la gluconeogénesis: sale menos glucosa a la sangre. No estimula la insulina, por eso sola no causa hipoglucemia.","labels":[[44,108,"Hígado"],[44,20,"Gluconeogénesis"],[126,40,"Vena"]]},{"cap":"\u003cb>iSGLT2 (-flozina).\u003c/b> En el túbulo proximal, el SGLT2 reabsorbe glucosa y sodio. La flozina lo bloquea: la glucosa y el sodio se van por la orina. La natriuresis explica el beneficio en IC y ERC.","labels":[[80,14,"Capilar"],[40,99,"Túbulo proximal"],[86,46,"SGLT2"],[148,92,"Orina"]]},{"cap":"\u003cb>arGLP-1 (-glutida).\u003c/b> Imita a la incretina: más insulina solo cuando hay glucosa alta, menos glucagón, vaciamiento gástrico lento y saciedad en el cerebro. Por eso bajan tanto la A1c y el peso.","labels":[[28,104,"Páncreas"],[80,104,"Estómago"],[132,104,"Cerebro"]]}]},"sca":{"title":"De la placa al infarto","steps":[{"cap":"\u003cb>Arteria sana.\u003c/b> El endotelio está liso y los eritrocitos pasan sin obstáculo. El miocardio de abajo recibe todo su oxígeno.","labels":[[80,17,"Endotelio"],[80,50,"Flujo normal"],[80,86,"Miocardio"],[14,98,"ECG"]]},{"cap":"\u003cb>Disfunción endotelial.\u003c/b> El LDL entra a la íntima y se oxida. Los macrófagos lo fagocitan y se vuelven células espumosas: así empieza la estría grasa.","labels":[[40,44,"LDL"],[118,86,"Células espumosas"]]},{"cap":"\u003cb>Placa estable.\u003c/b> Un núcleo de lípidos cubierto por una capa fibrosa gruesa estrecha la luz. En reposo alcanza el flujo; con el esfuerzo aparece la angina estable (síndrome coronario crónico).","labels":[[80,86,"Núcleo lipídico"],[126,44,"Capa fibrosa gruesa"]]},{"cap":"\u003cb>Ruptura y trombo blanco.\u003c/b> La capa fibrosa delgada se rompe y expone el contenido de la placa. Las plaquetas se adhieren y forman un trombo que ocluye parcialmente: SCASEST, con infradesnivel del ST.","labels":[[80,30,"Ruptura"],[128,46,"Plaquetas"],[130,104,"ST ↓"]]},{"cap":"\u003cb>Oclusión total.\u003c/b> La fibrina atrapa eritrocitos y forma un trombo rojo que cierra la arteria. El miocardio que depende de ella empieza a morir: IAMCEST, con elevación del ST. Tiempo es miocardio.","labels":[[85,22,"Trombo rojo"],[130,86,"Necrosis"],[130,104,"ST ↑"]]},{"cap":"\u003cb>Reperfusión.\u003c/b> El stent abre la arteria y regresa el flujo. La aspirina y el P2Y12 evitan que las plaquetas vuelvan a agregarse. Lo que se salve depende de cuánto tardaste.","labels":[[83,22,"Stent (ICP)"],[40,50,"Flujo"],[130,86,"Cicatriz pequeña"],[130,104,"ST normaliza"]]}]},"lra":{"title":"El glomérulo bajo presión","steps":[{"cap":"\u003cb>Glomérulo normal.\u003c/b> La sangre entra por la arteriola aferente, filtra en el glomérulo y sale por la eferente. El filtrado baja al túbulo. La TFG depende de la presión dentro del glomérulo.","labels":[[24,40,"Aferente"],[130,32,"Eferente"],[112,110,"Túbulo"]]},{"cap":"\u003cb>Hipovolemia compensada.\u003c/b> Llega menos sangre. Las prostaglandinas dilatan la aferente y la angiotensina II contrae la eferente: la presión glomerular se sostiene y la TFG casi no cae.","labels":[[24,36,"PG: dilata"],[130,32,"Ang II: contrae"]]},{"cap":"\u003cb>AINE.\u003c/b> Bloquean las prostaglandinas: la aferente se contrae, entra menos sangre al glomérulo y la TFG cae.","labels":[[24,36,"AINE ✕ PG"],[130,32,"Ang II: contrae"]]},{"cap":"\u003cb>IECA o ARA-II.\u003c/b> Sin angiotensina II, la eferente se relaja y la presión del glomérulo se escapa: la TFG cae. En un paciente bien hidratado es tolerable; con hipovolemia, no.","labels":[[24,36,"PG: dilata"],[128,32,"IECA/ARA ✕ Ang II"]]},{"cap":"\u003cb>Triple golpe.\u003c/b> AINE (aferente cerrada) + IECA o ARA-II (eferente abierta) + diurético (menos volumen). Es la LRA prerrenal clásica del adulto mayor con dolor articular.","labels":[[24,36,"AINE"],[130,32,"IECA/ARA"],[60,10,"Diurético: ↓ volumen"]]},{"cap":"\u003cb>Prerrenal: el túbulo está sano.\u003c/b> Las células tubulares reabsorben el sodio con avidez. Casi no sale sodio en la orina (FENa \u003c1%) y la orina sale concentrada.","labels":[[112,74,"Reabsorbe Na"],[112,110,"FENa \u003c1%"]]},{"cap":"\u003cb>Necrosis tubular aguda.\u003c/b> Si la isquemia se prolonga o hay tóxicos, las células tubulares mueren y se desprenden como cilindros granulosos “café lodoso”. El sodio se escapa a la orina (FENa >2%).","labels":[[112,74,"Células muertas"],[86,110,"Cilindros"],[140,110,"FENa >2%"]]},{"cap":"\u003cb>Posrenal.\u003c/b> Una obstrucción (próstata, litos) frena la salida. La presión se transmite hacia atrás hasta la cápsula de Bowman y la filtración se detiene. Primero, sonda o desobstrucción.","labels":[[146,76,"Obstrucción"],[74,10,"Presión retrógrada"]]}]},"smdl":{"title":"El receptor de LDL y sus fármacos","steps":[{"cap":"\u003cb>El hígado limpia el LDL.\u003c/b> Los receptores de LDL en la membrana del hepatocito atrapan las partículas de LDL de la sangre, las meten a la célula y vuelven a la superficie para atrapar más.","labels":[[30,10,"Sangre"],[130,10,"LDL"],[40,66,"Receptor"],[80,104,"Hepatocito"]]},{"cap":"\u003cb>Estatina.\u003c/b> Bloquea la HMG-CoA reductasa: el hepatocito fabrica menos colesterol y, para compensar, saca más receptores a la membrana. Resultado: más LDL capturado y menos en la sangre.","labels":[[80,104,"HMG-CoA reductasa ✕"],[130,10,"LDL ↓"]]},{"cap":"\u003cb>PCSK9 e iPCSK9.\u003c/b> La PCSK9 se pega al receptor y hace que se destruya. El anticuerpo anti-PCSK9 la atrapa: el receptor se recicla y sigue limpiando LDL.","labels":[[30,10,"PCSK9"],[120,30,"Anticuerpo"],[80,104,"Receptor reciclado"]]},{"cap":"\u003cb>Ezetimiba.\u003c/b> En el intestino bloquea la proteína NPC1L1, que absorbe colesterol. Llega menos colesterol al hígado, que de nuevo responde con más receptores de LDL.","labels":[[40,10,"Luz intestinal"],[80,58,"NPC1L1 ✕"],[80,104,"Enterocito"]]}]},"hta":{"title":"Renina-angiotensina-aldosterona","steps":[{"cap":"\u003cb>La cascada.\u003c/b> El hígado produce angiotensinógeno. Cuando baja la perfusión renal, el aparato yuxtaglomerular libera renina, que lo convierte en angiotensina I. La ECA (sobre todo en el pulmón) la convierte en angiotensina II.","labels":[[22,14,"Hígado"],[22,104,"Riñón: renina"],[80,14,"Ang I"],[80,60,"Pulmón: ECA"],[138,60,"Ang II"]]},{"cap":"\u003cb>Lo que hace la angiotensina II.\u003c/b> Contrae las arteriolas (sube la resistencia) y estimula a la suprarrenal para liberar aldosterona, que retiene sodio y agua en el riñón. Resultado: sube la PA.","labels":[[40,30,"Vasoconstricción"],[118,30,"Suprarrenal"],[120,104,"Aldosterona: retiene Na"]]},{"cap":"\u003cb>IECA (-pril).\u003c/b> Bloquean la ECA: no se forma angiotensina II. Como la ECA también degrada bradicinina, esta se acumula y causa tos y, rara vez, angioedema.","labels":[[80,60,"ECA ✕"],[124,98,"Bradicinina ↑ → tos"]]},{"cap":"\u003cb>ARA-II (-sartán).\u003c/b> Bloquean el receptor AT1: la angiotensina II se forma pero no actúa. No acumulan bradicinina, por eso no dan tos.","labels":[[118,40,"Receptor AT1 ✕"],[40,104,"Sin tos"]]},{"cap":"\u003cb>Espironolactona.\u003c/b> Bloquea el receptor de aldosterona en el túbulo colector: sale sodio y se retiene potasio. Es el cuarto fármaco en la HTA resistente; vigila el potasio.","labels":[[118,40,"Aldosterona"],[80,104,"Receptor ✕ · K ↑"]]}]},"glomerulo":{"title":"La barrera de filtración y sus depósitos","steps":[{"cap":"\u003cb>Barrera normal.\u003c/b> La sangre del capilar (arriba) cruza el endotelio fenestrado, la membrana basal y los pedicelos de los podocitos hacia el espacio de Bowman (abajo). Pasan agua y solutos pequeños; la albúmina y los eritrocitos no.","labels":[[20,10,"Capilar"],[140,46,"Endotelio"],[140,58,"Membrana basal"],[140,72,"Podocitos"],[24,108,"Bowman"]]},{"cap":"\u003cb>Cambios mínimos.\u003c/b> Los pedicelos se fusionan y la barrera pierde su carga negativa: la albúmina se escapa a la orina en grandes cantidades, sin inflamación ni depósitos. Patrón nefrótico.","labels":[[140,72,"Pedicelos fusionados"],[60,108,"Albúmina en orina"]]},{"cap":"\u003cb>Depósitos subepiteliales.\u003c/b> Inmunocomplejos entre la membrana basal y los podocitos: “jorobas” en la postinfecciosa y “espigas” en la membranosa.","labels":[[140,72,"Subepitelial"],[40,30,"Inmunocomplejos"]]},{"cap":"\u003cb>Depósitos subendoteliales.\u003c/b> Del lado de la sangre activan el complemento y atraen neutrófilos: inflamación, hematuria y cilindros eritrocitarios. Típico del lupus (clase IV) y de la membranoproliferativa.","labels":[[140,46,"Subendotelial"],[60,108,"Eritrocitos en orina"]]},{"cap":"\u003cb>Mesangio e IgA.\u003c/b> En la nefropatía por IgA los depósitos quedan en el mesangio, entre los capilares. Da hematuria a los pocos días de una infección respiratoria, con complemento normal.","labels":[[80,92,"Mesangio: IgA"]]},{"cap":"\u003cb>Anti-MBG.\u003c/b> Los anticuerpos se pegan de forma lineal a lo largo de toda la membrana basal (colágeno IV). En el pulmón hacen lo mismo: hemoptisis + GN rápidamente progresiva = Goodpasture.","labels":[[140,58,"IgG lineal"],[40,30,"Anti-MBG"]]}]},"stda":{"title":"De H. pylori a la úlcera","steps":[{"cap":"\u003cb>Mucosa protegida.\u003c/b> El ácido de las células parietales llena la luz gástrica, pero una capa de moco con bicarbonato (sostenida por las prostaglandinas) protege el epitelio.","labels":[[30,10,"Ácido (H⁺)"],[80,52,"Moco + bicarbonato"],[80,78,"Epitelio"],[130,108,"Célula parietal"]]},{"cap":"\u003cb>H. pylori.\u003c/b> Su ureasa convierte la urea en amoníaco, que lo protege del ácido. Inflama la mucosa y debilita la barrera.","labels":[[46,42,"H. pylori"],[100,28,"Amoníaco"],[80,78,"Inflamación"]]},{"cap":"\u003cb>AINE.\u003c/b> Bloquean la COX-1 y bajan las prostaglandinas: se produce menos moco y bicarbonato, y la mucosa queda expuesta al ácido.","labels":[[40,104,"COX-1 ✕"],[80,52,"Menos moco"]]},{"cap":"\u003cb>Úlcera.\u003c/b> El ácido atraviesa la mucosa y la submucosa. Si alcanza un vaso, sangra: hematemesis o melena.","labels":[[80,66,"Úlcera"],[80,104,"Vaso que sangra"]]},{"cap":"\u003cb>IBP.\u003c/b> Bloquean la bomba H⁺/K⁺ ATPasa de la célula parietal, el último paso de la secreción de ácido. La mucosa puede cicatrizar; los antibióticos eliminan a H. pylori.","labels":[[130,108,"Bomba H⁺/K⁺ ✕"],[30,10,"Menos ácido"]]}]},"pancrea":{"title":"La autodigestión","steps":[{"cap":"\u003cb>Célula acinar normal.\u003c/b> Fabrica enzimas inactivas (tripsinógeno) en gránulos y las envía por el conducto hacia el duodeno, donde se activan.","labels":[[40,14,"Célula acinar"],[40,64,"Tripsinógeno"],[130,64,"Conducto"],[140,104,"Duodeno"]]},{"cap":"\u003cb>Obstrucción o alcohol.\u003c/b> Un lito en la ampolla (o el alcohol) frena la salida. Dentro de la célula el tripsinógeno se activa antes de tiempo y se convierte en tripsina.","labels":[[140,80,"Lito"],[40,64,"Tripsina activa"]]},{"cap":"\u003cb>Autodigestión.\u003c/b> La tripsina activa a otras enzimas (elastasa, fosfolipasa): se digiere el propio páncreas y la grasa alrededor. Edema, necrosis y hemorragia.","labels":[[40,64,"Enzimas activas"],[100,30,"Necrosis"]]},{"cap":"\u003cb>Respuesta sistémica.\u003c/b> Las citocinas salen a la circulación: fuga capilar, hipovolemia, SRIS y falla orgánica (pulmón, riñón, choque). Por eso se reponen líquidos y se vigilan los órganos.","labels":[[80,14,"Citocinas"],[40,104,"Pulmón"],[120,104,"Riñón"]]}]},"ar":{"title":"Del sinovio al pannus","steps":[{"cap":"\u003cb>Articulación sana.\u003c/b> Dos huesos cubiertos de cartílago, separados por líquido sinovial. La membrana sinovial es delgada.","labels":[[80,12,"Hueso"],[36,60,"Sinovial"],[126,60,"Cartílago"],[80,108,"Hueso"]]},{"cap":"\u003cb>Inflamación.\u003c/b> Linfocitos T y B y macrófagos llegan al sinovio y liberan TNF, IL-6 e IL-1. El sinovio se engrosa y produce más líquido: la articulación se hincha y duele.","labels":[[36,60,"Sinovitis"],[120,30,"TNF · IL-6"]]},{"cap":"\u003cb>Pannus.\u003c/b> El sinovio inflamado crece como un tejido invasor que se come el cartílago y erosiona el hueso en los bordes (erosiones marginales). El daño es irreversible.","labels":[[50,46,"Pannus"],[120,76,"Erosión"]]},{"cap":"\u003cb>Tratamiento.\u003c/b> El metotrexato y los biológicos (anti-TNF, anti-IL-6) apagan la inflamación: el pannus retrocede y se detiene el daño. Por eso se trata temprano.","labels":[[80,12,"Metotrexato / anti-TNF"],[36,60,"Sinovio en calma"]]}]},"gota":{"title":"Cristales, inflamación y alopurinol","steps":[{"cap":"\u003cb>Urato en exceso.\u003c/b> Las purinas se convierten en xantina y luego en ácido úrico gracias a la xantina oxidasa. Por arriba de 6.8 mg/dL el urato ya no cabe disuelto.","labels":[[30,14,"Purinas"],[80,14,"Xantina oxidasa"],[130,14,"Ácido úrico"]]},{"cap":"\u003cb>Precipitación.\u003c/b> En articulaciones frías y periféricas (el dedo gordo del pie), el urato cristaliza en forma de agujas dentro del líquido sinovial.","labels":[[80,104,"Cristales en aguja"],[24,60,"1ª MTF"]]},{"cap":"\u003cb>Ataque.\u003c/b> Los macrófagos fagocitan los cristales y activan el inflamasoma: liberan IL-1β y llegan neutrófilos. La articulación se pone roja, caliente y muy dolorosa.","labels":[[40,40,"Macrófago"],[120,40,"IL-1β"],[80,104,"Neutrófilos"]]},{"cap":"\u003cb>Colchicina.\u003c/b> Bloquea los microtúbulos de los neutrófilos: no pueden migrar ni amplificar la inflamación. Por eso funciona mejor en las primeras horas.","labels":[[80,104,"Microtúbulos ✕"],[120,40,"Menos inflamación"]]},{"cap":"\u003cb>Alopurinol.\u003c/b> Inhibe la xantina oxidasa: se forma menos ácido úrico y, con el tiempo, los cristales se disuelven. Meta: urato \u003c6 mg/dL.","labels":[[80,14,"Xantina oxidasa ✕"],[130,104,"Urato \u003c6"]]}]},"aortica":{"title":"Flujo por la válvula aórtica","steps":[{"cap":"\u003cb>Válvula sana.\u003c/b> En la sístole el VI se contrae, las valvas se abren por completo y la sangre sale a la aorta sin turbulencia.","labels":[[66,106,"VI"],[120,14,"Aorta"],[80,50,"Válvula"]]},{"cap":"\u003cb>Estenosis.\u003c/b> Valvas calcificadas que casi no se abren: el chorro sale a gran velocidad y con turbulencia (soplo sistólico). El VI se engrosa para vencer la resistencia (hipertrofia concéntrica).","labels":[[80,50,"Orificio estrecho"],[124,30,"Chorro ≥4 m/s"],[66,106,"VI hipertrófico"]]},{"cap":"\u003cb>Insuficiencia.\u003c/b> En la diástole la válvula no cierra: la sangre regresa de la aorta al VI (soplo diastólico). El VI recibe más volumen y se dilata (hipertrofia excéntrica).","labels":[[80,50,"Reflujo"],[66,106,"VI dilatado"]]},{"cap":"\u003cb>TAVI.\u003c/b> Una prótesis montada en un stent se coloca por catéter (por lo general por la arteria femoral) dentro de la válvula enferma y restablece la apertura sin cirugía abierta.","labels":[[80,50,"Prótesis"],[120,104,"Vía femoral"]]}]},"tep":{"title":"Del trombo al choque obstructivo","steps":[{"cap":"\u003cb>Trombo venoso.\u003c/b> Un trombo en las venas profundas de la pierna se desprende y viaja por la vena cava, cruza el corazón derecho y llega a la arteria pulmonar.","labels":[[24,104,"TVP"],[70,50,"VD"],[130,14,"Arteria pulmonar"]]},{"cap":"\u003cb>Oclusión.\u003c/b> El émbolo tapa ramas pulmonares: hay alvéolos ventilados sin perfusión (espacio muerto) e hipoxemia. Aumenta la resistencia vascular pulmonar.","labels":[[130,30,"Émbolo"],[120,80,"V/Q alterada"]]},{"cap":"\u003cb>Sobrecarga del VD.\u003c/b> El VD, de pared delgada, se dilata para vencer la resistencia. Empuja el tabique hacia el VI (forma de “D”) y sube la troponina por isquemia del VD.","labels":[[60,60,"VD dilatado"],[104,60,"VI comprimido"]]},{"cap":"\u003cb>Choque obstructivo.\u003c/b> El VI recibe poca sangre y cae el gasto: hipotensión y síncope. Es un TEP de alto riesgo: trombólisis sistémica.","labels":[[104,60,"Gasto ↓"],[80,104,"Trombólisis"]]}]}},"exam":{"date":"2026-11-10","start":"2026-10-22","label":"Parcial regional de Medicina Interna","place":"Aula 3 · Hospital Zambrano Hellion","weight":"25% de la calificación teórica","classes":{"5":"2026-10-27","6":"2026-11-03"},"sim":["2026-11-07","2026-11-08"]},"subjects":[{"id":"cardio","name":"Cardiología","short":"Cardio","color":"#FF5470","icon":"heart"},{"id":"endo","name":"Endocrinología","short":"Endo","color":"#B48CFF","icon":"thyroid"},{"id":"gastro","name":"Gastroenterología","short":"Gastro","color":"#FF9B3D","icon":"stomach"},{"id":"hemato","name":"Hematología","short":"Hemato","color":"#FF8FD0","icon":"drop"},{"id":"nefro","name":"Nefrología","short":"Nefro","color":"#4DB8FF","icon":"kidney"},{"id":"reuma","name":"Reumatología","short":"Reuma","color":"#C6E84A","icon":"bone"}],"topics":[{"id":"dm2","n":1,"pri":"alta","subj":"endo","weeks":[5,6],"title":"Diabetes tipo 2","sub":"Diagnóstico, metas, fármacos y elección según comorbilidad (metformina, iSGLT2, arGLP-1, iDPP-4, sulfonilureas, insulina)"},{"id":"sca","n":2,"pri":"alta","subj":"cardio","weeks":[2],"title":"Síndromes coro   g.disk(30, 32, 5, COL.cyan); g.disk(30, 32, 2, COL.blood);
  g.disk(80, 32, 7, COL.gold); for (let d = -3; d <= 3; d++) g.r(73, 32 + d, 7 - 2 * Math.abs(d), 1, COL.bg);
  g.disk(130, 32, 5, blocked ? COL.dead : COL.white);
  for (let x = 38; x < 70; x += 4) g.p(x, 32, COL.frame);
  for (let x = 90; x < 122; x += 4) g.p(x, 32, COL.frame);
  for (let i = 0; i < 3; i++) {
    const p = (t * 0.35 + i / 3) % 1;
    if (p < 0.5) g.r(lerp(36, 72, p * 2), 31, 3, 3, COL.cyan);
    else if (!blocked) g.r(lerp(88, 124, (p - 0.5) * 2), 31, 3, 3, COL.white);
    else g.r(70 - i * 4, 31, 3, 3, COL.cyan);
  }
  if (blocked) xMark(g, t, 80, 32, 5);
}
function urTank(g, t, level) {
  g.r(40, 52, 2, 54, COL.cap); g.r(118, 52, 2, 54, COL.cap); g.r(40, 104, 80, 2, COL.cap);
  const top = Math.round(104 - level * 48);
  g.r(42, top, 76, 104 - top, '#1E3A6A');
  for (let x = 42; x < 118; x += 4) g.r(x, 71, 2, 1, COL.gold);
  const n = Math.round(level * 16);
  for (let i = 0; i < n; i++) g.p(44 + rnd(i, 71) * 72, top + 2 + rnd(i, 72) * (102 - top), COL.white);
  const nd = Math.max(0, Math.floor((level - 0.68) * 40));
  for (let k = 0; k < nd; k++) { const x = 46 + ((k * 13) % 66); g.line(x, 102, x + 3, 95, COL.white); }
}
function needleField(g, n, x0, y0, w, h) { for (let k = 0; k < n; k++) { const x = x0 + rnd(k, 73) * w, y = y0 + rnd(k, 74) * h; g.line(x, y, x + 4, y - 3, COL.white); g.p(x + 4, y - 3, COL.gold); } }

function aoHeart(g, t, o) {

  ell(g, o.cx, o.cy, o.rx, o.ry, COL.lumen);

  const h = o.cy - o.ry - 58; g.r(70, 58, 2, h, COL.myo); g.r(88, 58, 2, h, COL.myo); g.r(72, 58, 16, h + 4, COL.lumen);
}
function leaflets(g, open, thick, gap) {
  const c = thick ? '#E0DCC8' : COL.cap, w = thick ? 3 : 1;
  if (open) { const o = thick ? 2 : 7; g.r(80 - o - w, 52, w, 8, c); g.r(80 + o, 52, w, 8, c); if (thick) { g.r(73, 54, 5, 6, c); g.r(82, 54, 5, 6, c); g.p(75, 55, COL.white); g.p(84, 57, COL.white); } }
  else { const h = gap || 0; g.r(72, 58, 8 - h, w + 1, c); g.r(80 + h, 58, 8 - h, w + 1, c); }
}
function aoFlow(g, t, n, sp, jitter = 0) {
  for (let i = 0; i < n; i++) {
    const p = (t * sp + i / n) % 1, [x, y] = along([[80, 84], [80, 13], [158, 13]], p);
    const j = jitter && y < 52 && y > 10 && x < 90 ? Math.sin(p * 40 + i) * jitter * (1 - y / 52) * 2 : 0;
    g.r(x - 1 + j, y - 1, 3, 2, COL.rbc);
  }
}

function svgSpr(rows, pal, scale = 2, label) {
  const h = rows.length, w = Math.max(...rows.map((r) => r.length));
  let rects = '';
  rows.forEach((row, y) => {
    let x = 0;
    while (x < row.length) {
      const ch = row[x];
      if (ch === '.' || !pal[ch]) { x++; continue; }
      let x2 = x; while (x2 + 1 < row.length && row[x2 + 1] === ch) x2++;
      rects += `<rect x="${x}" y="${y}" width="${x2 - x + 1}" height="1" fill="${pal[ch]}"/>`;
      x = x2 + 1;
    }
  });
  const a11y = label ? `role="img" aria-label="${esc(label)}"` : 'aria-hidden="true" focusable="false"';
  return `<svg class="spr" width="${w * scale}" height="${h * scale}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" ${a11y}>${rects}</svg>`;
}
function shade(hex, f = 0.6) {

}

    const s = 3, w = Math.ceil(innerWidth / s), h = Math.ceil(innerHeight / s);
    cv.width = w; cv.height = h; cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
    pts = [];
    const n = Math.round((w * h) / 420);
    for (let i = 0; i < n; i++) pts.push({ x: Math.floor(Math.random() * w), y: Math.floor(Math.random() * h), k: Math.random() < 0.04 ? 2 : Math.random() < 0.35 ? 1 : 0, ph: Math.random() * 6 });
    draw(0);
  };
  const draw = (t) => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const p of pts) {
      const on = reduce || Math.sin(t * 1.3 + p.ph) > -0.6;
      if (!on) continue;
      if (p.k === 2) { ctx.fillStyle = '#FFE7A6'; ctx.fillRect(p.x - 1, p.y, 3, 1); ctx.fillRect(p.x, p.y - 1, 1, 3); }
      else { ctx.fillStyle = p.k ? '#B9BFEC' : '#4A5296'; ctx.fillRect(p.x, p.y, 1, 1); }
    }

}

function diagAvg(filter) {

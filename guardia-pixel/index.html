<title>Guardia Pixel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Herramienta de estudio en pixel art para el parcial de Medicina Interna: diagnóstico, plan diario, lecciones, casos de guardia, tarjetas y simulacro.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Jersey+10&family=VT323&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: una columna tipo consola portátil (máx. 560px) sobre cielo estrellado azul marino.
   HUD fijo arriba (rango · XP · racha · sonido), barra de 5 secciones abajo.
   Lo especial (examen, carta, mnemotecnia) va en marco dorado con gemas en las esquinas.
   Diseño de un solo tema oscuro, a propósito: es una pantalla de videojuego. */
:root{
  --void:#090B20;
  --sky:#0E1230;
  --panel:#141A42;
  --panel-2:#1B2253;
  --line:#2D3680;
  --line-2:#4150A8;
  --ink:#EEF0FF;
  --ink-2:#B9BFEC;
  --ink-3:#8790CC;
  --gold:#F2C14E;
  --gold-2:#B9832A;
  --gold-3:#FFE7A6;
  --wine:#3B0F26;
  --wine-2:#5C1A3C;
  --ok:#4BE38F;
  --ok-bg:#0F3328;
  --bad:#FF5C70;
  --bad-bg:#3A1222;
  --warn:#FFB547;
  --warn-bg:#3A2A10;
  --cyan:#62E3FF;
  --mon:#03110B;
  --mon-line:#0F3A2A;
  --shade:#05061A;
  --f-px:'Press Start 2P','Courier New',monospace;
  --f-ui:'Jersey 10','Arial Narrow',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'VT323',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--void)}
body{margin:0;background:var(--void);color:var(--ink);font:16px/1.55 var(--f-body);min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--void)}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;image-rendering:pixelated}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wrap{position:relative;z-index:1;padding-block:16px calc(104px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;outline:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
a{color:var(--cyan)}
h1,h2,h3{font-family:var(--f-ui);font-weight:400;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:36px}
h2{font-size:27px}
h3{font-size:23px}
p{margin:0}
.h2{display:block;font:26px/1.15 var(--f-ui);text-wrap:balance}
.px{font:19px/1.3 var(--f-ui);letter-spacing:.12em;text-transform:uppercase}
.eyebrow{font:15px/1.4 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.spr{display:inline-block;vertical-align:middle;image-rendering:pixelated;flex:none}

/* ───── HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--void);border-bottom:3px solid var(--line)}
.hud-in{display:flex;align-items:center;gap:12px;padding-block:8px}
.rank{flex:none;min-width:52px;height:40px;padding:0 8px;background:var(--panel-2);border:3px solid var(--gold);color:var(--gold);font:12px/1 var(--f-px);box-shadow:0 3px 0 var(--gold-2)}
.xp{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.xp-top{display:flex;justify-content:space-between;gap:8px;font:15px/1 var(--f-mono);color:var(--ink-2);white-space:nowrap;overflow:hidden}
.xp-top b{color:var(--gold);font-weight:400}
.streak{flex:none;display:flex;align-items:center;gap:4px;font:20px/1 var(--f-mono);color:var(--warn)}
.snd{flex:none;height:40px;padding:0 8px;background:transparent;border:3px solid var(--line);color:var(--ink-2);font:16px/1 var(--f-mono)}
.snd[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan)}

/* Barra segmentada estilo videojuego */
.seg{--p:0;--c:var(--gold);height:12px;background:var(--shade);border:2px solid var(--line);position:relative;overflow:hidden}
.seg i{position:absolute;inset:0 auto 0 0;width:calc(var(--p)*100%);background:repeating-linear-gradient(90deg,var(--c) 0 8px,transparent 8px 10px)}
.seg.ok{--c:var(--ok)}
.seg.cy{--c:var(--cyan)}
.seg.bad{--c:var(--bad)}

/* ───── Barra inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--void);border-top:3px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-3);font:16px/1 var(--f-ui);min-height:56px}
.tab .spr{opacity:.8}
.tab[aria-current="page"]{color:var(--gold)}
.tab[aria-current="page"] .spr{opacity:1}

/* ───── Paneles y botones */
.panel{background:var(--panel);border:3px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 0 var(--shade)}
.panel.tight{gap:8px;padding:12px}
.gold{position:relative;border:3px solid var(--gold);box-shadow:0 0 0 3px var(--void),0 0 0 6px var(--gold-2),0 8px 0 var(--shade);margin:6px}
.gem{position:absolute;width:12px;height:12px;background:var(--gold);transform:rotate(45deg);box-shadow:inset 0 0 0 2px var(--gold-3),0 0 0 2px var(--void);z-index:2}
.gem.tl{top:-10px;left:-10px}.gem.tr{top:-10px;right:-10px}.gem.bl{bottom:-10px;left:-10px}.gem.br{bottom:-10px;right:-10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 14px;background:var(--panel-2);border:3px solid var(--line-2);color:var(--ink);font:20px/1.2 var(--f-ui);box-shadow:0 4px 0 var(--shade);text-align:center;text-decoration:none;transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shade)}
.btn.gold-btn{background:var(--gold);border-color:var(--gold-3);color:#241500;box-shadow:0 4px 0 var(--gold-2)}
.btn.gold-btn:active{box-shadow:0 1px 0 var(--gold-2)}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:4px 10px;font-size:14px}
.btn.big{min-height:56px;font-size:19px;width:100%}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--cyan);font:inherit;text-decoration:underline;text-underline-offset:3px}

.chip{--sc:var(--ink-3);display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:2px solid var(--sc);color:var(--sc);font:16px/1.2 var(--f-ui);background:var(--void);white-space:nowrap}
.chip.fill{background:var(--sc);color:#0B0E2A}
.pri{font:9px/1 var(--f-px);padding:5px 6px;letter-spacing:.06em;border:2px solid}
.pri.alta{color:var(--bad);border-color:var(--bad)}
.pri.media{color:var(--warn);border-color:var(--warn)}
.pri.baja{color:var(--ink-3);border-color:var(--ink-3)}
.stars-d{font:14px/1 var(--f-mono);color:var(--gold);letter-spacing:1px}

/* ───── Inicio */
.count{background:radial-gradient(120% 90% at 50% 0%,var(--panel-2),var(--panel));padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.count-row{display:flex;align-items:center;gap:16px}
.bignum{font:44px/1 var(--f-px);color:var(--gold);text-shadow:4px 4px 0 var(--gold-2);min-width:2ch}
.meter{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;font:16px/1 var(--f-mono);color:var(--ink-2)}
.cta-diag{display:flex;flex-direction:column;gap:10px;background:var(--panel-2)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--panel);border:3px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;box-shadow:0 4px 0 var(--shade);color:var(--ink);min-width:0}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shade)}
.tile .n{font:34px/1 var(--f-mono);color:var(--cyan)}
.tile .t{font:20px/1.2 var(--f-ui)}
.tile .d{font-size:13px;color:var(--ink-3)}

/* Carta misteriosa */
.carta{--lat:rgba(242,193,78,.22);background:
  radial-gradient(60% 55% at 50% 38%,rgba(255,231,166,.28),transparent 70%),
  repeating-linear-gradient(45deg,var(--lat) 0 2px,transparent 2px 18px),
  repeating-linear-gradient(-45deg,var(--lat) 0 2px,transparent 2px 18px),
  var(--wine);
  padding:18px 16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-align:left;color:var(--ink);width:calc(100% - 12px);font:inherit;cursor:pointer}
.carta .h2{color:var(--gold-3)}
.carta .medal{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle,var(--wine-2) 55%,var(--gold-2) 56%,var(--gold) 64%,var(--gold-2) 70%,transparent 71%);display:grid;place-items:center}
.carta h2{color:var(--gold-3)}
.carta.done{filter:saturate(.5)}
.carta.flip{animation:flip .5s steps(6) both}
@keyframes flip{0%{transform:scaleX(1)}50%{transform:scaleX(0)}100%{transform:scaleX(1)}}

/* ───── Plan */
.days{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.day{background:var(--panel);border:3px solid var(--line);padding:10px 12px}
.day.today{border-color:var(--gold)}
.day.past{opacity:.6}
.day-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;margin-bottom:6px}
.day-h b{font:21px/1.2 var(--f-ui)}
.dtype{font:15px/1.4 var(--f-ui);color:var(--ink-3);letter-spacing:.12em;text-transform:uppercase}
.day-h .mins{margin-left:auto;font:17px/1 var(--f-mono);color:var(--ink-2)}
.blks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.blk{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:2px dashed var(--line)}
.blk:first-child{border-top:0}
.blk label{display:flex;gap:10px;align-items:flex-start;flex:1;min-width:0;cursor:pointer}
.blk input{appearance:none;flex:none;width:22px;height:22px;margin:1px 0 0;border:3px solid var(--line-2);background:var(--void);display:grid;place-items:center}
.blk input:checked{background:var(--ok);border-color:var(--ok)}
.blk input:checked::after{content:"";width:8px;height:8px;background:var(--void)}
.blk-t{flex:1;min-width:0;font-size:15px;line-height:1.35}
.blk-t small{display:block;color:var(--ink-3);font-size:13px}
.blk.done .blk-t{color:var(--ink-3);text-decoration:line-through}
.blk-m{flex:none;font:16px/1.2 var(--f-mono);color:var(--ink-2)}
.budget{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.field .lab{font:15px/1.3 var(--f-ui);color:var(--ink-2)}
select,input[type=number],input[type=text],textarea{background:var(--void);border:3px solid var(--line-2);padding:8px;min-height:44px;width:100%;color:var(--ink);border-radius:0}
textarea{min-height:90px;font:14px/1.4 var(--f-mono)}
.note{border:2px solid var(--warn);background:var(--warn-bg);padding:10px 12px;font-size:14px}

/* ───── Temario */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{cursor:pointer;min-height:36px}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.titem{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;width:100%;text-align:left;background:var(--panel);border:3px solid var(--line);padding:10px;color:var(--ink);box-shadow:0 3px 0 var(--shade)}
.titem:active{transform:translateY(2px)}
.titem .num{font:12px/1 var(--f-px);color:var(--ink-3);text-align:center}
.titem .tt{font:20px/1.25 var(--f-ui)}
.titem .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:5px}
.titem .mbar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:6px;font:15px/1 var(--f-mono);color:var(--ink-2)}
.locked{color:var(--ink-3);font:16px/1.2 var(--f-ui);display:inline-flex;gap:5px;align-items:center}

/* Mapa de calor */
.heat{display:flex;flex-direction:column;gap:10px}
.hrow{display:grid;grid-template-columns:94px 1fr;gap:10px;align-items:center}
.hrow .hs{display:flex;align-items:center;gap:6px;font:18px/1.1 var(--f-ui);color:var(--sc)}
.hcells{display:flex;flex-wrap:wrap;gap:6px}
.hc{width:48px;height:44px;border:2px solid var(--void);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:15px/1 var(--f-mono);color:#0B0E2A;background:var(--ink-3)}
.hc small{font:8px/1 var(--f-px);opacity:.8}
.hc.lo{background:var(--bad)}.hc.mid{background:var(--warn)}.hc.hi{background:var(--ok)}.hc.na{background:var(--line);color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-1px}

/* ───── Tema */
.thead{display:flex;flex-direction:column;gap:8px}
.ttabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.ttabs::-webkit-scrollbar{display:none}
.ttab{flex:none;min-height:40px;padding:6px 12px;background:var(--panel);border:3px solid var(--line);color:var(--ink-2);font:19px/1 var(--f-ui)}
.ttab[aria-selected="true"]{background:var(--gold);border-color:var(--gold-3);color:#241500}
.hook{font-size:17px;color:var(--ink);border-left:4px solid var(--gold);padding-left:12px}
.lsec{display:flex;flex-direction:column;gap:8px}
.lsec h3{color:var(--gold-3);display:flex;gap:8px;align-items:center}
.lsec h3::before{content:"";width:8px;height:8px;background:var(--gold);flex:none}
.lsec ul,.lsec ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.lsec p{max-width:65ch}
.tablewrap{overflow-x:auto;border:2px solid var(--line)}
table.mini{border-collapse:collapse;width:100%;min-width:420px;font-size:14px;line-height:1.35}
table.mini th{font:16px/1.2 var(--f-ui);color:var(--gold-3);text-align:left;background:var(--panel-2);padding:7px 8px}
table.mini td{padding:7px 8px;border-top:2px solid var(--line);vertical-align:top}
.decide{display:flex;flex-direction:column;gap:6px}
.decide p{display:grid;grid-template-columns:1fr 1fr;gap:0;border:2px solid var(--line)}
.decide .if{padding:8px 10px;background:var(--panel-2);font-size:14px}
.decide .then{padding:8px 10px;font-size:14px;font-weight:700;color:var(--ok);border-left:2px solid var(--line)}
.box{border:3px solid;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.box .lab{font:15px/1.4 var(--f-ui);letter-spacing:.14em;text-transform:uppercase}
.box.pearl{border-color:var(--cyan);background:#0C2233}.box.pearl .lab{color:var(--cyan)}
.box.trap{border-color:var(--bad);background:var(--bad-bg)}.box.trap .lab{color:var(--bad)}
.box.guide{border-color:var(--warn);background:var(--warn-bg)}.box.guide .lab{color:var(--warn)}
.box.guide ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.box.mnemo{background:var(--wine);border-color:var(--gold)}.box.mnemo .lab{color:var(--gold)}
.box.mnemo .big{font:24px/1.3 var(--f-ui);color:var(--gold-3)}
details.refs summary{cursor:pointer;color:var(--ink-2);font:19px/1.4 var(--f-ui)}
details.refs ol{margin:8px 0 0;padding-left:20px;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}

/* Comparador lado a lado */
.cmp{display:flex;flex-direction:column;gap:0;border:3px solid var(--line);background:var(--panel)}
.cmp-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:12px;background:var(--panel-2);border-bottom:3px solid var(--line)}
.cmp-h .a,.cmp-h .b{font:13px/1.4 var(--f-px);text-align:center;color:var(--cyan)}
.cmp-h .b{color:var(--bad)}
.cmp-h .x{font:18px/1 var(--f-px);color:var(--gold)}
.cmp-r{border-top:2px dashed var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.cmp-r:first-of-type{border-top:0}
.cmp-r .k{font:15px/1.4 var(--f-ui);color:var(--ink-3);letter-spacing:.12em;text-transform:uppercase}
.cmp-r .v{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:14px;line-height:1.35}
.cmp-r .v span{min-width:0}
.cmp-r .v span:first-child{border-left:3px solid var(--cyan);padding-left:8px}
.cmp-r .v span:last-child{border-left:3px solid var(--bad);padding-left:8px}

/* Animaciones */
.stage{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;border:3px solid var(--line);background:#0B0E2A;overflow:hidden}
.stage canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.labels{position:absolute;inset:0;pointer-events:none}
.labels span{position:absolute;transform:translate(-50%,-50%);font:clamp(13px,3.6vw,18px)/1 var(--f-mono);color:var(--ink);background:rgba(9,11,32,.78);padding:1px 4px;white-space:nowrap}
.cap{min-height:5.2em;font-size:15px;line-height:1.5}
.cap b{color:var(--gold-3)}
.actrl{display:grid;grid-template-columns:1fr 1fr auto 1fr;gap:8px;align-items:center}
.stepn{font:16px/1 var(--f-mono);color:var(--ink-2);text-align:center;padding:0 4px}
.pips{display:flex;gap:6px;justify-content:center}
.pips button{width:14px;height:14px;border:2px solid var(--line-2);background:var(--void);padding:0}
.pips button[aria-current="step"]{background:var(--gold);border-color:var(--gold)}

/* ───── Preguntas */
.qhead{display:flex;align-items:center;gap:10px}
.qhead .grow{display:flex;flex-direction:column;gap:6px}
.qprog{font:16px/1 var(--f-mono);color:var(--ink-2)}
.qcard{background:var(--panel);border:3px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stem{font-size:17px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:10px 12px;background:var(--panel-2);border:3px solid var(--line-2);color:var(--ink);font-size:16px;line-height:1.4;box-shadow:0 3px 0 var(--shade)}
.opt:active:not([disabled]){transform:translateY(2px);box-shadow:0 1px 0 var(--shade)}
.opt .key{width:30px;height:30px;display:grid;place-items:center;border:3px solid var(--gold);color:var(--gold);font:11px/1 var(--f-px);background:var(--void)}
.opt.sel{border-color:var(--gold)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .key{background:var(--ok);border-color:var(--ok);color:#06210F}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:#2A0710}
.opt[disabled]{cursor:default}
.verdict{display:flex;align-items:center;gap:10px;font:25px/1.2 var(--f-ui)}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.verdict .xpgain{margin-left:auto;font:18px/1 var(--f-mono);color:var(--gold)}
.fb{display:flex;flex-direction:column;gap:10px;border-top:3px dashed var(--line);padding-top:12px}
.fb .why{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:15px}
.fb .why li{display:grid;grid-template-columns:24px 1fr;gap:8px}
.fb .why b{font:10px/2 var(--f-px);color:var(--ink-3)}
.ref{font-size:13px;color:var(--ink-3)}
.lives{display:flex;gap:4px}
.bosshp{display:flex;flex-direction:column;gap:4px;font:16px/1.4 var(--f-ui);color:var(--bad);letter-spacing:.1em;text-transform:uppercase}
.timer{font:22px/1 var(--f-mono);color:var(--cyan)}
.timer.low{color:var(--bad)}
.result{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.score{font:40px/1 var(--f-px);color:var(--gold);text-shadow:4px 4px 0 var(--gold-2)}
.missed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.missed details{background:var(--panel);border:3px solid var(--line);padding:10px 12px}
.missed summary{cursor:pointer;font-size:15px}
.subjbars{display:flex;flex-direction:column;gap:8px}
.sbar{display:grid;grid-template-columns:96px 1fr 52px;gap:10px;align-items:center;font:15px/1 var(--f-mono);color:var(--ink-2)}
.sbar .nm{font:18px/1.1 var(--f-ui);color:var(--sc)}

/* ───── Modo guardia */
.case-h{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.case-h .who{font:22px/1.2 var(--f-ui)}
.monitor{background:var(--mon);border:3px solid var(--mon-line);box-shadow:inset 0 0 0 2px #000,0 4px 0 var(--shade);padding:10px;display:flex;flex-direction:column;gap:8px}
.monitor canvas{width:100%;height:auto;aspect-ratio:4/1;display:block;image-rendering:pixelated}
.vitals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.vit{display:flex;flex-direction:column;gap:2px;min-width:0}
.vit .l{font:14px/1.3 var(--f-ui);letter-spacing:.06em;color:#6FA88C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vit .v{font:30px/1 var(--f-mono);color:var(--ok);white-space:nowrap}
.vit .v small{font-size:15px;color:#6FA88C}
.vit.pa .v{color:var(--cyan)}
.vit.sat .v{color:#7FD9FF}
.vit.x .v{color:var(--warn)}
.vit.alarm .v{color:var(--bad);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.scene{font-size:16px;line-height:1.5}
.ab{display:grid;grid-template-columns:1fr;gap:10px}
.abbtn{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;text-align:left;padding:12px;background:var(--panel-2);border:3px solid var(--line-2);color:var(--ink);font-size:16px;line-height:1.35;box-shadow:0 4px 0 var(--shade)}
.abbtn:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--shade)}
.abbtn .k{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--gold-3);color:#3A2400;font:14px/1 var(--f-px);box-shadow:inset -3px -3px 0 var(--gold-2)}
.abbtn.right{border-color:var(--ok);background:var(--ok-bg)}
.abbtn.wrong{border-color:var(--bad);background:var(--bad-bg)}
.tbar{height:10px;border:2px solid var(--line);background:var(--shade)}
.tbar i{display:block;height:100%;background:var(--cyan);width:100%}
.tbar.low i{background:var(--bad)}
.outcome{border:3px solid;padding:12px;display:flex;flex-direction:column;gap:8px}
.outcome.ok{border-color:var(--ok);background:var(--ok-bg)}
.outcome.no{border-color:var(--bad);background:var(--bad-bg)}

/* ───── Tarjetas */
.fcard{min-height:220px;background:var(--panel-2);border:3px solid var(--gold);box-shadow:0 0 0 3px var(--void),0 0 0 6px var(--gold-2);padding:20px 18px;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center;margin:6px;width:calc(100% - 12px);color:var(--ink)}
.fcard .side{font:15px/1.4 var(--f-ui);color:var(--ink-3);letter-spacing:.12em;text-transform:uppercase}
.fcard .txt{font:25px/1.35 var(--f-ui)}
.fcard.back .txt{font:400 18px/1.45 var(--f-body)}
.fcard.turn{animation:flip .35s steps(5) both}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* ───── Ruleta */
.wheel-wrap{position:relative;align-self:center;width:min(300px,78vw);aspect-ratio:1;max-width:100%;background:var(--wine);display:grid;place-items:center;padding:14px}
.wheel-wrap canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.pointer{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:20px solid var(--gold-3);filter:drop-shadow(0 3px 0 var(--gold-2));z-index:3}

/* ───── Herramientas */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tools .tile{min-height:104px}
.calc{display:flex;flex-direction:column;gap:12px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.checks{display:flex;flex-direction:column;gap:8px}
.checks label{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;font-size:15px;cursor:pointer}
.checks input{width:22px;height:22px;accent-color:var(--gold);margin:1px 0 0}
.out{border:3px solid var(--cyan);background:#0C2233;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.out .big{font:34px/1 var(--f-mono);color:var(--cyan)}
.out .lab{font:15px/1.4 var(--f-ui);color:var(--cyan);letter-spacing:.14em;text-transform:uppercase}
.example{font-size:13px;color:var(--warn)}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.achi{border:3px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:4px;background:var(--panel)}
.achi.got{border-color:var(--gold);background:var(--wine)}
.achi .t{font:19px/1.2 var(--f-ui)}
.achi .d{font-size:13px;color:var(--ink-2)}
.ranks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ranks li{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:2px solid var(--line);font-size:15px}
.ranks li.me{border-color:var(--gold);background:var(--wine)}
.ranks .rk{font:11px/1 var(--f-px);color:var(--gold)}
.ranks .rx{font:16px/1 var(--f-mono);color:var(--ink-2)}

/* ───── Toast y modal */
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);z-index:50;background:var(--void);border:3px solid var(--gold);color:var(--gold-3);font:19px/1.3 var(--f-ui);padding:8px 14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,6,26,.82);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .panel{max-width:420px;width:100%}

@media (max-width:380px){
  .budget{grid-template-columns:1fr}
  .vit .v{font-size:25px}
  .bignum{font-size:36px}
  .tools,.ach{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .hrow{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

<script type="application/json" id="contenido">{"questions":[{"diag":true,"id":"dx-c1","topic":"sca","subj":"cardio","dif":1,"stem":"Hombre de 59 años con dolor torácico de 1 h. ECG: elevación del ST en DII, DIII y aVF. ¿Qué arteria es la responsable más probable?","opts":["Descendente anterior","Coronaria derecha","Tronco de la coronaria izquierda","Primera diagonal","Circunfleja"],"ans":1,"exp":"La cara inferior (DII, DIII, aVF) la irriga la coronaria derecha en ~80–90% de las personas (dominancia derecha). Pista extra: si el ST de DIII es mayor que el de DII y hay infradesnivel en DI y aVL, apunta a la CD.","why":["La DA da IAM anterior (V1–V4).","","La lesión de tronco da infradesnivel difuso con elevación en aVR.","Las diagonales dan IAM lateral alto (DI, aVL).","La circunfleja puede causar IAM inferior (dominancia izquierda, ~10–20%), pero es menos probable que la CD."],"ref":"ESC 2023 SCA"},{"diag":true,"id":"dx-c2","topic":"scc","subj":"cardio","dif":2,"stem":"Hombre de 62 años con angina estable de esfuerzo y FEVI normal. Ya toma un betabloqueador y nitroglicerina sublingual de rescate. ¿Qué fármaco agregas porque reduce eventos cardiovasculares y no solo síntomas?","opts":["Nitrato de acción prolongada","Ranolazina","Estatina de alta intensidad","Ivabradina","Trimetazidina"],"ans":2,"exp":"En el síndrome coronario crónico mejoran el pronóstico: aspirina 75–100 mg, estatina de alta intensidad (meta LDL \u003c55 mg/dL) e IECA/ARA-II si hay HTA, DM, ERC o FEVI ≤40%. Los antianginosos solo controlan síntomas.","why":["Antianginoso: alivia síntomas, no reduce infartos ni mortalidad.","Antianginoso de segunda línea; no cambia el pronóstico.","","Baja la frecuencia cardiaca para aliviar angina; no reduce eventos en SCC.","Antianginoso metabólico; sin beneficio en eventos."],"ref":"ESC 2024 síndromes coronarios crónicos"},{"diag":true,"id":"dx-c3","topic":"aortica","subj":"cardio","dif":2,"stem":"Mujer de 76 años con síncope de esfuerzo. Soplo sistólico expulsivo en foco aórtico irradiado a carótidas y pulso parvus et tardus. ¿Qué hallazgo del ecocardiograma define estenosis aórtica GRAVE?","opts":["Área valvular de 1.6 cm²","Gradiente medio de 22 mmHg","Velocidad pico ≥4 m/s","Insuficiencia mitral leve","FEVI de 60%"],"ans":2,"exp":"Estenosis aórtica grave: velocidad pico ≥4 m/s, gradiente medio ≥40 mmHg y área valvular ≤1.0 cm². Si es grave y sintomática (angina, síncope o disnea), está indicado el reemplazo valvular: TAVI o cirugía según edad y riesgo.","why":[">1.5 cm² es estenosis leve; grave es ≤1.0 cm².","Grave requiere gradiente medio ≥40 mmHg.","","No define la gravedad de la estenosis aórtica.","Una FEVI normal no descarta gravedad; tampoco la define."],"ref":"ESC/EACTS 2025 · ACC/AHA 2020 valvulopatías"},{"diag":true,"id":"dx-c4","topic":"tep","subj":"cardio","dif":2,"stem":"Mujer de 39 años que toma anticonceptivos orales. Disnea súbita después de un vuelo de 12 h. PA 78/46 mmHg sostenida, FC 128. Angio-TC: TEP bilateral. Sin contraindicaciones para trombólisis. ¿Tratamiento?","opts":["Heparina de bajo peso molecular y alta en 48 h","Trombólisis sistémica más heparina no fraccionada","Filtro de vena cava como primera opción","Oxígeno y vigilancia","Anticoagulante oral directo ambulatorio"],"ans":1,"exp":"TEP de alto riesgo = inestabilidad hemodinámica (PAS \u003c90 mmHg por ≥15 min, necesidad de vasopresor o paro). Está indicada la trombólisis sistémica con heparina no fraccionada. Si hay contraindicación: embolectomía quirúrgica o tratamiento dirigido por catéter.","why":["La HBPM sola es para riesgo intermedio o bajo; aquí hay choque obstructivo.","","El filtro se reserva para quien no puede anticoagularse.","Con choque obstructivo, sin reperfusión puede morir.","Solo para TEP de bajo riesgo y estable."],"ref":"ESC 2019 TEP"},{"diag":true,"id":"dx-c5","topic":"mitral","subj":"cardio","dif":1,"stem":"Mujer de 34 años de una comunidad rural, con disnea progresiva y palpitaciones. ECG: fibrilación auricular. Auscultación: chasquido de apertura y retumbo diastólico en el ápex. ¿Causa más probable?","opts":["Prolapso de válvula mitral","Cardiopatía reumática con estenosis mitral","Miocardiopatía hipertrófica","Válvula aórtica bicúspide","Endocarditis aguda"],"ans":1,"exp":"Chasquido de apertura + retumbo diastólico apical = estenosis mitral. En mujeres jóvenes de países de ingreso medio, la causa principal es la fiebre reumática. La aurícula izquierda dilatada favorece la FA y la embolia. Si es grave y la anatomía es favorable, la valvuloplastia percutánea con balón es de elección.","why":["Da clic mesosistólico y soplo telesistólico.","","Soplo sistólico que aumenta con Valsalva.","Da soplo sistólico expulsivo aórtico, no retumbo diastólico apical.","Da soplo de regurgitación con fiebre; no chasquido de apertura."],"ref":"ESC/EACTS 2025 · ACC/AHA 2020 valvulopatías"},{"diag":true,"id":"dx-e1","topic":"dm2","subj":"endo","dif":1,"stem":"Hombre de 41 años con IMC 31. En la misma muestra: glucosa en ayuno 112 mg/dL y A1c 6.1%. ¿Diagnóstico y conducta?","opts":["Diabetes; iniciar metformina","Prediabetes; programa intensivo de estilo de vida (bajar ≥7% del peso y 150 min/semana de ejercicio)","Normal; repetir en 3 años","Diabetes; iniciar insulina","Prediabetes; iniciar una sulfonilurea"],"ans":1,"exp":"Glucosa en ayuno 100–125 y A1c 5.7–6.4% = prediabetes. El programa intensivo de estilo de vida redujo ~58% la progresión a DM2 en el estudio DPP. La metformina se considera sobre todo si IMC ≥35, edad \u003c60 años o diabetes gestacional previa. Se repite la glucosa cada año.","why":["Ninguna prueba alcanza el umbral de diabetes (A1c ≥6.5% o GA ≥126).","","Las dos pruebas están alteradas.","No es diabetes y no hay indicación de insulina.","Las sulfonilureas no se usan en prediabetes."],"ref":"ADA Standards of Care 2026, secc. 2–3"},{"diag":true,"id":"dx-e2","topic":"dm2","subj":"endo","dif":1,"stem":"Mujer de 69 años con DM2 e insuficiencia cardiaca con FEVI 35%. ¿Qué grupo de fármacos da beneficio tanto en la diabetes como en la insuficiencia cardiaca?","opts":["Tiazolidinedionas","Inhibidores de SGLT2","Sulfonilureas","Inhibidores de DPP-4","Meglitinidas"],"ans":1,"exp":"Los iSGLT2 (empagliflozina, dapagliflozina) reducen hospitalización por IC y muerte cardiovascular en IC con FE reducida y preservada, con o sin diabetes.","why":["Retienen líquidos y empeoran la IC.","","Sin beneficio cardiaco; causan hipoglucemia.","Neutros; la saxagliptina aumentó hospitalización por IC.","Secretagogos sin beneficio cardiaco."],"ref":"ADA 2026 secc. 9–10 · ESC IC 2021/2023"},{"diag":true,"id":"dx-e3","topic":"smdl","subj":"endo","dif":1,"stem":"Hombre de 57 años, 3 meses después de un infarto. Según las guías ESC/EAS, ¿cuál es su meta de LDL?","opts":["\u003c130 mg/dL","\u003c100 mg/dL","\u003c70 mg/dL","\u003c55 mg/dL y reducción ≥50% de la basal","No hay meta: basta con dar estatina"],"ans":3,"exp":"ECV establecida = muy alto riesgo: LDL \u003c55 mg/dL y reducción ≥50%. Alto riesgo: \u003c70. Moderado: \u003c100. Bajo: \u003c116. Si tiene un segundo evento en 2 años con estatina a dosis máxima, se puede considerar \u003c40.","why":["No corresponde a ninguna categoría de riesgo actual.","Es la meta de riesgo moderado.","Es la meta de alto riesgo, no de muy alto.","","Las guías ESC/EAS sí fijan metas numéricas de LDL."],"ref":"ESC/EAS dislipidemias 2019 y actualización 2025"},{"diag":true,"id":"dx-e4","topic":"smdl","subj":"endo","dif":2,"stem":"Hombre de 48 años sin tratamientos: cintura 104 cm, triglicéridos 182 mg/dL, HDL 44 mg/dL, PA 126/80 mmHg, glucosa en ayuno 106 mg/dL. ¿Tiene síndrome metabólico?","opts":["No, le faltan criterios","Sí: cumple 3 de 5 (cintura, triglicéridos y glucosa)","Sí: cumple los 5 criterios","No, porque el HDL es normal","Solo si tiene diabetes"],"ans":1,"exp":"Criterios armonizados (2009): ≥3 de 5. Cintura aumentada (umbral según población: ≥102/88 cm en ATP III; ≥90/80 cm para Latinoamérica según la IDF), TG ≥150, HDL \u003c40 en hombres o \u003c50 en mujeres, PA ≥130/85 y glucosa en ayuno ≥100 (o tratamiento para cualquiera de ellos). Él cumple cintura, TG y glucosa.","why":["Tres criterios bastan.","","HDL 44 y PA 126/80 no cumplen.","No se necesitan los 5 criterios.","La diabetes no es requisito; la glucosa ≥100 ya cuenta como criterio."],"ref":"Alberti KG, et al. Circulation 2009 (criterios armonizados)"},{"diag":true,"id":"dx-e5","topic":"hipofisis","subj":"endo","dif":2,"stem":"Mujer de 27 años con amenorrea de 6 meses y galactorrea. Prueba de embarazo negativa, TSH normal, sin fármacos. Prolactina 260 ng/mL. RM: adenoma hipofisario de 14 mm con leve compresión del quiasma. ¿Tratamiento inicial?","opts":["Cirugía transesfenoidal urgente","Cabergolina","Radioterapia","Anticonceptivos orales","Observación"],"ans":1,"exp":"Incluso los macroprolactinomas con compromiso visual se tratan primero con agonista dopaminérgico. La cabergolina es más eficaz y mejor tolerada que la bromocriptina: baja la prolactina y reduce el tumor, a menudo con mejoría visual rápida. La cirugía queda para intolerancia, resistencia o apoplejía.","why":["No es la primera línea en prolactinoma.","","Solo en casos refractarios.","Corrigen el hipoestrogenismo, pero no tratan el tumor ni la compresión.","Un macroadenoma con compresión requiere tratamiento."],"ref":"Pituitary Society 2023 · Endocrine Society 2011"},{"diag":true,"id":"dx-g1","topic":"stda","subj":"gastro","dif":2,"stem":"Hombre de 64 años con melena y Hb 6.8 g/dL, sin cardiopatía. Tras reanimación con cristaloides está estable. ¿Umbral de transfusión y momento de la endoscopia?","opts":["Transfundir si Hb \u003c10 g/dL; endoscopia a las 72 h","Transfundir si Hb \u003c7 g/dL; endoscopia en las primeras 24 h","No transfundir; endoscopia electiva","Transfundir si Hb \u003c9 g/dL; endoscopia en menos de 1 h para todos","Transfundir hasta Hb 12 g/dL"],"ans":1,"exp":"Estrategia restrictiva: transfundir con Hb \u003c7 g/dL (umbral ~8 si hay enfermedad cardiovascular). Endoscopia en las primeras 24 h después de reanimar. IBP IV, sobre todo después de terapia endoscópica en estigmas de alto riesgo. La endoscopia muy temprana (\u003c6 h) no reduce la mortalidad.","why":["Transfundir de más aumenta resangrado y mortalidad; 72 h es tarde.","","Con Hb 6.8 sí se transfunde.","Endoscopia en \u003c6 h no da beneficio; Hb 9 es un umbral liberal.","Umbral liberal y dañino."],"ref":"ACG 2021 STDA · Lau JYW, NEJM 2020"},{"diag":true,"id":"dx-g2","topic":"pancrea","subj":"gastro","dif":1,"stem":"Mujer de 46 años con dolor epigástrico intenso irradiado en cinturón y vómito. Lipasa 6 veces el límite superior. ¿Qué estudio necesitas para confirmar pancreatitis aguda?","opts":["TC con contraste urgente","Ninguno: ya cumple 2 de 3 criterios","Resonancia magnética","CPRE","Ultrasonido endoscópico"],"ans":1,"exp":"Se diagnostica con 2 de 3: dolor típico, lipasa o amilasa ≥3 veces el límite superior, e imagen compatible. La TC se reserva para duda diagnóstica o si no mejora en 48–72 h. Sí pide USG abdominal para buscar litiasis biliar, la causa más frecuente.","why":["La TC temprana no cambia el manejo ni se necesita para el diagnóstico.","","No se necesita para el diagnóstico.","La CPRE se usa en colangitis u obstrucción biliar persistente; no es diagnóstica.","No se necesita para el diagnóstico."],"ref":"Atlanta revisada 2012 · ACG 2024 pancreatitis aguda"},{"diag":true,"id":"dx-g3","topic":"erge","subj":"gastro","dif":1,"stem":"Hombre de 32 años con pirosis y regurgitación después de comer, 3 veces por semana desde hace 4 meses. Sin disfagia, pérdida de peso, sangrado, anemia ni vómito. ¿Conducta inicial?","opts":["Endoscopia inmediata","Prueba terapéutica con IBP por 8 semanas","pH-metría de 24 h","Funduplicatura","Serie esofagogastroduodenal"],"ans":1,"exp":"Síntomas típicos sin datos de alarma: IBP una vez al día, 30–60 min antes del desayuno, por 8 semanas. Endoscopia si hay alarma (disfagia, pérdida de peso, sangrado o anemia, vómito persistente), falla al IBP o factores de riesgo de Barrett.","why":["No tiene datos de alarma.","","Se reserva para casos refractarios o antes de cirugía.","No es tratamiento inicial.","No es útil para diagnosticar ERGE."],"ref":"ACG 2022 ERGE"},{"diag":true,"id":"dx-g4","topic":"diarrea","subj":"gastro","dif":1,"stem":"Mujer de 28 años con diarrea crónica, distensión, anemia ferropénica que no responde a hierro oral y dermatitis herpetiforme. Consume gluten. ¿Primera prueba?","opts":["Anticuerpos antigliadina nativa","Anti-transglutaminasa tisular IgA más IgA sérica total","Dieta sin gluten de prueba","Colonoscopia con biopsias","HLA-DQ2/DQ8 para confirmar"],"ans":1,"exp":"La prueba inicial es anti-tTG IgA con IgA total (si hay deficiencia de IgA, se usan pruebas IgG, como anti-DGP IgG). Se hace mientras consume gluten. Se confirma con biopsia duodenal: atrofia de vellosidades, linfocitos intraepiteliales e hiperplasia de criptas.","why":["Poco sensible y específica; ya no se recomienda.","","Quitar el gluten antes de estudiar da falsos negativos.","La biopsia es duodenal, por endoscopia alta.","Sirve para descartar (alto valor predictivo negativo), no para confirmar: 30–40% de la población lo tiene."],"ref":"ACG 2023 enfermedad celiaca"},{"diag":true,"id":"dx-g5","topic":"deglucion","subj":"gastro","dif":2,"stem":"Hombre de 38 años con disfagia a sólidos y líquidos desde el inicio, regurgitación de comida no digerida y pérdida de peso leve. Esofagograma con imagen en “pico de pájaro”. ¿Qué estudio confirma el diagnóstico?","opts":["Endoscopia alta","Manometría esofágica de alta resolución","pH-metría","TC de tórax","Biopsia esofágica"],"ans":1,"exp":"Acalasia: aperistalsis y relajación incompleta del esfínter esofágico inferior (IRP elevada) en la manometría de alta resolución, el estándar diagnóstico (clasificación de Chicago). La endoscopia es obligatoria para descartar pseudoacalasia por tumor de la unión esofagogástrica.","why":["Es obligatoria para descartar cáncer, pero no confirma la acalasia.","","Evalúa reflujo.","No evalúa motilidad.","No diagnostica trastornos motores."],"ref":"ACG 2020 acalasia · Chicago v4.0"},{"diag":true,"id":"dx-h1","topic":"anemias","subj":"hemato","dif":1,"stem":"Hombre de 62 años con fatiga. Hb 9.6 g/dL, VCM 71 fL, ADE alta, ferritina 7 ng/mL. Sin sangrado visible. ¿Siguiente paso?","opts":["Hierro oral y control en 6 meses, sin más estudios","Endoscopia alta y colonoscopia","Electroforesis de hemoglobina","Aspirado de médula ósea","Vitamina B12 intramuscular"],"ans":1,"exp":"Ferritina baja (\u003c30 ng/mL) confirma ferropenia. En un hombre o una mujer posmenopáusica, la ferropenia es sangrado gastrointestinal hasta demostrar lo contrario, incluido cáncer colorrectal: estudio endoscópico alto y bajo, además de reponer hierro.","why":["Dar hierro sin buscar la causa puede dejar pasar un cáncer.","","En talasemia la ferritina es normal o alta y el índice de Mentzer es \u003c13.","Invasivo e innecesario: la ferritina ya hizo el diagnóstico.","El déficit de B12 da macrocitosis."],"ref":"AGA 2020 anemia ferropénica"},{"diag":true,"id":"dx-h2","topic":"hemoliticas","subj":"hemato","dif":2,"stem":"Mujer de 34 años con LES. Ictericia, Hb 7.9 g/dL, reticulocitos 9%, LDH alta, haptoglobina baja y esferocitos en el frotis. Coombs directo positivo (IgG). ¿Diagnóstico y tratamiento inicial?","opts":["Esferocitosis hereditaria; esplenectomía","Anemia hemolítica autoinmune por anticuerpos calientes; prednisona","Deficiencia de G6PD; evitar oxidantes","PTT; plasmaféresis","Enfermedad por crioaglutininas; evitar el frío"],"ans":1,"exp":"AHAI caliente: IgG, hemólisis extravascular en el bazo, esferocitos y Coombs directo positivo. Se asocia a LES, LLC, linfomas y fármacos. Primera línea: glucocorticoides (prednisona 1 mg/kg/día); rituximab en segunda línea o casos graves.","why":["La esferocitosis hereditaria tiene Coombs negativo e historia familiar.","","G6PD: Coombs negativo, cuerpos de Heinz y células mordidas.","PTT: esquistocitos y trombocitopenia con Coombs negativo.","Crioaglutininas: IgM con C3, asociada a Mycoplasma o linfoma, con acrocianosis."],"ref":"Jäger U, et al. Blood Rev 2020 (consenso AHAI)"},{"diag":true,"id":"dx-h3","topic":"sangrado","subj":"hemato","dif":2,"stem":"Mujer de 29 años con petequias en piernas y gingivorragia. Plaquetas 14 000/µL; Hb y leucocitos normales. Frotis con plaquetas grandes, sin esquistocitos. TP y TTPa normales. Sin fármacos nuevos. ¿Tratamiento?","opts":["Transfusión de plaquetas de rutina","Glucocorticoides (prednisona o dexametasona)","Esplenectomía inmediata","Plasmaféresis","Observación sin tratamiento"],"ans":1,"exp":"PTI: trombocitopenia aislada con frotis sin otras alteraciones; es diagnóstico de exclusión (VIH, VHC, H. pylori, fármacos, LES). En adultos se trata si las plaquetas son \u003c30 000/µL o hay sangrado: glucocorticoides; IgIV si se necesita subirlas rápido. La transfusión se reserva para sangrado grave.","why":["Las plaquetas transfundidas se destruyen rápido; solo en sangrado que pone en riesgo la vida.","","Es una opción de segunda o tercera línea.","Es el tratamiento de la PTT.","Con \u003c30 000 y sangrado sí se trata."],"ref":"ASH 2019 PTI"},{"diag":true,"id":"dx-h4","topic":"leucemias","subj":"hemato","dif":3,"stem":"Hombre de 35 años con equimosis, fatiga y fiebre. Pancitopenia con blastos, algunos con bastones de Auer. Fibrinógeno muy bajo, dímero D alto y TP prolongado. ¿Qué haces de inmediato?","opts":["Esperar la confirmación molecular antes de tratar","Iniciar ácido transretinoico (ATRA) ante la sospecha de leucemia promielocítica","Transfundir y referir en 2 semanas","Heparina a dosis plenas","Esplenectomía"],"ans":1,"exp":"Bastones de Auer = leucemia mieloide. Con coagulación intravascular diseminada, sospecha leucemia promielocítica aguda (t(15;17), PML-RARA). Es una urgencia: se inicia ATRA en cuanto se sospecha, sin esperar la genética, porque la coagulopatía causa muertes tempranas por hemorragia. Se combina con trióxido de arsénico y soporte con plaquetas, crioprecipitado y plasma.","why":["Esperar aumenta la mortalidad hemorrágica temprana.","","Es una urgencia hematológica.","En esta coagulopatía hemorrágica la heparina empeora el sangrado.","No tiene indicación."],"ref":"ELN 2019 LPA · ELN 2022 LMA"},{"diag":true,"id":"dx-h5","topic":"linfo","subj":"hemato","dif":1,"stem":"Hombre de 24 años con adenopatías cervicales indoloras, fiebre, sudoración nocturna y prurito. Biopsia: células grandes binucleadas en “ojos de búho”, CD15+ y CD30+. ¿Diagnóstico?","opts":["Linfoma difuso de células B grandes","Linfoma de Hodgkin clásico","Leucemia linfocítica crónica","Mononucleosis infecciosa","Tuberculosis ganglionar"],"ans":1,"exp":"Células de Reed-Sternberg (CD15+, CD30+) = linfoma de Hodgkin clásico. Edad bimodal, diseminación por contigüidad (cervical y mediastinal), síntomas B y, a veces, dolor ganglionar al tomar alcohol. El subtipo más frecuente es esclerosis nodular.","why":["Es CD20+ y no tiene células de Reed-Sternberg.","","LLC: adultos mayores, linfocitosis, células en mancha, CD5+ y CD23+.","Puede tener células parecidas, pero con linfocitos atípicos y serología positiva.","Mostraría granulomas caseificantes."],"ref":"Clasificación OMS 2022 / ICC"},{"diag":true,"id":"dx-n1","topic":"lra","subj":"nefro","dif":1,"stem":"Hombre de 57 años hospitalizado. Creatinina de 0.9 mg/dL al ingreso y de 1.3 mg/dL 36 h después. Uresis normal. ¿Tiene lesión renal aguda?","opts":["No: no llegó a 1.5 veces la basal","Sí, estadio 1: subió ≥0.3 mg/dL en 48 h","Sí, estadio 2","Solo si baja la uresis","No se puede saber sin biopsia"],"ans":1,"exp":"KDIGO: LRA = aumento de creatinina ≥0.3 mg/dL en 48 h, o ≥1.5 veces la basal en 7 días, o uresis \u003c0.5 mL/kg/h por 6 h. Un aumento ≥0.3 en 48 h es estadio 1.","why":["Basta un aumento ≥0.3 mg/dL en 48 h.","","Estadio 2 es 2.0–2.9 veces la basal.","Basta la creatinina o la uresis; no se necesitan las dos.","No hace falta biopsia."],"ref":"KDIGO LRA 2012"},{"diag":true,"id":"dx-n2","topic":"hta","subj":"nefro","dif":2,"stem":"Hombre de 55 años con PA 220/130 mmHg, cefalea, confusión y papiledema. ¿Cómo bajas la presión?","opts":["Captopril sublingual y alta","Fármaco IV titulable en terapia intensiva, bajando la PAM no más de ~25% en la primera hora","Llevar la PA a 120/80 mmHg en 1 hora","Nifedipino sublingual","Fármacos orales y control en 1 semana"],"ans":1,"exp":"Encefalopatía hipertensiva = emergencia (PA muy alta con daño agudo a órgano blanco). Fármaco IV titulable (labetalol, nicardipino, clevidipino o nitroprusiato) en terapia intensiva: PAM ≤25% en la primera hora y luego descenso gradual en 24–48 h. Excepciones: disección aórtica (PAS \u003c120 en la primera hora) y EVC. Sin daño a órgano blanco es urgencia: vía oral y descenso en 24–48 h.","why":["La vía sublingual no es titulable, y una emergencia no se va de alta.","","Bajar tan rápido causa isquemia cerebral, coronaria o renal.","Baja la PA de forma brusca e impredecible; está proscrito.","Es una emergencia, no una urgencia."],"ref":"ESC 2024 HTA · AHA/ACC 2025 HTA"},{"diag":true,"id":"dx-n3","topic":"erc","subj":"nefro","dif":1,"stem":"Mujer de 63 años con TFG de 52 mL/min/1.73 m² y cociente albúmina/creatinina de 120 mg/g, ambos persistentes por más de 3 meses. ¿Clasificación KDIGO?","opts":["G2 A1","G3a A2","G3b A3","G4 A2","No es ERC"],"ans":1,"exp":"TFG: G1 ≥90 · G2 60–89 · G3a 45–59 · G3b 30–44 · G4 15–29 · G5 \u003c15. Albuminuria: A1 \u003c30 · A2 30–300 · A3 >300 mg/g. Se requiere persistencia >3 meses.","why":["G2 es 60–89 y A1 es \u003c30 mg/g.","","G3b es 30–44 y A3 es >300 mg/g.","G4 es 15–29.","Cumple criterios: alteración persistente >3 meses."],"ref":"KDIGO ERC 2024"},{"diag":true,"id":"dx-n4","topic":"glomerulo","subj":"nefro","dif":2,"stem":"Hombre de 52 años con edema generalizado. Proteinuria 6.2 g/24 h, albúmina 2.1 g/dL, colesterol 320 mg/dL y sedimento sin cilindros eritrocitarios. Anticuerpos anti-PLA2R positivos. ¿Diagnóstico?","opts":["Enfermedad de cambios mínimos","Nefropatía membranosa","Glomerulonefritis postestreptocócica","Nefropatía por IgA","Glomerulonefritis rápidamente progresiva"],"ans":1,"exp":"Síndrome nefrótico (proteinuria >3.5 g/día, hipoalbuminemia, edema, hiperlipidemia). La membranosa es de las causas primarias más frecuentes en adultos; el anti-PLA2R es positivo en ~70–80% de las primarias. Depósitos subepiteliales con “espigas”. Alto riesgo de trombosis (vena renal). Busca causas secundarias: cáncer, LES, VHB y fármacos.","why":["Es más frecuente en niños, con anti-PLA2R negativo.","","Es nefrítico: hematuria, HTA y C3 bajo después de faringitis o piodermitis.","Hematuria macroscópica durante una infección respiratoria; patrón nefrítico.","Nefrítico con caída rápida de la TFG y semilunas."],"ref":"KDIGO glomerulopatías 2021"},{"diag":true,"id":"dx-n5","topic":"dialisis","subj":"nefro","dif":1,"stem":"¿Cuál es la principal causa de muerte en pacientes en hemodiálisis crónica?","opts":["Infecciones","Enfermedad cardiovascular","Hiperkalemia aislada","Cáncer","Sangrado del acceso vascular"],"ans":1,"exp":"La enfermedad cardiovascular (muerte súbita, IAM, IC) es la primera causa de muerte en diálisis y también en trasplantados renales con injerto funcional. En diálisis, las infecciones son la segunda.","why":["Son la segunda causa (accesos y catéteres).","","Contribuye a la muerte súbita, pero no es la principal categoría.","El riesgo aumenta con la inmunosupresión del trasplante, pero no es la primera causa.","Es raro."],"ref":"USRDS Annual Data Report"},{"diag":true,"id":"dx-r1","topic":"ar","subj":"reuma","dif":1,"stem":"Mujer de 42 años con dolor e inflamación simétrica de MCF, IFP y muñecas por 10 semanas, con rigidez matutina de 90 min. FR alto, anti-CCP positivo, PCR elevada. ¿Tratamiento de base?","opts":["Solo AINE","Metotrexato con ácido fólico","Prednisona sola a largo plazo","Alopurinol","Infliximab como primera línea"],"ans":1,"exp":"Cumple criterios ACR/EULAR 2010 (≥6/10). Se inicia un FAME convencional lo antes posible: el metotrexato es el ancla (con ácido fólico; vigilar BH, PFH y creatinina). Esteroides a dosis bajas solo como puente breve. Biológicos si no se alcanza la meta con FAME convencional.","why":["Alivian síntomas, pero no frenan el daño articular.","","Solo como puente y lo más breve posible.","Es para gota.","Los biológicos van después de falla a FAME convencional, salvo situaciones especiales."],"ref":"ACR 2021 · EULAR 2022 AR"},{"diag":true,"id":"dx-r2","topic":"gota","subj":"reuma","dif":1,"stem":"Hombre de 52 años con monoartritis aguda de la primera metatarsofalángica. Artrocentesis: cristales en forma de aguja con birrefringencia NEGATIVA intensa. ¿Diagnóstico?","opts":["Pseudogota","Gota","Artritis séptica","Artritis reumatoide","Osteoartritis"],"ans":1,"exp":"Urato monosódico: agujas con birrefringencia negativa. Pirofosfato de calcio (pseudogota): romboides con birrefringencia positiva débil, típico en la rodilla de adultos mayores con condrocalcinosis. Siempre pide Gram y cultivo: gota e infección pueden coexistir.","why":["Sus cristales son romboides con birrefringencia positiva débil.","","Se confirma con Gram o cultivo positivos; aquí los cristales explican el cuadro.","Es poliartritis simétrica, no monoartritis por cristales.","Líquido no inflamatorio y sin cristales de urato."],"ref":"ACR 2020 gota"},{"diag":true,"id":"dx-r3","topic":"espondilo","subj":"reuma","dif":2,"stem":"Hombre de 26 años con dolor lumbar de 8 meses que empeora con el reposo, lo despierta en la madrugada y mejora con el ejercicio. HLA-B27 positivo. RM con sacroileítis y edema óseo. ¿Tratamiento de primera línea?","opts":["Metotrexato","AINE a dosis completas","Prednisona oral crónica","Reposo absoluto","Sulfasalazina para la afección axial"],"ans":1,"exp":"Espondiloartritis axial (criterios ASAS): dolor lumbar inflamatorio ≥3 meses que inicia antes de los 45 años, con sacroileítis en imagen y ≥1 dato (HLA-B27, etc.). Primera línea: AINE + ejercicio y fisioterapia. Si fallan dos AINE: anti-TNF, anti-IL-17 o inhibidor de JAK.","why":["Los FAME convencionales no sirven para la afección axial.","","No se recomiendan esteroides sistémicos crónicos en la forma axial.","El reposo empeora; el ejercicio es parte del tratamiento.","La sulfasalazina solo ayuda en la afección periférica."],"ref":"ASAS-EULAR 2022 espondiloartritis axial"},{"diag":true,"id":"dx-r4","topic":"oa","subj":"reuma","dif":2,"stem":"Mujer de 66 años con dolor de rodilla derecha que empeora al caminar y mejora con reposo, rigidez matutina de 15 min y crepitación. Rx: disminución asimétrica del espacio articular y osteofitos. Tiene ERC G3b. ¿Primer fármaco recomendado?","opts":["AINE oral a dosis plena","AINE tópico (diclofenaco en gel)","Opioide potente","Prednisona oral","Metotrexato"],"ans":1,"exp":"Osteoartritis: dolor mecánico y rigidez \u003c30 min. La base es ejercicio, bajar de peso y educación. En rodilla y mano, el AINE tópico es de primera línea (ACR 2019), sobre todo en adultos mayores o con ERC, por su baja absorción sistémica. Infiltración con esteroide para brotes.","why":["En ERC los AINE orales pueden empeorar la función renal.","","Los opioides potentes no se recomiendan.","Los esteroides sistémicos no se usan en OA.","No tiene papel en la OA."],"ref":"ACR/AF 2019 osteoartritis"},{"diag":true,"id":"dx-r5","topic":"abordaje","subj":"reuma","dif":2,"stem":"Hombre de 45 años con dolor de hombro. Le duele solo al abducir activamente entre 60° y 120°; el movimiento pasivo es completo y casi indoloro, sin aumento de volumen. ¿Qué tipo de problema es?","opts":["Articular inflamatorio (artritis)","Periarticular: tendinopatía del manguito rotador o bursitis","Articular mecánico (osteoartritis glenohumeral)","Dolor referido visceral","Poliartritis"],"ans":1,"exp":"Periarticular: dolor con movimientos activos en un plano específico, pasivo conservado y dolor localizado. El arco doloroso de 60–120° sugiere pinzamiento subacromial. Articular: dolor y limitación con movimiento activo y pasivo en todos los planos, con aumento de volumen o derrame.","why":["La artritis limitaría también el movimiento pasivo y daría derrame o calor.","","La OA limita el pasivo en todos los planos, con crepitación.","El dolor visceral no cambia con un movimiento específico.","Es una sola región."],"ref":"Abordaje clínico reumatológico"},{"topic":"dm2","subj":"endo","id":"dm2-01","dif":1,"stem":"Hombre de 45 años, asintomático, en un chequeo laboral. IMC 29. A1c 6.7%; no se midió glucosa en esa muestra. ¿Cuál es el siguiente paso?","opts":["Diagnosticar diabetes tipo 2 e iniciar metformina","Confirmar con una segunda prueba: repetir la A1c o medir glucosa en ayuno","Hacer curva de tolerancia a la glucosa, que es obligatoria para el diagnóstico","Clasificarlo como prediabetes y repetir en 3 años","Medir péptido C para definir el tipo de diabetes"],"ans":1,"exp":"Sin hiperglucemia inequívoca (síntomas clásicos o crisis), la ADA pide dos resultados anormales: dos pruebas distintas en la misma muestra o la misma prueba en otra muestra. Si la segunda sale en rango de diabetes, se confirma.","why":["Un solo valor alterado en un paciente sin síntomas no confirma el diagnóstico.","","La CTOG es válida, pero no obligatoria; repetir la A1c o medir glucosa en ayuno es igual de válido y más simple.","6.7% está por arriba del umbral de diabetes (≥6.5%), no en rango de prediabetes (5.7–6.4%).","El péptido C no se usa para diagnosticar; ayuda cuando hay duda de DM1 o LADA."],"ref":"ADA 2026, secc. 2"},{"topic":"dm2","subj":"endo","id":"dm2-02","dif":1,"stem":"Mujer de 38 años con 4 semanas de poliuria, polidipsia y pérdida de 5 kg. Glucosa plasmática al azar: 318 mg/dL. Sin cetonas. ¿Qué afirmación es correcta?","opts":["Necesita una glucosa en ayuno para confirmar","El diagnóstico de diabetes ya está establecido","Debe repetirse la A1c en 3 meses antes de diagnosticar","Solo se diagnostica si la A1c es ≥6.5%","Es prediabetes hasta tener una CTOG"],"ans":1,"exp":"Una glucosa plasmática al azar ≥200 mg/dL con síntomas clásicos es diagnóstica por sí sola; no requiere confirmación. Por la pérdida de peso (catabolismo) conviene iniciar insulina, y si sospechas DM1 o LADA, pide autoanticuerpos.","why":["No hace falta: la hiperglucemia con síntomas clásicos ya es inequívoca.","","Retrasar el diagnóstico y el tratamiento no tiene sentido aquí.","Cualquier criterio sirve; no depende de la A1c.","318 mg/dL con síntomas es diabetes, no prediabetes."],"ref":"ADA 2026, secc. 2"},{"topic":"dm2","subj":"endo","id":"dm2-03","dif":2,"stem":"Hombre de 50 años, asintomático. En la misma muestra: A1c 6.6% y glucosa en ayuno 112 mg/dL. ¿Qué haces?","opts":["Diagnosticar diabetes con la A1c","Diagnosticar prediabetes con la glucosa","Repetir la A1c; si vuelve a salir ≥6.5%, es diabetes","Repetir la glucosa en ayuno porque la A1c no es confiable","Descartar diabetes porque las pruebas no coinciden"],"ans":2,"exp":"Cuando dos pruebas no coinciden, se repite la que salió por arriba del punto de corte. Si se confirma, es diabetes.","why":["Un solo resultado alterado no basta sin hiperglucemia inequívoca.","Tiene una prueba en rango de diabetes; no puedes quedarte con la menor.","","Se repite la prueba alterada (A1c), y no hay datos de que no sea confiable (anemia, hemoglobinopatía).","La discordancia obliga a repetir, no a descartar."],"ref":"ADA 2026, secc. 2"},{"topic":"dm2","subj":"endo","id":"dm2-04","dif":2,"stem":"Hombre de 61 años con DM2 e IAM hace 2 años (stent en la DA). Toma metformina 1 g c/12 h. A1c 6.8%, TFG 78, IMC 31. ¿Cuál es la mejor conducta?","opts":["Sin cambios: la A1c ya está en meta","Agregar un arGLP-1 o un iSGLT2 con beneficio cardiovascular probado","Agregar glibenclamida para llegar a A1c \u003c6.5%","Agregar sitagliptina por su perfil seguro","Cambiar la metformina por insulina basal"],"ans":1,"exp":"En ECV aterosclerótica establecida, la ADA indica arGLP-1 o iSGLT2 con beneficio CV demostrado para reducir eventos, sin importar la A1c ni la metformina. Con IMC 31, un arGLP-1 (semaglutida, liraglutida, dulaglutida) además ayuda a bajar de peso.","why":["La indicación es por riesgo cardiovascular, no por glucosa.","","Las sulfonilureas no reducen eventos CV, causan hipoglucemia y aumentan el peso.","Los iDPP-4 son neutros en eventos CV: no dan la protección que necesita.","No hay indicación de insulina: A1c en meta y sin catabolismo."],"ref":"ADA 2026, secc. 9–10"},{"topic":"dm2","subj":"endo","id":"dm2-05","dif":1,"stem":"Mujer de 67 años con DM2 e insuficiencia cardiaca con FEVI 30% (NYHA II). Toma metformina. A1c 7.6%. ¿Qué agregas?","opts":["Pioglitazona","Saxagliptina","Dapagliflozina","Glimepirida","Insulina NPH"],"ans":2,"exp":"Los iSGLT2 (dapagliflozina, empagliflozina) reducen la hospitalización por IC y la muerte cardiovascular en IC con FE reducida, con o sin diabetes. Son uno de los 4 pilares de la IC con FEr.","why":["Retiene líquidos: contraindicada en IC NYHA III–IV y no recomendada en IC sintomática.","Aumentó la hospitalización por IC (SAVOR-TIMI 53).","","No da beneficio en IC y causa hipoglucemia.","No es necesaria con A1c 7.6% y no protege el corazón."],"ref":"ADA 2026 secc. 9–10 · ESC IC 2021/2023"},{"topic":"dm2","subj":"endo","id":"dm2-06","dif":2,"stem":"Hombre de 64 años con DM2 y ERC: TFG 38 mL/min/1.73 m², CAC 450 mg/g. Toma metformina 1 g c/12 h. A1c 7.3%. ¿Qué haces?","opts":["Suspender la metformina e iniciar glibenclamida","Bajar la metformina a 1 000 mg/día y agregar un iSGLT2","Mantener la misma dosis de metformina y agregar pioglitazona","Suspender todo e iniciar insulina basal","Dejar todo igual y repetir la TFG en 1 año"],"ans":1,"exp":"Con TFG 30–44 la metformina se puede mantener a dosis reducida (máximo 1 000 mg/día) y se suspende si baja de 30. Con ERC y albuminuria, el iSGLT2 (se inicia con TFG ≥20) frena la progresión renal y reduce eventos CV. Si no toma IECA o ARA-II, agrégalo a dosis máxima tolerada.","why":["No hay que suspenderla con TFG 38, y la glibenclamida es la peor opción en ERC (hipoglucemia prolongada).","","La dosis plena no es adecuada con TFG \u003c45, y la pioglitazona no protege el riñón y retiene líquidos.","No hay indicación de insulina y perderías la protección renal del iSGLT2.","Con albuminuria A3 y un tratamiento con beneficio probado disponible, esperar es un error."],"ref":"ADA 2026 secc. 9 y 11 · KDIGO 2022 DM en ERC"},{"topic":"dm2","subj":"endo","id":"dm2-07","dif":1,"stem":"Mujer de 44 años con DM2 de 3 años, IMC 38, sin ECV ni ERC. Toma metformina 2 g/día. A1c 8.1%. Su prioridad es bajar de peso. ¿Qué agregas?","opts":["Glimepirida","Pioglitazona","Semaglutida o tirzepatida","Insulina glargina","Sitagliptina"],"ans":2,"exp":"Cuando el peso es prioridad, la ADA recomienda los fármacos con mayor efecto en el peso: semaglutida o tirzepatida (agonista dual GIP/GLP-1). Además bajan mucho la A1c sin causar hipoglucemia.","why":["Sulfonilurea: aumenta el peso y causa hipoglucemia.","Aumenta el peso y retiene líquidos.","","La insulina aumenta el peso y no hay catabolismo que la justifique.","Peso neutro y potencia modesta."],"ref":"ADA 2026, secc. 8–9"},{"topic":"dm2","subj":"endo","id":"dm2-08","dif":2,"stem":"Hombre de 47 años con poliuria, polidipsia y pérdida de 7 kg en 2 meses. A1c 11.4%, glucosa 342 mg/dL. Cetonas negativas y pH normal. ¿Cuál es el mejor tratamiento inicial?","opts":["Metformina sola y control en 3 meses","Cambios en el estilo de vida por 3 meses antes de cualquier fármaco","Insulina basal, con o sin metformina","Sitagliptina con metformina","Glibenclamida a dosis máxima"],"ans":2,"exp":"Con síntomas catabólicos (pérdida de peso) o A1c >10% / glucosa ≥300 mg/dL, la ADA recomienda iniciar insulina. Cuando se controla la glucotoxicidad, muchas veces se puede reducir o retirar.","why":["Insuficiente para una A1c >11% con catabolismo.","Retrasar el tratamiento con este grado de hiperglucemia es inseguro.","","La combinación no alcanza a bajar 4–5 puntos de A1c ni corrige el catabolismo.","No corrige el catabolismo y causa hipoglucemia."],"ref":"ADA 2026, secc. 9"},{"topic":"dm2","subj":"endo","id":"dm2-09","dif":3,"stem":"Mujer de 58 años con DM2 que toma metformina y empagliflozina. Postoperatorio de colecistectomía con ayuno prolongado. Presenta náusea, vómito y taquipnea. Glucosa 198 mg/dL, pH 7.17, HCO₃ 11 mEq/L, brecha aniónica 24, β-hidroxibutirato elevado. ¿Diagnóstico?","opts":["Acidosis láctica por metformina","Cetoacidosis euglucémica asociada a iSGLT2","Cetosis de ayuno sin importancia clínica","Estado hiperosmolar hiperglucémico","No puede ser cetoacidosis porque la glucosa es \u003c250 mg/dL"],"ans":1,"exp":"Los iSGLT2 pueden causar cetoacidosis con glucosa normal o poco elevada (\u003c250 mg/dL), sobre todo con ayuno, cirugía, enfermedad aguda o reducción de insulina. Se trata como cualquier CAD: líquidos, insulina IV con dextrosa desde el inicio, potasio y suspender el iSGLT2. Prevención: suspenderlo 3 días antes de una cirugía programada.","why":["En la acidosis láctica lo elevado es el lactato; aquí son las cetonas.","","La cetosis de ayuno no produce pH 7.17 ni HCO₃ 11.","El EHH tiene glucosa >600 y osmolaridad alta, sin acidosis importante.","Esa es justo la trampa: con iSGLT2 la glucosa puede ser casi normal."],"ref":"ADA 2026, secc. 9 y 16"},{"topic":"dm2","subj":"endo","id":"dm2-10","dif":2,"stem":"Mujer de 79 años con DM2, TFG 34, vive sola. Toma glibenclamida 5 mg c/12 h. Ha tenido 3 episodios de confusión y sudoración por la mañana; en uno, glucosa capilar de 52 mg/dL. A1c 6.4%. ¿Qué haces?","opts":["Bajar la glibenclamida a 5 mg/día","Suspender la glibenclamida, usar un fármaco sin riesgo de hipoglucemia (p. ej., linagliptina) y aceptar una A1c \u003c8%","Agregar una colación nocturna y mantener la dosis","Cambiar a insulina NPH nocturna","Dejar todo igual: su A1c está en meta"],"ans":1,"exp":"La glibenclamida tiene metabolitos activos de eliminación renal: en adultos mayores con ERC causa hipoglucemias prolongadas y graves. Suspéndela, usa fármacos sin riesgo de hipoglucemia (la linagliptina no requiere ajuste renal) y relaja la meta: en adultos mayores con comorbilidades, A1c \u003c8% es adecuada.","why":["Bajar la dosis no elimina el riesgo; el fármaco no es adecuado para ella.","","Parchar con comida no resuelve el problema de fondo.","Cambia un riesgo de hipoglucemia por otro, sin indicación de insulina.","Una A1c de 6.4% con hipoglucemias es sobretratamiento."],"ref":"ADA 2026, secc. 6 y 13"},{"topic":"dm2","subj":"endo","id":"dm2-11","dif":1,"stem":"Hombre de 55 años con DM2 en tratamiento con insulina. Está tembloroso y sudoroso, consciente y puede tragar. Glucosa capilar 51 mg/dL. ¿Clasificación y manejo?","opts":["Nivel 1; esperar a la siguiente comida","Nivel 2; 15–20 g de glucosa oral y repetir la glucosa en 15 minutos","Nivel 3; glucagón intramuscular inmediato","Nivel 2; dextrosa al 50% IV obligatoria","Nivel 1; 50 g de glucosa oral"],"ans":1,"exp":"Nivel 1: 54–69 mg/dL. Nivel 2: \u003c54 mg/dL. Nivel 3: evento grave con alteración mental o física que requiere ayuda de otra persona, sin importar la cifra. Si está consciente y puede tragar, regla de 15: 15–20 g de glucosa, revalorar en 15 min, repetir si sigue \u003c70 y luego dar una colación.","why":["51 es nivel 2 y se trata de inmediato.","","El nivel 3 se define por necesitar ayuda de otra persona; él está consciente y puede comer.","La vía oral es de elección si puede tragar.","51 no es nivel 1, y 50 g es una dosis excesiva."],"ref":"ADA 2026, secc. 6"},{"topic":"dm2","subj":"endo","id":"dm2-12","dif":2,"stem":"Hombre de 42 años con DM2 e IMC 36 que quiere “la inyección para bajar de peso”. Su hermana tuvo carcinoma medular de tiroides por MEN2A. ¿Qué fármaco está contraindicado?","opts":["Empagliflozina","Metformina","Semaglutida","Linagliptina","Pioglitazona"],"ans":2,"exp":"Los arGLP-1 (y la tirzepatida) están contraindicados con antecedente personal o familiar de carcinoma medular de tiroides o MEN2, por los tumores de células C que se observaron en roedores.","why":["No tiene esa contraindicación.","No tiene relación con el cáncer medular.","","No está contraindicada en MEN2.","No está contraindicada por este antecedente, aunque aumenta el peso."],"ref":"ADA 2026, secc. 9 · ficha técnica"},{"topic":"dm2","subj":"endo","id":"dm2-13","dif":1,"stem":"Hombre de 52 años con DM2 confirmada hoy. ¿Qué tamizaje de complicaciones le corresponde ahora?","opts":["Ninguno; se inicia a los 5 años del diagnóstico","Solo fondo de ojo","Fondo de ojo, cociente albúmina/creatinina con TFG y revisión de pies con monofilamento","Solo TFG","Electromiografía y angiografía con fluoresceína"],"ans":2,"exp":"En la DM2 las complicaciones pueden existir desde el diagnóstico porque la enfermedad pasó años sin detectarse. Por eso el tamizaje de retinopatía, nefropatía y neuropatía se hace al diagnóstico y luego cada año. En DM1 se inicia a los 5 años.","why":["Eso aplica a la DM1, no a la DM2.","Incompleto: faltan riñón y pies.","","Incompleto: la TFG sola no detecta la albuminuria temprana.","No son pruebas de tamizaje."],"ref":"ADA 2026, secc. 11–12"},{"topic":"dm2","subj":"endo","id":"dm2-14","dif":2,"stem":"Mujer de 66 años con DM2 de 12 años tratada con metformina 2 g/día. Tiene parestesias en guante y calcetín y fatiga. Hb 10.8 g/dL, VCM 108 fL. ¿Qué debes medir?","opts":["Ferritina","Vitamina B12","Lactato sérico","Solo TSH","Anticuerpos anti-GAD"],"ans":1,"exp":"El uso prolongado de metformina reduce la absorción de B12 en el íleon terminal. La deficiencia da anemia macrocítica y una neuropatía que se confunde con la diabética. La ADA recomienda medir B12 periódicamente en usuarios crónicos, sobre todo si hay neuropatía o anemia.","why":["La ferropenia da anemia microcítica, no un VCM de 108.","","No hay datos de acidosis.","El hipotiroidismo puede dar macrocitosis leve, pero medir solo TSH dejaría pasar la causa esperada.","Sirven para autoinmunidad pancreática, no para este cuadro."],"ref":"ADA 2026, secc. 9"},{"topic":"dm2","subj":"endo","id":"dm2-15","dif":2,"stem":"Hombre de 81 años con DM2, IC, ERC G3b, deterioro cognitivo leve y dos caídas este año. Vive con su hija. ¿Qué meta de A1c es razonable?","opts":["\u003c6.0%","\u003c6.5%","\u003c7.0%","\u003c8.0%","La glucosa ya no importa"],"ans":3,"exp":"En adultos mayores con varias enfermedades crónicas o deterioro cognitivo leve-moderado, la ADA sugiere A1c \u003c8.0%. Las metas estrictas aumentan hipoglucemias, caídas y mortalidad sin beneficio a corto plazo. En el muy frágil o con expectativa de vida corta no se persigue la A1c: se evitan la hipoglucemia y la hiperglucemia sintomática.","why":["Una meta tan estricta aumenta hipoglucemias y caídas.","Igual: demasiado estricta para él.","Es la meta para adultos mayores sanos, no para este perfil.","","Sí importa: hay que evitar la hipoglucemia y la hiperglucemia sintomática."],"ref":"ADA 2026, secc. 13"},{"topic":"sca","subj":"cardio","id":"sca-01","dif":2,"stem":"Hombre de 63 años con dolor torácico de 1 h. ECG: elevación del ST de 3 mm en DII, DIII y aVF. PA 82/50 mmHg, ingurgitación yugular y campos pulmonares limpios. ¿Cuál es el siguiente paso más adecuado?","opts":["Nitroglicerina sublingual y furosemida IV","Tomar derivaciones derechas (V4R) y dar una carga de cristaloide","Morfina IV y oxígeno por mascarilla","Betabloqueador IV para reducir el consumo de oxígeno","Esperar la troponina antes de decidir la reperfusión"],"ans":1,"exp":"IAM inferior + hipotensión + IY + pulmones limpios = infarto del ventrículo derecho (CD proximal). Se confirma con V4R. El VD depende de la precarga: da volumen y evita nitratos, diuréticos y morfina, que la reducen. La reperfusión urgente sigue siendo la prioridad.","why":["Nitratos y diuréticos reducen la precarga y pueden causar colapso hemodinámico en el IAM de VD.","","La morfina también es venodilatadora, y el oxígeno solo se da si la SatO₂ es \u003c90%.","Un betabloqueador IV con hipotensión y posible choque está contraindicado.","En IAMCEST la troponina no se espera: el ECG basta para reperfundir."],"ref":"ESC 2023 SCA"},{"topic":"sca","subj":"cardio","id":"sca-02","dif":2,"stem":"Mujer de 55 años con IAMCEST anterior de 2 h de evolución en un hospital sin hemodinamia. El traslado a un centro con ICP tardaría unas 3 h. Sin contraindicaciones. ¿Qué haces?","opts":["Trasladarla para ICP primaria aunque tarde 3 h","Fibrinólisis en los primeros 10 min y luego traslado para coronariografía en 2–24 h","Tratamiento médico y coronariografía electiva en 1 semana","Esperar la troponina de las 3 h para confirmar","Fibrinólisis y alta a casa si se quita el dolor"],"ans":1,"exp":"Si la ICP primaria no puede hacerse en ≤120 min desde el diagnóstico, se da fibrinólisis (de preferencia tenecteplasa) en ≤10 min, siempre que lleve \u003c12 h de síntomas. Después se traslada a un centro con ICP: coronariografía en 2–24 h si fue exitosa, o ICP de rescate inmediata si falló.","why":["3 h rebasa el límite de 120 min; cada minuto de retraso es miocardio perdido.","","Sin reperfusión urgente pierde miocardio que se podía salvar.","En IAMCEST la troponina no se espera.","Toda fibrinólisis debe seguirse de traslado a un centro con ICP (estrategia farmacoinvasiva)."],"ref":"ESC 2023 SCA"},{"topic":"sca","subj":"cardio","id":"sca-03","dif":2,"stem":"Hombre de 70 años con IAMCEST inferior de 90 min en un hospital sin hemodinamia (traslado >3 h). ¿Cuál de estos antecedentes es una contraindicación ABSOLUTA para la fibrinólisis?","opts":["PA de 175/100 mmHg al ingreso","EVC isquémico hace 3 meses","Toma warfarina","Úlcera péptica activa","RCP de 5 min no traumática"],"ans":1,"exp":"Absolutas: hemorragia intracraneal previa o EVC de origen desconocido, EVC isquémico en los últimos 6 meses, daño o neoplasia del SNC, trauma, cirugía o TCE en el último mes, sangrado GI en el último mes, trastorno hemorrágico, disección aórtica y punciones no compresibles en 24 h.","why":["Ni siquiera llega al umbral de contraindicación relativa (PAS >180 o PAD >110).","","La anticoagulación oral es una contraindicación relativa.","La úlcera péptica activa es relativa.","Solo la RCP traumática o prolongada es contraindicación relativa."],"ref":"ESC 2023 SCA"},{"topic":"sca","subj":"cardio","id":"sca-04","dif":2,"stem":"Mujer de 49 años con dolor opresivo de 30 min. ECG: elevación del ST de 1.5 mm en V2 y V3, sin otros cambios. ¿Cómo interpretas el ECG?","opts":["No cumple criterio de IAMCEST: en V2–V3 se requieren ≥2 mm","Cumple criterio de IAMCEST: en mujeres el umbral en V2–V3 es ≥1.5 mm","Solo sería IAMCEST si también hubiera elevación ≥1 mm en derivaciones de miembros","Es repolarización precoz hasta demostrar lo contrario","Necesita troponina positiva para considerarlo IAMCEST"],"ans":1,"exp":"Umbrales en V2–V3: ≥2 mm en hombres ≥40 años, ≥2.5 mm en hombres \u003c40 y ≥1.5 mm en mujeres. En las demás derivaciones, ≥1 mm en dos contiguas.","why":["≥2 mm es el umbral para hombres ≥40 años; en mujeres basta ≥1.5 mm.","","V2 y V3 son contiguas: con eso basta.","Con dolor típico y una elevación que cumple criterio, se asume isquemia.","El diagnóstico electrocardiográfico de IAMCEST no espera la troponina."],"ref":"4ª definición universal de IAM"},{"topic":"sca","subj":"cardio","id":"sca-05","dif":2,"stem":"Hombre de 66 años con IAMSEST: troponina elevada e infradesnivel del ST en V4–V6. A pesar de nitroglicerina IV, aspirina y anticoagulación sigue con dolor y su PA baja a 85/55 mmHg. ¿Cuándo debe ir a coronariografía?","opts":["De inmediato, en menos de 2 horas","Temprana, en las primeras 24 h","En las primeras 72 h","Solo si una prueba de esfuerzo sale positiva","Nunca: debe recibir fibrinólisis"],"ans":0,"exp":"Muy alto riesgo (dolor refractario e inestabilidad hemodinámica) = coronariografía inmediata, en \u003c2 h. Otros criterios de muy alto riesgo: arritmias graves, IC aguda, complicaciones mecánicas y cambios dinámicos recurrentes del ST.","why":["","El plazo de \u003c24 h es para alto riesgo sin inestabilidad.","Él es de muy alto riesgo; no puede esperar.","Una prueba de esfuerzo está contraindicada con dolor activo e inestabilidad.","La fibrinólisis nunca está indicada en SCASEST."],"ref":"ESC 2023 SCA"},{"topic":"sca","subj":"cardio","id":"sca-06","dif":2,"stem":"Mujer de 71 años con dolor torácico que cedió en urgencias. ECG con T invertidas en V4–V6; troponina de alta sensibilidad con ascenso significativo a la hora. GRACE 152. Estable y sin dolor. ¿Estrategia?","opts":["Coronariografía inmediata (\u003c2 h)","Coronariografía temprana (\u003c24 h)","Alta con prueba de esfuerzo ambulatoria","Fibrinólisis","Solo tratamiento médico"],"ans":1,"exp":"IAMSEST confirmado y GRACE >140 = alto riesgo → estrategia invasiva temprana (\u003c24 h). La inmediata (\u003c2 h) se reserva para muy alto riesgo.","why":["No tiene criterios de muy alto riesgo: está estable y sin dolor.","","Con IAMSEST confirmado no se da de alta.","Nunca en SCASEST.","El paciente de alto riesgo se beneficia de la estrategia invasiva."],"ref":"ESC 2023 SCA"},{"topic":"sca","subj":"cardio","id":"sca-07","dif":3,"stem":"Hombre de 57 años con IAMCEST anterior. Recibió tenecteplasa hace 75 min en su hospital comunitario. Sigue con dolor y el ST bajó solo 20%. ¿Qué haces?","opts":["Repetir la tenecteplasa","Trasladarlo de inmediato para ICP de rescate","Esperar 24 h y hacer coronariografía programada","Agregar heparina y observar","Iniciar nitroglicerina IV y valorar en 6 h"],"ans":1,"exp":"Fibrinólisis fallida = el ST baja \u003c50% a los 60–90 min o persisten el dolor o la inestabilidad → ICP de rescate inmediata. Repetir el fibrinolítico no se recomienda.","why":["Repetir la fibrinólisis no mejora el resultado y aumenta el sangrado.","","La coronariografía en 2–24 h es para la fibrinólisis exitosa.","Retrasa la reperfusión de una arteria que sigue cerrada.","Retrasa la reperfusión de una arteria que sigue cerrada."],"ref":"ESC 2023 SCA"},{"topic":"sca","subj":"cardio","id":"sca-08","dif":2,"stem":"Hombre de 68 años con IAMSEST que irá a ICP. Tuvo un accidente isquémico transitorio hace 2 años. No toma anticoagulantes. ¿Qué inhibidor P2Y12 eliges junto con la aspirina?","opts":["Prasugrel 60 mg de carga","Ticagrelor 180 mg de carga","Ninguno; solo aspirina","Prasugrel 30 mg por su edad","Clopidogrel 75 mg sin dosis de carga"],"ans":1,"exp":"El prasugrel está contraindicado con antecedente de EVC o AIT (más hemorragia intracraneal en TRITON-TIMI 38). El ticagrelor (carga 180 mg, luego 90 mg c/12 h) es preferido sobre el clopidogrel en SCA.","why":["Contraindicado por el AIT previo.","","El SCA requiere doble antiagregación.","No existe esa dosis, y el AIT lo contraindica de todos modos.","El clopidogrel es inferior al ticagrelor en SCA y siempre requiere carga (300–600 mg)."],"ref":"ESC 2023 SCA"},{"topic":"sca","subj":"cardio","id":"sca-09","dif":2,"stem":"Hombre de 62 años en su cuarto día de un IAM inferior. Presenta disnea súbita, estertores bilaterales y un soplo holosistólico nuevo en el ápex que se irradia a la axila. PA 88/56. ¿Diagnóstico más probable?","opts":["Ruptura del septum interventricular","Ruptura del músculo papilar posteromedial","Síndrome de Dressler","Reinfarto","Aneurisma ventricular"],"ans":1,"exp":"El músculo papilar posteromedial tiene irrigación única (la descendente posterior, casi siempre de la CD), por eso se rompe en IAM inferiores, típicamente entre los días 2 y 7. Causa insuficiencia mitral aguda con edema pulmonar y choque. Ecocardiograma urgente y cirugía.","why":["La CIV también da soplo holosistólico, pero suele ser paraesternal izquierdo con frémito; la irradiación a la axila apunta a la válvula mitral.","","Es una pericarditis que aparece semanas después; no causa insuficiencia mitral.","Daría dolor nuevo y cambios en el ECG; no explica el soplo.","Aparece sem

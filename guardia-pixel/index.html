anas después, con IC progresiva y elevación persistente del ST."],"ref":"ESC 2023 SCA"},{"topic":"sca","subj":"cardio","id":"sca-10","dif":2,"stem":"Hombre de 60 años, 7 semanas después de un IAM anterior extenso tratado tarde. Tiene disnea de esfuerzo. ECG: elevación persistente del ST en V1–V4 con ondas Q. ¿Diagnóstico?","opts":["Reinfarto agudo","Aneurisma del ventrículo izquierdo","Pericarditis aguda","Síndrome de Brugada","Hiperkalemia"],"ans":1,"exp":"La elevación del ST que persiste semanas después de un IAM, con ondas Q, sugiere aneurisma ventricular: una zona de cicatriz que se mueve en sentido contrario (discinesia). Complicaciones: IC, arritmias ventriculares y trombo mural con embolia. Se confirma con ecocardiograma.","why":["Un reinfarto tendría dolor agudo y elevación nueva de troponina.","","La pericarditis da elevación difusa del ST con infradesnivel del PR.","Brugada es un patrón en V1–V2 en personas jóvenes, sin relación con un infarto.","La hiperkalemia da T picudas y QRS ancho."],"ref":"ESC 2023 SCA"},{"topic":"sca","subj":"cardio","id":"sca-11","dif":2,"stem":"Mujer de 74 años con hemorragia digestiva: Hb 6.2 g/dL y FC 128. Refiere opresión torácica. Troponina de alta sensibilidad elevada y en ascenso; ECG con infradesnivel difuso leve del ST. ¿Conducta más adecuada?","opts":["Coronariografía inmediata y doble antiagregación","Fibrinólisis","Tratar la causa: transfusión, control del sangrado y de la frecuencia cardiaca","Ignorar la troponina: es un falso positivo","Heparina a dosis plenas"],"ans":2,"exp":"IAM tipo 2: necrosis por desequilibrio entre aporte y demanda de oxígeno (anemia grave, taquicardia, hipotensión), sin ruptura de placa. Se trata corrigiendo la causa. Antiagregar o anticoagular a una paciente que sangra empeora todo.","why":["La doble antiagregación con sangrado activo es peligrosa, y la causa no es trombótica.","Contraindicada por el sangrado activo.","","Es una lesión miocárdica real con mal pronóstico.","Empeora la hemorragia."],"ref":"4ª definición universal de IAM"},{"topic":"sca","subj":"cardio","id":"sca-12","dif":2,"stem":"Hombre de 59 años con dolor torácico típico. ECG: infradesnivel del ST de 2 mm en V1–V3 con ondas R altas y T positivas. ¿Qué haces?","opts":["Tratarlo como SCASEST de bajo riesgo","Tomar derivaciones posteriores V7–V9","Tomar derivaciones derechas V3R–V4R","Repetir el ECG en 24 h","Hacer prueba de esfuerzo"],"ans":1,"exp":"El infradesnivel del ST en V1–V3 con R alta es la imagen en espejo de un IAM posterior (circunfleja o CD). Una elevación ≥0.5 mm en V7–V9 confirma IAMCEST posterior, que necesita reperfusión urgente.","why":["Es un equivalente de IAMCEST, no un SCASEST de bajo riesgo.","","V4R busca el VD; la pared posterior se ve en V7–V9.","Retrasa una posible reperfusión.","Está contraindicada en un SCA con dolor."],"ref":"ESC 2023 SCA"},{"topic":"sca","subj":"cardio","id":"sca-13","dif":3,"stem":"Hombre de 52 años que ayer tuvo dolor torácico; hoy está asintomático. ECG: T profundamente invertidas y simétricas en V2–V3, sin elevación del ST ni ondas Q. Troponina levemente elevada. ¿Qué significa y qué debes evitar?","opts":["Patrón de Wellens: estenosis crítica de la DA proximal; evitar la prueba de esfuerzo y programar coronariografía","Repolarización precoz benigna; alta","IAM antiguo cicatrizado; prueba de esfuerzo","Hipertrofia ventricular izquierda; ecocardiograma ambulatorio","Pericarditis; AINE y colchicina"],"ans":0,"exp":"El síndrome de Wellens (T bifásicas o profundamente invertidas en V2–V3 en un paciente sin dolor) indica estenosis crítica proximal de la descendente anterior, con alto riesgo de un IAM anterior extenso. Una prueba de esfuerzo puede desencadenarlo: va a coronariografía.","why":["","La repolarización precoz da elevación del ST, no T invertidas profundas.","Un IAM antiguo dejaría ondas Q, y la prueba de esfuerzo es peligrosa aquí.","La HVI da voltaje alto con sobrecarga lateral, no T profundas aisladas en V2–V3.","La pericarditis da elevación difusa del ST e infradesnivel del PR."],"ref":"ESC 2023 SCA"},{"topic":"sca","subj":"cardio","id":"sca-14","dif":1,"stem":"Hombre de 60 años con dolor torácico típico de 20 min. SatO₂ 96% al aire ambiente, PA 138/84. ¿Cuál de estas medidas iniciales es correcta?","opts":["Oxígeno a 10 L/min por mascarilla a todo paciente con SCA","Aspirina 150–300 mg VO masticada y ECG en ≤10 min","Morfina IV a todo paciente con dolor","Esperar la troponina antes de dar aspirina","Betabloqueador IV de rutina"],"ans":1,"exp":"Lo que siempre va: ECG en ≤10 min y aspirina masticada. Oxígeno solo si la SatO₂ es \u003c90%: el exceso no ayuda y puede dañar. La morfina se reserva para dolor intenso. El “MONA para todos” ya no se usa.","why":["Oxígeno solo si la SatO₂ es \u003c90%.","","Solo si el dolor es intenso y persistente; retrasa la absorción de los P2Y12.","La aspirina no espera la troponina.","No es rutina por riesgo de choque; el betabloqueador oral se inicia en las primeras 24 h si no hay contraindicaciones."],"ref":"ESC 2023 SCA"},{"topic":"sca","subj":"cardio","id":"sca-15","dif":2,"stem":"Hombre de 58 años, 6 semanas después de un IAMSEST. Toma atorvastatina 80 mg/día con buen apego. LDL 84 mg/dL (antes del evento era 160). ¿Qué haces?","opts":["Nada: ya bajó más del 50%","Agregar ezetimiba","Cambiar a simvastatina 80 mg","Agregar un fibrato","Suspender la estatina y dejar solo ezetimiba"],"ans":1,"exp":"Después de un SCA (muy alto riesgo) la meta es LDL \u003c55 mg/dL y reducción ≥50% de la basal. Si no se alcanza con estatina de alta intensidad a dosis máxima tolerada en 4–6 semanas, se agrega ezetimiba; si aun así no llega, un iPCSK9.","why":["Necesita las dos cosas: reducción ≥50% y LDL \u003c55.","","La simvastatina 80 mg es menos potente y tiene más riesgo de miopatía.","Los fibratos no reducen eventos sobre la estatina; se usan para triglicéridos muy altos.","Perderías el efecto de la estatina de alta intensidad."],"ref":"ESC 2023 SCA · ESC/EAS dislipidemias"},{"topic":"lra","subj":"nefro","id":"lra-01","dif":1,"stem":"Hombre de 68 años con 3 días de vómito y diarrea. FC 108, PA 98/60, mucosas secas. Cr 2.1 mg/dL (basal 1.0), BUN 58 mg/dL. Na urinario 12 mEq/L, FENa 0.4%, sedimento con cilindros hialinos. ¿Diagnóstico y manejo?","opts":["NTA; restricción de líquidos","LRA prerrenal; reposición con cristaloides","Nefritis intersticial; esteroides","LRA posrenal; sonda vesical","Glomerulonefritis; biopsia renal"],"ans":1,"exp":"Hipovolemia + FENa \u003c1% + Na urinario \u003c20 + BUN/Cr >20 (58/2.1 ≈ 28) + cilindros hialinos = prerrenal. El túbulo está sano y conserva sodio. Responde al volumen en 24–72 h.","why":["La NTA tiene FENa >2% y cilindros granulosos; restringir líquidos empeoraría la hipoperfusión.","","No hay fármaco desencadenante, exantema, eosinofilia ni cilindros leucocitarios.","No hay datos de obstrucción (globo vesical, hidronefrosis).","No hay hematuria dismórfica, cilindros eritrocitarios ni proteinuria."],"ref":"KDIGO LRA 2012"},{"topic":"lra","subj":"nefro","id":"lra-02","dif":1,"stem":"Mujer de 60 años hospitalizada. Creatinina basal 0.8 mg/dL; hoy 2.0 mg/dL. Uresis conservada. ¿Estadio KDIGO?","opts":["Estadio 1","Estadio 2","Estadio 3","No es LRA","No se puede estadificar sin la uresis"],"ans":1,"exp":"2.0 ÷ 0.8 = 2.5 veces la basal → estadio 2 (2.0–2.9). Estadio 1: 1.5–1.9 veces o ↑ ≥0.3 mg/dL. Estadio 3: ≥3 veces, Cr ≥4.0 o inicio de terapia de reemplazo renal.","why":["1.5–1.9 veces es estadio 1; ella tiene 2.5 veces.","","Necesitaría ≥3 veces (≥2.4 mg/dL), Cr ≥4.0 o diálisis.","Supera por mucho el aumento de 0.3 mg/dL.","Basta la creatinina; se toma el criterio que dé el estadio más alto."],"ref":"KDIGO LRA 2012"},{"topic":"lra","subj":"nefro","id":"lra-03","dif":2,"stem":"Hombre de 70 años (80 kg) en terapia intensiva. Creatinina de 1.0 a 1.6 mg/dL en 48 h. Uresis de 20 mL/h durante las últimas 26 horas. ¿Estadio KDIGO?","opts":["Estadio 1, por creatinina","Estadio 2","Estadio 3, por uresis","No es LRA","Estadio 1, porque se toma el criterio menor"],"ans":2,"exp":"20 mL/h ÷ 80 kg = 0.25 mL/kg/h por más de 24 h → estadio 3 (uresis \u003c0.3 mL/kg/h por ≥24 h o anuria ≥12 h). Cuando la creatinina y la uresis dan estadios distintos, se toma el más alto.","why":["Por creatinina sería estadio 1, pero se toma el criterio que dé el estadio mayor.","El estadio 2 es uresis \u003c0.5 por ≥12 h; él está por debajo de 0.3 por más de 24 h.","","Cumple criterios por creatinina y por uresis.","Es al revés: se toma el criterio mayor."],"ref":"KDIGO LRA 2012"},{"topic":"lra","subj":"nefro","id":"lra-04","dif":2,"stem":"Mujer de 54 años en choque séptico por pielonefritis, con hipotensión sostenida por 18 h. Día 3: Cr 3.8 mg/dL, FENa 3.1%, osmolaridad urinaria 290 mOsm/kg y sedimento con cilindros granulosos pardos. ¿Diagnóstico?","opts":["LRA prerrenal","Necrosis tubular aguda isquémica","Glomerulonefritis postinfecciosa","Nefropatía obstructiva","Síndrome hepatorrenal"],"ans":1,"exp":"La hipoperfusión prolongada mata a las células tubulares: ya no reabsorben sodio (FENa >2%) ni concentran la orina (≈300 mOsm/kg). Los cilindros granulosos “café lodoso” son el sello de la NTA.","why":["La prerrenal tendría FENa \u003c1% y orina concentrada (>500).","","Tendría cilindros eritrocitarios, hematuria y C3 bajo 1–3 semanas después de la infección.","No hay datos de obstrucción.","No tiene cirrosis, y el SHR tiene FENa \u003c1%."],"ref":"KDIGO LRA 2012"},{"topic":"lra","subj":"nefro","id":"lra-05","dif":2,"stem":"Hombre de 75 años con IC tratado con furosemida. Cr de 1.2 a 2.0 mg/dL después de un cuadro de diarrea. FENa 2.6%, FEUrea 24%. ¿Cómo lo interpretas?","opts":["NTA, por la FENa >2%","Prerrenal: la furosemida eleva falsamente la FENa, y la FEUrea \u003c35% es confiable","Posrenal","No se puede interpretar sin biopsia","Nefritis intersticial por furosemida"],"ans":1,"exp":"Los diuréticos aumentan la excreción de sodio y elevan la FENa aunque el riñón esté hipoperfundido. La urea se reabsorbe en el túbulo proximal y el diurético casi no la afecta: FEUrea \u003c35% = prerrenal; >50% = NTA.","why":["La FENa no es confiable con diuréticos.","","No hay datos de obstrucción.","Los índices urinarios bastan; la biopsia no está indicada.","No hay exantema, eosinofilia ni sedimento sugestivo, y la FEUrea indica prerrenal."],"ref":"KDIGO LRA 2012"},{"topic":"lra","subj":"nefro","id":"lra-06","dif":1,"stem":"Hombre de 78 años con HPB. Lleva 18 h sin orinar, con dolor suprapúbico y globo vesical palpable. Cr 3.4 (basal 1.1). USG: hidronefrosis bilateral. ¿Primer paso?","opts":["Furosemida IV","Colocar sonda vesical","Hemodiálisis urgente","Biopsia renal","Tomografía con contraste"],"ans":1,"exp":"LRA posrenal por obstrucción de la salida vesical. La sonda vesical es diagnóstica y terapéutica. Después vigila la diuresis posobstructiva: poliuria con pérdida de agua, sodio y potasio.","why":["El problema es mecánico; el diurético no destapa la uretra.","","Primero se libera la obstrucción; no hay indicación AEIOU descrita.","No está indicada con una causa obstructiva evidente.","El contraste es nefrotóxico y el USG ya dio el diagnóstico."],"ref":"KDIGO LRA 2012"},{"topic":"lra","subj":"nefro","id":"lra-07","dif":2,"stem":"Mujer de 72 años con HTA tratada con losartán e hidroclorotiazida. Empieza ibuprofeno por gonartrosis. A los 10 días, Cr de 0.9 a 2.2 mg/dL. ¿Cómo contribuye el losartán a la caída del filtrado?","opts":["Contrae la arteriola aferente","Dilata la arteriola eferente al bloquear el efecto de la angiotensina II","Es tóxico directo para el túbulo","Precipita cristales en el túbulo","Produce nefritis intersticial alérgica"],"ans":1,"exp":"Cuando baja la perfusión, el riñón sostiene el filtrado dilatando la aferente (prostaglandinas) y contrayendo la eferente (angiotensina II). El AINE quita la dilatación aferente, el ARA-II quita la contracción eferente y el diurético reduce el volumen: es el “triple golpe”.","why":["Eso lo hace el AINE al bloquear las prostaglandinas vasodilatadoras.","","Los ARA-II no son tóxicos para el túbulo.","Dan cristaluria fármacos como aciclovir, metotrexato, sulfas e indinavir.","La NIA la causan fármacos como betalactámicos, AINE o IBP; no es este mecanismo."],"ref":"Fisiología renal · KDIGO LRA 2012"},{"topic":"lra","subj":"nefro","id":"lra-08","dif":1,"stem":"Hombre de 66 años con ERC y LRA. K 7.2 mEq/L. ECG: T picudas, PR prolongado y QRS de 130 ms. ¿Qué das primero?","opts":["Poliestireno sulfonato de sodio oral","Gluconato de calcio al 10% IV","Furosemida IV","Bicarbonato de sodio IV a todos los pacientes","Hemodiálisis antes de cualquier medicamento"],"ans":1,"exp":"Con cambios en el ECG, lo primero es estabilizar la membrana del miocardio con calcio IV (10 mL de gluconato de calcio al 10% en 2–3 min; se repite si el ECG no mejora). No baja el potasio: después se redistribuye (insulina con glucosa, salbutamol) y se elimina (diurético, quelantes, diálisis).","why":["Tarda horas en actuar.","","Elimina potasio, pero lento y solo si orina.","Solo si hay acidosis metabólica.","Puede necesitarla, pero primero se protege el corazón con calcio mientras se prepara."],"ref":"KDIGO 2020 controversias del potasio"},{"topic":"lra","subj":"nefro","id":"lra-09","dif":1,"stem":"¿Cuál de estos hallazgos en un paciente con LRA es indicación de diálisis urgente?","opts":["Creatinina de 6.5 mg/dL en un paciente asintomático","BUN de 110 mg/dL sin síntomas","Frote pericárdico con dolor pleurítico (pericarditis urémica)","K de 5.8 mEq/L sin cambios en el ECG","pH 7.29 con HCO₃ de 17"],"ans":2,"exp":"AEIOU: Acidosis grave refractaria, Electrolitos (hiperkalemia refractaria), Intoxicaciones dializables, sobrecarga de volumen (Overload) refractaria y Uremia sintomática (pericarditis, encefalopatía, sangrado). Ninguna cifra aislada de creatinina o BUN es indicación.","why":["La cifra sola no indica diálisis.","Sin síntomas urémicos no es indicación urgente.","","Una hiperkalemia leve sin cambios en el ECG se maneja con medicamentos.","Es una acidosis leve; la indicación es acidosis grave (pH \u003c7.1–7.15) que no responde."],"ref":"KDIGO LRA 2012"},{"topic":"lra","subj":"nefro","id":"lra-10","dif":2,"stem":"Hombre de 24 años después de correr 42 km con calor. Orina oscura y mialgias. Tira reactiva: sangre +++. Sedimento: 0–2 eritrocitos por campo. CK 52 000 U/L, K 5.9, Cr 2.3. ¿Tratamiento principal?","opts":["Restricción de líquidos","Cristaloides IV abundantes para lograr una uresis alta (≈200–300 mL/h)","Furosemida sin reponer volumen","Esteroides IV","Biopsia renal"],"ans":1,"exp":"Tira positiva para sangre sin eritrocitos en el sedimento = pigmento (mioglobina). La rabdomiólisis daña el túbulo por obstrucción con cilindros, toxicidad del grupo hem y vasoconstricción. Lo que más ayuda es hidratar temprano y en abundancia. Vigila potasio y fósforo (altos), calcio (bajo al inicio) y síndrome compartimental.","why":["Empeoraría la precipitación de mioglobina.","","Los diuréticos sin volumen empeoran la hipoperfusión.","No hay un proceso inflamatorio que tratar.","El diagnóstico es clínico y de laboratorio."],"ref":"Bosch X, et al. N Engl J Med 2009"},{"topic":"lra","subj":"nefro","id":"lra-11","dif":2,"stem":"Mujer de 45 años que empezó amoxicilina hace 9 días por sinusitis. Tiene fiebre, exantema maculopapular y Cr de 0.8 a 2.4. EGO: leucocituria estéril y cilindros leucocitarios. Eosinofilia en sangre. ¿Diagnóstico y manejo?","opts":["Pielonefritis; cambiar de antibiótico","Nefritis intersticial aguda; suspender el fármaco (± esteroide)","NTA por amoxicilina; diálisis","Glomerulonefritis postinfecciosa; esteroides en pulsos","LRA prerrenal; líquidos"],"ans":1,"exp":"La NIA es una reacción de hipersensibilidad (betalactámicos, AINE, IBP, sulfas, rifampicina). La triada fiebre, exantema y eosinofilia solo aparece completa en una minoría, pero aquí está. Lo clave es suspender el fármaco; los esteroides se consideran si no mejora en pocos días.","why":["La leucocituria es estéril y el exantema apunta a hipersensibilidad, no a infección.","","La amoxicilina no es un tóxico tubular típico, y los cilindros leucocitarios no son de NTA.","Daría cilindros eritrocitarios e hipocomplementemia.","No hay hipovolemia y el sedimento es activo."],"ref":"Perazella MA, et al. Nat Rev Nephrol 2010"},{"topic":"lra","subj":"nefro","id":"lra-12","dif":2,"stem":"Hombre de 71 años, fumador, 3 semanas después de un cateterismo cardiaco. Cr de 1.1 a 2.8. Livedo reticularis en piernas, dedos azules y dolorosos con pulsos pedios presentes, eosinofilia y C3 bajo. ¿Diagnóstico?","opts":["Nefropatía por contraste","Enfermedad renal ateroembólica","Nefritis intersticial por contraste","Trombosis de la arteria renal","LRA prerrenal"],"ans":1,"exp":"Al manipular una aorta con ateromas se sueltan cristales de colesterol que tapan arteriolas: LRA subaguda (semanas), livedo, dedos azules con pulsos presentes, eosinofilia, eosinofiluria e hipocomplementemia. La biopsia muestra hendiduras de colesterol. El tratamiento es de soporte, con estatina.","why":["Aparece a las 24–72 h, sin livedo ni eosinofilia.","","No es una presentación típica del contraste.","Sería abrupta, con dolor en el flanco y LDH alta.","No hay hipovolemia ni fármacos hemodinámicos."],"ref":"Scolari F, Ravani P. Lancet 2010"},{"topic":"lra","subj":"nefro","id":"lra-13","dif":2,"stem":"Mujer de 69 años con ERC G3b (TFG 35) y DM2 que necesita una tomografía con contraste yodado. ¿Qué medida preventiva tiene respaldo?","opts":["N-acetilcisteína oral","Hidratación IV con solución isotónica antes y después del estudio","Hemodiálisis profiláctica después del contraste","Furosemida IV antes del estudio","Cancelar siempre el estudio"],"ans":1,"exp":"En pacientes con riesgo se usa hidratación IV isotónica, la menor dosis posible de contraste de baja osmolaridad y se suspenden los nefrotóxicos. La N-acetilcisteína no mostró beneficio (PRESERVE). ⚠️ El umbral de TFG para hidratar varía entre guías (\u003c30 en el consenso ACR-NKF 2020; algunos protocolos usan \u003c45).","why":["El ensayo PRESERVE no mostró beneficio.","","No previene la nefropatía y tiene riesgos.","Los diuréticos aumentan el riesgo.","Si el estudio es necesario, se hace con prevención."],"ref":"ACR-NKF 2020 · PRESERVE 2018"},{"topic":"lra","subj":"nefro","id":"lra-14","dif":2,"stem":"Paciente de 61 años con NTA oligúrica, euvolémico y sin edema pulmonar. El residente propone furosemida IV para “convertirla en no oligúrica”. ¿Qué es correcto?","opts":["Mejora la supervivencia y acelera la recuperación","No se recomienda para tratar la LRA; solo para manejar la sobrecarga de volumen","Está indicada en todos los pacientes oligúricos","Evita la necesidad de diálisis","Debe darse con manitol de rutina"],"ans":1,"exp":"KDIGO recomienda no usar diuréticos para prevenir ni tratar la LRA, salvo para manejar la sobrecarga de volumen. Producir más orina no cambia el pronóstico ni evita la diálisis.","why":["No mejora la supervivencia ni la recuperación.","","No hay indicación general en la oliguria.","No evita la diálisis.","El manitol tampoco se recomienda para prevenir ni tratar la LRA."],"ref":"KDIGO LRA 2012"},{"topic":"lra","subj":"nefro","id":"lra-15","dif":3,"stem":"Hombre de 56 años con cirrosis alcohólica y ascitis. Cr de 1.0 a 2.3 en 3 días. Se suspendieron los diuréticos y recibió albúmina 1 g/kg por 2 días sin mejoría. Sin choque, sin nefrotóxicos, sedimento normal, sin proteinuria, USG renal normal. FENa 0.2%. ¿Diagnóstico y tratamiento?","opts":["NTA; diálisis","Síndrome hepatorrenal (SHR-LRA); terlipresina con albúmina","Prerrenal por hipovolemia; más diuréticos","Nefropatía por IgA; esteroides","Nefropatía obstructiva; sonda vesical"],"ans":1,"exp":"SHR-LRA: LRA funcional en la cirrosis con ascitis, por vasodilatación esplácnica y vasoconstricción renal intensa. Se diagnostica cuando no responde a 2 días sin diuréticos y con albúmina 1 g/kg, sin choque, nefrotóxicos ni daño estructural. Tratamiento: vasoconstrictor (terlipresina, o norepinefrina en terapia intensiva) con albúmina; el definitivo es el trasplante hepático.","why":["Un sedimento normal con FENa muy baja no es NTA.","","La hipovolemia ya se descartó con la albúmina, y los diuréticos empeoran el cuadro.","No hay hematuria ni proteinuria.","El USG es normal, sin hidronefrosis."],"ref":"ICA/ADQI 2015 · AASLD 2021 ascitis y SHR"},{"topic":"smdl","subj":"endo","id":"smdl-01","dif":2,"stem":"Mujer de 44 años sin tratamientos: cintura 92 cm, TG 168 mg/dL, HDL 46 mg/dL, PA 124/78 mmHg, glucosa en ayuno 96 mg/dL. ¿Tiene síndrome metabólico según los criterios armonizados?","opts":["No, solo cumple 2 criterios","Sí: cintura, TG y HDL","No, porque la glucosa es normal","Sí: cumple los 5 criterios","Solo si la cintura es ≥102 cm"],"ans":1,"exp":"Cumple 3 de 5: cintura (≥88 cm en ATP III y ≥80 cm en IDF para Latinoamérica), TG ≥150 y HDL \u003c50 mg/dL (umbral de mujeres). La PA y la glucosa no cumplen.","why":["El HDL de 46 sí cuenta porque en mujeres el umbral es \u003c50.","","No hace falta que todos los criterios estén alterados.","La PA y la glucosa no cumplen.","≥102 cm es el umbral de hombres en ATP III."],"ref":"Alberti KG, et al. Circulation 2009"},{"topic":"smdl","subj":"endo","id":"smdl-02","dif":2,"stem":"Hombre de 58 años con DM2 de 12 años de evolución e HTA. Sin ECV, sin retinopatía ni albuminuria, TFG 82. LDL 142 mg/dL. Según la ESC/EAS, ¿cuál es su meta de LDL?","opts":["\u003c116 mg/dL","\u003c100 mg/dL","\u003c70 mg/dL y reducción ≥50%","\u003c55 mg/dL y reducción ≥50%","\u003c40 mg/dL"],"ans":2,"exp":"DM sin daño a órgano blanco pero con ≥10 años de evolución u otro factor de riesgo = alto riesgo → LDL \u003c70 mg/dL y reducción ≥50%. Sería muy alto riesgo con daño a órgano blanco, ≥3 factores mayores o ECV.","why":["Es la meta de bajo riesgo.","Es la meta de riesgo moderado (DM joven, corta evolución, sin FR).","","Esa es para muy alto riesgo; no tiene daño a órgano blanco ni ECV.","Solo se considera en eventos recurrentes en 2 años."],"ref":"ESC/EAS dislipidemias 2019"},{"topic":"smdl","subj":"endo","id":"smdl-03","dif":1,"stem":"¿Cuál de estas es una estatina de alta intensidad?","opts":["Simvastatina 20 mg","Pravastatina 40 mg","Rosuvastatina 20 mg","Atorvastatina 10 mg","Lovastatina 20 mg"],"ans":2,"exp":"Alta intensidad (reduce LDL ≥50%): atorvastatina 40–80 mg y rosuvastatina 20–40 mg. Las demás opciones son de intensidad baja o moderada.","why":["Intensidad moderada.","Intensidad moderada.","","Intensidad moderada.","Intensidad baja-moderada."],"ref":"ACC/AHA 2018 colesterol"},{"topic":"smdl","subj":"endo","id":"smdl-04","dif":2,"stem":"Hombre de 62 años con IAM previo, en atorvastatina 80 mg. Refiere dolor muscular simétrico en muslos desde hace 3 semanas. CK 3 veces el límite superior; TSH normal. ¿Qué haces?","opts":["Suspender para siempre todo hipolipemiante","Mantener la dosis y agregar gemfibrozilo","Suspender temporalmente; al mejorar, reintentar con otra estatina o dosis menor y agregar ezetimiba si no llega a la meta","Coenzima Q10 obligatoria y seguir igual","Cambiar a niacina"],"ans":2,"exp":"Ante síntomas musculares con CK \u003c10 veces el límite: suspender, esperar a que mejoren y reintroducir otra estatina o la misma a menor dosis. Si no alcanza la meta, agregar ezetimiba y después iPCSK9 o ácido bempedoico. En prevención secundaria nunca se abandona la terapia hipolipemiante.","why":["En prevención secundaria es el peor desenlace: pierde la protección cardiovascular.","El gemfibrozilo con estatina aumenta la miopatía.","","No tiene evidencia sólida y no resuelve el problema.","La niacina no reduce eventos y tiene muchos efectos adversos."],"ref":"ESC/EAS 2019 · EAS consensus SAMS 2015"},{"topic":"smdl","subj":"endo","id":"smdl-05","dif":1,"stem":"Paciente en simvastatina 40 mg. Otro médico le agregó un fibrato por TG de 640 mg/dL. Llega con mialgias intensas, orina oscura y CK de 28 000 U/L. ¿Qué fibrato es el más probable responsable de la interacción?","opts":["Fenofibrato","Gemfibrozilo","Bezafibrato a dosis baja","Ninguno; los fibratos no interactúan","Ácido fenofíbrico"],"ans":1,"exp":"El gemfibrozilo inhibe la glucuronidación de las estatinas y aumenta mucho sus niveles: alto riesgo de miopatía y rabdomiólisis. Si se necesita un fibrato con estatina, se usa fenofibrato.","why":["Es el fibrato que se prefiere junto a estatinas por su menor interacción.","","No es el clásico de esta interacción.","Sí interactúan, sobre todo el gemfibrozilo.","Es la forma activa del fenofibrato; tiene menor interacción."],"ref":"ESC/EAS 2019"},{"topic":"smdl","subj":"endo","id":"smdl-06","dif":2,"stem":"Hombre de 46 años con DM2 descontrolada (A1c 11%) que bebe 6 cervezas diarias. TG 1 480 mg/dL, sin dolor abdominal. ¿Cuál es el objetivo prioritario del tratamiento?","opts":["Bajar el LDL con estatina de alta intensidad","Prevenir pancreatitis: dieta muy baja en grasa, suspender el alcohol, controlar la glucosa e iniciar fenofibrato","Iniciar icosapento de etilo como único tratamiento","Repetir los lípidos en 6 meses","Iniciar niacina"],"ans":1,"exp":"Con TG muy altos el riesgo inmediato es la pancreatitis. Se corrigen las causas secundarias (alcohol, DM descontrolada), dieta muy baja en grasa y fenofibrato. Después se reevalúa el LDL y el riesgo cardiovascular.","why":["Importa después, pero lo urgente con TG >1 000 es la pancreatitis.","","Está indicado con TG 135–499 y alto riesgo; no es el tratamiento de una hipertrigliceridemia grave.","Esperar es peligroso con este nivel.","No reduce eventos y aumenta la glucosa."],"ref":"ESC/EAS 2019 · Endocrine Society hipertrigliceridemia"},{"topic":"smdl","subj":"endo","id":"smdl-07","dif":1,"stem":"Mujer de 38 años con pápulas amarillas de base eritematosa en glúteos y codos que aparecieron en semanas. En el fondo de ojo los vasos retinianos se ven blanquecinos. ¿Qué espera encontrar en el laboratorio?","opts":["LDL >300 mg/dL con TG normales","Triglicéridos muy elevados (quilomicronemia)","HDL muy bajo aislado","Lp(a) elevada","Hipoglucemia"],"ans":1,"exp":"Xantomas eruptivos + lipemia retinalis = hipertrigliceridemia grave por quilomicronemia (habitualmente TG >1 000 mg/dL). Busca DM descontrolada, alcohol y fármacos, y previene la pancreatitis.","why":["El LDL muy alto da xantomas tendinosos y arco corneal, no eruptivos.","","No produce xantomas eruptivos.","No da hallazgos cutáneos característicos.","No tiene relación."],"ref":"Endocrine Society hipertrigliceridemia 2012"},{"topic":"smdl","subj":"endo","id":"smdl-08","dif":2,"stem":"Hombre de 29 años con LDL 268 mg/dL, xantomas en tendones de Aquiles y padre con IAM a los 44 años. ¿Diagnóstico y manejo?","opts":["Dislipidemia secundaria a dieta; solo cambios de estilo de vida","Hipercolesterolemia familiar: estatina de alta intensidad (probablemente con ezetimiba) y tamizaje en cascada de la familia","Hipertrigliceridemia familiar; fenofibrato","Disbetalipoproteinemia; niacina","Esperar a los 40 años para iniciar estatina"],"ans":1,"exp":"LDL ≥190 + xantomas tendinosos + ECV prematura en un familiar de primer grado = hipercolesterolemia familiar (autosómica dominante). Es alto riesgo desde joven: estatina de alta intensidad, ezetimiba y a menudo iPCSK9 para llegar a la meta. Hay que estudiar a los familiares.","why":["La dieta no explica un LDL de 268 con xantomas tendinosos.","","El problema es el LDL, no los TG.","La disbetalipoproteinemia da xantomas palmares estriados y eleva CT y TG por igual.","Retrasar el tratamiento aumenta el daño acumulado."],"ref":"ESC/EAS 2019"},{"topic":"smdl","subj":"endo","id":"smdl-09","dif":1,"stem":"Mujer de 52 años con hipercolesterolemia nueva (LDL 210 mg/dL), fatiga, aumento de peso, estreñimiento y piel seca. Antes de iniciar estatina, ¿qué estudio pides?","opts":["TSH","Cortisol sérico","Lipasa","Prueba de embarazo como único estudio","Electroforesis de proteínas"],"ans":0,"exp":"El hipotiroidismo es causa secundaria de LDL alto y además aumenta el riesgo de miopatía por estatinas. Corregirlo con levotiroxina puede normalizar o bajar mucho el LDL.","why":["","El Cushing no es la causa sugerida por este cuadro.","No tiene relación con este cuadro.","No explica los síntomas.","Se usa en sospecha de mieloma o nefrótico, no aquí."],"ref":"ESC/EAS 2019"},{"topic":"smdl","subj":"endo","id":"smdl-10","dif":1,"stem":"¿Cuál es el mecanismo de acción de la ezetimiba?","opts":["Inhibe la HMG-CoA reductasa","Bloquea la proteína NPC1L1 y reduce la absorción intestinal de colesterol","Inhibe la PCSK9","Activa PPAR-α","Secuestra ácidos biliares en el intestino"],"ans":1,"exp":"La ezetimiba bloquea NPC1L1 en el borde en cepillo del enterocito. Baja el LDL ~20–25% y redujo eventos sumada a estatina (IMPROVE-IT).","why":["Es el mecanismo de las estatinas.","","Es el mecanismo de evolocumab y alirocumab.","Es el mecanismo de los fibratos.","Es el mecanismo de la colestiramina y similares."],"ref":"Cannon CP, et al. IMPROVE-IT, NEJM 2015"},{"topic":"smdl","subj":"endo","id":"smdl-11","dif":2,"stem":"Hombre de 64 años con IAM hace 1 año y EVC hace 6 meses. Toma rosuvastatina 40 mg y ezetimiba 10 mg con buen apego. LDL 78 mg/dL. ¿Siguiente paso?","opts":["Nada: ya bajó bastante","Agregar un iPCSK9","Cambiar a simvastatina 80 mg","Agregar gemfibrozilo","Suspender la ezetimiba"],"ans":1,"exp":"Muy alto riesgo (dos eventos) fuera de meta pese a estatina máxima + ezetimiba → iPCSK9. Con eventos recurrentes en 2 años incluso se puede buscar LDL \u003c40 mg/dL.","why":["Su meta es \u003c55 (o \u003c40 por eventos recurrentes).","","Es menos potente que la rosuvastatina 40 mg.","No baja el LDL de forma relevante y aumenta la miopatía.","Perdería reducción de LDL."],"ref":"ESC/EAS 2019"},{"topic":"smdl","subj":"endo","id":"smdl-12","dif":3,"stem":"Hombre de 66 años con cardiopatía isquémica, en atorvastatina 80 mg. LDL 48 mg/dL, TG 228 mg/dL. ¿Qué fármaco demostró reducir eventos en este escenario?","opts":["Fenofibrato","Niacina de liberación prolongada","Icosapento de etilo","Omega-3 mezclados en dosis bajas","Ninguno"],"ans":2,"exp":"REDUCE-IT: en pacientes con ECV o DM con factores de riesgo y TG 135–499 mg/dL pese a estatina, el icosapento de etilo (EPA purificado 2 g c/12 h) redujo eventos cardiovasculares. Las mezclas de omega-3 y los fibratos no lo demostraron sobre la estatina.","why":["Sobre estatina no redujo eventos de forma consistente.","No reduce eventos y tiene muchos efectos adversos.","","Las mezclas EPA+DHA a dosis bajas no mostraron beneficio.","Sí existe una opción con evidencia."],"ref":"Bhatt DL, et al. REDUCE-IT, NEJM 2019"},{"topic":"smdl","subj":"endo","id":"smdl-13","dif":1,"stem":"Colesterol total 220 mg/dL, HDL 40 mg/dL, triglicéridos 200 mg/dL. ¿LDL calculado por Friedewald?","opts":["100 mg/dL","120 mg/dL","140 mg/dL","160 mg/dL","No se puede calcular"],"ans":2,"exp":"LDL = CT − HDL − TG/5 = 220 − 40 − 40 = 140 mg/dL. Solo es válida con TG \u003c400 mg/dL.","why":["Revisa la resta.","Restaste TG/2.5 en lugar de TG/5.","","Olvidaste restar los TG/5.","Sí se puede: los TG son \u003c400."],"ref":"Friedewald WT, et al. Clin Chem 1972"},{"topic":"smdl","subj":"endo","id":"smdl-14","dif":2,"stem":"Mujer de 31 años con hipercolesterolemia familiar en rosuvastatina 20 mg y ezetimiba. Planea embarazarse en los próximos meses. ¿Qué le indicas?","opts":["Continuar la estatina durante todo el embarazo","Suspender estatina y ezetimiba antes de buscar el embarazo; si necesita tratamiento, secuestradores de ácidos biliares (o aféresis de LDL en casos graves)","Cambiar a evolocumab durante el embarazo","Cambiar a fenofibrato","Duplicar la dosis de estatina antes del embarazo"],"ans":1,"exp":"Las estatinas están contraindicadas en el embarazo y la lactancia. Se suspenden antes de buscar el embarazo. Si hace falta, se usan secuestradores de ácidos biliares, que no se absorben, y en hipercolesterolemia homocigota o muy grave, aféresis de LDL.","why":["Están contraindicadas en el embarazo.","","No hay datos suficientes de seguridad en el embarazo.","No es el tratamiento del LDL y tampoco se recomienda en el embarazo.","No tiene sentido y está contraindicada."],"ref":"ESC/EAS 2019"},{"topic":"smdl","subj":"endo","id":"smdl-15","dif":1,"stem":"Hombre de 45 años con síndrome metabólico (cintura 108 cm, TG 190, HDL 36, glucosa 108). ¿Qué intervención mejora más componentes a la vez?","opts":["Metformina a todos","Estatina a todos","Bajar 7–10% del peso con dieta y ≥150 min/semana de ejercicio","Fenofibrato","Orlistat como primera línea"],"ans":2,"exp":"La pérdida de peso con dieta y ejercicio mejora la cintura, los TG, el HDL, la PA y la glucosa al mismo tiempo, y reduce la progresión a DM2 (DPP). Los fármacos se agregan según cada componente y el riesgo cardiovascular.","why":["Se considera en prediabetes con IMC ≥35, \u003c60 años o DMG previa; no es para todos.","Se decide por el riesgo cardiovascular y el LDL, no por el síndrome en sí.","","Solo actúa sobre TG.","Tiene un efecto modesto y no es primera línea."],"ref":"ADA 2026 secc. 3 · AHA 2009"},{"topic":"hta","subj":"nefro","id":"hta-01","dif":1,"stem":"Hombre de 40 años, asintomático, con PA de 148/92 mmHg en una sola visita. Sin comorbilidades. ¿Siguiente paso?","opts":["Iniciar amlodipino hoy","Confirmar con MAPA o automedición en casa","Ecocardiograma urgente","Iniciar IECA + diurético","Diagnosticar HTA y citar en un año"],"ans":1,"exp":"Una sola medición en consultorio no basta. Se confirma con medición fuera del consultorio (MAPA o automedición), que además detecta HTA de bata blanca y enmascarada. Con PA muy alta o daño a órgano blanco se puede iniciar sin esperar.","why":["Se trata después de confirmar, salvo HTA grave o daño a órgano blanco.","","No está indicado de entrada.","Primero se confirma el diagnóstico.","Primero confirma; tampoco se espera un año."],"ref":"ESC 2024 HTA"},{"topic":"hta","subj":"nefro","id":"hta-02","dif":1,"stem":"Mujer de 50 años con PA en consultorio de 152/96 mmHg en dos visitas. MAPA de 24 h: promedio 122/76, diurno 126/80. ¿Diagnóstico?","opts":["HTA estadio 2","HTA de bata blanca","HTA enmascarada","HTA resistente","Hipotensión ortostática"],"ans":1,"exp":"Alta en consultorio y normal en MAPA = bata blanca. No requiere fármacos de inicio: estilo de vida y vigilancia con MAPA o automedición, porque tiene más riesgo de desarrollar HTA sostenida.","why":["El MAPA es normal.","","Enmascarada es al revés: normal en consultorio y alta fuera.","Ni siquiera recibe tratamiento.","No hay datos de ortostatismo."],"ref":"ESC 2024 HTA"},{"topic":"hta","subj":"nefro","id":"hta-03","dif":2,"stem":"Hombre de 52 años con HTA confirmada por MAPA (promedio 156/98), sin comorbilidades. ¿Tratamiento inicial preferido?","opts":["Atenolol solo","Combinación en una sola pastilla de IECA/ARA-II con calcioantagonista o tiazida","Hidralazina","Furosemida","Solo dieta por 6 meses"],"ans":1,"exp":"En la mayoría de los hipertensos se inicia con dos fármacos de primera línea, idealmente en una sola pastilla (mejor apego y control más rápido). Después se escala a A + C + D.","why":["Los betabloqueadores no son de primera línea sin indicación específica.","","No es primera línea (taquicardia refleja, retención de líquidos).","Los diuréticos de asa no son de primera línea en HTA sin IC o ERC avanzada.","Con 156/98 confirmada, el estilo de vida solo no basta."],"ref":"ESC 2024 · AHA/ACC 2025"},{"topic":"hta","subj":"nefro","id":"hta-04","dif":1,"stem":"Mujer de 56 años con DM2 e HTA, con cociente albúmina/creatinina de 280 mg/g. ¿Qué antihipertensivo debe formar parte de su tratamiento?","opts":["Amlodipino como único fármaco","IECA o ARA-II","Hidroclorotiazida como único fármaco","Atenolol","Doxazosina"],"ans":1,"exp":"Con albuminuria (diabética o no), el IECA o ARA-II a dosis máxima tolerada reduce la proteinuria y la progresión renal. Se combina con otros fármacos para llegar a la meta y, en DM2 con ERC, con un iSGLT2.","why":["Baja la PA pero no protege el riñón como el bloqueo del SRAA.","","Útil como combinación, no como base en albuminuria.","No tiene indicación específica aquí.","No es primera línea."],"ref":"KDIGO 2024 · ADA 2026"},{"topic":"hta","subj":"nefro","id":"hta-05","dif":1,"stem":"Hombre de 61 años que inició enalapril hace 4 semanas. Tiene tos seca persistente que no lo deja dormir. Rx de tórax normal. ¿Qué haces?","opts":["Agregar un antitusivo y seguir igual","Cambiar a un ARA-II","Agregar losartán al enalapril","Suspender todo antihipertensivo","Cambiar a otro IECA"],"ans":1,"exp":"La tos por IECA se debe a acumulación de bradicinina (la ECA también la degrada). Es efecto de clase: se cambia a un ARA-II, que no la produce. Desaparece en días a semanas.","why":["No resuelve la causa.","","Nunca se combinan IECA y ARA-II.","Necesita seguir tratado.","Todos los IECA la producen."],"ref":"ESC 2024 HTA"},{"topic":"hta","subj":"nefro","id":"hta-06","dif":2,"stem":"Hombre de 66 años con HTA resistente. Toma amlodipino 10 mg, losartán 100 mg y clortalidona 25 mg con buen apego confirmado. El MAPA confirma descontrol y se descartaron causas secundarias. K 4.3 mEq/L, TFG 70. ¿Qué agregas?","opts":["Enalapril","Espironolactona","Atenolol","Furosemida","Hidralazina"],"ans":1,"exp":"En la HTA resistente verdadera, la espironolactona como cuarto fármaco fue la más eficaz (PATHWAY-2). Vigila potasio y creatinina, sobre todo con TFG baja.","why":["Nunca IECA + ARA-II.","","Menos eficaz que la espironolactona en este escenario.","Solo en ERC avanzada o sobrecarga de volumen.","Opción de reserva."],"ref":"Williams B, et al. PATHWAY-2, Lancet 2015"},{"topic":"hta","subj":"nefro","id":"hta-07","dif":2,"stem":"Mujer de 45 años con HTA de difícil control con 3 fármacos y K de 3.1 mEq/L sin diuréticos. ¿Qué estudio pides primero?","opts":["Metanefrinas en plasma","Cociente aldosterona/renina","Cortisol libre urinario","Angiografía renal","Ecocardiograma"],"ans":1,"exp":"HTA resistente + hipokalemia espontánea = sospecha de hiperaldosteronismo primario, la causa endocrina más frecuente de HTA secundaria. Tamizaje: cociente aldosterona/renina; confirmación con prueba de supresión; luego TC suprarrenal y, si se piensa en cirugía, cateterismo de venas suprarrenales.","why":["El feocromocitoma da crisis de cefalea, sudoración y palpitaciones.","","Se pide si hay fenotipo de Cushing.","Es invasiva y no es el primer estudio.","No busca la causa."],"ref":"Endocrine Society 2016 hiperaldosteronismo primario"},{"topic":"hta","subj":"nefro","id":"hta-08","dif":2,"stem":"Mujer de 27 años con HTA de 6 meses, PA 168/104 mmHg, sin antecedentes familiares. Soplo abdominal periumbilical. ¿Causa más probable y conducta?","opts":["HTA esencial; tiazida","Displasia fibromuscular de arteria renal; imagen vascular (Doppler, angio-TC o angio-RM) y angioplastia con balón","Coartación aórtica; cirugía inmediata","Hiperaldosteronismo; espironolactona","Feocromocitoma; betabloqueador"],"ans":1,"exp":"Mujer joven + HTA + soplo abdominal = estenosis de arteria renal por displasia fibromuscular (imagen en “cuentas de rosario”). Responde muy bien a angioplastia con balón, generalmente sin stent. La aterosclerótica (adultos mayores) se trata sobre todo con medicamentos.","why":["El inicio joven y el soplo apuntan a causa secundaria.","","Daría diferencia de PA entre brazos y piernas.","No hay hipokalemia ni HTA resistente descrita.","No hay crisis adrenérgicas, y el betabloqueador solo está contraindicado en feocromocitoma."],"ref":"ESC 2024 HTA · SCAI/SVM displasia fibromuscular"},{"topic":"hta","subj":"nefro","id":"hta-09","dif":2,"stem":"Hombre de 38 años con episodios de cefalea intensa, palpitaciones y sudoración profusa con PA de 220/130 durante las crisis. ¿Qué estudio pides y qué precaución tienes con el tratamiento?","opts":["TSH; propranolol","Metanefrinas libres en plasma; bloqueo alfa (fenoxibenzamina o doxazosina) antes de cualquier betabloqueador","Cortisol; ketoconazol","Renina; IECA","Ecocardiograma; diurético"],"ans":1,"exp":"La tríada cefalea + palpitaciones + diaforesis con crisis hipertensivas sugiere feocromocitoma. Se confirma con metanefrinas plasmáticas (o urinarias fraccionadas) y luego imagen. Antes de la cirugía: primero bloqueo alfa y después beta. Un betabloqueador solo deja la estimulación alfa sin oposición: crisis hipertensiva.","why":["El hipertiroidismo no da crisis tan graves, y el propranolol solo es peligroso si es feocromocitoma.","","El cuadro no es de Cushing.","No es la sospecha principal.","No busca la causa."],"ref":"Endocrine Society 2014 feocromocitoma"},{"topic":"hta","subj":"nefro","id":"hta-10","dif":1,"stem":"Hombre de 19 años con HTA. PA en brazo derecho 162/88 y en piernas 110/70; pulsos femorales débiles y retrasados. La Rx de tórax muestra muescas en el borde inferior de las costillas. ¿Diagnóstico?","opts":["Displasia fibromuscular","Coartación de la aorta","Feocromocitoma","Hiperaldosteronismo","Disección aórtica"],"ans":1,"exp":"PA alta en brazos y baja en piernas, pulsos femorales retrasados (retraso braquiofemoral) y muescas costales (por circulación colateral intercostal) = coartación aórtica. Se asocia a válvula aórtica bicúspide y síndrome de Turner.","why":["No explica la diferencia brazos-piernas.","","Causaría crisis adrenérgicas.","No causa este patrón.","Daría dolor súbito desgarrante."],"ref":"ESC 2020 cardiopatías congénitas del adulto"},{"topic":"hta","subj":"nefro","id":"hta-11","dif":2,"stem":"Hombre de 59 años con dolor torácico desgarrante irradiado a la espalda. PA 200/110 mmHg, FC 104. Angio-TC: disección aórtica tipo B. ¿Manejo inicial de la PA?","opts":["Nitroprusiato solo","Esmolol o labetalol IV para FC \u003c60 y PAS \u003c120 en la primera hora; después vasodilatador si hace falta","Bajar la PAM solo 25% en 24 h","Nifedipino sublingual","Hidralazina IV sola"],"ans":1,"exp":"En la disección la meta es reducir la fuerza de eyección (dP/dt): primero betabloqueador IV para FC \u003c60 y luego, si es necesario, vasodilatador para PAS \u003c120 mmHg, todo en la primera hora. Es la excepción a la regla del 25%.","why":["Un vasodilatador sin betabloqueo previo causa taquicardia refleja y empeora la disección.","","Esa regla no aplica a la disección.","Proscrito.","Causa taquicardia refleja."],"ref":"ESC 2024 HTA · ACC/AHA 2022 enfermedad aórtica"},{"topic":"hta","subj":"nefro","id":"hta-12","dif":1,"stem":"Hombre de 55 años que se quedó sin sus antihipertensivos hace una semana. PA 210/122 mmHg, asintomático, exploración neurológica y fondo de ojo normales, ECG y creatinina sin cambios. ¿Qué haces?","opts":["Nicardipino IV en terapia intensiva","Nifedipino sublingual","Reiniciar su tratamiento oral, descenso gradual en 24–48 h y cita cercana","Furosemida IV","Bajar la PA a 120/80 en una hora"],"ans":2,"exp":"Sin daño agudo a órgano blanco es urgencia hipertensiva: tratamiento oral y descenso gradual. Bajarla rápido no da beneficio y puede causar isquemia.","why":["Es una urgencia, no una emergencia.","Proscrito por descensos bruscos e impredecibles.","","Sin sobrecarga de volumen no está indicada.","Peligroso."],"ref":"ESC 2024 HTA"},{"topic":"hta","subj":"nefro","id":"hta-13","dif":1,"stem":"Mujer de 30 años con HTA crónica controlada con enalapril. Tiene 7 semanas de embarazo. ¿Qué haces?","opts":["Continuar el enalapril","Cambiar a losartán","Cambiar a labetalol o nifedipino de liberación prolongada","Suspender todo y vigilar","Cambiar a espironolactona"],"ans":2,"exp":"IECA y ARA-II son fetotóxicos (sobre todo en 2º y 3º trimestres: oligohidramnios, falla renal fetal). Se cambian en cuanto se sabe del embarazo por labetalol, nifedipino o metildopa.","why":["Contraindicado en el embarazo.","También contraindicado.","","La HTA crónica en el embarazo debe tratarse.","Efecto antiandrogénico; no se usa."],"ref":"ESC 2024 HTA · ACOG"},{"topic":"hta","subj":"nefro","id":"hta-14","dif":1,"stem":"Hombre de 63 años con HTA que inició hidroclorotiazida hace 2 meses. Hoy tiene la primera MTF roja, caliente y muy dolorosa. ¿Qué relación tiene con su tratamiento?","opts":["Ninguna","Las tiazidas reducen la excreción de ácido úrico y desencadenan gota; considerar cambiar a losartán o amlodipino","Es una reacción alérgica a sulfas","Es hipokalemia","Es un efecto del IECA"],"ans":1,"exp":"Las tiazidas (y los diuréticos de asa) aumentan la reabsorción de urato y desencadenan gota. Tras tratar el ataque, conviene cambiar a otro antihipertensivo; el losartán además tiene efecto uricosúrico.","why":["Es una asociación clásica.","","La presentación es de gota, no de alergia.","La hipokalemia no da monoartritis.","No toma IECA."],"ref":"ACR 2020 gota"},{"topic":"hta","subj":"nefro","id":"hta-15","dif":2,"stem":"Hombre de 70 años con HTA tratada con lisinopril. Inicia losartán por indicación de otro médico. A las 2 semanas: K 6.4 mEq/L y Cr de 1.1 a 1.9 mg/dL. ¿Cuál fue el error?","opts":["Usar un ARA-II en mayores de 65 años","Combinar IECA + ARA-II","No dar diurético","No medir el ácido úrico","Ninguno; es esperable"],"ans":1,"exp":"El doble bloqueo del SRAA (IECA + ARA-II o + aliskirén) no reduce eventos y aumenta hiperkalemia, LRA e hipotensión (ONTARGET, VA NEPHRON-D). Nunca se combinan.","why":["Los ARA-II se usan sin problema en adultos mayores.","","No explica la hiperkalemia ni la LRA.","No tiene relación.","Es un error de prescripción prevenible."],"ref":"ONTARGET 2008 · ESC 2024"},{"topic":"erc","subj":"nefro","id":"erc-01","dif":1,"stem":"Hombre de 67 años con TFG de 38 mL/min/1.73 m² y cociente albúmina/creatinina de 420 mg/g, estables por 6 meses. ¿Clasificación?","opts":["G3a A2","G3b A3","G4 A3","G3b A2","G2 A3"],"ans":1,"exp":"TFG 30–44 = G3b. Albuminuria >300 mg/g = A3. Persistencia >3 meses confirma ERC.","why":["G3a es 45–59 y A2 es 30–300.","","G4 es 15–29.","A2 es 30–300; él tiene 420.","G2 es 60–89."],"ref":"KDIGO 2024"},{"topic":"erc","subj":"nefro","id":"erc-02","dif":1,"stem":"Mujer de 48 años con gastroenteritis hace 1 semana. Hoy TFG 55 mL/min/1.73 m²; nunca se había medido. EGO normal. ¿Tiene ERC?","opts":["Sí, G3a","No se puede afirmar: hay que confirmar que persista por más de 3 meses","Sí, porque la TFG es \u003c60","No, porque el EGO es normal","Sí, si el USG muestra riñones normales"],"ans":1,"exp":"La ERC requiere persistencia >3 meses. Una TFG baja en el contexto de una enfermedad aguda puede ser LRA o un cambio transitorio. Repite la creatinina (y la albuminuria) más adelante.","why":["Falta el criterio de tiempo.","","Un solo valor no basta.","Un EGO normal no descarta ERC si la TFG baja persiste.","El USG no sustituye el criterio de tiempo."],"ref":"KDIGO 2024"},{"topic":"erc","subj":"nefro","id":"erc-03","dif":2,"stem":"Hombre de 55 años sin diabetes, con nefropatía por IgA. TFG 48, cociente albúmina/creatinina 650 mg/g. Toma losartán 100 mg. PA 128/78. ¿Qué agregas para proteger el riñón?","opts":["Enalapril","Un iSGLT2 (dapagliflozina o empagliflozina)","Amlodipino","Furosemida","Nada más"],"ans":1,"exp":"KDIGO 2024: en ERC sin DM con TFG ≥20 y albuminuria ≥200 mg/g, los iSGLT2 reducen la progresión renal y los eventos (DAPA-CKD, EMPA-KIDNEY). Se suman al ARA-II a dosis máxima.","why":["Nunca IECA + ARA-II.","","Baja la PA, pero no tiene efecto antiproteinúrico adicional significativo.","Solo si hay sobrecarga de volumen.","Con esta albuminuria hay beneficio claro de agregar iSGLT2."],"ref":"KDIGO 2024 · DAPA-CKD, EMPA-KIDNEY"},{"topic":"erc","subj":"nefro","id":"erc-04","dif":2,"stem":"Mujer de 60 años con ERC G3a A3. Hace 2 semanas inició lisinopril. Creatinina de 1.30 a 1.55 mg/dL (↑19%), K 5.0 mEq/L. ¿Qué haces?","opts":["Suspender el lisinopril","Continuarlo y repetir creatinina y potasio","Agregar losartán","Cambiar a hidralazina","Solicitar biopsia renal"],"ans":1,"exp":"Un ascenso de creatinina \u003c30% al iniciar IECA o ARA-II refleja la caída de la presión glomerular (efecto protector a largo plazo). Se continúa y se vigila. Si sube >30% o hay hiperkalemia grave, revisa volumen, AINE y estenosis de arteria renal.","why":["El ascenso es menor a 30%: aceptable.","","Nunca doble bloqueo.","Perdería la protección renal.","No hay indicación."],"ref":"KDIGO 2024"},{"topic":"erc","subj":"nefro","id":"erc-05","dif":2,"stem":"Hombre de 70 años con ERC G4. Hb 9.2 g/dL, VCM 86, ferritina 80 ng/mL, saturación de transferrina 15%. ¿Primer paso?","opts":["Iniciar eritropoyetina","Reponer hierro (IV u oral)","Transfundir","Aspirado de médula ósea","Vitamina B12"],"ans":1,"exp":"En la anemia de la ERC primero se corrige la ferropenia (TSAT ≤30% y ferritina ≤500 ng/mL). Sin hierro suficiente, la eritropoyetina no funciona bien. Si la Hb sigue \u003c10 con hierro repleto, se considera el estimulante de eritropoyesis.","why":["Funciona mal sin hierro suficiente.","","No hay datos de inestabilidad ni síntomas graves.","No está indicado.","El VCM es normal y no hay datos de déficit."],"ref":"KDIGO 2012 anemia en ERC"},{"topic":"erc","subj":"nefro","id":"erc-06","dif":2,"stem":"Paciente en hemodiálisis con eritropoyetina. Hb 13.2 g/dL. ¿Qué haces?","opts":["Mantener la dosis: está perfecto","Reducir o suspender la eritropoyetina: no se busca normalizar la Hb","Aumentar la dosis","Agregar hierro","Iniciar flebotomías"],"ans":1,"exp":"Con estimulantes de eritropoyesis, la Hb no debe superar ~11.5 g/dL: buscar 13 aumentó EVC, trombosis del acceso y eventos (TREAT, CHOIR, CREATE).","why":["Es una Hb excesiva para un paciente con estimulante.","","Empeoraría el riesgo.","No está indicado con Hb alta.","No es el manejo."],"ref":"KDIGO 2012 anemia · TREAT 2009"},{"topic":"erc","subj":"nefro","id":"erc-07","dif":1,"stem":"Paciente con ERC G4. ¿Qué patrón de laboratorio esperas?","opts":["Fósforo bajo, calcio alto, PTH baja","Fósforo alto, calcio bajo o normal, PTH alta, calcitriol bajo","Fósforo normal, calcio alto, PTH alta","Fósforo alto, calcio alto, PTH baja","Todo normal hasta G5"],"ans":1,"exp":"Con menos nefronas se retiene fósforo y sube el FGF-23; baja la 1α-hidroxilasa (menos calcitriol), cae el calcio y la paratiroides responde: hiperparatiroidismo secundario. Lleva a enfermedad ósea y calcificación vascular.","why":["Es el patrón contrario.","","Calcio alto con PTH alta y fósforo normal sugiere hiperparatiroidismo primario.","PTH baja no es lo esperado.","Las alteraciones empiezan desde G3."],"ref":"KDIGO 2017 CKD-MBD"},{"topic":"erc","subj":"nefro","id":"erc-08","dif":2,"stem":"Mujer en hemodiálisis con fósforo de 7.2 mg/dL, calcio de 10.6 mg/dL y calcificaciones vasculares extensas. ¿Qué quelante de fósforo prefieres?","opts":["Carbonato de calcio","Acetato de calcio","Sevelamer","Hidróxido de aluminio de forma crónica","Ninguno"],"ans":2,"exp":"Con hipercalcemia o calcificación vascular se prefiere un quelante sin calcio (sevelamer o lantano). Los quelantes de calcio aumentan la carga de calcio; el aluminio crónico es tóxico (encefalopatía, osteomalacia).","why":["Aumenta la carga de calcio.","Igual: aporta calcio.","","Tóxico a largo plazo.","Con fósforo de 7.2 necesita quelante además de la dieta."],"ref":"KDIGO 2017 CKD-MBD"},{"topic":"erc","subj":"nefro","id":"erc-09","dif":1,"stem":"Hombre con ERC G4 y HCO₃ sérico de 16 mEq/L persistente. ¿Qué indicas?","opts":["Nada","Bicarbonato de sodio oral","Hemodiálisis urgente","Acetazolamida","Furosemida"],"ans":1,"exp":"La acidosis metabólica crónica de la ERC acelera la pérdida ósea y muscular y quizá la progresión renal. Se trata con bicarbonato oral cuando el HCO₃ es \u003c18 mEq/L.","why":["Con 16 mEq/L se recomienda tratar.","","Sin otras indicaciones no requiere diálisis urgente.","Empeora la acidosis.","No corrige la acidosis."],"ref":"KDIGO 2024"},{"topic":"erc","subj":"nefro","id":"erc-10","dif":2,"stem":"Hombre con ERC G5 sin diálisis requiere una biopsia renal. Tiene tiempo de sangrado prolongado con plaquetas y coagulación normales. ¿Qué das antes del procedimiento?","opts":["Plasma fresco congelado","Transfusión de plaquetas","Desmopresina","Vitamina K","Heparina"],"ans":2,"exp":"La uremia causa disfunción plaquetaria (con número de plaquetas y tiempos de coagulación normales). La desmopresina libera factor de von Willebrand y mejora la adhesión plaquetaria en horas. También ayudan la diálisis, corregir la anemia y los estrógenos conjugados.","why":["La coagulación es normal.","Las plaquetas transfundidas también se vuelven disfuncionales en el ambiente urémico.","","No hay déficit de vitamina K.","Aumentaría el sangrado."],"ref":"Hedges SJ, et al. Nat Clin Pract Nephrol 2007"},{"topic":"erc","subj":"nefro","id":"erc-11","dif":1,"stem":"Mujer de 59 años con creatinina de 3.1 mg/dL. El USG muestra riñones de 8 cm, ecogénicos, con pérdida de la diferenciación corticomedular. ¿Qué sugiere?","opts":["Lesión renal aguda prerrenal","Enfermedad renal crónica","Obstrucción aguda","Nefropatía diabética temprana","Amiloidosis"],"ans":1,"exp":"Riñones pequeños (\u003c9–10 cm) y ecogénicos indican cronicidad. Excepciones con riñones grandes en ERC: diabetes, amiloidosis, poliquistosis y VIH.","why":["En la LRA el tamaño suele ser normal.","","La obstrucción mostraría hidronefrosis.","Suele cursar con riñones normales o grandes.","Cursa con riñones grandes."],"ref":"KDIGO 2024"},{"topic":"erc","subj":"nefro","id":"erc-12","dif":1,"stem":"Hombre diestro de 62 años con ERC G4 que progresa. ¿Qué acción es la más importante para preparar su terapia de reemplazo?","opts":["Colocar un catéter de hemodiálisis en cuanto la TFG llegue a 15","Referir para fístula arteriovenosa en el brazo no dominante con meses de anticipación y evitar venopunciones en ese brazo","Iniciar diálisis cuando la TFG sea \u003c20 aunque esté asintomático","Esperar a que tenga uremia para decidir","Colocar un catéter central de inserción periférica en el brazo izquierdo"],"ans":1,"exp":"La fístula AV nativa tiene menos infecciones y trombosis que injertos y catéteres, pero tarda semanas o meses en madurar. Se planea con anticipación y se protegen las venas del brazo no dominante.","why":["El catéter tiene más bacteriemias y es el acceso de última opción.","","Iniciar temprano y asintomático no mejora la supervivencia (IDEAL).","Lleva a iniciar diálisis con catéter de urgencia.","Destruye las venas que se necesitan para la fístula."],"ref":"KDIGO 2024 · KDOQI 2019 accesos vasculares"},{"topic":"erc","subj":"nefro","id":"erc-13","dif":2,"stem":"Hombre de 58 años con ERC G3a A2, no en diálisis. LDL 128 mg/dL. Sin ECV. ¿Qué indicas?","opts":["Nada: la estatina no sirve en ERC","Estatina (o estatina + ezetimiba)","Solo fenofibrato","Niacina","Esperar a que entre a diálisis"],"ans":1,"exp":"KDIGO: estatina (o estatina + ezetimiba, como en SHARP) en todos los adultos ≥50 años con ERC no en diálisis. En pacientes que ya están en diálisis no se inicia (4D, AURORA), aunque se continúa si ya la tomaban.","why":["Sí reduce eventos en ERC no dialítica.","","No es el tratamiento recomendado.","Sin beneficio.","En diálisis ya no muestra beneficio al iniciarla."],"ref":"KDIGO 2013 lípidos en ERC · SHARP 2011"},{"topic":"erc","subj":"nefro","id":"erc-14","dif":2,"stem":"Mujer de 64 años con DM2 y ERC G3a A3. Toma losartán 100 mg y empagliflozina. K 4.5 mEq/L. Albuminuria persistente de 900 mg/g. ¿Qué agregas para reducir progresión renal y eventos CV?","opts":["Espironolactona","Finerenona","Enalapril","Aliskirén","Hidroclorotiazida"],"ans":1,"exp":"La finerenona (antagonista mineralocorticoide no esteroideo) redujo progresión renal y eventos CV en DM2 con albuminuria pese a IECA/ARA-II (FIDELIO, FIGARO). Requiere K normal y vigilancia.","why":["No tiene la misma evidencia renal y da más hiperkalemia y ginecomastia.","","Nunca IECA + ARA-II.","Doble bloqueo dañino.","Baja la PA, pero no tiene ese beneficio renal."],"ref":"KDIGO 2022 DM en ERC · FIDELIO-DKD"},{"topic":"erc","subj":"nefro","id":"erc-15","dif":1,"stem":"¿Cuál de estos pacientes con ERC debe enviarse a Nefrología?","opts":["TFG 72, albuminuria 15 mg/g estable","TFG 26 mL/min/1.73 m²","TFG 58 estable por 3 años, albuminuria 20 mg/g","Creatinina 1.1 mg/dL en un hombre de 30 años","TFG 65 con albuminuria 40 mg/g estable"],"ans":1,"exp":"Criterios de referencia: TFG \u003c30, albuminuria ≥300 mg/g, caída rápida de la TFG, hematuria glomerular, HTA refractaria, alteraciones persistentes de potasio, litiasis recurrente o causa hereditaria. Con TFG \u003c30 también empieza la planeación de la terapia de reemplazo.","why":["Riesgo bajo; seguimiento en primer nivel.","","G3a A1 estable puede seguirse en primer nivel.","Es normal.","G2 A2 estable se sigue en primer nivel."],"ref":"KDIGO 2024"},{"topic":"glomerulo","subj":"nefro","id":"glo-01","dif":1,"stem":"Niño de 5 años con edema palpebral y de piernas de 1 semana. Proteinuria 4.2 g/24 h, albúmina 1.9 g/dL, colesterol 360 mg/dL. EGO sin eritrocitos. PA y creatinina normales, C3 normal. ¿Conducta?","opts":["Biopsia renal antes de tratar","Prednisona empírica","Ciclofosfamida","Recambio plasmático","Solo diurético y observar"],"ans":1,"exp":"Nefrótico puro en un niño = cambios mínimos hasta demostrar lo contrario. Se trata con prednisona sin biopsia; la gran mayoría responde. Se biopsia si no responde o si hay datos atípicos (hematuria, HTA, complemento bajo, edad atípica).","why":["En niños con cuadro típico no hace falta biopsia inicial.","","No es primera línea.","No tiene indicación.","Necesita tratamiento específico."],"ref":"KDIGO 2021 glomerulopatías"},{"topic":"glomerulo","subj":"nefro","id":"glo-02","dif":1,"stem":"Niño de 8 años con orina color “Coca-Cola”, edema facial y PA 140/90, 2 semanas después de una faringoamigdalitis. ASLO elevada, C3 bajo, C4 normal. ¿Diagnóstico y manejo?","opts":["Nefropatía por IgA; esteroides","GN postestreptocócica; soporte con restricción de sodio, diurético y antihipertensivo","Nefritis lúpica; micofenolato","Cambios mínimos; prednisona","GN rápidamente progresiva; recambio plasmático"],"ans":1,"exp":"Nefrítico 1–3 semanas después de faringitis, con ASLO alta y C3 bajo = GN postestreptocócica. Tratamiento de soporte; el C3 se normaliza en 6–8 semanas. Si no se normaliza, piensa en otra causa (C3 glomerulopatía).","why":["La IgA aparece a los 1–2 días y con C3 normal.","","El lupus tendría C3 y C4 bajos y anti-dsDNA.","Cambios mínimos es nefrótico, sin hematuria ni HTA.","No hay datos de GN rápidamente progresiva."],"ref":"KDIGO 2021"},{"topic":"glomerulo","subj":"nefro","id":"glo-03","dif":1,"stem":"Hombre de 22 años con hematuria macroscópica que empezó 2 días después de un cuadro gripal. PA y creatinina normales. C3 normal. ¿Diagnóstico más probable?","opts":["GN postestreptocócica","Nefropatía por IgA","Nefropatía membranosa","Goodpasture","Cistitis hemorrágica"],"ans":1,"exp":"Hematuria sinfaringítica (a los pocos días de la infección) con C3 normal = nefropatía por IgA, la GN primaria más común del mundo. La biopsia muestra depósitos mesangiales de IgA.","why":["Aparece 1–3 semanas después y con C3 bajo.","","Es nefrótica, sin hematuria macroscópica.","Daría hemoptisis y GN rápidamente progresiva.","No tiene relación temporal con la infección respiratoria ni es glomerular."],"ref":"KDIGO 2021"},{"topic":"glomerulo","subj":"nefro","id":"glo-04","dif":2,"stem":"Hombre de 26 años con hemoptisis y oliguria. Cr 4.8 mg/dL, hematuria con cilindros eritrocitarios. Biopsia: semilunas con depósito lineal de IgG en la membrana basal. ¿Tratamiento?","opts":["Solo antibióticos","Recambio plasmático + pulsos de esteroides + ciclofosfamida","IECA y observar","Prednisona oral sola","Hemodiálisis sin inmunosupresión"],"ans":1,"exp":"IF lineal + hemorragia pulmonar + GN rápidamente progresiva = enfermedad anti-MBG (Goodpasture). El recambio plasmático retira los anticuerpos circulantes; esteroides y ciclofosfamida frenan su producción. Es una urgencia.","why":["No es infeccioso.","","Insuficiente para una GN rápidamente progresiva.","Insuficiente sin recambio plasmático ni ciclofosfamida.","Puede requerir diálisis, pero sin inmunosupresión pierde riñón y pulmón."],"ref":"KDIGO 2021"},{"topic":"glomerulo","subj":"nefro","id":"glo-05","dif":2,"stem":"Mujer de 54 años con sinusitis crónica con secreción sanguinolenta, nódulos pulmonares cavitados y Cr que sube de 1.0 a 3.6 en 2 semanas con cilindros eritrocitarios. c-ANCA (PR3) positivo. ¿Diagnóstico?","opts":["Poliangeítis microscópica","Granulomatosis con poliangeítis","EGPA","Sarcoidosis","Tuberculosis"],"ans":1,"exp":"Vía aérea superior + nódulos pulmonares + GN pauciinmune + c-ANCA/PR3 = granulomatosis con poliangeítis. Tratamiento de inducción: pulsos de esteroides + rituximab o ciclofosfamida; recambio plasmático en casos seleccionados.","why":["Es p-ANCA/MPO y sin granulomas en vía aérea superior.","","Tiene asma y eosinofilia, usualmente p-ANCA.","No da GN rápidamente progresiva con c-ANCA.","No explica la GN pauciinmune ni el c-ANCA."],"ref":"KDIGO 2024 vasculitis ANCA"},{"topic":"glomerulo","subj":"nefro","id":"glo-06","dif":2,"stem":"Mujer de 25 años con LES. Proteinuria 2.8 g/24 h, hematuria con cilindros eritrocitarios, C3 y C4 bajos, anti-dsDNA alto. Cr 1.4 mg/dL. ¿Siguiente paso?","opts":["Solo hidroxicloroquina","Biopsia renal para clasificar la nefritis lúpica y luego esteroides + micofenolato o ciclofosfamida","Observar 6 meses","Rituximab sin biopsia","IECA y alta"],"ans":1,"exp":"Toda sospecha de nefritis lúpica se biopsia: la clase define el tratamiento. Las clases III y IV (proliferativas) se inducen con esteroides + micofenolato o ciclofosfamida (± belimumab o voclosporina). La hidroxicloroquina se mantiene en todos.","why":["Se mantiene, pero no basta para una nefritis activa.","","Retrasar el tratamiento lleva a ERC.","No es la inducción estándar sin clasificar.","Insuficiente."],"ref":"KDIGO 2024 nefritis lúpica"},{"topic":"glomerulo","subj":"nefro","id":"glo-07","dif":2,"stem":"Hombre de 52 años con nefropatía membranosa (albúmina 1.7 g/dL). Presenta dolor en flanco izquierdo, hematuria macroscópica y LDH elevada. ¿Complicación más probable?","opts":["Pielonefritis","Trombosis de la vena renal","Litiasis renal","Infarto por embolia cardiaca","Necrosis papilar"],"ans":1,"exp":"El nefrótico es protrombótico (pérdida urinaria de antitrombina III, ↑ fibrinógeno). La membranosa con albúmina muy baja tiene el mayor riesgo de trombosis de la vena renal. Se confirma con Doppler o angio-TC; se anticoagula.","why":["No hay fiebre ni datos infecciosos.","","Posible, pero el contexto de nefrótico grave apunta a trombosis.","Menos probable sin fuente embólica.","Se asocia a AINE, DM y drepanocitosis."],"ref":"KDIGO 2021"},{"topic":"glomerulo","subj":"nefro","id":"glo-08","dif":2,"stem":"Hombre de 24 años con adenopatías cervicales, sudoración nocturna y síndrome nefrótico de inicio brusco. ¿Qué glomerulopatía esperas en la biopsia?","opts":["Membranosa","Cambios mínimos","GEFS colapsante","Amiloidosis AL","IgA"],"ans":1,"exp":"El linfoma de Hodgkin se asocia a enfermedad de cambios mínimos (citocinas de los linfocitos T). La membranosa se asocia más a tumores sólidos.","why":["Se asocia a tumores sólidos (pulmón, colon, mama).","","Se asocia a VIH.","Se asocia a mieloma.","No es la asociación clásica."],"ref":"KDIGO 2021"},{"topic":"glomerulo","subj":"nefro","id":"glo-09","dif":1,"stem":"Hombre con VIH sin tratamiento, con proteinuria de 9 g/24 h y deterioro rápido de la función renal. Riñones grandes en el USG. ¿Diagnóstico más probable?","opts":["GEFS variante colapsante (nefropatía asociada a VIH)","Cambios mínimos","Membranosa","IgA","Postinfecciosa"],"ans":0,"exp":"La nefropatía asociada a VIH es una GEFS colapsante, con proteinuria masiva, progresión rápida y riñones grandes. Mejora con antirretrovirales; agrega IECA o ARA-II.","why":["","No progresa tan rápido ni se asocia a VIH.","Se asocia a VHB, no típicamente a VIH.","Es nefrítica.","No encaja."],"ref":"KDIGO 2021"},{"topic":"glomerulo","subj":"nefro","id":"glo-10","dif":1,"stem":"Hombre con DM2 de 15 años. ¿Cuál es el primer hallazgo de nefropatía diabética y qué muestra la biopsia en fases avanzadas?","opts":["Hematuria; semilunas","Albuminuria; expansión mesangial con nódulos de Kimmelstiel-Wilson","Cilindros eritrocitarios; depósitos lineales","Hipokalemia; necrosis tubular","Leucocituria; granulomas"],"ans":1,"exp":"La albuminuria (A2) es el marcador temprano. La histología muestra engrosamiento de la membrana basal, expansión mesangial y nódulos de Kimmelstiel-Wilson; es la causa secundaria más común de nefrótico.","why":["No es el patrón diabético.","","Es de anti-MBG.","No tiene relación.","No tiene relación."],"ref":"KDIGO 2022 DM en ERC"},{"topic":"glomerulo","subj":"nefro","id":"glo-11","dif":2,"stem":"Hombre de 67 años con proteinuria de 8 g/24 h, macroglosia, hepatomegalia y anemia. Biopsia de grasa abdominal con rojo Congo positivo y birrefringencia verde manzana. ¿Qué buscas a continuación?","opts":["Anti-PLA2R","Electroforesis de proteínas e inmunofijación con cadenas ligeras libres","ASLO","Anti-MBG","Complemento"],"ans":1,"exp":"Amiloidosis con macroglosia en un adulto mayor sugiere amiloidosis AL por una discrasia de células plasmáticas (mieloma). Se buscan cadenas ligeras monoclonales en suero y orina.","why":["Es de la membranosa.","","Es de la postestreptocócica.","Es de Goodpasture.","No aporta al diagnóstico de amiloidosis."],"ref":"KDIGO 2021"},{"topic":"glomerulo","subj":"nefro","id":"glo-12","dif":1,"stem":"¿En cuál de estas glomerulopatías esperas el complemento C3 bajo?","opts":["Nefropatía por IgA","Enfermedad anti-MBG","Vasculitis ANCA","GN postestreptocócica","Cambios mínimos"],"ans":3,"exp":"Complemento bajo: postinfecciosa, lúpica, membranoproliferativa y crioglobulinemia. IgA, anti-MBG, ANCA y las nefróticas primarias tienen complemento normal.","why":["Complemento normal.","Complemento normal.","Complemento normal (pauciinmune).","","Complemento normal."],"ref":"KDIGO 2021"},{"topic":"glomerulo","subj":"nefro","id":"glo-13","dif":2,"stem":"Mujer de 50 años con hepatitis C, púrpura palpable en piernas, artralgias, hematuria con proteinuria de 2 g/24 h y C4 muy bajo. ¿Diagnóstico?","opts":["Nefropatía por IgA","GN membranoproliferativa por crioglobulinemia","Membranosa","Cambios mínimos","Nefritis intersticial"],"ans":1,"exp":"VHC + púrpura palpable + artralgias + GN + C4 bajo = crioglobulinemia mixta con patrón membranoproliferativo. Se trata el VHC con antivirales de acción directa; en casos graves, rituximab.","why":["No explica el C4 bajo ni el VHC.","","La membranosa se asocia más a VHB.","Es nefrótica y sin púrpura.","No da púrpura ni complemento bajo."],"ref":"KDIGO 2022 VHC en ERC"},{"topic":"glomerulo","subj":"nefro","id":"glo-14","dif":1,"stem":"En el sedimento urinario de un paciente edematoso se observan cuerpos ovales grasos que con luz polarizada muestran “cruces de Malta”. ¿Qué indican?","opts":["Síndrome nefrítico","Síndrome nefrótico (lipiduria)","Necrosis tubular aguda","Nefritis intersticial","Infección urinaria"],"ans":1,"exp":"Los cuerpos ovales grasos son células tubulares cargadas de lípidos que se filtran en el nefrótico; con luz polarizada los ésteres de colesterol dan la imagen en cruz de Malta.","why":["El nefrítico da cilindros eritrocitarios.","","La NTA da cilindros granulosos pardos.","Da cilindros leucocitarios.","Da leucocitos y bacterias."],"ref":"KDIGO 2021"},{"topic":"glomerulo","subj":"nefro","id":"glo-15","dif":1,"stem":"Adulto con síndrome nefrótico por GEFS: proteinuria 6 g/24 h, PA 138/86, edema. Mientras llega el tratamiento específico, ¿qué medida reduce la proteinuria?","opts":["IECA o ARA-II","Dieta alta en proteínas","Infusión diaria de albúmina","AINE","Ninguna"],"ans":0,"exp":"El bloqueo del SRAA baja la presión intraglomerular y la proteinuria. Se acompaña de restricción de sodio, diurético de asa, estatina y, según el caso, anticoagulación.","why":["","Aumenta la proteinuria y no mejora la albúmina.","Su efecto es transitorio; no es medida de rutina.","Pueden empeorar la función renal.","Sí hay medidas eficaces."],"ref":"KDIGO 2021"},{"topic":"anemias","subj":"hemato","id":"ane-01","dif":1,"stem":"Mujer de 28 años con menstruaciones abundantes. Hb 9.4 g/dL, VCM 71, ferritina 6 ng/mL. ¿Tratamiento y respuesta esperada?","opts":["Transfusión de 2 unidades","Hierro oral en dosis diaria o en días alternos; reticulocitos ↑ en 7–10 días y Hb ↑ 1–2 g/dL en 3–4 semanas","Hierro IV de entrada en todos los casos","Ácido fólico","Eritropoyetina"],"ans":1,"exp":"Ferropenia por pérdidas menstruales en una paciente estable: hierro oral. Se continúa ~3 meses después de normalizar la Hb para llenar los depósitos, y se trata la causa ginecológica.","why":["No hay inestabilidad ni Hb \u003c7.","","Se reserva para intolerancia, malabsorción o pérdidas continuas.","No hay déficit de folato.","No está indicada."],"ref":"Camaschella C, NEJM 2015"},{"topic":"anemias","subj":"hemato","id":"ane-02","dif":2,"stem":"Hombre de 30 años asintomático. Hb 11.8 g/dL, VCM 64 fL, eritrocitos 5.9 millones/µL, ferritina 90 ng/mL. ¿Siguiente paso?","opts":["Hierro oral por 3 meses","Electroforesis de hemoglobina","Colonoscopia","Aspirado de médula ósea","Vitamina B12"],"ans":1,"exp":"Microcitosis marcada con eritrocitos altos, Hb casi normal y ferritina normal; Mentzer = 64 ÷ 5.9 ≈ 10.8 (\u003c13) = rasgo talasémico. La electroforesis muestra HbA2 >3.5% en la β-talasemia menor. No necesita hierro.","why":["Su ferritina es normal: el hierro puede causar sobrecarga.","","No hay datos de sangrado ni ferropenia.","Innecesario.","Es macrocitosis lo que sugiere déficit de B12."],"ref":"Taher AT, et al. Lancet 2018"},{"topic":"anemias","subj":"hemato","id":"ane-03","dif":2,"stem":"Mujer de 52 años con artritis reumatoide activa. Hb 10.4 g/dL, VCM 84, ferritina 320 ng/mL, TIBC baja, saturación 14%. ¿Diagnóstico y conducta?","opts":["Ferropenia; hierro oral","Anemia de inflamación; controlar la AR","Talasemia; electroforesis","Déficit de B12; B12 IM","Sideroblástica; piridoxina"],"ans":1,"exp":"Ferritina alta con TIBC baja en una enfermedad inflamatoria = anemia de inflamación (hepcidina alta). Mejora al controlar la enfermedad de base.","why":["Con ferritina de 320 y TIBC baja no es ferropenia pura.","","Es normocítica y la ferritina no lo sugiere.","El VCM es normal y no hay neuropatía.","No hay datos que la sugieran."],"ref":"Weiss G, et al. NEJM 2005"},{"topic":"anemias","subj":"hemato","id":"ane-04","dif":2,"stem":"Mujer de 64 años con vitíligo e hipotiroidismo. Tiene parestesias en pies, inestabilidad al caminar y Romberg positivo. Hb 9.1, VCM 116, neutrófilos hipersegmentados. ¿Diagnóstico y tratamiento?","opts":["Déficit de folato; ácido fólico","Anemia perniciosa (déficit de B12 autoinmune); B12 IM","Hipotiroidismo; subir la levotiroxina","Alcohol; suspenderlo","SMD; azacitidina"],"ans":1,"exp":"Autoinmunidad (vitíligo, tiroiditis) + anemia megaloblástica + afección de cordones posteriores = anemia perniciosa. Confirma con B12 baja (± ácido metilmalónico) y anticuerpos anti-factor intrínseco. Tratamiento con B12 IM; vigilar cáncer gástrico.","why":["El folato no da neuropatía.","","El hipotiroidismo no explica neutrófilos hipersegmentados ni la neuropatía.","No hay antecedente ni encaja la hipersegmentación.","Primero se descarta lo carencial."],"ref":"Stabler SP, NEJM 2013"},{"topic":"anemias","subj":"hemato","id":"ane-05","dif":1,"stem":"Un paciente con anemia macrocítica y parestesias recibe solo ácido fólico. Su Hb mejora, pero la ataxia empeora. ¿Qué pasó?","opts":["Efecto adverso del folato","Tenía déficit de B12: el folato corrigió la anemia pero no la neuropatía","Es una coincidencia","Desarrolló SMD","Le faltaba hierro"],"ans":1,"exp":"El folato puede corregir la parte hematológica de un déficit de B12, pero no la neurológica, que avanza. Por eso se mide B12 antes de dar folato, o se dan ambos.","why":["El folato no es neurotóxico.","","Es un error clásico prevenible.","No hay datos que lo sugieran.","No explica la ataxia."],"ref":"Stabler SP, NEJM 2013"},{"topic":"anemias","subj":"hemato","id":"ane-06","dif":2,"stem":"Hombre de 45 años con AR tratada con metotrexato sin ácido fólico. Hb 9.8, VCM 112, neutrófilos hipersegmentados. Ácido metilmalónico normal, homocisteína alta. ¿Qué déficit tiene?","opts":["B12","Folato","Hierro","Cobre","Piridoxina"],"ans":1,"exp":"El metotrexato inhibe la dihidrofolato reductasa. La homocisteína alta con ácido metilmalónico normal señala déficit de folato; en el de B12 ambos están altos. Por eso se da ácido fólico con el metotrexato.","why":["En el déficit de B12 el ácido metilmalónico estaría alto.","","Daría microcitosis.","Da anemia con neutropenia y mielopatía; no es el contexto.","Da anemia sideroblástica."],"ref":"Stabler SP, NEJM 2013"},{"topic":"anemias","subj":"hemato","id":"ane-07","dif":1,"stem":"Hombre de 70 años con Hb 8.0 g/dL e índice reticulocitario de 0.6. ¿Cómo interpretas el índice?","opts":["Hemólisis","Sangrado agudo compensado","Anemia hipoproliferativa: la médula no está respondiendo","Respuesta adecuada","Es un valor normal"],"ans":2,"exp":"Un índice reticulocitario \u003c2 con anemia indica producción insuficiente (ferropenia, inflamación, ERC, déficits, falla medular). >2–3 sugiere hemólisis o sangrado con médula que responde.","why":["La hemólisis da índice alto.","La médula respondería con índice alto.","","Con Hb de 8, un índice de 0.6 es inadecuado.","Con anemia, es bajo."],"ref":"Abordaje de la anemia"},{"topic":"anemias","subj":"hemato","id":"ane-08","dif":2,"stem":"Hombre de 35 años con TB en tratamiento con isoniazida desde hace 3 meses. Anemia microcítica. El aspirado muestra sideroblastos en anillo. ¿Tratamiento?","opts":["Hierro IV","Piridoxina (vitamina B6)","Ácido fólico","Suspender todo el tratamiento antituberculoso","Transfusión"],"ans":1,"exp":"La isoniazida interfiere con la vitamina B6, cofactor de la ALA sintasa (síntesis del grupo hem): anemia sideroblástica. Se da piridoxina (y se usa como profilaxis con isoniazida).","why":["El hierro está acumulado en las mitocondrias, no falta.","","No es el mecanismo.","No es necesario: basta agregar B6.","No hay indicación."],"ref":"Bottomley SS, Hematol Oncol Clin 2014"},{"topic":"anemias","subj":"hemato","id":"ane-09","dif":2,"stem":"Mujer de 50 años que fabrica y usa ollas de barro vidriado. Dolor abdominal cólico, estreñimiento, debilidad para extender la muñeca y anemia microcítica con punteado basófilo. ¿Diagnóstico?","opts":["Ferropenia","Intoxicación por plomo","Porfiria aguda intermitente","Talasemia","Hipotiroidismo"],"ans":1,"exp":"El plomo inhibe enzimas de la síntesis del hem (ALA deshidratasa, ferroquelatasa): anemia microcítica con punteado basófilo, dolor abdominal (cólico saturnino), neuropatía motora (muñeca caída) y línea de Burton. Se mide plomo en sangre; quelación si es alto.","why":["No explica el punteado basófilo ni la neuropatía.","","Da dolor abdominal y neuropatía, pero sin anemia microcítica con punteado.","No da cólico ni neuropatía.","No encaja."],"ref":"CDC/ATSDR plomo · contexto mexicano de barro vidriado"},{"topic":"anemias","subj":"hemato","id":"ane-10","dif":2,"stem":"Mujer de 34 años con ferropenia que toma hierro oral desde hace 6 semanas con buen apego. La Hb no subió. Toma omeprazol y no tiene sangrado visible. ¿Qué buscas?","opts":["Nada: subir la dosis a 3 tomas al día","Malabsorción: enfermedad celiaca, H. pylori y gastritis atrófica, además de pérdidas ocultas","Talasemia mayor","Leucemia","Déficit de B12"],"ans":1,"exp":"Falta de respuesta al hierro oral con buen apego: piensa en malabsorción (celiaca, H. pylori, gastritis atrófica, IBP, bypass) o pérdida continua. Pide anti-tTG IgA con IgA total y estudia H. pylori; considera hierro IV.","why":["Repartir en varias tomas no mejora la absorción por la hepcidina.","","Se diagnostica en la infancia.","Sin datos que lo sugieran.","Daría macrocitosis."],"ref":"AGA 2020 anemia ferropénica"},{"topic":"anemias","subj":"hemato","id":"ane-11","dif":2,"stem":"Mujer de 45 años con bypass gástrico en Y de Roux hace 6 años. Ferritina 4 ng/mL, sin respuesta a hierro oral. ¿Qué indicas?","opts":["Más hierro oral","Hierro IV","Transfusión mensual","Eritropoyetina","Revertir el bypass"],"ans":1,"exp":"El hierro se absorbe en el duodeno y yeyuno proximal, que el bypass excluye. Con malabsorción o falta de respuesta, el hierro IV es de elección.","why":["No se absorbe por la cirugía.","","No está indicada de forma rutinaria.","No corrige la ferropenia.","Desproporcionado."],"ref":"AGA 2020"},{"topic":"anemias","subj":"hemato","id":"ane-12","dif":1,"stem":"Hombre de 66 años estable, sin cardiopatía, con Hb 7.6 g/dL por anemia ferropénica crónica. ¿Debe transfundirse?","opts":["Sí, a todo paciente con Hb \u003c10","No: está por arriba del umbral restrictivo (\u003c7); repón hierro y busca la causa","Sí, para llegar a 12","Solo si la Hb es \u003c5","Sí, si tiene más de 65 años"],"ans":1,"exp":"Estrategia restrictiva: transfundir con Hb \u003c7 g/dL en pacientes estables (≈8 con enfermedad cardiovascular). Es igual de segura y evita complicaciones de transfundir de más.","why":["Es un umbral liberal sin beneficio.","","Excesivo y riesgoso.","Demasiado bajo; con \u003c7 sí se transfunde.","La edad sola no cambia el umbral."],"ref":"AABB 2023 transfusión"},{"topic":"anemias","subj":"hemato","id":"ane-13","dif":2,"stem":"Mujer de 55 años con disfagia a sólidos, glositis y anemia ferropénica. El esofagograma muestra una membrana en el esófago cervical. ¿Qué síndrome es y qué riesgo implica?","opts":["Acalasia; cáncer de estómago","Plummer-Vinson; carcinoma escamoso de esófago","Zenker; perforación","Barrett; adenocarcinoma","Esofagitis eosinofílica; impactación"],"ans":1,"exp":"Ferropenia + membranas esofágicas cervicales + disfagia = síndrome de Plummer-Vinson. Mejora con hierro y dilatación, y aumenta el riesgo de carcinoma escamoso de esófago e hipofaringe.","why":["La acalasia da disfagia a sólidos y líquidos sin membranas.","","Zenker es un divertículo con regurgitación y halitosis.","Barrett es metaplasia distal por reflujo.","Da anillos y no se asocia a ferropenia."],"ref":"Plummer-Vinson syndrome, Orphanet"},{"topic":"anemias","subj":"hemato","id":"ane-14","dif":1,"stem":"Hombre de 50 años que bebe 8 cervezas diarias. Hb 12.2, VCM 106, sin neutrófilos hipersegmentados; B12 y folato normales, GGT alta. ¿Causa más probable de la macrocitosis?","opts":["Déficit de B12","Alcohol","SMD","Talasemia","Ferropenia"],"ans":1,"exp":"El alcohol produce macrocitosis no megaloblástica (efecto directo sobre la membrana y la médula), a menudo con GGT alta. Mejora en meses con abstinencia.","why":["B12 normal y sin hipersegmentación.","","Posible, pero menos probable con este contexto.","Da microcitosis.","Da microcitosis."],"ref":"Kaferle J, et al. Am Fam Physician 2009"},{"topic":"anemias","subj":"hemato","id":"ane-15","dif":2,"stem":"Mujer de 60 años con anemia ferropénica (ferritina 12) y PCR elevada por infección reciente. Otra paciente con artritis activa tiene ferritina de 70 ng/mL y saturación de 12%. ¿Qué es cierto sobre la ferritina?","opts":["Siempre refleja exactamente los depósitos","Es reactante de fase aguda: con inflamación, valores hasta ~100 ng/mL pueden coexistir con ferropenia","Un valor >30 descarta siempre ferropenia","Se eleva en la ferropenia","No sirve para estudiar anemia"],"ans":1,"exp":"La ferritina sube con la inflamación. Con inflamación, una ferritina de 30–100 ng/mL con saturación \u003c20% sugiere ferropenia coexistente. El receptor soluble de transferrina ayuda a distinguir.","why":["La inflamación la eleva.","","No con inflamación.","Baja en la ferropenia.","Es el mejor estudio aislado para ferropenia."],"ref":"AGA 2020 · Camaschella C, NEJM 2015"},{"topic":"stda","subj":"gastro","id":"stda-01","dif":1,"stem":"Hombre de 38 años con úlcera duodenal y biopsia

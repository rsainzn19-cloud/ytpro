 positiva para H. pylori en Monterrey. Sin alergias. ¿Esquema de primera línea más apropiado?","opts":["IBP + claritromicina + amoxicilina por 7 días","IBP + bismuto + tetraciclina + metronidazol por 14 días","IBP solo por 8 semanas","Amoxicilina sola por 10 días","Levofloxacino + metronidazol por 5 días"],"ans":1,"exp":"Con alta resistencia a claritromicina (como en México), la primera línea es la cuádruple con bismuto por 14 días. Después se confirma la erradicación.","why":["La triple con claritromicina solo si hay sensibilidad confirmada, y 7 días es poco.","","Cicatriza, pero no erradica la bacteria: recurre.","La monoterapia no erradica.","Esquema inadecuado como primera línea."],"ref":"ACG 2024 H. pylori · consenso mexicano 2018"},{"topic":"stda","subj":"gastro","id":"stda-02","dif":1,"stem":"Mujer de 45 años que terminó el tratamiento de erradicación de H. pylori. ¿Cómo y cuándo confirmas la curación?","opts":["Serología IgG al mes","Prueba de aliento con urea o antígeno en heces ≥4 semanas después, sin IBP 2 semanas antes","Endoscopia inmediata","No hace falta confirmar","Prueba de aliento al día siguiente de terminar"],"ans":1,"exp":"Se confirma siempre: prueba de aliento o antígeno fecal ≥4 semanas después de terminar los antibióticos, y sin IBP 2 semanas antes (falsos negativos).","why":["La serología permanece positiva meses o años.","","Solo se repite endoscopia si hay otra indicación (úlcera gástrica).","Siempre se confirma por la resistencia antibiótica.","Demasiado pronto: falsos negativos."],"ref":"ACG 2024 H. pylori"},{"topic":"stda","subj":"gastro","id":"stda-03","dif":2,"stem":"Hombre de 55 años con pérdida de peso, dolor epigástrico que empeora al comer y una úlcera gástrica de 2 cm en la endoscopia. ¿Qué es indispensable?","opts":["Solo IBP por 8 semanas","Biopsias de la úlcera y endoscopia de control para confirmar cicatrización","Cirugía inmediata","TC de abdomen y alta","Prueba de aliento y nada más"],"ans":1,"exp":"Toda úlcera gástrica puede ser un adenocarcinoma ulcerado: se biopsia y se repite la endoscopia (8–12 semanas) para confirmar que cicatrizó.","why":["Falta descartar cáncer.","","No hay complicación que la indique.","No sustituye las biopsias.","Busca H. pylori, pero no descarta cáncer."],"ref":"ACG 2021 · ASGE"},{"topic":"stda","subj":"gastro","id":"stda-04","dif":2,"stem":"Hombre de 42 años con úlceras múltiples en duodeno y yeyuno que no cicatrizan con IBP, diarrea crónica e hipercalcemia. H. pylori negativo, sin AINE. ¿Qué estudio pides?","opts":["Gastrina en ayuno (sin IBP) y prueba de secretina","Cortisol","Colonoscopia","Prueba de aliento con urea","Elastasa fecal"],"ans":0,"exp":"Úlceras múltiples, refractarias y distales + diarrea = gastrinoma (Zollinger-Ellison). La hipercalcemia sugiere hiperparatiroidismo: MEN1. Gastrina en ayuno muy alta con pH gástrico ácido y prueba de secretina positiva.","why":["","No explica las úlceras.","No es la sospecha.","Ya es negativo.","Mide insuficiencia pancreática."],"ref":"NANETS · ENETS gastrinoma"},{"topic":"stda","subj":"gastro","id":"stda-05","dif":1,"stem":"Mujer de 70 años que toma naproxeno diario. Presenta dolor epigástrico súbito e intenso, abdomen rígido y FC 118. La Rx de tórax de pie muestra aire bajo el diafragma. ¿Conducta?","opts":["IBP oral y alta","Endoscopia urgente","Cirugía urgente, con reanimación y antibióticos","Colonoscopia","Observación 24 h"],"ans":2,"exp":"Neumoperitoneo + peritonitis = úlcera perforada: reanimación, IBP IV, antibióticos y cirugía urgente (cierre con parche de epiplón).","why":["Es una emergencia quirúrgica.","La insuflación empeora la perforación.","","No tiene relación.","Retrasar aumenta la mortalidad."],"ref":"WSES perforated peptic ulcer 2020"},{"topic":"stda","subj":"gastro","id":"stda-06","dif":2,"stem":"Hombre de 58 años con antecedentes de úlcera duodenal. Vómito de alimento ingerido el día anterior, chapoteo gástrico. Gasometría: pH 7.52, HCO₃ 36, Cl 88, K 2.9. ¿Diagnóstico?","opts":["Úlcera perforada","Obstrucción del vaciamiento gástrico por úlcera (estenosis pilórica)","Pancreatitis","Cetoacidosis","Gastroparesia diabética"],"ans":1,"exp":"La cicatrización repetida de una úlcera pilórica o duodenal estenosa el píloro. El vómito pierde HCl: alcalosis metabólica hipoclorémica e hipokalémica. Se repone con solución salina y potasio, sonda, IBP y dilatación endoscópica o cirugía.","why":["Daría peritonitis y neumoperitoneo.","","No explica el vómito de comida retenida.","Daría acidosis.","Posible, pero no hay DM y sí antecedente de úlcera."],"ref":"ACG"},{"topic":"stda","subj":"gastro","id":"stda-07","dif":2,"stem":"Endoscopia en un paciente con melena: úlcera duodenal con sangrado activo en chorro. ¿Qué haces?","opts":["Solo inyección de adrenalina","Terapia dual (adrenalina + térmica o clips) e IBP a dosis altas por 72 h","IBP oral y alta","Cirugía directa","Ácido tranexámico IV"],"ans":1,"exp":"Forrest Ia (chorro) es alto riesgo: terapia endoscópica dual y luego IBP a dosis altas por 72 h. La adrenalina sola tiene más resangrado.","why":["La adrenalina sola no basta.","","Tiene alto riesgo de resangrado.","Primero endoscopia.","No reduce mortalidad (HALT-IT)."],"ref":"ACG 2021 · ESGE 2021"},{"topic":"stda","subj":"gastro","id":"stda-08","dif":1,"stem":"Mujer de 46 años con melena. Hemodinámicamente estable, Hb estable de 12.6. Endoscopia: úlcera duodenal con base limpia. ¿Conducta?","opts":["Terapia endoscópica dual","IBP oral, dieta temprana y alta pronto","Embolización","Repetir endoscopia en 12 h","Terapia intensiva"],"ans":1,"exp":"Forrest III (base limpia) tiene muy bajo riesgo de resangrado: no requiere terapia endoscópica. IBP oral, iniciar dieta y alta temprana; erradicar H. pylori si está presente.","why":["No hay estigma de alto riesgo.","","No está indicada.","Sin indicación.","Es bajo riesgo."],"ref":"ACG 2021"},{"topic":"stda","subj":"gastro","id":"stda-09","dif":2,"stem":"Hombre de 66 años con hematemesis. Antes de la endoscopia, ¿qué medicamento mejora la visibilidad y reduce la necesidad de repetirla?","opts":["Metoclopramida oral","Eritromicina IV","Octreotida","Vitamina K","Ácido tranexámico"],"ans":1,"exp":"La eritromicina IV (agonista de motilina) 30–120 min antes vacía el estómago de sangre y coágulos, mejora la visibilidad y reduce la segunda endoscopia.","why":["No es la recomendada.","","Es para sangrado variceal.","Sin coagulopatía no aplica.","No reduce mortalidad y aumenta trombosis (HALT-IT)."],"ref":"ACG 2021"},{"topic":"stda","subj":"gastro","id":"stda-10","dif":1,"stem":"Hombre de 35 años con melena hace 2 días, ya sin sangrado. FC 82, PAS 128, Hb 13.4, BUN 15 mg/dL, sin comorbilidades. ¿Qué indica una puntuación de Glasgow-Blatchford de 1?","opts":["Necesita terapia intensiva","Muy bajo riesgo: puede manejarse de forma ambulatoria con endoscopia temprana","Necesita transfusión","Cirugía","Embolización"],"ans":1,"exp":"Glasgow-Blatchford 0–1 identifica pacientes con muy bajo riesgo de necesitar intervención o de morir: se pueden egresar con endoscopia ambulatoria.","why":["No requiere hospitalización.","","Hb normal.","Sin indicación.","Sin indicación."],"ref":"ACG 2021"},{"topic":"stda","subj":"gastro","id":"stda-11","dif":2,"stem":"Mujer de 74 años con stent coronario hace 2 años, en aspirina 100 mg. Tuvo sangrado por úlcera Forrest IIa tratada con éxito. ¿Qué haces con la aspirina?","opts":["Suspenderla para siempre","Reanudarla pronto (hacia el día 3) junto con IBP","Cambiarla por un AINE","Reanudarla en 3 meses","Cambiar a doble antiagregación"],"ans":1,"exp":"En prevención secundaria, suspender la aspirina aumenta la mortalidad cardiovascular. Tras controlar una úlcera de alto riesgo se reanuda pronto (hacia el día 3; de inmediato si era de bajo riesgo), con IBP de mantenimiento.","why":["Aumenta eventos cardiovasculares y muertes.","","Los AINE están contraindicados.","Demasiado tiempo sin protección.","Aumenta el riesgo de resangrado sin indicación."],"ref":"ESGE 2021 · ACG 2021"},{"topic":"stda","subj":"gastro","id":"stda-12","dif":2,"stem":"Hombre de 62 años con úlcera Forrest Ib tratada con clips y adrenalina. A las 36 h vuelve a tener melena y FC 120. ¿Siguiente paso?","opts":["Cirugía inmediata","Segunda endoscopia con terapia; si falla, embolización por radiología intervencionista","Solo transfundir","Suspender el IBP","Ácido tranexámico"],"ans":1,"exp":"El resangrado se maneja primero con una segunda endoscopia. Si falla, embolización arterial transcatéter; la cirugía queda como último recurso.","why":["Se reserva para fallas.","","No controla la fuente.","Debe seguir a dosis altas.","No está recomendado."],"ref":"ACG 2021 · ESGE 2021"},{"topic":"stda","subj":"gastro","id":"stda-13","dif":1,"stem":"Hombre de 30 años que tras una borrachera presenta varios vómitos y después hematemesis de poco volumen. Estable. ¿Diagnóstico más probable?","opts":["Síndrome de Boerhaave","Desgarro de Mallory-Weiss","Várices esofágicas","Úlcera perforada","Cáncer gástrico"],"ans":1,"exp":"Mallory-Weiss: desgarro de la mucosa en la unión esofagogástrica por arcadas. Suele autolimitarse; la endoscopia confirma y trata si sangra.","why":["Es una perforación transmural: dolor torácico intenso, enfisema subcutáneo, mediastinitis.","","Sin datos de cirrosis o hipertensión portal.","Daría peritonitis.","No encaja con el contexto."],"ref":"ACG"},{"topic":"stda","subj":"gastro","id":"stda-14","dif":2,"stem":"Mujer de 72 años con osteoartritis que necesita un AINE por tiempo prolongado. Tuvo una úlcera sangrante hace 2 años. ¿Estrategia más segura si no hay alternativa al AINE?","opts":["Naproxeno solo","Celecoxib + IBP, y confirmar que no tenga H. pylori","Ibuprofeno + misoprostol a días alternos","Indometacina + antiácido","Diclofenaco + ranitidina"],"ans":1,"exp":"Con antecedente de úlcera complicada (muy alto riesgo GI), si se necesita un AINE: COX-2 selectivo + IBP, y erradicar H. pylori si está presente. Considerar primero alternativas sin AINE (tópicos, paracetamol, ejercicio).","why":["Muy alto riesgo de resangrado.","","El misoprostol a días alternos es insuficiente y causa diarrea.","Muy gastrolesivo; los antiácidos no protegen.","Los antagonistas H2 a dosis estándar no bastan."],"ref":"ACG 2009 prevención de úlceras por AINE · ACG 2021"},{"topic":"stda","subj":"gastro","id":"stda-15","dif":1,"stem":"Hombre de 40 años con dispepsia, sin datos de alarma, menor de 60 años. ¿Estrategia recomendada?","opts":["Endoscopia inmediata a todos","Buscar H. pylori con prueba no invasiva y tratar si es positivo","Tomografía abdominal","Serología repetida cada año","Colonoscopia"],"ans":1,"exp":"En dispepsia sin alarma en menores de 60 años, la estrategia “probar y tratar” H. pylori (aliento o antígeno fecal) es costo-efectiva. Si es negativo o persisten síntomas: IBP. Con alarma o ≥60 años: endoscopia.","why":["Se reserva para datos de alarma o ≥60 años.","","Sin indicación.","La serología no sirve para seguimiento.","No tiene relación con dispepsia."],"ref":"ACG/CAG 2017 dispepsia"},{"topic":"pancrea","subj":"gastro","id":"pan-01","dif":1,"stem":"Mujer de 38 años con dolor epigástrico intenso irradiado a la espalda. Lipasa 4 veces el límite superior; amilasa normal. ¿Se puede diagnosticar pancreatitis aguda?","opts":["No: la amilasa debe estar elevada","Sí: dolor típico + lipasa ≥3×","Solo con TC","Solo si la lipasa es >10×","Solo con CPRE"],"ans":1,"exp":"Bastan 2 de 3 criterios. La lipasa es más específica y se mantiene elevada más tiempo que la amilasa, que puede ser normal (sobre todo en la alcohólica y la de hipertrigliceridemia).","why":["No se necesitan ambas enzimas.","","La TC no es necesaria si ya se cumplen 2 criterios.","El umbral es ≥3×.","No es diagnóstica."],"ref":"Atlanta revisada 2012"},{"topic":"pancrea","subj":"gastro","id":"pan-02","dif":1,"stem":"Mujer de 45 años con pancreatitis aguda. ALT 320 U/L a las 24 h. ¿Causa más probable y estudio inicial?","opts":["Alcohol; ninguno","Litiasis biliar; USG abdominal","Hipertrigliceridemia; perfil de lípidos solamente","Fármacos; suspender todo","Autoinmune; IgG4"],"ans":1,"exp":"Una ALT >150 U/L en las primeras 48 h sugiere origen biliar con buena especificidad. El USG abdominal busca litos o lodo y se pide en todos los pacientes con pancreatitis.","why":["La ALT tan alta orienta a biliar.","","Se piden lípidos, pero la ALT orienta a biliar.","No hay fármaco sospechoso.","Es una causa rara."],"ref":"ACG 2024"},{"topic":"pancrea","subj":"gastro","id":"pan-03","dif":2,"stem":"Hombre de 50 años con pancreatitis aguda, FC 112, PA 104/66. ¿Qué estrategia de líquidos recomiendan las guías actuales?","opts":["Solución salina 20 mL/kg/h por 24 h","Ringer lactato moderado: bolo de 10 mL/kg si hay hipovolemia y luego ~1.5 mL/kg/h, reevaluando","Restricción de líquidos","Coloides (almidones)","Solo vía oral"],"ans":1,"exp":"WATERFALL (2022): la reanimación agresiva causó más sobrecarga de volumen sin mejorar desenlaces. Se recomienda Ringer lactato con estrategia moderada y dirigida (FC, PA, uresis, BUN, hematocrito).","why":["Agresiva y con salina: más sobrecarga y acidosis hiperclorémica.","","Está hipovolémico.","Los almidones dañan el riñón.","Necesita reanimación IV."],"ref":"WATERFALL 2022 · ACG 2024"},{"topic":"pancrea","subj":"gastro","id":"pan-04","dif":1,"stem":"Mujer con pancreatitis leve. Al día 2 ya no tiene náusea, el dolor mejoró y tiene hambre. La lipasa sigue 4× el límite. ¿Qué indicas?","opts":["Ayuno hasta que la lipasa se normalice","Dieta oral baja en grasa desde ahora","Nutrición parenteral","Sonda nasoyeyunal","Solo líquidos claros por 1 semana"],"ans":1,"exp":"La alimentación oral temprana (incluso dieta sólida baja en grasa) es segura y acorta la estancia. No hay que esperar a que se normalice la lipasa.","why":["No se recomienda: la lipasa no guía la realimentación.","","Solo si no puede usar el tubo digestivo.","Innecesaria si come.","Restringe sin motivo."],"ref":"ACG 2024"},{"topic":"pancrea","subj":"gastro","id":"pan-05","dif":2,"stem":"Hombre con pancreatitis grave. TC al día 5: necrosis del 40% del páncreas, sin gas, sin fiebre, hemodinámicamente estable. ¿Indicas antibióticos?","opts":["Sí, imipenem profiláctico","No: la necrosis estéril no requiere antibióticos profilácticos","Sí, fluconazol","Sí, ceftriaxona por 14 días","Sí, metronidazol"],"ans":1,"exp":"Los antibióticos profilácticos no reducen mortalidad ni infección en la necrosis estéril y favorecen resistencias y hongos. Se usan solo si hay infección demostrada o fuertemente sospechada.","why":["No están indicados.","","Tampoco antifúngicos profilácticos.","No hay infección.","No hay infección."],"ref":"ACG 2024 · IAP/APA 2013"},{"topic":"pancrea","subj":"gastro","id":"pan-06","dif":2,"stem":"Mujer con pancreatitis necrosante. Al día 14 presenta fiebre de 39 °C, leucocitosis y deterioro. La TC muestra gas dentro de la colección necrótica. ¿Manejo?","opts":["Necrosectomía quirúrgica abierta inmediata","Carbapenémico y abordaje escalonado: drenaje percutáneo o endoscópico, con necrosectomía diferida si hace falta","Observar","Solo esteroides","CPRE"],"ans":1,"exp":"Gas en la necrosis = necrosis infectada. Antibióticos que penetren (carbapenémicos) y abordaje escalonado (step-up): primero drenaje mínimamente invasivo; la necrosectomía se retrasa, idealmente a >4 semanas, cuando la necrosis se encapsula.","why":["La cirugía temprana abierta aumenta la mortalidad.","","Es una infección grave.","No están indicados.","No trata la necrosis."],"ref":"van Santvoort HC, et al. PANTER, NEJM 2010 · ACG 2024"},{"topic":"pancrea","subj":"gastro","id":"pan-07","dif":2,"stem":"Hombre de 62 años con pancreatitis biliar, fiebre de 39 °C, ictericia y dolor en hipocondrio derecho. Bilirrubina 6.2 mg/dL. ¿Qué haces?","opts":["Colecistectomía hoy","CPRE urgente (\u003c24 h) con antibióticos","TC y observar","Solo antibióticos","Colangio-RM en 1 semana"],"ans":1,"exp":"La tríada de Charcot (fiebre, ictericia, dolor) indica colangitis: requiere antibióticos y CPRE urgente para drenar la vía biliar. En pancreatitis biliar sin colangitis no se hace CPRE urgente.","why":["La vía biliar debe drenarse primero; la colecistectomía va después.","","Retrasa un drenaje urgente.","Sin drenaje no se controla.","Demasiado tarde."],"ref":"ACG 2024 · Tokyo Guidelines 2018"},{"topic":"pancrea","subj":"gastro","id":"pan-08","dif":1,"stem":"Mujer de 40 años con pancreatitis biliar leve, ya sin dolor y tolerando dieta. ¿Cuándo debe operarse de la vesícula?","opts":["En 6 meses","En la misma hospitalización","Solo si vuelve a tener pancreatitis","Nunca","En 3 años"],"ans":1,"exp":"En pancreatitis biliar leve, la colecistectomía en la misma hospitalización reduce las recurrencias y complicaciones biliares (PONCHO). En la necrosante se difiere hasta que se resuelvan las colecciones.","why":["Retrasar aumenta las recurrencias.","","Esperar una recurrencia es peligroso.","Tiene alto riesgo de recurrencia.","Demasiado tarde."],"ref":"da Costa DW, et al. PONCHO, Lancet 2015"},{"topic":"pancrea","subj":"gastro","id":"pan-09","dif":2,"stem":"Hombre con pancreatitis aguda que tiene insuficiencia respiratoria que requiere oxígeno a alto flujo desde hace 72 h. ¿Gravedad según Atlanta revisada?","opts":["Leve","Moderadamente grave","Grave","No se puede saber sin TC","Crítica según Ranson"],"ans":2,"exp":"Falla orgánica que persiste más de 48 h = pancreatitis grave. Si se resolviera antes de 48 h, sería moderadamente grave.","why":["Tiene falla orgánica.","Sería si la falla durara \u003c48 h.","","La gravedad se define por la falla orgánica, no por la TC.","Atlanta revisada no usa Ranson."],"ref":"Atlanta revisada 2012"},{"topic":"pancrea","subj":"gastro","id":"pan-10","dif":1,"stem":"Seis semanas después de una pancreatitis, una paciente asintomática tiene en la TC una colección de 5 cm con pared bien definida, sin necrosis. ¿Qué haces?","opts":["Drenaje percutáneo inmediato","Observar: pseudoquiste asintomático","Cirugía urgente","Antibióticos","CPRE"],"ans":1,"exp":"Una colección sin necrosis con pared definida tras >4 semanas es un pseudoquiste. Si es asintomático, se observa; se drena si causa dolor, obstrucción, infección o sangrado.","why":["No hay indicación.","","No hay indicación.","No hay infección.","No hay indicación."],"ref":"Atlanta revisada 2012 · ACG 2024"},{"topic":"pancrea","subj":"gastro","id":"pan-11","dif":2,"stem":"Hombre de 39 años con DM2 descontrolada y pancreatitis aguda. Suero lechoso; TG 2 400 mg/dL. ¿Tratamiento específico además del habitual?","opts":["Fenofibrato oral solo","Infusión de insulina con dextrosa (o plasmaféresis) para bajar los TG","Estatina de alta intensidad","Omega-3","Nada específico"],"ans":1,"exp":"En pancreatitis por hipertrigliceridemia, la insulina IV activa la lipoproteína lipasa y baja rápido los TG; la plasmaféresis es alternativa en casos graves. Después: fibrato, dieta y control de la DM.","why":["Se usa después; no baja los TG con la rapidez necesaria.","","No es para TG.","Efecto lento.","Sí hay tratamiento específico."],"ref":"ACG 2024"},{"topic":"pancrea","subj":"gastro","id":"pan-12","dif":2,"stem":"Mujer de 55 años con pancreatitis sin litos ni alcohol, TG normales. Calcio 12.1 mg/dL. ¿Qué causa buscas?","opts":["Hipotiroidismo","Hiperparatiroidismo primario","Hipoparatiroidismo","Déficit de vitamina D","Hipomagnesemia"],"ans":1,"exp":"La hipercalcemia es una causa de pancreatitis; en pacientes ambulatorios la más común es el hiperparatiroidismo primario. Mide PTH.","why":["No causa hipercalcemia.","","Da hipocalcemia.","Da hipocalcemia.","No explica el calcio alto."],"ref":"ACG 2024"},{"topic":"pancrea","subj":"gastro","id":"pan-13","dif":1,"stem":"Paciente con pancreatitis que presenta equimosis en los flancos. ¿Cómo se llama el signo y qué indica?","opts":["Cullen; colecistitis","Grey Turner; hemorragia retroperitoneal (pancreatitis hemorrágica)","Murphy; colangitis","Courvoisier; cáncer de páncreas","Rovsing; apendicitis"],"ans":1,"exp":"Grey Turner (flancos) y Cullen (periumbilical) indican sangrado retroperitoneal, propio de pancreatitis grave necrótico-hemorrágica. Son poco frecuentes pero de mal pronóstico.","why":["Cullen es periumbilical.","","Murphy es dolor a la palpación de la vesícula.","Courvoisier es vesícula palpable no dolorosa con ictericia.","Rovsing es de apendicitis."],"ref":"Semiología"},{"topic":"pancrea","subj":"gastro","id":"pan-14","dif":2,"stem":"Hombre con pancreatitis de 12 h de evolución, diagnóstico seguro, con buena evolución. El residente quiere TC con contraste hoy “para ver la necrosis”. ¿Qué opinas?","opts":["Es necesaria en todos al ingreso","No está indicada: si el diagnóstico es claro, la TC se reserva para falta de mejoría a las 48–72 h (la necrosis se define mejor después de 72 h)","Debe ser sin contraste siempre","Debe sustituir al USG","Solo si la lipasa es muy alta"],"ans":1,"exp":"La TC temprana no cambia el manejo, puede subestimar la necrosis y expone al contraste. Se indica si hay duda diagnóstica o si no mejora en 48–72 h.","why":["No es rutinaria.","","El contraste es necesario para valorar necrosis cuando está indicada.","El USG se necesita para buscar litos.","La lipasa no se relaciona con la gravedad."],"ref":"ACG 2024"},{"topic":"pancrea","subj":"gastro","id":"pan-15","dif":2,"stem":"Hombre de 28 años con enfermedad de Crohn que inició azatioprina hace 4 semanas. Presenta dolor epigástrico y lipasa 8×. Sin alcohol, sin litos, TG y calcio normales. ¿Conducta?","opts":["Continuar la azatioprina","Pancreatitis inducida por fármacos: suspender la azatioprina","CPRE","Esteroides","Colecistectomía"],"ans":1,"exp":"La azatioprina (y la 6-mercaptopurina) causan pancreatitis idiosincrásica en las primeras semanas. Se suspende y no se reintroduce.","why":["Mantenerla perpetúa la pancreatitis.","","No hay obstrucción biliar.","No tratan esta causa.","No hay litiasis."],"ref":"ACG 2024"},{"topic":"ar","subj":"reuma","id":"ar-01","dif":2,"stem":"Mujer de 45 años con sinovitis en 2 MCF y 1 IFP de 8 semanas. Anti-CCP 5 veces el límite superior, FR negativo, PCR elevada. ¿Puntaje ACR/EULAR 2010 y conclusión?","opts":["5: no es AR","7: cumple criterios de AR","4: posible AR","10: AR grave","No se puede calcular sin Rx"],"ans":1,"exp":"3 articulaciones pequeñas (1–3) = 2 puntos; serología positiva alta (>3× el límite) = 3; PCR alta = 1; ≥6 semanas = 1. Total: 2 + 3 + 1 + 1 = 7. Cumple criterios de AR (≥6).","why":["Subestimaste los dominios.","","Supera el umbral de 6.","El puntaje no mide gravedad.","Los criterios no requieren Rx."],"ref":"ACR/EULAR 2010"},{"topic":"ar","subj":"reuma","id":"ar-02","dif":1,"stem":"¿Cuál es la prueba de laboratorio más específica para artritis reumatoide?","opts":["Factor reumatoide","Anti-CCP","ANA","VSG","HLA-B27"],"ans":1,"exp":"El anti-CCP (ACPA) tiene especificidad >95% y se asocia a enfermedad erosiva. El factor reumatoide es menos específico.","why":["Es más sensible pero menos específico.","","Es de LES y conectivopatías.","Es inespecífica.","Se asocia a espondiloartritis."],"ref":"ACR"},{"topic":"ar","subj":"reuma","id":"ar-03","dif":1,"stem":"Mujer de 60 años con dolor en las IFD de ambas manos, nódulos duros en el dorso de esas articulaciones y rigidez matutina de 10 minutos. ¿Qué es más probable?","opts":["Artritis reumatoide","Osteoartritis (nódulos de Heberden)","Gota","Lupus","Fiebre reumática"],"ans":1,"exp":"La AR respeta las IFD. Nódulos óseos en IFD (Heberden) con rigidez breve = osteoartritis. En IFD con onicopatía piensa también en artritis psoriásica.","why":["La AR respeta las IFD y da rigidez prolongada.","","Puede afectar dedos, pero con ataques inflamatorios agudos.","No da nódulos óseos en IFD.","No es el cuadro."],"ref":"ACR"},{"topic":"ar","subj":"reuma","id":"ar-04","dif":1,"stem":"Mujer de 38 años con AR recién diagnosticada, PFH y creatinina normales, sin planes de embarazo. ¿Tratamiento de base?","opts":["Metotrexato semanal + ácido fólico","Metotrexato diario","Prednisona 40 mg/día por 1 año","Solo AINE","Infliximab de inicio"],"ans":0,"exp":"Metotrexato 15–25 mg una vez a la semana (oral o subcutáneo) con ácido fólico para reducir efectos adversos. Puede usarse prednisona a dosis baja como puente breve.","why":["","La dosis diaria es un error grave y puede ser mortal.","Dosis y duración excesivas.","No modifican la enfermedad.","Los biológicos van tras falla al FAME convencional."],"ref":"ACR 2021 · EULAR 2022"},{"topic":"ar","subj":"reuma","id":"ar-05","dif":2,"stem":"Paciente con AR en metotrexato desde hace 4 meses. Presenta tos seca, disnea progresiva y fiebre leve. La TC muestra opacidades en vidrio despulido bilaterales. ¿Qué sospechas?","opts":["Nódulos reumatoides","Neumonitis por metotrexato","Asma","TEP","Insuficiencia cardiaca"],"ans":1,"exp":"La neumonitis por hipersensibilidad al metotrexato suele aparecer en el primer año: tos, disnea, fiebre y vidrio despulido. Se suspende el fármaco, se descarta infección (incluida Pneumocystis) y se dan esteroides.","why":["No dan vidrio despulido difuso con fiebre.","","No da vidrio despulido.","No encaja con la imagen.","Menos probable sin otros datos."],"ref":"ACR"},{"topic":"ar","subj":"reuma","id":"ar-06","dif":1,"stem":"Hombre con AR que va a iniciar adalimumab. ¿Qué estudio es obligatorio antes?","opts":["Densitometría","Tamizaje de TB latente (IGRA o PPD) y hepatitis B","Ecocardiograma","Colonoscopia","Electromiografía"],"ans":1,"exp":"Los anti-TNF pueden reactivar TB latente y hepatitis B. Si el IGRA o el PPD son positivos, se trata la TB latente antes (o junto) de iniciar el biológico.","why":["No es requisito.","","Solo si hay sospecha de IC.","No es requisito.","No tiene relación."],"ref":"ACR 2021"},{"topic":"ar","subj":"reuma","id":"ar-07","dif":2,"stem":"Mujer de 30 años con AR controlada con metotrexato que desea embarazarse el próximo año. ¿Qué haces?","opts":["Seguir igual durante el embarazo","Suspender el metotrexato al menos 1–3 meses antes de la concepción y cambiar a hidroxicloroquina o sulfasalazina","Cambiar a leflunomida","Suspender todo tratamiento","Cambiar a prednisona 60 mg/día"],"ans":1,"exp":"El metotrexato es teratogénico (abortos, malformaciones). Se suspende antes de buscar el embarazo y se cambia por fármacos compatibles: hidroxicloroquina, sulfasalazina, prednisona a dosis baja o certolizumab.","why":["Está contraindicado en el embarazo.","","También es teratogénica.","Puede recaer; hay opciones seguras.","Dosis excesiva y riesgosa."],"ref":"ACR 2020 salud reproductiva"},{"topic":"ar","subj":"reuma","id":"ar-08","dif":2,"stem":"Hombre de 60 años con AR de 15 años, esplenomegalia y neutrófilos de 900/µL con infecciones recurrentes. ¿Diagnóstico?","opts":["Leucemia mieloide","Síndrome de Felty","Sjögren","Lupus inducido","Linfoma"],"ans":1,"exp":"AR de larga evolución + esplenomegalia + neutropenia = síndrome de Felty. Se asocia a FR alto y nódulos; se trata la AR (metotrexato, rituximab).","why":["No hay blastos ni datos de leucemia.","","Da sequedad, no neutropenia con esplenomegalia.","Se asocia a fármacos (hidralazina, procainamida).","Posible en AR, pero la tríada es de Felty."],"ref":"Reumatología clínica"},{"topic":"ar","subj":"reuma","id":"ar-09","dif":2,"stem":"Mujer con AR erosiva de larga evolución que será operada con intubación. Refiere dolor cervical y parestesias en las manos. ¿Qué estudio pides antes?","opts":["Ninguno","Rx de columna cervical en flexión y extensión","Densitometría","USG de cuello","Electrocardiograma"],"ans":1,"exp":"La AR afecta la articulación atlantoaxoidea: la hiperextensión al intubar puede comprimir la médula. Se pide Rx en flexión-extensión (o RM) y se planea la intubación.","why":["Es un riesgo neurológico real.","","No evalúa la inestabilidad.","No evalúa la columna.","No evalúa este riesgo."],"ref":"Reumatología clínica"},{"topic":"ar","subj":"reuma","id":"ar-10","dif":1,"stem":"Paciente con AR que tomará hidroxicloroquina por tiempo prolongado. ¿Qué vigilancia necesita?","opts":["Audiometría","Exploración oftalmológica basal y anual a partir de los 5 años de uso","Biopsia hepática","Espirometría","Ecocardiograma"],"ans":1,"exp":"La hidroxicloroquina puede causar retinopatía (maculopatía en “ojo de buey”) dependiente de dosis y tiempo. Se pide examen basal y anual a partir de los 5 años (antes si hay factores de riesgo).","why":["No es el efecto clásico.","","No tiene relación.","No tiene relación.","Rara vez cardiotóxica; no es la vigilancia de rutina."],"ref":"AAO 2016"},{"topic":"ar","subj":"reuma","id":"ar-11","dif":2,"stem":"Mujer de 50 años con AR tratada 6 meses con metotrexato 25 mg semanales y buen apego. Sigue con 8 articulaciones inflamadas y DAS28 de 5.4. ¿Siguiente paso?","opts":["Esperar otros 6 meses","Agregar un biológico (o JAK) o, según la guía, pasar a triple terapia convencional","Suspender el metotrexato y dar solo AINE","Prednisona 30 mg/día crónica","Cirugía"],"ans":1,"exp":"Tratar a una meta: si no hay remisión o baja actividad tras 3–6 meses con dosis óptimas de metotrexato, se escala (biológico o JAK; EULAR acepta triple terapia si no hay mal pronóstico).","why":["Seguir con actividad alta acumula daño.","","Retroceso sin justificación.","Los esteroides crónicos tienen muchos efectos adversos.","No es la indicación."],"ref":"ACR 2021 · EULAR 2022"},{"topic":"ar","subj":"reuma","id":"ar-12","dif":1,"stem":"Hombre de 55 años con AR de 10 años. ¿Cuál es la principal causa de muerte en pacientes con AR?","opts":["Infecciones","Enfermedad cardiovascular","Linfoma","Enfermedad pulmonar intersticial","Insuficiencia renal"],"ans":1,"exp":"La inflamación crónica acelera la aterosclerosis: la ECV es la principal causa de muerte. Controla PA, lípidos, tabaco y glucosa, y apaga la inflamación.","why":["Son importantes, pero no la primera causa.","","Aumenta su riesgo, pero no es la principal.","Importante, pero no la primera.","No es la principal."],"ref":"EULAR 2022 riesgo CV en enfermedades inflamatorias"},{"topic":"ar","subj":"reuma","id":"ar-13","dif":2,"stem":"Mujer de 33 años con AR en leflunomida que quiere embarazarse. ¿Qué debes hacer?","opts":["Nada especial","Suspender la leflunomida y hacer lavado con colestiramina, confirmando niveles bajos","Cambiar a metotrexato","Duplicar la dosis","Suspenderla solo cuando se confirme el embarazo"],"ans":1,"exp":"La leflunomida es teratogénica y tiene vida media muy larga por recirculación enterohepática. Antes de buscar el embarazo se suspende y se hace lavado con colestiramina hasta tener niveles indetectables.","why":["Riesgo de malformaciones.","","También teratogénico.","Absurdo.","Su efecto dura meses; hay que lavarla antes."],"ref":"ACR 2020 salud reproductiva"},{"topic":"ar","subj":"reuma","id":"ar-14","dif":2,"stem":"Hombre de 62 años, fumador, con AR anti-CCP positivo. Tiene disnea progresiva y estertores “en velcro” en las bases. ¿Qué complicación extraarticular sospechas?","opts":["Derrame pericárdico","Enfermedad pulmonar intersticial","Asma","Bronquiectasias aisladas","Neumotórax"],"ans":1,"exp":"La enfermedad pulmonar intersticial es una complicación frecuente y grave de la AR (más en hombres, fumadores, anti-CCP alto); el patrón más común es NIU. Se estudia con TC de alta resolución y pruebas funcionales.","why":["No da estertores en velcro.","","No es el cuadro.","Posibles, pero los estertores en velcro sugieren intersticial.","Daría dolor súbito."],"ref":"ACR/CHEST 2023 EPI en enfermedades reumáticas"},{"topic":"ar","subj":"reuma","id":"ar-15","dif":1,"stem":"Paciente con AR activa que inicia metotrexato. Su médico agrega prednisona 7.5 mg/día. ¿Cuál es el papel de la prednisona?","opts":["Tratamiento de mantenimiento indefinido","Puente mientras actúa el FAME, a la menor dosis y por el menor tiempo posible","Sustituye al metotrexato","Previene la enfermedad cardiovascular","Previene la osteoporosis"],"ans":1,"exp":"El metotrexato tarda semanas en actuar. Los glucocorticoides a dosis bajas controlan síntomas mientras tanto y se retiran lo antes posible por sus efectos adversos.","why":["El uso crónico causa osteoporosis, DM, infecciones.","","No modifica la enfermedad a largo plazo como el FAME.","La aumenta.","La causa."],"ref":"EULAR 2022"},{"topic":"gota","subj":"reuma","id":"gota-01","dif":1,"stem":"Mujer de 78 años con monoartritis aguda de la rodilla. Rx: calcificación lineal en los meniscos. Artrocentesis: cristales romboides con birrefringencia positiva débil. ¿Diagnóstico?","opts":["Gota","Enfermedad por depósito de pirofosfato de calcio (pseudogota)","Artritis séptica","Osteoartritis sin inflamación","Artritis reumatoide"],"ans":1,"exp":"Cristales romboides con birrefringencia positiva débil + condrocalcinosis en un adulto mayor = CPPD. La gota tiene agujas con birrefringencia negativa.","why":["Los cristales de la gota son agujas negativas.","","Requiere Gram o cultivo positivos; los cristales explican el cuadro (aunque siempre se cultiva).","Hay inflamación aguda y cristales.","No es monoartritis con cristales."],"ref":"Rosenthal AK, NEJM 2016"},{"topic":"gota","subj":"reuma","id":"gota-02","dif":2,"stem":"Hombre de 68 años con ERC G4 y úlcera péptica reciente. Ataque de gota en el tobillo desde hace 12 h. ¿Mejor opción?","opts":["Indometacina a dosis plenas","Colchicina a dosis altas","Prednisona oral (o esteroide intraarticular)","Iniciar alopurinol 300 mg sin antiinflamatorio","Naproxeno + omeprazol"],"ans":2,"exp":"Con ERC avanzada y úlcera, los AINE están contraindicados y la colchicina requiere ajuste importante (riesgo de toxicidad). Los glucocorticoides (orales o intraarticulares) son la opción más segura.","why":["Contraindicado por ERC y úlcera.","Riesgo de toxicidad en ERC.","","No trata el ataque.","Sigue siendo riesgoso con ERC G4."],"ref":"ACR 2020"},{"topic":"gota","subj":"reuma","id":"gota-03","dif":2,"stem":"Hombre de 55 años con gota que toma colchicina 0.6 mg/día como profilaxis. Le indican claritromicina por neumonía. A los 4 días: diarrea, debilidad muscular, CK alta y leucopenia. ¿Qué pasó?","opts":["Neumonía grave","Toxicidad por colchicina por interacción con claritromicina (inhibidor de CYP3A4 y P-gp)","Gota poliarticular","Reacción alérgica a la claritromicina","Rabdomiólisis por el ejercicio"],"ans":1,"exp":"La claritromicina eleva mucho los niveles de colchicina: diarrea, miopatía, mielosupresión y puede ser mortal. Se suspende la colchicina o se elige otro antibiótico (p. ej., azitromicina, con menor interacción).","why":["No explica la miopatía y la leucopenia.","","No es el cuadro.","No da miopatía ni leucopenia.","No hay antecedente."],"ref":"FDA colchicina · ACR 2020"},{"topic":"gota","subj":"reuma","id":"gota-04","dif":1,"stem":"Hombre en alopurinol 300 mg con buen control presenta un ataque de gota. ¿Qué haces con el alopurinol?","opts":["Suspenderlo hasta que pase el ataque","Continuarlo y tratar el ataque","Duplicar la dosis de inmediato","Cambiarlo por probenecid","Suspenderlo para siempre"],"ans":1,"exp":"Suspender el alopurinol causa oscilaciones del urato y más ataques. Se mantiene igual y se trata el ataque con colchicina, AINE o esteroide.","why":["Empeora el control.","","No es el momento de ajustarlo bruscamente.","No hay motivo.","Lo dejaría sin control."],"ref":"ACR 2020"},{"topic":"gota","subj":"reuma","id":"gota-05","dif":2,"stem":"Hombre de 50 años con 3 ataques de gota este año y un tofo en el codo. Urato 9.4 mg/dL, TFG 70. ¿Qué indicas?","opts":["Solo colchicina en cada ataque","Alopurinol en dosis baja con aumento progresivo hasta urato \u003c6, más profilaxis con colchicina 3–6 meses","Alopurinol 600 mg desde el primer día","Probenecid y dieta","Febuxostat de primera línea"],"ans":1,"exp":"Tiene indicaciones fuertes (tofo y ≥2 ataques/año). Alopurinol iniciado bajo (≤100 mg) y titulado cada 2–5 semanas hasta la meta, con profilaxis antiinflamatoria para evitar ataques al bajar el urato.","why":["No previene el daño a largo plazo.","","Iniciar alto aumenta ataques y reacciones adversas.","El alopurinol es primera línea.","Es alternativa, no primera línea."],"ref":"ACR 2020"},{"topic":"gota","subj":"reuma","id":"gota-06","dif":1,"stem":"¿Cuál es la meta de urato sérico en un paciente con gota en tratamiento?","opts":["\u003c8 mg/dL","\u003c7 mg/dL","\u003c6 mg/dL","\u003c3 mg/dL","Normalizarlo sin meta"],"ans":2,"exp":"Por debajo de 6 mg/dL los cristales se disuelven con el tiempo. EULAR propone \u003c5 mg/dL si hay tofos o enfermedad grave.","why":["Está por arriba del punto de saturación.","Insuficiente para disolver cristales.","","No se busca tan bajo de forma rutinaria.","Sí hay meta definida."],"ref":"ACR 2020 · EULAR 2016"},{"topic":"gota","subj":"reuma","id":"gota-07","dif":2,"stem":"Hombre de 45 años de origen coreano que va a iniciar alopurinol. ¿Qué estudio debes pedir antes?","opts":["G6PD","HLA-B*58:01","HLA-B27","TPMT","Ninguno"],"ans":1,"exp":"El HLA-B*58:01 se asocia a reacciones graves por alopurinol (Stevens-Johnson, NET, DRESS). Es frecuente en personas de origen coreano, chino han, tailandés y afrodescendientes; si es positivo, se usa otro fármaco.","why":["Se pide antes de pegloticasa o rasburicasa.","","Se asocia a espondiloartritis.","Se pide antes de azatioprina.","En este grupo está recomendado."],"ref":"ACR 2020"},{"topic":"gota","subj":"reuma","id":"gota-08","dif":1,"stem":"Hombre hipertenso tratado con hidroclorotiazida, con gota recurrente. ¿Qué antihipertensivo prefieres?","opts":["Furosemida","Losartán","Clortalidona","Hidroclorotiazida a mayor dosis","Ninguno"],"ans":1,"exp":"Los diuréticos elevan el urato. El losartán tiene efecto uricosúrico y es buena opción para HTA en gota (también calcioantagonistas).","why":["También eleva el urato.","","Es otra tiazida.","Empeora la gota.","Necesita control de su HTA."],"ref":"ACR 2020"},{"topic":"gota","subj":"reuma","id":"gota-09","dif":2,"stem":"Hombre de 66 años con IAM previo y gota con indicación de terapia hipouricemiante. ¿Qué fármaco evitarías?","opts":["Alopurinol","Febuxostat","Colchicina profiláctica","Losartán","Prednisona en el ataque"],"ans":1,"exp":"En CARES el febuxostat se asoció a mayor mortalidad cardiovascular que el alopurinol en pacientes con ECV. Se prefiere alopurinol.","why":["Es la primera línea.","","Es segura con dosis ajustada.","Es útil en HTA con gota.","Es útil en el ataque."],"ref":"White WB, et al. CARES, NEJM 2018"},{"topic":"gota","subj":"reuma","id":"gota-10","dif":1,"stem":"Hombre con podagra típica. Ácido úrico sérico durante el ataque: 5.8 mg/dL. ¿Qué concluyes?","opts":["No es gota","El urato puede ser normal durante el ataque: confirmar con cristales","Es pseudogota","Es artritis séptica","Es artritis reumatoide"],"ans":1,"exp":"Durante el ataque el urato puede bajar o ser normal. El diagnóstico se basa en los cristales; si no hay artrocentesis, se usa el criterio clínico y se repite el urato 2–4 semanas después.","why":["Un urato normal no la descarta.","","Sin cristales no puedes afirmarlo.","No hay datos de infección descritos.","No encaja."],"ref":"ACR/EULAR 2015 clasificación de gota"},{"topic":"gota","subj":"reuma","id":"gota-11","dif":3,"stem":"Hombre de 58 años con fiebre de 39 °C y rodilla muy inflamada. Líquido sinovial: 120 000 leucocitos/µL con 95% neutrófilos y cristales de urato. ¿Qué haces?","opts":["Tratar solo la gota","Considerar artritis séptica coexistente: Gram y cultivo, antibióticos empíricos y drenaje articular","Dar alopurinol","Observar 48 h","Infiltrar esteroide"],"ans":1,"exp":"Los cristales no descartan infección. Con >50 000 leucocitos y fiebre alta, se trata como artritis séptica hasta tener cultivos: antibióticos empíricos y drenaje.","why":["Si es séptica, la articulación se destruye en días.","","No es el problema urgente.","La infección no espera.","Contraindicado si puede ser séptica."],"ref":"EULAR · Reumatología clínica"},{"topic":"gota","subj":"reuma","id":"gota-12","dif":2,"stem":"Mujer de 45 años con pseudogota en ambas rodillas. ¿Qué estudios pides para buscar una causa?","opts":["Ninguno","Calcio, PTH, ferritina y saturación de transferrina, magnesio y fosfatasa alcalina","Anti-CCP","HLA-B27","ANA"],"ans":1,"exp":"La CPPD en menores de 60 años obliga a buscar hiperparatiroidismo, hemocromatosis, hipomagnesemia e hipofosfatasia.","why":["En pacientes jóvenes hay que buscar causas.","","Es de AR.","Es de espondiloartritis.","Es de LES."],"ref":"Rosenthal AK, NEJM 2016"},{"topic":"gota","subj":"reuma","id":"gota-13","dif":1,"stem":"Rx del pie de un hombre con gota de 15 años: erosiones en “sacabocado” con borde óseo colgante cerca de la 1ª MTF. ¿Qué indican?","opts":["Osteoartritis","Gota crónica tofácea","Artritis reumatoide","Osteomielitis","Artritis psoriásica"],"ans":1,"exp":"Las erosiones en sacabocado con borde sobresaliente (overhanging edge) son típicas de la gota crónica tofácea y son indicación de terapia hipouricemiante.","why":["Da osteofitos y espacio reducido.","","Da erosiones marginales sin borde colgante y osteopenia.","Daría destrucción con reacción perióstica y clínica infecciosa.","Da “lápiz en copa”."],"ref":"Radiología musculoesquelética"},{"topic":"gota","subj":"reuma","id":"gota-14","dif":2,"stem":"Hombre con gota y cólico renal. El lito no se ve en la Rx simple pero sí en la TC. ¿De qué es probablemente el lito y cómo se previene?","opts":["Oxalato de calcio; restringir calcio","Ácido úrico; alcalinizar la orina con citrato de potasio, hidratación y alopurinol","Estruvita; antibióticos","Cistina; penicilamina","Fosfato de calcio; tiazida"],"ans":1,"exp":"Los litos de ácido úrico son radiolúcidos en la Rx simple y se forman en orina ácida. Se previenen alcalinizando la orina (pH 6–6.5), con mucha agua y bajando el urato.","why":["Son radioopacos, y restringir calcio no se recomienda.","","Asociada a infección por bacterias ureolíticas.","Es una enfermedad hereditaria rara.","Son radioopacos."],"ref":"AUA/EAU litiasis"},{"topic":"gota","subj":"reuma","id":"gota-15","dif":2,"stem":"Hombre de 52 años que inició alopurinol 300 mg sin profilaxis. Al mes tiene dos ataques de gota y dice “el alopurinol me empeoró”. ¿Qué explicas y haces?","opts":["Suspender el alopurinol definitivamente","Los ataques son por la movilización del urato al iniciarlo: mantener el alopurinol (idealmente desde dosis baja), tratar el ataque y dar profilaxis con colchicina 3–6 meses","Cambiar a febuxostat","Es alergia al alopurinol","Agregar otra tiazida"],"ans":1,"exp":"Bajar el urato bruscamente moviliza cristales y provoca ataques. Por eso se inicia a dosis baja, se titula y se da profilaxis antiinflamatoria los primeros meses.","why":["Es un efecto esperado, no una falla.","","Tendría el mismo efecto y no está indicado por esto.","No hay datos de alergia.","Empeora el urato."],"ref":"ACR 2020"},{"topic":"scc","subj":"cardio","id":"scc-01","dif":1,"stem":"Hombre de 60 años con opresión retroesternal al subir dos pisos, que cede con 3 minutos de reposo. ¿Cómo se clasifica el dolor?","opts":["No anginoso","Angina atípica","Angina típica","Angina inestable","Dolor pleurítico"],"ans":2,"exp":"Cumple los 3 criterios: localización retroesternal, desencadenado por esfuerzo y alivio con reposo. Al ser estable y predecible, es angina estable típica.","why":["Cumple los 3 criterios.","Atípica sería con 2 de 3.","","La inestable es de reposo, nueva o en aumento.","No cambia con la respiración."],"ref":"ESC 2024 SCC"},{"topic":"scc","subj":"cardio","id":"scc-02","dif":2,"stem":"Mujer de 58 años con angina típica, ECG normal y probabilidad clínica moderada (≈25%). Según la ESC 2024, ¿qué estudio inicial prefieres?","opts":["Coronariografía invasiva directa","Angio-TC coronaria","Ninguno; tratamiento empírico","Dímero D","Troponinas seriadas"],"ans":1,"exp":"Con probabilidad baja a moderada, la angio-TC coronaria tiene muy buen valor predictivo negativo y permite iniciar prevención si hay placa. Con probabilidad moderada-alta también es válida una prueba funcional de imagen.","why":["Se reserva para probabilidad muy alta o alto riesgo.","","Con probabilidad moderada se estudia.","No tiene relación.","Son para SCA, no para angina estable."],"ref":"ESC 2024 SCC"},{"topic":"scc","subj":"cardio","id":"scc-03","dif":2,"stem":"Hombre de 66 años con angina de esfuerzo y bloqueo de rama izquierda en el ECG basal. ¿Qué prueba funcional eliges?","opts":["Prueba de esfuerzo con ECG","Prueba de imagen (eco de estrés o SPECT con vasodilatador)","Holter de 24 h","Tilt test","Ninguna"],"ans":1,"exp":"Con BRIHH el ST basal no se puede interpretar durante el esfuerzo. Se usa imagen; con BRIHH se prefiere estrés farmacológico vasodilatador en SPECT (el ejercicio da defectos septales falsos).","why":["El ECG basal no es interpretable.","","No diagnostica isquemia de esfuerzo.","Es para síncope.","Necesita estudio."],"ref":"ESC 2024 SCC"},{"topic":"scc","subj":"cardio","id":"scc-04","dif":1,"stem":"Hombre con angina estable que ya recibe aspirina y estatina. Persisten los síntomas. ¿Antianginoso de primera línea?","opts":["Ranolazina","Betabloqueador o calcioantagonista","Ivabradina","Trimetazidina","Nitrato de acción prolongada"],"ans":1,"exp":"Betabloqueadores y calcioantagonistas son la primera línea para controlar la angina. El resto se agrega si no basta o hay contraindicaciones.","why":["Segunda línea.","","Segunda línea; requiere ritmo sinusal.","Segunda línea.","Segunda línea."],"ref":"ESC 2024 SCC"},{"topic":"scc","subj":"cardio","id":"scc-05","dif":2,"stem":"Paciente con angina estable en metoprolol. Para agregar un segundo antianginoso, ¿cuál evitas?","opts":["Amlodipino","Verapamilo","Nitrato de acción prolongada","Ranolazina","Ivabradina"],"ans":1,"exp":"Verapamilo y diltiazem (calcioantagonistas no dihidropiridínicos) + betabloqueador causan bradicardia grave, bloqueo AV y depresión de la contractilidad. Con betabloqueador se combina una dihidropiridina.","why":["Es la combinación recomendada.","","Combinable.","Combinable.","Combinable con precaución de FC."],"ref":"ESC 2024 SCC"},{"topic":"scc","subj":"cardio","id":"scc-06","dif":2,"stem":"Mujer de 42 años, fumadora, con dolor torácico en reposo a las 4 a. m. que dura 10 minutos. Durante un episodio, el Holter muestra elevación transitoria del ST que se normaliza. Coronariografía sin obstrucciones. ¿Tratamiento?","opts":["Betabloqueador no selectivo","Calcioantagonista + nitratos y dejar de fumar","Doble antiagregación por 12 meses","ICP","Fibrinólisis"],"ans":1,"exp":"Angina vasoespástica (Prinzmetal). Los calcioantagonistas y nitratos previenen el espasmo; se suspende el tabaco (y cocaína). Los betabloqueadores no selectivos pueden empeorarlo (vasoconstricción alfa sin oposición).","why":["Pueden empeorar el espasmo.","","No hay placa ni stent.","No hay lesión obstructiva.","No hay trombo."],"ref":"ESC 2024 SCC"},{"topic":"scc","subj":"cardio","id":"scc-07","dif":1,"stem":"Hombre con angina estable que usa nitroglicerina SL de rescate. Pregunta si puede tomar sildenafil. ¿Qué le dices?","opts":["No hay problema","No debe usar nitratos dentro de las 24 h siguientes al sildenafil (48 h con tadalafil): riesgo de hipotensión grave","Solo si toma aspirina","Solo si toma betabloqueador","Puede tomarlos juntos a mitad de dosis"],"ans":1,"exp":"Los inhibidores de la PDE5 potencian el efecto vasodilatador de los nitratos (más GMPc): hipotensión profunda, síncope, isquemia.","why":["La combinación es peligrosa.","","No tiene relación.","No tiene relación.","No es seguro."],"ref":"ESC 2024 SCC"},{"topic":"scc","subj":"cardio","id":"scc-08","dif":2,"stem":"Hombre de 64 años con angina estable leve, controlada con tratamiento médico óptimo. Angio-TC: estenosis de 70% en la circunfleja media, sin lesión de tronco; FEVI normal. ¿Qué indica la evidencia actual?","opts":["ICP inmediata para reducir mortalidad","Continuar tratamiento médico óptimo; revascularizar si los síntomas no se controlan","Cirugía de revascularización urgente","Suspender la estatina","Fibrinólisis"],"ans":1,"exp":"ISCHEMIA: en enfermedad estable sin lesión de tronco, revascularizar de rutina no redujo muerte ni IAM. Se revasculariza por síntomas refractarios o anatomía de alto riesgo.","why":["No reduce mortalidad en este escenario.","","No hay indicación urgente.","La estatina es pilar del pronóstico.","No es un SCA."],"ref":"ISCHEMIA, NEJM 2020"},{"topic":"scc","subj":"cardio","id":"scc-09","dif":2,"stem":"Hombre de 60 años con DM2 y enfermedad de 3 vasos con FEVI de 45%. ¿Qué tipo de revascularización se prefiere?","opts":["ICP con balón sin stent","Cirugía de revascularización coronaria (CABG)","Solo tratamiento médico","Trombólisis","ICP solo de la lesión más grave"],"ans":1,"exp":"En diabéticos con enfermedad multivaso, la cirugía de revascularización redujo muerte e IAM frente a la ICP (FREEDOM).","why":["Técnica obsoleta para esta anatomía.","","Con 3 vasos y DM la cirugía tiene beneficio.","No es un SCA.","Revascularización incompleta."],"ref":"FREEDOM, NEJM 2012 · ESC 2024"},{"topic":"scc","subj":"cardio","id":"scc-10","dif":1,"stem":"¿Cuál es el mecanismo de la ivabradina y su requisito?","opts":["Bloquea canales de calcio; ninguno","Inhibe la corriente If del nodo sinusal y baja la FC; requiere ritmo sinusal","Bloquea receptores β1; FC >50","Inhibe la corriente tardía de sodio; ninguno","Es un nitrato; evitar sildenafil"],"ans":1,"exp":"La ivabradina reduce la FC sin efecto inotrópico negativo al bloquear la corriente “funny” (If). No sirve en fibrilación auricular. Se usa en angina con FC >70 y en IC con FE reducida.","why":["Es el mecanismo de los calcioantagonistas.","","Es el de los betabloqueadores.","Es el de la ranolazina.","No es un nitrato."],"ref":"ESC 2024 SCC"},{"topic":"aortica","subj":"cardio","id":"aor-01","dif":1,"stem":"Hombre de 78 años con soplo sistólico rudo en el 2º espacio intercostal derecho, irradiado a ambas carótidas, con pulso carotídeo débil y retrasado. ¿Diagnóstico?","opts":["Insuficiencia mitral","Estenosis aórtica","Insuficiencia aórtica","Comunicación interventricular","Miocardiopatía hipertrófica"],"ans":1,"exp":"Soplo sistólico expulsivo en foco aórtico irradiado a carótidas + pulso parvus et tardus = estenosis aórtica. En un adulto mayor, la causa más común es la calcificación degenerativa.","why":["Es holosistólico apical irradiado a axila.","","Es diastólico.","Holosistólico paraesternal izquierdo.","Aumenta con Valsalva y no irradia típicamente a carótidas con pulso tardío."],"ref":"ACC/AHA 2020 valvulopatías"},{"topic":"aortica","subj":"cardio","id":"aor-02","dif":1,"stem":"En la estenosis aórtica grave no tratada, ¿qué síntoma se asocia a la menor supervivencia?","opts":["Angina","Síncope","Insuficiencia cardiaca","Palpitaciones","Fatiga"],"ans":2,"exp":"Supervivencia media sin tratamiento: angina ~5 años, síncope ~3 años e IC ~2 años. Cualquier síntoma con estenosis grave es indicación de intervenir.","why":["Mejor supervivencia que la IC.","Intermedia.","","No es parte de la tríada clásica.","No es parte de la tríada clásica."],"ref":"Ross J, Braunwald E. Circulation 1968"},{"topic":"aortica","subj":"cardio","id":"aor-03","dif":2,"stem":"Mujer de 84 años con estenosis aórtica grave y disnea de esfuerzo, fragilidad moderada y anatomía femoral adecuada. ¿Mejor opción?","opts":["Tratamiento médico","TAVI por vía femoral","Cirugía de reemplazo valvular abierta","Valvuloplastia con balón definitiva","Diuréticos y vasodilatadores a dosis altas"],"ans":1,"exp":"Estenosis aórtica grave sintomática en una paciente mayor y frágil con buena anatomía: TAVI transfemoral. Mejora la supervivencia y los síntomas.","why":["No modifica el pronóstico.","","Mayor riesgo en una paciente frágil de 84 años.","Solo como puente; reestenosa pronto.","Los vasodilatadores son peligrosos aquí."],"ref":"ESC/EACTS 2025 · ACC/AHA 2020"},{"topic":"aortica","subj":"cardio","id":"aor-04","dif":2,"stem":"Hombre de 52 años con válvula aórtica bicúspide, estenosis grave y síncope de esfuerzo. Bajo riesgo quirúrgico. ¿Tratamiento?","opts":["TAVI","Reemplazo valvular quirúrgico","Observación","Betabloqueador","Valvuloplastia con balón"],"ans":1,"exp":"Paciente joven de bajo riesgo con bicúspide: cirugía de reemplazo (permite además tratar la aorta dilatada si la hay). La TAVI en bicúspide de jóvenes no es la primera opción.","why":["La anatomía bicúspide y la edad favorecen la cirugía.","","Tiene síntoma: requiere intervención.","No trata la obstrucción.","En adultos no es definitiva."],"ref":"ESC/EACTS 2025 · ACC/AHA 2020"},{"topic":"aortica","subj":"cardio","id":"aor-05","dif":2,"stem":"Paciente con estenosis aórtica grave y dolor torácico. El residente quiere dar nitroglicerina sublingual. ¿Qué riesgo hay?","opts":["Ninguno","Hipotensión grave por caída de la precarga","Hiperkalemia","Bradicardia","Broncoespasmo"],"ans":1,"exp":"Con un orificio fijo y estrecho, el gasto depende de la precarga. Los venodilatadores la reducen y pueden causar colapso hemodinámico.","why":["Sí hay riesgo.","","No tiene relación.","No es el efecto principal.","No tiene relación."],"ref":"ACC/AHA 2020"},{"topic":"aortica","subj":"cardio","id":"aor-06","dif":1,"stem":"Hombre de 40 años con soplo diastólico decreciente en el borde esternal izquierdo, presión de pulso de 80 mmHg y movimiento de la cabeza con cada latido. ¿Diagnóstico?","opts":["Estenosis aórtica","Insuficiencia aórtica","Estenosis mitral","Insuficiencia tricuspídea","Pericarditis"],"ans":1,"exp":"Soplo diastólico temprano en borde esternal izquierdo + presión de pulso amplia + signo de Musset = insuficiencia aórtica crónica.","why":["Es sistólico.","","Es diastólico apical con chasquido.","Es holosistólico paraesternal que aumenta con la inspiración.","Da frote, no soplo diastólico."],"ref":"ACC/AHA 2020"},{"topic":"aortica","subj":"cardio","id":"aor-07","dif":2,"stem":"Hombre de 35 años usuario de drogas IV con endocarditis aórtica por S. aureus. De forma súbita presenta edema pulmonar y PA 85/40. Eco: insuficiencia aórtica grave aguda. ¿Manejo?","opts":["Antibióticos y cirugía en 6 semanas","Cirugía urgente de la válvula, con antibióticos","Balón de contrapulsación intraaórtico","Betabloqueador IV","Solo diuréticos"],"ans":1,"exp":"La insuficiencia aórtica aguda grave no da tiempo al VI para adaptarse: choque y edema pulmonar. Es indicación de cirugía urgente. El balón de contrapulsación está contraindicado (aumenta el reflujo).","why":["No sobreviviría la espera.","","Contraindicado en insuficiencia aórtica.","La bradicardia alarga la diástole y aumenta el reflujo.","Insuficiente."],"ref":"ESC 2023 endocarditis · ACC/AHA 2020"},{"topic":"aortica","subj":"cardio","id":"aor-08","dif":2,"stem":"Mujer de 74 años con estenosis aórtica grave y anemia ferropénica recurrente. La colonoscopia muestra angiodisplasias en el colon derecho. ¿Qué asociación es?","opts":["Síndrome de Heyde","Síndrome de Leriche","Síndrome de Marfan","Síndrome de Felty","Síndrome de Plummer-Vinson"],"ans":0,"exp":"El flujo turbulento de la estenosis aórtica destruye multímeros grandes de von Willebrand (von Willebrand adquirido tipo 2A), y las angiodisplasias sangran. El reemplazo valvular suele resolver el sangrado.","why":["","Es oclusión aortoilíaca con claudicación e impotencia.","Da dilatación aórtica e insuficiencia, no esta asociación.","Es AR + esplenomegalia + neutropenia.","Es ferropenia con membranas esofágicas."],"ref":"Heyde syndrome, NEJM 2003"},{"topic":"aortica","subj":"cardio","id":"aor-09","dif":2,"stem":"Hombre de 55 años con insuficiencia aórtica grave crónica, asintomático. Eco: FEVI 45% y diámetro telesistólico del VI de 54 mm. ¿Qué indicas?","opts":["Seguimiento anual","Cirugía de la válvula","Solo IECA","Betabloqueador","TAVI de rutina"],"ans":1,"exp":"En insuficiencia aórtica grave asintomática, la disfunción del VI (FEVI ≤50%) o la dilatación importante (DTS >50 mm) indican cirugía antes de que el daño sea irreversible.","why":["Ya tiene criterios de cirugía.","","No sustituye a la cirugía.","Aumentaría el reflujo.","La TAVI no es el estándar para insuficiencia aórtica."],"ref":"ACC/AHA 2020 · ESC/EACTS 2025"},{"topic":"aortica","subj":"cardio","id":"aor-10","dif":1,"stem":"Paciente con prótesis valvular aórtica mecánica que irá a una extracción dental. ¿Qué profilaxis de endocarditis indicas?","opts":["Ninguna","Amoxicilina 2 g VO 30–60 min antes","Ciprofloxacino por 7 días","Vancomicina IV de rutina","Doxiciclina"],"ans":1,"exp":"Las prótesis valvulares son de alto riesgo: profilaxis con amoxicilina 2 g antes de procedimientos dentales que manipulan encía o región periapical (clindamicina ya no se recomienda; con alergia, azitromicina o doxiciclina según la guía).","why":["Es de alto riesgo: sí la necesita.","","No es el esquema.","No es rutinaria.","Solo como alternativa en alergia a penicilina."],"ref":"AHA 2021 · ESC 2023 endocarditis"},{"topic":"tep","subj":"cardio","id":"tep-01","dif":1,"stem":"Mujer de 34 años con dolor pleurítico y disnea leve. FC 92, sin signos de TVP, sin antecedentes; TEP no es el diagnóstico más probable. Wells 0. ¿Siguiente paso?","opts":["Angio-TC de inmediato","Dímero D; si es negativo, se descarta TEP","Anticoagular empíricamente","Gammagrama V/Q","Ecocardiograma"],"ans":1,"exp":"Con probabilidad baja (Wells ≤4) se pide dímero D; un resultado negativo descarta TEP sin imagen. Solo si es positivo se pide angio-TC.","why":["Expone a radiación y contraste sin necesidad.","","Sin probabilidad alta no se anticoagula empíricamente.","No es el primer paso.","No diagnostica TEP en un paciente estable."],"ref":"ESC 2019 TEP"},{"topic":"tep","subj":"cardio","id":"tep-02","dif":1,"stem":"Hombre de 58 años, 10 días después de un reemplazo de cadera. Pierna derecha edematosa y dolorosa, disnea súbita, FC 112. Estable. Wells 7.5. ¿Siguiente paso?","opts":["Dímero D","Angio-TC pulmonar","Rx de tórax y alta","Prueba de esfuerzo","Troponinas seriadas"],"ans":1,"exp":"Con probabilidad alta (Wells >4), el dímero D no basta para descartar: se va directo a la angio-TC (y se puede iniciar anticoagulación mientras, si no hay contraindicación).","why":["Con probabilidad alta, un dímero D negativo no descarta.","","Peligroso.","Contraindicada.","No diagnostican TEP."],"ref":"ESC 2019 TEP"},{"topic":"tep","subj":"cardio","id":"tep-03","dif":2,"stem":"Mujer de 72 años con sospecha de TEP y probabilidad baja. Dímero D 620 µg/L (punto de corte habitual 500). ¿Cómo lo interpretas?","opts":["Positivo: angio-TC","Con el ajuste por edad (72 × 10 = 720 µg/L) es negativo: se descarta TEP","No se puede interpretar en mayores de 70","Siempre se pide angio-TC en mayores de 70","Requiere V/Q"],"ans":1,"exp":"El dímero D sube con la edad. En mayores de 50 años, el punto de corte ajustado (edad × 10 µg/L) mantiene la seguridad y evita estudios innecesarios (ADJUST-PE).","why":["Con el ajuste por edad es negativo.","","Sí se puede, con ajuste.","Con probabilidad baja y dímero ajustado negativo no hace falta.","No es necesaria."],"ref":"Righini M, et al. ADJUST-PE, JAMA 2014"},{"topic":"tep","subj":"cardio","id":"tep-04","dif":1,"stem":"Mujer con 20 semanas de embarazo y TEP confirmado, estable. ¿Anticoagulante?","opts":["Warfarina","Rivaroxabán","Heparina de bajo peso molecular","Dabigatrán","Aspirina"],"ans":2,"exp":"La HBPM no cruza la placenta y es el tratamiento de elección en el embarazo. La warfarina es teratogénica y los ACOD no se recomiendan.","why":["Teratogénica (embriopatía).","No recomendado en el embarazo.","","No recomendado en el embarazo.","No trata el TEP."],"ref":"ESC 2019 TEP · ASH 2018 embarazo"},{"topic":"tep","subj":"cardio","id":"tep-05","dif":2,"stem":"Mujer de 40 años con TEP y síndrome antifosfolípido triple positivo. ¿Anticoagulante de largo plazo?","opts":["Rivaroxabán","Apixabán","Warfarina con INR 2–3","Aspirina sola","Filtro de vena cava"],"ans":2,"exp":"En el síndrome antifosfolípido (sobre todo triple positivo), los ACOD tuvieron más eventos trombóticos que la warfarina (TRAPS). Se usa warfarina.","why":["Más trombosis en SAF triple positivo.","No recomendado en SAF de alto riesgo.","","Insuficiente.","Solo si no puede anticoagularse."],"ref":"Pengo V, et al. TRAPS, Blood 2018"},{"topic":"tep","subj":"cardio","id":"tep-06","dif":2,"stem":"Hombre de 65 años con TEP. PA 124/78, FC 104. Eco con VD dilatado y troponina elevada. sPESI 1. ¿Tratamiento?","opts":["Trombólisis sistémica inmediata","Anticoagulación con vigilancia estrecha; trombólisis de rescate si se descompensa","Alta con ACOD","Filtro de vena cava","Embolectomía quirúrgica"],"ans":1,"exp":"Riesgo intermedio-alto (estable con disfunción del VD y troponina alta). La trombólisis primaria no redujo mortalidad y aumentó hemorragias (PEITHO). Se anticoagula en un área monitorizada.","why":["No está indicada mientras esté estable.","","Requiere vigilancia hospitalaria.","Sin contraindicación para anticoagular no está indicado.","No hay inestabilidad."],"ref":"PEITHO, NEJM 2014 · ESC 2019"},{"topic":"tep","subj":"cardio","id":"tep-07","dif":1,"stem":"Hombre de 45 años con TEP 3 semanas después de una cirugía de rodilla, sin otros factores. ¿Duración de la anticoagulación?","opts":["6 semanas","3 meses","1 año obligatorio","De por vida","Solo durante la hospitalización"],"ans":1,"exp":"Un TEP provocado por un factor transitorio mayor (cirugía) tiene bajo riesgo de recurrencia: 3 meses de anticoagulación.","why":["Insuficiente.","","Excesivo sin otros factores.","Para TEP no provocado o factor persistente se considera.","Insuficiente."],"ref":"ESC 2019 · CHEST 2021"},{"topic":"tep","subj":"cardio","id":"tep-08","dif":2,"stem":"Mujer de 55 años con TEP sin factor desencadenante identificado, bajo riesgo de sangrado. Terminó 3 meses de apixabán. ¿Qué haces?","opts":["Suspender","Considerar anticoagulación extendida (indefinida) con reevaluación periódica","Cambiar a aspirina","Filtro de vena cava","Repetir angio-TC para decidir"],"ans":1,"exp":"El TEP no provocado tiene alto riesgo de recurrencia al suspender. Con bajo riesgo de sangrado se recomienda anticoagulación extendida (puede usarse dosis reducida de apixabán o rivaroxabán).","why":["El riesgo de recurrencia es alto.","","Menos eficaz que la anticoagulación.","No está indicado.","La imagen no define la duración."],"ref":"ESC 2019 · CHEST 2021"},{"topic":"tep","subj":"cardio","id":"tep-09","dif":1,"stem":"¿Cuál es el hallazgo electrocardiográfico más frecuente en el TEP?","opts":["S1Q3T3","Taquicardia sinusal","Fibrilación auricular","BRDHH","Elevación del ST en V1–V4"],"ans":1,"exp":"El S1Q3T3 es clásico pero poco frecuente. Lo que más se ve es taquicardia sinusal; los signos de sobrecarga del VD indican mayor gravedad.","why":["Es clásico pero poco sensible.","","Puede aparecer, pero es menos frecuente.","Sugiere sobrecarga del VD, pero es menos frecuente.","Sugiere IAM anterior."],"ref":"ESC 2019 TEP"},{"topic":"tep","subj":"cardio","id":"tep-10","dif":2,"stem":"Hombre de 70 años con ERC G4 y alergia grave al contraste yodado. Sospecha de TEP con Rx de tórax normal. ¿Estudio de imagen?","opts":["Angio-TC con premedicación obligatoria","Gammagrama de ventilación/perfusión","RM sin contraste como único estudio","Arteriografía pulmonar","Rx de tórax repetida"],"ans":1,"exp":"El gammagrama V/Q no usa contraste yodado y es útil con Rx de tórax normal. Un estudio normal descarta TEP; uno de alta probabilidad lo confirma.","why":["Riesgo de nefropatía y anafilaxia.","","No es el estudio validado.","Invasiva y con contraste.","No diagnostica TEP."],"ref":"ESC 2019 TEP"},{"topic":"sangrado","subj":"hemato","id":"sangrado-01","dif":1,"stem":"Mujer de 24 años con menorragia desde la menarca y epistaxis frecuentes. Su madre tiene lo mismo. Plaquetas 260,000, TP normal, TTPa 39 s (límite alto). ¿Diagnóstico más probable?","opts":["Hemofilia A","Enfermedad de von Willebrand","PTI","Déficit de vitamina K","Anticoagulante lúpico"],"ans":1,"exp":"Sangrado mucocutáneo + herencia autosómica dominante + plaquetas normales: enfermedad de von Willebrand tipo 1. El TTPa puede salir normal o algo prolongado porque el FvW protege al VIII.","why":["Es ligada al X y da hemartrosis.","","Las plaquetas son normales.","Prolongaría el TP.","Da trombosis, no sangrado."],"ref":"ASH/ISTH 2021 vWD"},{"topic":"sangrado","subj":"hemato","id":"sangrado-02","dif":1,"stem":"Niño de 8 años con hemartrosis de rodilla tras una caída menor. Un tío materno tenía lo mismo. Plaquetas normales, TP normal, TTPa prolongado que corrige con la prueba de mezcla. ¿Qué déficit es más probable?","opts":["Factor VII","Factor VIII","Factor XII","Fibrinógeno","Factor XIII"],"ans":1,"exp":"Hemartrosis + herencia por línea materna (ligada al X) + TTPa ↑ que corrige: hemofilia. La A (VIII) es ~4 veces más frecuente que la B (IX).","why":["Prolongaría el TP.","","Prolonga el TTPa pero no da sangrado.","Prolongaría TP y TTPa.","TP y TTPa normales."],"ref":"WFH 2020"},{"topic":"sangrado","subj":"hemato","id":"sangrado-03","dif":2,"stem":"Mujer de 35 años con confusión, petequias y orina oscura. Hb 7.8, plaquetas 14,000, esquistocitos abundantes, LDH 1,600, haptoglobina indetectable, creatinina 1.4, TP y TTPa normales. ¿Siguiente paso?","opts":["Transfundir plaquetas","Recambio plasmático urgente + glucocorticoides","Esperar el resultado de ADAMTS13","IgIV sola","Heparina"],"ans":1,"exp":"Anemia microangiopática + trombocitopenia + afección neurológica con coagulación normal: PTT. Se inicia recambio plasmático sin esperar ADAMTS13 (el plasma repone la enzima y retira los autoanticuerpos). Se agrega caplacizumab si está disponible.","why":["Puede empeorar la trombosis.","","El retraso aumenta la mortalidad.","No es el tratamiento del PTT.","No está indicada; aumenta el sangrado."],"ref":"ISTH 2020 TTP"},{"topic":"sangrado","subj":"hemato","id":"sangrado-04","dif":2,"stem":"Hombre de 66 años en el día 7 de heparina no fraccionada tras una cirugía de cadera. Plaquetas bajaron de 240,000 a 90,000 y tiene trombosis venosa profunda nueva. ¿Qué haces?","opts":["Cambiar a enoxaparina","Suspender toda heparina e iniciar argatrobán","Iniciar warfarina de inmediato","Transfundir plaquetas","Continuar la heparina a menor dosis"],"ans":1,"exp":"HIT con alta probabilidad (4T alto). Se suspende toda heparina, incluida la HBPM, y se usa un anticoagulante no heparínico. La warfarina se inicia hasta que las plaquetas se recuperan (riesgo de necrosis cutánea y gangrena venosa).","why":["La HBPM tiene reacción cruzada.","","Puede causar gangrena venosa al inicio.","Aumenta la trombosis.","Mantiene el estímulo."],"ref":"ASH 2018 HIT"},{"topic":"sangrado","subj":"hemato","id":"sangrado-05","dif":2,"stem":"Paciente con choque séptico y sangrado por sitios de punción. Plaquetas 42,000, TP y TTPa prolongados, fibrinógeno 80 mg/dL, dímero D muy alto. ¿Diagnóstico y medida principal?","opts":["PTI; prednisona","CID; tratar la sepsis y reponer componentes porque sangra","Hemofilia adquirida; factor VIII","PTT; recambio plasmático","HIT; argatrobán"],"ans":1,"exp":"CID: consumo de plaquetas y factores con fibrinólisis (fibrinógeno ↓, dímero D ↑). Se trata la causa; como sangra, se transfunden plaquetas, plasma y crioprecipitado (fibrinógeno).","why":["El PTI no prolonga TP/TTPa.","","Solo prolongaría el TTPa.","En el PTT la coagulación es normal.","No hay exposición a heparina."],"ref":"ISTH CID"},{"topic":"sangrado","subj":"hemato","id":"sangrado-06","dif":1,"stem":"Mujer de 30 años con petequias. Plaquetas 18,000; el resto de la BH y el frotis son normales salvo plaquetas grandes. No sangra activamente. ¿Tratamiento inicial?","opts":["Observación sin tratamiento","Glucocorticoides (prednisona o dexametasona)","Esplenectomía","Transfusión de plaquetas","Rituximab"],"ans":1,"exp":"PTI con plaquetas \u003c30,000: primera línea glucocorticoides (± IgIV si se necesita respuesta rápida). Esplenectomía, rituximab y agonistas de TPO son segunda línea.","why":["Con \u003c30,000 se trata.","","Segunda línea.","Solo en sangrado grave o procedimiento.","Segunda línea."],"ref":"ASH 2019 PTI"},{"topic":"sangrado","subj":"hemato","id":"sangrado-07","dif":2,"stem":"Hombre con fibrilación auricular en warfarina llega con hemorragia intracraneal. INR 4.2. ¿Qué das?","opts":["Solo suspender warfarina","Vitamina K 10 mg IV + concentrado de complejo protrombínico de 4 factores","Protamina","Idarucizumab","Vitamina K oral"],"ans":1,"exp":"Sangrado que amenaza la vida: el concentrado de complejo protrombínico corrige el INR en minutos y la vitamina K IV mantiene el efecto (la vida media del concentrado es corta).","why":["Tardaría días.","","Revierte heparina.","Revierte dabigatrán.","Demasiado lenta para un sangrado grave."],"ref":"ACC 2020 Expert Consensus on Bleeding"},{"topic":"sangrado","subj":"hemato","id":"sangrado-08","dif":3,"stem":"Mujer de 70 años sin antecedentes de sangrado presenta hematomas extensos en brazos y muslo. TP normal, TTPa 68 s, no corrige con la prueba de mezcla incubada 2 horas. Plaquetas normales. ¿Diagnóstico más probable?","opts":["Hemofilia A congénita","Hemofilia A adquirida (inhibidor del factor VIII)","Déficit de vitamina K","Von Willebrand tipo 1","Anticoagulante lúpico"],"ans":1,"exp":"Sangrado nuevo en adulto mayor + TTPa ↑ que no corrige (sobre todo tras incubar) = autoanticuerpo contra el VIII. Se asocia a edad, posparto, autoinmunidad y cáncer. Se trata con agentes de bypass (factor VII activado) e inmunosupresión.","why":["No debutaría a los 70 y la mezcla corregiría.","","Prolongaría el TP y corregiría.","La mezcla corregiría.","No corrige, pero causa trombosis, no hematomas."],"ref":"International recommendations on acquired hemophilia A, 2020"},{"topic":"sangrado","subj":"hemato","id":"sangrado-09","dif":2,"stem":"Hombre con ERC en diálisis tiene sangrado prolongado por el sitio de una biopsia renal. Plaquetas, TP y TTPa normales. ¿Qué fármaco ayuda?","opts":["Vitamina K","Desmopresina","Heparina","Plasma fresco","Protamina"],"ans":1,"exp":"La uremia causa disfunción plaquetaria con conteo normal. La desmopresina libera FvW del endotelio y mejora la adhesión plaquetaria; la diálisis también ayuda.","why":["La vía de la coagulación está normal.","","Empeora el sangrado.","Los factores están normales.","No hay heparina que revertir."],"ref":"Harrison 21e"},{"topic":"sangrado","subj":"hemato","id":"sangrado-10","dif":1,"stem":"Un paciente con TTPa prolongado no tiene ningún antecedente de sangrado y le extraen una muela sin problemas. La prueba de mezcla corrige. ¿Qué déficit explica el hallazgo?","opts":["Factor VIII","Factor IX","Factor XII","Factor XI","Factor de von Willebrand"],"ans":2,"exp":"El déficit de factor XII prolonga mucho el TTPa in vitro pero no causa sangrado (in vivo la coagulación se inicia por la vía del factor tisular).","why":["Daría hemofilia A con sangrado.","Daría hemofilia B con sangrado.","","El XI sí puede sangrar, sobre todo en cirugía.","Da sangrado mucocutáneo."],"ref":"Harrison 21e"},{"topic":"hemoliticas","subj":"hemato","id":"hemoliticas-01","dif":1,"stem":"Hombre de 22 años con ictericia y orina oscura dos días después de recibir nitrofurantoína. Frotis con células mordidas. Coombs negativo. ¿Diagnóstico más probable?","opts":["Esferocitosis hereditaria","Déficit de G6PD","AHAI caliente","PTT","Drepanocitosis"],"ans":1,"exp":"Hemólisis intravascular aguda tras un fármaco oxidante en un hombre, con células mordidas (los macrófagos retiran los cuerpos de Heinz): déficit de G6PD.","why":["Daría esferocitos y es crónica.","","Coombs sería positivo.","Habría esquistocitos y plaquetas bajas.","Habría drepanocitos."],"ref":"Harrison 21e"},{"topic":"hemoliticas","subj":"hemato","id":"hemoliticas-02","dif":1,"stem":"Joven de 18 años con anemia leve, esplenomegalia, cálculos biliares y antecedente familiar similar. Esferocitos, CHCM 37, Coombs negativo. ¿Diagnóstico?","opts":["AHAI caliente","Esferocitosis hereditaria","Talasemia menor","Déficit de G6PD","HPN"],"ans":1,"exp":"Esferocitos con Coombs negativo, CHCM alta, herencia y esplenomegalia: esferocitosis hereditaria (defecto de espectrina o anquirina).","why":["Coombs sería positivo.","","Microcítica con CHCM normal o baja.","Daría crisis tras oxidantes.","Hemólisis intravascular con trombosis."],"ref":"Harrison 21e"},{"topic":"hemoliticas","subj":"hemato","id":"hemoliticas-03","dif":2,"stem":"Mujer de 34 años con LES presenta Hb 7, reticulocitos 9%, LDH alta, esferocitos y Coombs directo positivo para IgG. ¿Tratamiento de primera línea?","opts":["Esplenectomía","Prednisona 1 mg/kg/día","Recambio plasmático","Evitar el frío","Eculizumab"],"ans":1,"exp":"AHAI caliente (IgG) secundaria a LES: glucocorticoides en primera línea; rituximab si no responde o recae.","why":["Tercera línea.","","No es eficaz en AHAI caliente.","Es para crioaglutininas.","Es para HPN."],"ref":"Jäger U, et al. Blood Rev 2020"},{"topic":"hemoliticas","subj":"hemato","id":"hemoliticas-04","dif":2,"stem":"Hombre de 28 años convaleciente de neumonía por Mycoplasma presenta anemia hemolítica con acrocianosis al salir al frío. Coombs positivo para C3. ¿Tipo de anticuerpo?","opts":["IgG caliente","IgM fría (crioaglutinina)","IgA","IgE","Anticuerpo anti-ADAMTS13"],"ans":1,"exp":"Las crioaglutininas son IgM que se unen al eritrocito en el frío y fijan complemento (C3). Asociadas a Mycoplasma, mononucleosis y linfomas.","why":["Daría Coombs IgG y no empeora con frío.","","No es la causa típica.","No causa hemólisis.","Causa PTT."],"ref":"Harrison 21e"},{"topic":"hemoliticas","subj":"hemato","id":"hemoliticas-05","dif":3,"stem":"Mujer de 32 años con anemia hemolítica Coombs negativo, orina oscura por las mañanas, pancitopenia leve y trombosis de venas hepáticas (Budd-Chiari). ¿Estudio diagnóstico?","opts":["Electroforesis de hemoglobina","Citometría de flujo para CD55/CD59","Fragilidad osmótica","ADAMTS13","Biopsia hepática"],"ans":1,"exp":"Hemólisis intravascular + trombosis en sitio atípico + citopenias: hemoglobinuria paroxística nocturna. La citometría muestra pérdida de proteínas ancladas a GPI (CD55, CD59).","why":["Es para hemoglobinopatías.","","Es para esferocitosis.","Es para PTT.","No hace el diagnóstico."],"ref":"Hill A, Nat Rev Dis Primers 2017"},{"topic":"hemoliticas","subj":"hemato","id":"hemoliticas-06","dif":2,"stem":"¿Qué hallazgo apoya más una hemólisis intravascular que extravascular?","opts":["Esplenomegalia","Hemoglobinuria con hemosiderinuria","Esferocitos","Litiasis biliar","Bilirrubina indirecta elevada"],"ans":1,"exp":"La hemoglobina libre filtra al riñón cuando se satura la haptoglobina: hemoglobinuria y, días después, hemosiderinuria. La esplenomegalia y los esferocitos apuntan a destrucción extravascular.","why":["Es típica de la extravascular.","","Típicos de extravascular.","Más típica de la extravascular crónica.","Ocurre en ambas."],"ref":"Harrison 21e"},{"topic":"hemoliticas","subj":"hemato","id":"hemoliticas-07","dif":2,"stem":"Hombre de 26 años con déficit de G6PD conocido. Tuvo una crisis hace 3 días y le midieron G6PD: sale normal. ¿Cómo interpretas?","opts":["Se descarta el déficit","Falso normal: los reticulocitos tienen más G6PD; repetir en 2–3 meses","Error del laboratorio; repetir hoy","Es HPN","Es esferocitosis"],"ans":1,"exp":"Tras una crisis, los eritrocitos viejos (con menos enzima) se destruyen y quedan reticulocitos con más G6PD: la medición sale falsamente normal. Se repite cuando pasa la reticulocitosis.","why":["El contexto explica el resultado.","","Repetirlo pronto da el mismo error.","No hay datos de HPN.","No hay datos de esferocitosis."],"ref":"Luzzatto L. Lancet 2008"},{"topic":"hemoliticas","subj":"hemato","id":"hemoliticas-08","dif":1,"stem":"Paciente con válvula aórtica mecánica presenta anemia con esquistocitos, LDH alta y plaquetas normales. ¿Mecanismo?","opts":["Autoinmune","Hemólisis mecánica (traumática) por la prótesis","Déficit de B12","Déficit de G6PD","Hiperesplenismo"],"ans":1,"exp":"El flujo turbulento a través de la prótesis (sobre todo con fuga paravalvular) fragmenta eritrocitos: hemólisis intravascular con esquistocitos.","why":["Coombs sería positivo y habría esferocitos.","","Sería macrocítica.","Daría células mordidas.","No da esquistocitos."],"ref":"Harrison 21e"},{"topic":"hemoliticas","subj":"hemato","id":"hemoliticas-09","dif":2,"stem":"Niño con esferocitosis hereditaria presenta de repente Hb 4.5 con reticulocitos 0.2% tras un cuadro de fiebre y exantema en mejillas. ¿Causa?","opts":["Crisis hemolítica por infección bacteriana","Crisis aplásica por parvovirus B19","Secuestro esplénico","Déficit de hierro","AHAI sobreagregada"],"ans":1,"exp":"El parvovirus B19 infecta precursores eritroides y detiene la eritropoyesis por 1–2 semanas. En hemólisis crónica, eso causa anemia grave con reticulocitos muy bajos.","why":["Tendría reticulocitos altos.","","Tendría esplenomegalia aguda y reticulocitos altos.","No explica la caída brusca.","Tendría reticulocitos altos."],"ref":"Harrison 21e"},{"topic":"hemoliticas","subj":"hemato","id":"hemoliticas-10","dif":3,"stem":"Paciente con HPN que iniciará eculizumab. ¿Qué medida es obligatoria antes?","opts":["Vacuna contra meningococo","Esplenectomía","Profilaxis con TMP-SMX","Anticoagulación con heparina","Ácido fólico en dosis altas"],"ans":0,"exp":"El eculizumab bloquea C5; sin el complejo de ataque de membrana aumenta mucho el riesgo de infección por Neisseria meningitidis. Se vacuna (ACWY y B) y a menudo se da profilaxis antibiótica.","why":["","No está indicada.","Es para Pneumocystis.","No es requisito para iniciar.","Es complementario, no obligatorio para iniciar."],"ref":"Ficha técnica de eculizumab"},{"topic":"leucemias","subj":"hemato","id":"leucemias-01","dif":2,"stem":"Hombre de 38 años con gingivorragia y equimosis. Hb 8, plaquetas 18,000, leucocitos 2,100. TP y TTPa prolongados, fibrinógeno 90, dímero D alto. Frotis con promielocitos cargados de bastones de Auer. ¿Qué haces primero?","opts":["Esperar el resultado de PML::RARA","Iniciar ácido transretinoico (ATRA) de inmediato y soporte de la coagulopatía","Heparina para la CID","Inducción “7+3” sin ATRA","Esplenectomía"],"ans":1,"exp":"LPA con CID: la principal causa de muerte temprana es la hemorragia. Se inicia ATRA con la sospecha y se repone plaquetas y fibrinógeno.","why":["El retraso aumenta la mortalidad por sangrado.","","No se usa en la CID de la LPA.","La LPA se trata con ATRA ± arsénico.","No tiene papel."],"ref":"ELN APL 2019"},{"topic":"leucemias","subj":"hemato","id":"leucemias-02","dif":2,"stem":"Al quinto día de ATRA, el paciente con LPA presenta fiebre, disnea, infiltrados pulmonares, derrame pleural y aumento de 4 kg. ¿Diagnóstico y manejo?","opts":["Neumonía; solo antibióticos","Síndrome de diferenciación; dexametasona","Edema por IC; solo diuréticos","Leucostasis; leucoféresis","Toxicidad por arsénico; suspender todo"],"ans":1,"exp":"El síndrome de diferenciación aparece en días a semanas tras ATRA o arsénico. Se trata con dexametasona 10 mg cada 12 h; se suspende temporalmente el fármaco solo si es grave.","why":["No explica el aumento de peso ni el contexto.","","No explica la fiebre ni el contexto.","No es la causa en este momento.","No se suspende de entrada."],"ref":"ELN APL 2019"},{"topic":"leucemias","subj":"hemato","id":"leucemias-03","dif":1,"stem":"Niño de 4 años con palidez, petequias, dolor óseo y hepatoesplenomegalia. Blastos TdT+, CD10+, CD19+. ¿Diagnóstico?","opts":["LMA","LLA de precursores B","LLC","Linfoma de Hodgkin","Neuroblastoma"],"ans":1,"exp":"TdT marca blastos linfoides inmaduros; CD10 y CD19 indican estirpe B. Es la leucemia más común en la infancia.","why":["Sería mieloperoxidasa positiva.","","Es de adultos mayores y con células maduras.","No es leucemia.","No expresa estos marcadores."],"ref":"OMS 2022"},{"topic":"leucemias","subj":"hemato","id":"leucemias-04","dif":2,"stem":"Hombre de 70 años con LMA de diagnóstico reciente, ECOG 3 y car

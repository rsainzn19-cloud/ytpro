cb>Anemia (OMS)\u003c/b>: Hb &lt;13 g/dL en hombres, &lt;12 en mujeres no embarazadas (&lt;11 en el embarazo).\u003c/li>\n\u003cli>\u003cb>Índice reticulocitario\u003c/b> = reticulocitos (%) × (Hto/45) ÷ factor de maduración. &lt;2: la médula no produce (hipoproliferativa). &gt;2–3: produce bien (hemólisis o sangrado).\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>Microcítica (VCM &lt;80)\u003c/th>\u003cth>Normocítica\u003c/th>\u003cth>Macrocítica (VCM &gt;100)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Ferropénica, talasemia, inflamación (a veces), sideroblástica, plomo\u003c/td>\u003ctd>Inflamación, ERC, hemólisis, sangrado agudo, falla medular\u003c/td>\u003ctd>Megaloblástica: B12, folato, fármacos (metotrexato, hidroxiurea, zidovudina, trimetoprim). No megaloblástica: alcohol, hepatopatía, hipotiroidismo, SMD, reticulocitosis\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>"},{"h":"Ferropénica","html":"\n\u003cul>\n\u003cli>La más común del mundo. Causas: sangrado (menstrual, digestivo), embarazo, malabsorción (celiaca, bariátrica, gastritis atrófica, H. pylori), dieta.\u003c/li>\n\u003cli>\u003cb>Laboratorio\u003c/b>: ferritina &lt;30 ng/mL (con inflamación puede ser ferropenia hasta &lt;100), hierro bajo, transferrina/TIBC alta, saturación &lt;20%, ADE alta, trombocitosis reactiva.\u003c/li>\n\u003cli>\u003cb>Clínica\u003c/b>: pica (hielo = pagofagia), coiloniquia, queilitis, glositis, piernas inquietas. Plummer-Vinson: disfagia por membranas esofágicas (riesgo de cáncer escamoso).\u003c/li>\n\u003cli>\u003cb>Tratamiento\u003c/b>: hierro oral una vez al día o en días alternos (mejor absorción por la hepcidina), lejos de calcio, té e IBP. Reticulocitos suben en 7–10 días y la Hb ~1–2 g/dL en 3–4 semanas. Seguir 3 meses después de normalizar la Hb.\u003c/li>\n\u003cli>\u003cb>Hierro IV\u003c/b>: intolerancia, malabsorción (bypass gástrico, celiaca, EII), pérdidas continuas, ERC, tercer trimestre.\u003c/li>\n\u003cli>\u003cb>Busca la causa\u003c/b>: en hombres y mujeres posmenopáusicas, endoscopia alta y colonoscopia.\u003c/li>\n\u003c/ul>"},{"h":"Anemia de inflamación y talasemia","html":"\n\u003cul>\n\u003cli>\u003cb>Inflamación\u003c/b>: la IL-6 sube la hepcidina, que bloquea la ferroportina: el hierro queda atrapado en macrófagos y enterocitos. Ferritina normal o alta, TIBC baja, saturación baja. Normocítica (a veces microcítica leve). Se trata la causa.\u003c/li>\n\u003cli>\u003cb>β-talasemia menor (rasgo)\u003c/b>: microcitosis marcada (VCM ~60–70) con Hb casi normal y eritrocitos normales o aumentados; \u003cb>índice de Mentzer (VCM ÷ eritrocitos en millones) &lt;13\u003c/b>; ferritina normal; células en diana y punteado basófilo. Electroforesis: HbA2 &gt;3.5%. No requiere hierro.\u003c/li>\n\u003cli>\u003cb>α-talasemia rasgo\u003c/b>: electroforesis normal en adultos; diagnóstico genético o por exclusión.\u003c/li>\n\u003cli>\u003cb>β-talasemia mayor\u003c/b>: anemia grave desde los 6 meses, hepatoesplenomegalia, cambios óseos; transfusiones con quelación de hierro.\u003c/li>\n\u003c/ul>"},{"h":"Megaloblástica: B12 y folato","html":"\n\u003cul>\n\u003cli>\u003cb>B12\u003c/b>: anemia perniciosa (anticuerpos anti-factor intrínseco y anti-células parietales; gastritis atrófica autoinmune, más riesgo de cáncer gástrico), gastrectomía o bypass, resección ileal o Crohn, metformina, IBP crónicos, dieta vegana.\u003c/li>\n\u003cli>\u003cb>Clínica de B12\u003c/b>: anemia + \u003cb>neuropatía\u003c/b> (degeneración combinada subaguda: cordones posteriores y laterales → pérdida de vibración y posición, ataxia, Romberg +, Babinski), deterioro cognitivo, glositis.\u003c/li>\n\u003cli>\u003cb>Laboratorio\u003c/b>: VCM &gt;100, neutrófilos hipersegmentados (≥6 lóbulos), LDH y bilirrubina indirecta altas (hemólisis intramedular), a veces pancitopenia. Ácido metilmalónico y homocisteína altos en B12; en folato solo la homocisteína.\u003c/li>\n\u003cli>\u003cb>Folato\u003c/b>: dieta pobre, alcohol, embarazo, metotrexato, trimetoprim, fenitoína, hemólisis crónica. Sin neuropatía.\u003c/li>\n\u003cli>\u003cb>Tratamiento\u003c/b>: B12 IM (o oral a dosis altas); folato oral. \u003cb>Nunca des solo folato si hay déficit de B12\u003c/b>: mejora la anemia pero progresa la neuropatía. Vigila hipokalemia al inicio.\u003c/li>\n\u003c/ul>"},{"h":"Otras pistas y transfusión","html":"\n\u003cul>\n\u003cli>\u003cb>Sideroblástica\u003c/b>: sideroblastos en anillo (tinción de Perls); alcohol, plomo, isoniazida (déficit de B6), déficit de cobre, SMD. Isoniazida → piridoxina.\u003c/li>\n\u003cli>\u003cb>Plomo\u003c/b>: microcítica con punteado basófilo, dolor abdominal, neuropatía (muñeca caída), línea de Burton en encías. En México: loza de barro vidriado, reciclaje de baterías.\u003c/li>\n\u003cli>\u003cb>Alcohol\u003c/b>: macrocitosis sin hipersegmentación, GGT alta.\u003c/li>\n\u003cli>\u003cb>Transfusión\u003c/b>: umbral restrictivo Hb &lt;7 g/dL (≈8 con enfermedad cardiovascular o cirugía cardiaca u ortopédica). Cada unidad sube ~1 g/dL.\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"Microcítica: “TICS”","d":"Talasemia · Inflamación (enfermedad crónica) · Carencia de hierro (ferropenia) · Sideroblástica (y plomo). Para separar ferropenia de talasemia: Mentzer \u003c13 = talasemia."},"pearl":"La ferritina es el mejor estudio aislado para ferropenia: \u003c30 ng/mL la confirma. Pero es reactante de fase aguda: con inflamación, hasta 100 puede seguir siendo ferropenia.","trap":"Dar folato a un paciente con déficit de B12: la Hb mejora y la neuropatía sigue avanzando, a veces de forma irreversible. Mide B12 antes o da ambas.","guide":["Hierro oral en días alternos: estudios recientes muestran mejor absorción que dar varias dosis al día (la hepcidina sube tras cada dosis). Algunas guías siguen indicando una dosis diaria; ambas son correctas, lo que no conviene es repartirlo en 2–3 tomas."],"refs":["Ko CW, et al. AGA Clinical Practice Guidelines on the Gastrointestinal Evaluation of Iron Deficiency Anemia. Gastroenterology 2020.","Stabler SP. Vitamin B12 Deficiency. N Engl J Med 2013.","Camaschella C. Iron-Deficiency Anemia. N Engl J Med 2015."]},"stda":{"hook":"Úlcera = H. pylori o AINE hasta demostrar lo contrario. En el sangrado: reanima, IBP, endoscopia en 24 h y decide según Forrest.","anim":"stda","compare":["duodenal-gastrica"],"nn":[["gi-bleed-etiology-pathophysiology-clinical-features-diagnosis-treatment","GI Bleed"],["stomach-disorders","Stomach Disorders"]],"yt":"peptic ulcer disease H pylori","sections":[{"h":"Úlcera péptica","html":"\n\u003cul>\n\u003cli>\u003cb>Causas\u003c/b>: \u003ci>H. pylori\u003c/i> y AINE/aspirina (la gran mayoría); también estrés en terapia intensiva, tabaco, Zollinger-Ellison, cáncer.\u003c/li>\n\u003cli>\u003cb>Duodenal\u003c/b>: más frecuente; el dolor mejora al comer y regresa 2–3 h después o de noche.\u003c/li>\n\u003cli>\u003cb>Gástrica\u003c/b>: el dolor empeora al comer, hay pérdida de peso; se biopsia siempre (cáncer) y se confirma su cicatrización.\u003c/li>\n\u003cli>\u003cb>Zollinger-Ellison\u003c/b> (gastrinoma): úlceras múltiples, refractarias o más allá del duodeno, diarrea. Gastrina en ayuno alta (sin IBP) y prueba de secretina. Asociado a MEN1.\u003c/li>\n\u003cli>\u003cb>AINE\u003c/b>: inhiben la COX-1 → menos prostaglandinas protectoras. Riesgo mayor con edad &gt;65, úlcera previa, dosis altas, anticoagulantes, esteroides o ISRS. Prevención: IBP (o misoprostol); en muy alto riesgo, celecoxib + IBP. Erradica \u003ci>H. pylori\u003c/i> antes de un AINE crónico.\u003c/li>\n\u003c/ul>"},{"h":"Helicobacter pylori","html":"\n\u003cul>\n\u003cli>Bacilo gramnegativo con ureasa. Causa gastritis, úlcera, adenocarcinoma gástrico y linfoma MALT.\u003c/li>\n\u003cli>\u003cb>Diagnóstico sin endoscopia\u003c/b>: prueba de aliento con urea o antígeno en heces (suspender IBP 2 semanas y antibióticos o bismuto 4 semanas antes). \u003cb>Con endoscopia\u003c/b>: prueba rápida de ureasa, histología, cultivo. La serología no distingue infección activa: no sirve para confirmar curación.\u003c/li>\n\u003cli>\u003cb>Tratamiento de primera línea\u003c/b>: \u003cb>cuádruple con bismuto por 14 días\u003c/b> (IBP + bismuto + tetraciclina + metronidazol), sobre todo donde hay resistencia a claritromicina, como en México.\u003c/li>\n\u003cli>Triple con claritromicina solo si se sabe que la cepa es sensible. Alternativas: vonoprazán + amoxicilina, o esquemas con rifabutina.\u003c/li>\n\u003cli>\u003cb>Confirmar erradicación\u003c/b> ≥4 semanas después del tratamiento (aliento o antígeno fecal), sin IBP 2 semanas antes.\u003c/li>\n\u003c/ul>"},{"h":"Complicaciones de la úlcera","html":"\n\u003cul>\n\u003cli>\u003cb>Sangrado\u003c/b>: la más común. Una úlcera duodenal posterior puede erosionar la arteria gastroduodenal.\u003c/li>\n\u003cli>\u003cb>Perforación\u003c/b>: dolor súbito intenso, abdomen en tabla, aire libre subdiafragmático en Rx de tórax de pie → cirugía.\u003c/li>\n\u003cli>\u003cb>Obstrucción pilórica\u003c/b>: vómito de alimento no digerido, chapoteo gástrico, alcalosis metabólica hipoclorémica e hipokalémica.\u003c/li>\n\u003cli>\u003cb>Penetración\u003c/b> a páncreas: dolor que se irradia a la espalda y amilasa alta.\u003c/li>\n\u003c/ul>"},{"h":"Sangrado de tubo digestivo alto no variceal","html":"\n\u003cul>\n\u003cli>Hematemesis, “posos de café”, melena; BUN/Cr &gt;30 sugiere origen alto.\u003c/li>\n\u003cli>\u003cb>Reanimación\u003c/b>: dos vías gruesas, cristaloides, transfundir con Hb &lt;7 (≈8 con enfermedad cardiovascular).\u003c/li>\n\u003cli>\u003cb>Glasgow-Blatchford\u003c/b> 0–1: puede manejarse de forma ambulatoria. Calculadora en Más → Calculadoras.\u003c/li>\n\u003cli>\u003cb>IBP IV\u003c/b> (bolo y dosis altas), \u003cb>eritromicina IV\u003c/b> 30–120 min antes de la endoscopia para vaciar el estómago.\u003c/li>\n\u003cli>\u003cb>Endoscopia en ≤24 h\u003c/b> tras reanimar (hacerla en &lt;6 h no reduce la mortalidad).\u003c/li>\n\u003cli>No uses sonda nasogástrica de rutina ni ácido tranexámico (HALT-IT).\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>Forrest\u003c/th>\u003cth>Hallazgo\u003c/th>\u003cth>Riesgo\u003c/th>\u003cth>Conducta\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Ia\u003c/td>\u003ctd>Sangrado en chorro\u003c/td>\u003ctd>Alto\u003c/td>\u003ctd rowspan=\"3\">Terapia endoscópica dual (adrenalina + térmica o clips) + IBP a dosis altas 72 h\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Ib\u003c/td>\u003ctd>Sangrado en capa\u003c/td>\u003ctd>Alto\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>IIa\u003c/td>\u003ctd>Vaso visible\u003c/td>\u003ctd>Alto\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>IIb\u003c/td>\u003ctd>Coágulo adherido\u003c/td>\u003ctd>Intermedio\u003c/td>\u003ctd>Remover el coágulo y tratar lo que haya debajo\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>IIc\u003c/td>\u003ctd>Base pigmentada\u003c/td>\u003ctd>Bajo\u003c/td>\u003ctd rowspan=\"2\">IBP oral, dieta temprana, alta pronto\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>III\u003c/td>\u003ctd>Base limpia\u003c/td>\u003ctd>Bajo\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>La adrenalina sola no basta: siempre combinada.\u003c/li>\n\u003cli>\u003cb>Resangrado\u003c/b>: segunda endoscopia; si falla, embolización por radiología intervencionista; cirugía si no hay otra opción.\u003c/li>\n\u003cli>\u003cb>Aspirina en prevención secundaria\u003c/b>: reanudarla pronto (de inmediato si la úlcera es de bajo riesgo; hacia el día 3 si fue de alto riesgo), con IBP. Los AINE se suspenden.\u003c/li>\n\u003cli>Otras causas: Mallory-Weiss (desgarro tras vómito, se autolimita), Boerhaave (perforación esofágica: dolor torácico, enfisema, mediastinitis).\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"Forrest: “1 sangra, 2 avisa, 3 limpia”","d":"Forrest I: sangrado activo (a chorro o en capa). Forrest II: estigmas que avisan (vaso visible, coágulo, base pigmentada). Forrest III: base limpia. Ia, Ib y IIa se tratan con terapia endoscópica dual."},"pearl":"Para confirmar la erradicación de H. pylori pide prueba de aliento o antígeno fecal ≥4 semanas después, sin IBP las 2 semanas previas. La serología se queda positiva y no sirve.","trap":"Triple esquema con claritromicina por 7 días en México: alta resistencia. La respuesta esperada suele ser la cuádruple con bismuto por 14 días.","guide":["Primera línea para H. pylori: ACG 2024 prefiere la cuádruple con bismuto y deja la triple con claritromicina para cepas sensibles. El consenso mexicano también recomienda esquemas cuádruples por la resistencia local. ⚠️ Si tu profesor enseña otra combinación, apréndete esa para el examen.","Momento de la endoscopia: ACG y ESGE coinciden en ≤24 h; la ESGE pide \u003c12 h en pacientes de muy alto riesgo que siguen inestables."],"refs":["Laine L, et al. ACG Clinical Guideline: Upper Gastrointestinal and Ulcer Bleeding. Am J Gastroenterol 2021.","Chey WD, et al. ACG Clinical Guideline: Treatment of Helicobacter pylori Infection. Am J Gastroenterol 2024.","Gralnek IM, et al. ESGE Guideline: endoscopic diagnosis and management of nonvariceal upper GI hemorrhage. Endoscopy 2021.","Bosques-Padilla FJ, et al. IV consenso mexicano sobre Helicobacter pylori. Rev Gastroenterol Méx 2018."]},"pancrea":{"hook":"Diagnóstico con 2 de 3, gravedad con Atlanta revisada, líquidos moderados con Ringer lactato, comida temprana y nada de antibióticos “por si acaso”.","anim":"pancrea","compare":["biliar-alcohol"],"nn":[["acute-pancreatitis-etiology-pathophysiology-clinical-features-diagnosis-treatment","Acute Pancreatitis"]],"yt":"acute pancreatitis","sections":[{"h":"Causas","html":"\n\u003cul>\n\u003cli>\u003cb>Litiasis biliar\u003c/b> (la primera) y \u003cb>alcohol\u003c/b> (la segunda).\u003c/li>\n\u003cli>\u003cb>Hipertrigliceridemia\u003c/b> (habitualmente &gt;1 000 mg/dL), \u003cb>post-CPRE\u003c/b>, hipercalcemia (hiperparatiroidismo), fármacos (azatioprina, valproato, didanosina, estrógenos, tiazidas), trauma, tumores (IPMN), autoinmune (IgG4), genética, infecciones (parotiditis).\u003c/li>\n\u003cli>Pista biliar: ALT &gt;150 U/L en las primeras 48 h y litos en el USG.\u003c/li>\n\u003c/ul>\n\u003cp>Mnemotecnia en inglés: \u003cb>I GET SMASHED\u003c/b> (Idiopathic, Gallstones, Ethanol, Trauma, Steroids, Mumps, Autoimmune, Scorpion, Hypercalcemia/Hypertriglyceridemia, ERCP, Drugs).\u003c/p>"},{"h":"Diagnóstico (2 de 3)","html":"\n\u003col>\n\u003cli>Dolor epigástrico típico, intenso, irradiado en cinturón a la espalda.\u003c/li>\n\u003cli>Lipasa o amilasa ≥3 veces el límite superior (la lipasa es más específica y dura más días).\u003c/li>\n\u003cli>Imagen compatible.\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>\u003cb>USG abdominal a todos\u003c/b> para buscar litiasis.\u003c/li>\n\u003cli>\u003cb>TC con contraste\u003c/b> solo si hay duda diagnóstica o si no mejora en 48–72 h (la necrosis se ve mejor después de 72 h).\u003c/li>\n\u003cli>El nivel de lipasa no predice la gravedad.\u003c/li>\n\u003cli>Signos de Grey Turner (flancos) y Cullen (periumbilical): hemorragia retroperitoneal.\u003c/li>\n\u003cli>Pide TG y calcio para buscar causa.\u003c/li>\n\u003c/ul>"},{"h":"Gravedad (Atlanta revisada 2012)","html":"\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>Grado\u003c/th>\u003cth>Definición\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Leve\u003c/td>\u003ctd>Sin falla orgánica ni complicaciones locales o sistémicas\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Moderadamente grave\u003c/td>\u003ctd>Falla orgánica transitoria (&lt;48 h) y/o complicaciones locales o sistémicas\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Grave\u003c/td>\u003ctd>Falla orgánica persistente (&gt;48 h)\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>Falla orgánica: Marshall modificado ≥2 en sistema respiratorio, renal o cardiovascular.\u003c/li>\n\u003cli>Predictores tempranos de gravedad: SRIS persistente, BUN alto o en aumento, hematocrito &gt;44% o en aumento, edad avanzada, obesidad, \u003cb>BISAP ≥3\u003c/b> (calculadora en Más → Calculadoras).\u003c/li>\n\u003c/ul>"},{"h":"Complicaciones locales","html":"\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>\u003c/th>\u003cth>&lt;4 semanas\u003c/th>\u003cth>&gt;4 semanas (pared definida)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Sin necrosis (edematosa)\u003c/td>\u003ctd>Colección peripancreática aguda\u003c/td>\u003ctd>\u003cb>Pseudoquiste\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Con necrosis\u003c/td>\u003ctd>Colección necrótica aguda\u003c/td>\u003ctd>\u003cb>Necrosis encapsulada\u003c/b> (walled-off)\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>Pseudoquiste o necrosis encapsulada: solo se drenan si dan síntomas o se infectan.\u003c/li>\n\u003cli>\u003cb>Necrosis infectada\u003c/b>: gas en la necrosis en la TC o deterioro tras 7–10 días → antibióticos que penetren (carbapenémico) y abordaje escalonado: drenaje percutáneo o endoscópico; necrosectomía diferida (idealmente después de 4 semanas).\u003c/li>\n\u003cli>Sistémicas: SDRA, LRA, choque, hipocalcemia, hiperglucemia; trombosis de la vena esplénica, pseudoaneurisma.\u003c/li>\n\u003c/ul>"},{"h":"Tratamiento","html":"\n\u003cul>\n\u003cli>\u003cb>Líquidos\u003c/b>: Ringer lactato con estrategia moderada y dirigida a metas (bolo de 10 mL/kg si hay hipovolemia, luego ~1.5 mL/kg/h) y reevaluación frecuente. La reanimación agresiva aumentó la sobrecarga sin beneficio (WATERFALL 2022).\u003c/li>\n\u003cli>\u003cb>Analgesia\u003c/b> adecuada; los opioides son aceptables.\u003c/li>\n\u003cli>\u003cb>Nutrición oral temprana\u003c/b> (dieta sólida baja en grasa en cuanto la tolere, en las primeras 24–72 h); no esperar a que baje la lipasa. Si no tolera, enteral (sonda nasogástrica o nasoyeyunal) antes que parenteral.\u003c/li>\n\u003cli>\u003cb>No antibióticos profilácticos\u003c/b>, ni siquiera en necrosis estéril.\u003c/li>\n\u003cli>\u003cb>CPRE urgente (&lt;24 h)\u003c/b> solo si hay colangitis (o obstrucción biliar persistente). No en pancreatitis biliar sin colangitis.\u003c/li>\n\u003cli>\u003cb>Colecistectomía en la misma hospitalización\u003c/b> en la pancreatitis biliar leve: previene recurrencias.\u003c/li>\n\u003cli>\u003cb>Hipertrigliceridemia\u003c/b>: infusión de insulina (con dextrosa) o plasmaféresis; después fibratos y control de causas.\u003c/li>\n\u003cli>Alcohol: consejería breve y seguimiento.\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"Pancreatitis: “LÍQUIDOS, COMIDA y PACIENCIA”","d":"Líquidos moderados con Ringer lactato, comida en cuanto tolere y paciencia con la necrosis: sin antibióticos profilácticos y con la necrosectomía diferida. La CPRE urgente solo si hay colangitis."},"pearl":"Si ya tienes dolor típico + lipasa ≥3×, no necesitas TC para diagnosticar. Pide USG para buscar litos y TC solo si hay duda o no mejora en 48–72 h.","trap":"Dejar al paciente en ayuno “hasta que se normalice la lipasa” o darle antibióticos profilácticos por necrosis estéril: ambas son respuestas incorrectas en las guías actuales.","guide":["Volumen de líquidos: guías antiguas (ACG 2013) proponían 250–500 mL/h; tras WATERFALL (2022) las guías recientes recomiendan reanimación moderada y dirigida. ⚠️ Si tu profesor enseñó la versión agresiva, considera que el examen puede seguirla.","Atlanta revisada (2012) es la clasificación vigente; Ranson es histórica (necesita 48 h)."],"refs":["Banks PA, et al. Classification of acute pancreatitis—2012: revision of the Atlanta classification. Gut 2013.","Tenner S, et al. American College of Gastroenterology Guidelines: Management of Acute Pancreatitis. Am J Gastroenterol 2024.","de-Madaria E, et al. Aggressive or Moderate Fluid Resuscitation in Acute Pancreatitis (WATERFALL). N Engl J Med 2022."]},"ar":{"hook":"Poliartritis simétrica de manos que respeta las IFD, anti-CCP positivo y metotrexato lo antes posible: esa es la columna del tema.","anim":"ar","compare":["ar-oa"],"nn":[],"yt":"rheumatoid arthritis","sections":[{"h":"Clínica","html":"\n\u003cul>\n\u003cli>\u003cb>Poliartritis simétrica\u003c/b> de articulaciones pequeñas: MCF, IFP, muñecas y MTF. \u003cb>Respeta las IFD\u003c/b> y la columna lumbar.\u003c/li>\n\u003cli>Rigidez matutina &gt;1 h, mejora con el movimiento; fatiga, febrícula.\u003c/li>\n\u003cli>\u003cb>Deformidades\u003c/b>: cuello de cisne, en ojal (boutonnière), desviación cubital, pulgar en Z.\u003c/li>\n\u003cli>\u003cb>Columna cervical\u003c/b>: subluxación atlantoaxoidea (C1–C2). Pide Rx en flexión y extensión antes de intubar o de una cirugía.\u003c/li>\n\u003cli>\u003cb>Extraarticular\u003c/b>: nódulos reumatoides, enfermedad pulmonar intersticial (patrón NIU), Sjögren secundario, escleritis, vasculitis, \u003cb>síndrome de Felty\u003c/b> (AR + esplenomegalia + neutropenia), anemia de inflamación, túnel del carpo.\u003c/li>\n\u003cli>\u003cb>La enfermedad cardiovascular es la principal causa de muerte\u003c/b>: controla factores de riesgo.\u003c/li>\n\u003c/ul>"},{"h":"Laboratorio e imagen","html":"\n\u003cul>\n\u003cli>\u003cb>Factor reumatoide\u003c/b>: sensibilidad ~70%, poco específico (adultos mayores, hepatitis C, endocarditis, Sjögren).\u003c/li>\n\u003cli>\u003cb>Anti-CCP (ACPA)\u003c/b>: especificidad &gt;95%; predice erosiones y enfermedad más agresiva.\u003c/li>\n\u003cli>VSG y PCR elevadas.\u003c/li>\n\u003cli>\u003cb>Rx\u003c/b>: osteopenia yuxtaarticular, erosiones marginales y disminución simétrica del espacio articular. USG y RM detectan sinovitis temprana.\u003c/li>\n\u003c/ul>"},{"h":"Criterios ACR/EULAR 2010 (≥6/10)","html":"\n\u003cp>Se aplican a un paciente con ≥1 articulación con sinovitis no explicada por otra causa.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>Dominio\u003c/th>\u003cth>Puntos\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Articulaciones\u003c/b>: 1 grande 0 · 2–10 grandes 1 · 1–3 pequeñas 2 · 4–10 pequeñas 3 · &gt;10 (≥1 pequeña) 5\u003c/td>\u003ctd>0–5\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Serología\u003c/b>: FR y ACPA negativos 0 · positivo bajo 2 · positivo alto (&gt;3× el límite) 3\u003c/td>\u003ctd>0–3\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Reactantes de fase aguda\u003c/b>: normales 0 · PCR o VSG altas 1\u003c/td>\u003ctd>0–1\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Duración\u003c/b>: &lt;6 semanas 0 · ≥6 semanas 1\u003c/td>\u003ctd>0–1\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>La calculadora está en Más → Calculadoras.\u003c/p>"},{"h":"Tratamiento","html":"\n\u003cul>\n\u003cli>\u003cb>Tratar a una meta\u003c/b> (remisión o baja actividad, medida con DAS28 o CDAI) e iniciar FAME en cuanto se diagnostica.\u003c/li>\n\u003cli>\u003cb>Metotrexato\u003c/b>: el ancla. 15–25 mg \u003cb>a la semana\u003c/b> + ácido fólico. Vigila BH, PFH y creatinina. Efectos: hepatotoxicidad, mielosupresión, neumonitis, estomatitis. Teratogénico: suspender antes de buscar embarazo. Evitar en ERC grave y con alcohol.\u003c/li>\n\u003cli>\u003cb>Alternativas\u003c/b>: leflunomida (teratogénica; se “lava” con colestiramina), sulfasalazina (segura en embarazo), hidroxicloroquina (fondo de ojo basal y anual desde los 5 años de uso).\u003c/li>\n\u003cli>\u003cb>Glucocorticoides\u003c/b> a dosis bajas, solo como puente y por el menor tiempo posible.\u003c/li>\n\u003cli>\u003cb>Si no llega a la meta en 3–6 meses\u003c/b>: agregar biológico (anti-TNF: adalimumab, etanercept, infliximab, certolizumab; abatacept; tocilizumab; rituximab) o inhibidor de JAK (tofacitinib, baricitinib, upadacitinib).\u003c/li>\n\u003cli>\u003cb>Antes de biológicos o JAK\u003c/b>: tamizaje de TB latente (IGRA o PPD), VHB y VHC; vacunas inactivadas al día; nada de vacunas vivas.\u003c/li>\n\u003cli>Anti-TNF: evitar en IC NYHA III–IV y en enfermedades desmielinizantes. JAK: más eventos CV y trombosis en &gt;50 años con factores de riesgo (ORAL Surveillance).\u003c/li>\n\u003cli>Los AINE alivian síntomas, pero no frenan el daño articular.\u003c/li>\n\u003cli>\u003cb>Embarazo\u003c/b>: la AR suele mejorar. Metotrexato y leflunomida contraindicados; hidroxicloroquina, sulfasalazina, prednisona a dosis baja y certolizumab sí.\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"AR: “MANOS que no tocan la última falange”","d":"MCF, IFP y muñecas en ambos lados; la IFD se respeta (si está la IFD, piensa en OA o artritis psoriásica). Metotrexato es el primer paso, con ácido fólico, una vez a la semana."},"pearl":"El anti-CCP es la prueba más específica de AR y predice erosiones. El factor reumatoide es más sensible, pero aparece en adultos mayores sanos y en hepatitis C.","trap":"Escribir metotrexato “diario” es un error que puede ser mortal: la dosis es semanal.","guide":["Glucocorticoides: el ACR 2021 desaconseja su uso prolongado; EULAR 2022 los acepta como puente al iniciar o cambiar de FAME, reduciéndolos lo antes posible.","Después de metotrexato: el ACR 2021 prefiere agregar un biológico o JAK; EULAR 2022 permite triple terapia convencional en pacientes sin factores de mal pronóstico. ⚠️ Pregunta a tu profesor cuál esquema prefiere."],"refs":["Aletaha D, et al. 2010 Rheumatoid arthritis classification criteria (ACR/EULAR). Arthritis Rheum 2010.","Fraenkel L, et al. 2021 American College of Rheumatology Guideline for the Treatment of Rheumatoid Arthritis. Arthritis Care Res 2021.","Smolen JS, et al. EULAR recommendations for the management of rheumatoid arthritis: 2022 update. Ann Rheum Dis 2023."]},"gota":{"hook":"El examen gira en tres cosas: los cristales (agujas negativas vs romboides positivos), cómo apagar un ataque según el paciente y cuándo iniciar alopurinol con meta \u003c6.","anim":"gota","compare":["gota-pseudo"],"nn":[["gout-nclex","Gout (NCLEX)"]],"yt":"gout pseudogout","sections":[{"h":"Fisiopatología","html":"\n\u003cul>\n\u003cli>El urato se satura por arriba de \u003cb>6.8 mg/dL\u003c/b> y precipita como cristales de urato monosódico.\u003c/li>\n\u003cli>~90% por \u003cb>baja excreción renal\u003c/b>; ~10% por sobreproducción (lisis tumoral, mieloproliferativos, psoriasis, Lesch-Nyhan).\u003c/li>\n\u003cli>\u003cb>Factores\u003c/b>: alcohol (sobre todo cerveza), carnes rojas, mariscos, refrescos con fructosa, obesidad, síndrome metabólico, ERC, diuréticos (tiazidas y de asa), aspirina a dosis baja, ciclosporina, pirazinamida, etambutol.\u003c/li>\n\u003cli>\u003cb>Desencadenantes\u003c/b> de ataque: cambios bruscos del urato (incluido iniciar alopurinol), cirugía, deshidratación, borrachera, trauma.\u003c/li>\n\u003cli>Los cristales activan el inflamasoma NLRP3 de los macrófagos → IL-1β → ataque inflamatorio intenso.\u003c/li>\n\u003c/ul>"},{"h":"Clínica y diagnóstico","html":"\n\u003cul>\n\u003cli>\u003cb>Podagra\u003c/b> (1ª MTF): monoartritis aguda, muy dolorosa, roja y caliente, típicamente nocturna. También tobillo, rodilla, muñeca.\u003c/li>\n\u003cli>\u003cb>Tofos\u003c/b> (pabellón auricular, codos, Aquiles), gota tofácea crónica; litiasis de ácido úrico (radiolúcida); nefropatía por urato.\u003c/li>\n\u003cli>\u003cb>Artrocentesis\u003c/b>: cristales en aguja con \u003cb>birrefringencia negativa\u003c/b> (amarillos paralelos al eje del compensador). Siempre Gram y cultivo: gota e infección pueden coexistir.\u003c/li>\n\u003cli>El ácido úrico sérico puede estar normal durante el ataque: no lo descarta.\u003c/li>\n\u003cli>\u003cb>Imagen\u003c/b>: Rx tardía con erosiones en “sacabocado” de borde colgante; USG con signo del doble contorno; TC de doble energía.\u003c/li>\n\u003c/ul>"},{"h":"Ataque agudo","html":"\n\u003cul>\n\u003cli>Tratar en las primeras 24 h. Elige según el paciente:\u003c/li>\n\u003cli>\u003cb>Colchicina a dosis baja\u003c/b>: 1.2 mg y 0.6 mg una hora después (dosis total 1.8 mg). Ajustar en ERC; interacción grave con claritromicina y otros inhibidores de CYP3A4/P-gp.\u003c/li>\n\u003cli>\u003cb>AINE a dosis plenas\u003c/b> (naproxeno, indometacina): evitarlos en ERC, úlcera, IC o anticoagulación.\u003c/li>\n\u003cli>\u003cb>Glucocorticoides\u003c/b>: prednisona 30–40 mg/día por 5 días, o intraarticular. Útiles en ERC o cuando no puede recibir AINE ni colchicina.\u003c/li>\n\u003cli>Refractarios: anti-IL-1 (anakinra, canakinumab).\u003c/li>\n\u003cli>\u003cb>No suspendas el alopurinol\u003c/b> si ya lo toma. El ACR 2020 permite iniciarlo durante el ataque.\u003c/li>\n\u003c/ul>"},{"h":"Terapia para bajar el urato","html":"\n\u003cul>\n\u003cli>\u003cb>Indicaciones fuertes\u003c/b> (ACR 2020): ≥1 tofo, daño radiográfico por gota o ≥2 ataques al año.\u003c/li>\n\u003cli>\u003cb>Condicionales\u003c/b>: más de 1 ataque previo pero &lt;2 al año; primer ataque con ERC ≥3, urato &gt;9 mg/dL o litiasis urinaria.\u003c/li>\n\u003cli>\u003cb>Alopurinol\u003c/b> (inhibe la xantina oxidasa) es de primera línea, incluso en ERC: iniciar ≤100 mg/día (menos en ERC avanzada) y subir cada 2–5 semanas hasta la meta.\u003c/li>\n\u003cli>\u003cb>Meta: urato &lt;6 mg/dL\u003c/b> (&lt;5 si hay tofos, según EULAR).\u003c/li>\n\u003cli>\u003cb>Profilaxis antiinflamatoria\u003c/b> (colchicina, AINE o prednisona a dosis baja) por 3–6 meses al iniciar.\u003c/li>\n\u003cli>\u003cb>HLA-B*58:01\u003c/b> antes del alopurinol en personas de origen coreano, chino han, tailandés o afrodescendientes (riesgo de Stevens-Johnson, NET o DRESS).\u003c/li>\n\u003cli>\u003cb>Febuxostat\u003c/b>: alternativa; advertencia de mortalidad cardiovascular (CARES): evitar si hay ECV. \u003cb>Probenecid\u003c/b>: uricosúrico; no en litiasis ni ERC. \u003cb>Pegloticasa\u003c/b>: gota refractaria; contraindicada en déficit de G6PD.\u003c/li>\n\u003cli>Losartán y fenofibrato bajan un poco el urato; cambia la tiazida si se puede.\u003c/li>\n\u003cli>Litiasis de ácido úrico: alcalinizar la orina con citrato de potasio.\u003c/li>\n\u003c/ul>"},{"h":"Pseudogota (CPPD)","html":"\n\u003cul>\n\u003cli>Cristales de pirofosfato de calcio \u003cb>romboides con birrefringencia positiva débil\u003c/b> (azules paralelos al compensador).\u003c/li>\n\u003cli>Adultos mayores; rodilla y muñeca. Rx: \u003cb>condrocalcinosis\u003c/b> (meniscos, fibrocartílago triangular).\u003c/li>\n\u003cli>Si aparece antes de los 60 años, busca causas: \u003cb>hiperparatiroidismo, hemocromatosis, hipomagnesemia, hipofosfatasia\u003c/b>.\u003c/li>\n\u003cli>Ataque: AINE, colchicina o esteroide intraarticular. No hay tratamiento que disuelva los cristales.\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"Agujas Amarillas Negativas = gota · Romboides Positivos = pseudogota","d":"Urato: agujas, birrefringencia negativa, amarillas paralelas al compensador. Pirofosfato: romboides, positiva débil, azules paralelos. Para buscar causas de CPPD: las 4 H (Hiperparatiroidismo, Hemocromatosis, Hipomagnesemia, Hipofosfatasia)."},"pearl":"Un ácido úrico normal durante el ataque no descarta gota: puede bajar por la inflamación. El diagnóstico se hace con los cristales.","trap":"Suspender el alopurinol durante un ataque o no dar profilaxis con colchicina al iniciarlo: ambas cosas provocan más ataques.","guide":["Iniciar alopurinol durante el ataque: el ACR 2020 lo permite (recomendación condicional); libros antiguos dicen “esperar 2 semanas”. Si te preguntan con la guía actual, se puede iniciar.","Meta de urato: ACR \u003c6 mg/dL; EULAR \u003c6 y \u003c5 si hay tofos."],"refs":["FitzGerald JD, et al. 2020 American College of Rheumatology Guideline for the Management of Gout. Arthritis Care Res 2020.","Richette P, et al. 2016 updated EULAR evidence-based recommendations for the management of gout. Ann Rheum Dis 2017.","Rosenthal AK, Ryan LM. Calcium Pyrophosphate Deposition Disease. N Engl J Med 2016."]},"scc":{"hook":"Angina estable: decide qué estudio pedir según la probabilidad, qué fármacos mejoran el pronóstico y cuáles solo quitan síntomas, y cuándo revascularizar.","nn":[["ischemic-heart-disease","Coronary Artery Disease"]],"yt":"stable angina","sections":[{"h":"Clínica","html":"\n\u003cul>\n\u003cli>\u003cb>Angina típica\u003c/b> (3 de 3): molestia retroesternal característica, desencadenada por esfuerzo o estrés emocional, y que cede con reposo o nitroglicerina en minutos. \u003cb>Atípica\u003c/b>: 2 de 3. \u003cb>No anginoso\u003c/b>: 0–1.\u003c/li>\n\u003cli>Clasificación de la Sociedad Canadiense (CCS) I–IV según el esfuerzo que la provoca.\u003c/li>\n\u003cli>\u003cb>Angina vasoespástica\u003c/b> (Prinzmetal): en reposo, de madrugada, con elevación transitoria del ST; fumadores, cocaína. Tratamiento: calcioantagonista y nitratos; evita betabloqueadores no selectivos.\u003c/li>\n\u003cli>\u003cb>Angina microvascular\u003c/b> (INOCA): síntomas con coronarias sin obstrucción; más en mujeres.\u003c/li>\n\u003c/ul>"},{"h":"Estudios (ESC 2024)","html":"\n\u003cul>\n\u003cli>Base: ECG en reposo, ecocardiograma (FEVI, alteraciones de movilidad, valvulopatía), lípidos, glucosa o A1c, creatinina, BH.\u003c/li>\n\u003cli>Se estima la \u003cb>probabilidad clínica\u003c/b> con edad, sexo, tipo de síntoma y factores de riesgo (± calcio coronario).\u003c/li>\n\u003cli>Muy baja (≤5%): no se necesitan más pruebas. \u003cb>Baja a moderada (&gt;5–50%)\u003c/b>: \u003cb>angio-TC coronaria\u003c/b>. \u003cb>Moderada a alta (&gt;15–85%)\u003c/b>: imagen funcional (eco de estrés, SPECT, RM de estrés). \u003cb>Muy alta\u003c/b> o datos de alto riesgo: coronariografía invasiva.\u003c/li>\n\u003cli>La prueba de esfuerzo con ECG sola tiene menor sensibilidad; no sirve si el ECG basal no es interpretable (BRIHH, marcapasos, WPW, digoxina, infradesnivel ≥1 mm): usa imagen.\u003c/li>\n\u003cli>Contraindicaciones de la prueba de esfuerzo: SCA reciente, estenosis aórtica grave sintomática, IC descompensada, arritmias no controladas, TEP agudo, disección aórtica.\u003c/li>\n\u003c/ul>"},{"h":"Tratamiento","html":"\n\u003cp>\u003cb>Mejoran el pronóstico\u003c/b> (prevención de eventos):\u003c/p>\n\u003cul>\n\u003cli>Aspirina 75–100 mg (clopidogrel si no la tolera).\u003c/li>\n\u003cli>Estatina de alta intensidad: LDL &lt;55 mg/dL y ↓ ≥50%; ezetimiba e iPCSK9 si no llega.\u003c/li>\n\u003cli>IECA o ARA-II si hay HTA, DM, IC, FEVI ≤40% o ERC.\u003c/li>\n\u003cli>Colchicina 0.5 mg/día puede considerarse (LoDoCo2).\u003c/li>\n\u003cli>Dejar de fumar, ejercicio, rehabilitación, vacuna de influenza.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cb>Controlan síntomas\u003c/b> (antianginosos):\u003c/p>\n\u003cul>\n\u003cli>\u003cb>Primera línea\u003c/b>: betabloqueador y/o calcioantagonista; nitroglicerina SL de rescate (nunca con sildenafil o tadalafil).\u003c/li>\n\u003cli>Combinar betabloqueador + dihidropiridina (amlodipino); evitar betabloqueador + verapamilo o diltiazem (bradicardia y bloqueo).\u003c/li>\n\u003cli>Segunda línea: nitratos de acción prolongada, ranolazina, ivabradina (ritmo sinusal con FC &gt;70), trimetazidina, nicorandil.\u003c/li>\n\u003c/ul>"},{"h":"Revascularización","html":"\n\u003cul>\n\u003cli>Para \u003cb>síntomas\u003c/b> que persisten pese a tratamiento médico óptimo.\u003c/li>\n\u003cli>Para \u003cb>pronóstico\u003c/b>: lesión del tronco &gt;50%, enfermedad de 3 vasos o DA proximal con FEVI ≤35%, isquemia extensa.\u003c/li>\n\u003cli>\u003cb>ISCHEMIA (2020)\u003c/b>: en enfermedad estable sin lesión de tronco, la revascularización de rutina no redujo muerte ni IAM frente al tratamiento médico óptimo, aunque sí mejoró la angina.\u003c/li>\n\u003cli>\u003cb>Cirugía de revascularización (CABG)\u003c/b> preferida en multivaso con DM (FREEDOM), tronco con anatomía compleja y FEVI baja. \u003cb>ICP\u003c/b> en enfermedad menos compleja.\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"Pronóstico: “A-E-I” · Síntomas: “B-C-N”","d":"Lo que salva vidas: Aspirina, Estatina, IECA (si hay indicación). Lo que quita la angina: Betabloqueador, Calcioantagonista, Nitratos."},"pearl":"La nitroglicerina, la ranolazina y la ivabradina no reducen eventos: si te preguntan qué mejora el pronóstico, la respuesta es estatina (o aspirina, o IECA si hay indicación).","trap":"Betabloqueador + verapamilo o diltiazem: bradicardia y bloqueo AV. Si necesitas dos antianginosos, combina el betabloqueador con amlodipino.","guide":["Estudio inicial: la ESC 2024 favorece angio-TC coronaria con probabilidad baja-moderada y prueba de imagen funcional con probabilidad moderada-alta. Libros previos ponían la prueba de esfuerzo con ECG como primer estudio; la ESC ya no."],"refs":["Vrints C, et al. 2024 ESC Guidelines for the management of chronic coronary syndromes. Eur Heart J 2024.","Maron DJ, et al. ISCHEMIA. N Engl J Med 2020."]},"aortica":{"hook":"Estenosis: soplo sistólico a carótidas, síntomas = cirugía o TAVI. Insuficiencia: soplo diastólico, pulsos saltones y cirugía cuando el VI empieza a fallar.","anim":"aortica","compare":["ea-ia"],"nn":[["valvular-heart-diseases-overview","Valvular Heart Disease"],["heart-sounds","Heart Sounds & Murmurs"]],"yt":"aortic stenosis aortic regurgitation","sections":[{"h":"Estenosis aórtica","html":"\n\u003cul>\n\u003cli>\u003cb>Causas\u003c/b>: degenerativa calcificada (&gt;65–70 años, la más común), válvula bicúspide (&lt;65 años; se asocia a coartación y dilatación de la aorta), reumática (rara y casi siempre con valvulopatía mitral).\u003c/li>\n\u003cli>\u003cb>Síntomas\u003c/b>: angina, síncope de esfuerzo, disnea o IC. Sin tratamiento, supervivencia media: angina 5 años, síncope 3, IC 2.\u003c/li>\n\u003cli>\u003cb>Exploración\u003c/b>: soplo sistólico expulsivo en crescendo-decrescendo en foco aórtico, irradiado a carótidas; pulso \u003ci>parvus et tardus\u003c/i>; S2 disminuido; S4. Cuanto más tardío el pico del soplo, más grave.\u003c/li>\n\u003cli>\u003cb>Síndrome de Heyde\u003c/b>: estenosis aórtica + angiodisplasia intestinal sangrante (von Willebrand adquirido).\u003c/li>\n\u003cli>\u003cb>Grave por eco\u003c/b>: velocidad pico ≥4 m/s, gradiente medio ≥40 mmHg, área ≤1.0 cm² (≤0.6 cm²/m²). Bajo flujo-bajo gradiente con FEVI baja → eco con dobutamina; con FEVI conservada → calcio valvular por TC.\u003c/li>\n\u003cli>\u003cb>Indicación de intervención\u003c/b>: grave sintomática; o grave asintomática con FEVI &lt;50%, prueba de esfuerzo anormal, muy grave (≥5 m/s) o si irá a otra cirugía cardiaca.\u003c/li>\n\u003cli>\u003cb>TAVI vs cirugía (SAVR)\u003c/b>: TAVI en pacientes mayores (ESC/EACTS 2025: ≥70 años con anatomía adecuada; ACC/AHA 2020: &gt;80 años, decisión compartida entre 65 y 80) o de alto riesgo; cirugía en jóvenes de bajo riesgo, bicúspide o anatomía desfavorable.\u003c/li>\n\u003cli>No hay fármaco que frene la estenosis. Cuidado con vasodilatadores y nitratos en estenosis grave (dependiente de precarga).\u003c/li>\n\u003c/ul>"},{"h":"Insuficiencia aórtica","html":"\n\u003cul>\n\u003cli>\u003cb>Causas\u003c/b>: de la raíz (HTA, Marfan, sífilis, espondilitis anquilosante, disección) o de la válvula (bicúspide, endocarditis, reumática).\u003c/li>\n\u003cli>\u003cb>Aguda\u003c/b> (endocarditis, disección): edema pulmonar y choque sin tiempo para que el VI se adapte → cirugía urgente.\u003c/li>\n\u003cli>\u003cb>Crónica\u003c/b>: sobrecarga de volumen → VI dilatado (hipertrofia excéntrica). Soplo diastólico temprano decreciente en borde esternal izquierdo, mejor sentado, inclinado hacia adelante y en espiración.\u003c/li>\n\u003cli>\u003cb>Signos de pulso amplio\u003c/b>: presión de pulso ancha, pulso en martillo de agua (Corrigan), de Musset (cabeceo), Quincke (pulso capilar ungueal), Duroziez (soplo femoral), Traube; Austin Flint (retumbo apical funcional).\u003c/li>\n\u003cli>\u003cb>Cirugía\u003c/b> si es grave y sintomática; asintomática si FEVI ≤50% o diámetro telesistólico del VI &gt;50 mm (o &gt;25 mm/m²).\u003c/li>\n\u003cli>Vasodilatadores (IECA, ARA-II, dihidropiridinas) para la HTA en insuficiencia aórtica.\u003c/li>\n\u003c/ul>"},{"h":"Profilaxis de endocarditis","html":"\n\u003cul>\n\u003cli>Solo en alto riesgo: prótesis valvular (o reparación con material protésico), endocarditis previa, ciertas cardiopatías congénitas (y TAVI).\u003c/li>\n\u003cli>Antes de procedimientos dentales que manipulan encía: amoxicilina 2 g VO 30–60 min antes.\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"Estenosis: “ASI”: Angina, Síncope, Insuficiencia cardiaca","d":"En ese orden de aparición y de peor pronóstico (5, 3 y 2 años). Cualquiera de los tres con estenosis grave = intervenir."},"pearl":"El dato de mayor gravedad de una estenosis aórtica es un soplo con pico tardío y un S2 que desaparece. La intensidad del soplo baja cuando falla el VI.","trap":"Dar nitroglicerina a un paciente con estenosis aórtica grave: el VI depende de la precarga y puede caer en hipotensión grave.","guide":["Edad para TAVI: la ESC/EACTS 2025 bajó el umbral a ≥70 años (antes ≥75); la ACC/AHA 2020 prefiere cirugía \u003c65, decisión compartida entre 65 y 80, y TAVI >80. ⚠️ Verifica qué umbral usa tu profesor.","Umbral de FEVI en insuficiencia aórtica asintomática: guías previas usaban ≤50%; algunas recomendaciones recientes consideran operar antes (≤55%). Si no te dan más datos, ≤50%."],"refs":["Praz F, et al. 2025 ESC/EACTS Guidelines for the management of valvular heart disease. Eur Heart J 2025.","Otto CM, et al. 2020 ACC/AHA Guideline for the Management of Patients With Valvular Heart Disease. Circulation 2021."]},"tep":{"hook":"El algoritmo cabe en una tarjeta: ¿está estable? → probabilidad clínica → dímero D o angio-TC → riesgo (PESI, VD, troponina) → anticoagulante o trombólisis.","anim":"tep","nn":[["pulmonary-embolism-etiology-pathophysiology-diagnosis-clinical-features-treatment","Venous Thromboembolism"]],"yt":"pulmonary embolism","sections":[{"h":"Sospecha","html":"\n\u003cul>\n\u003cli>\u003cb>Tríada de Virchow\u003c/b>: estasis, daño endotelial, hipercoagulabilidad.\u003c/li>\n\u003cli>\u003cb>Factores\u003c/b>: cirugía mayor u ortopédica, inmovilización, cáncer, embarazo y puerperio, estrógenos, trombofilias, TVP previa, obesidad, viajes largos.\u003c/li>\n\u003cli>\u003cb>Clínica\u003c/b>: disnea súbita (lo más común), dolor pleurítico, taquicardia, taquipnea, hemoptisis; síncope o choque si es masiva. Pierna edematosa si hay TVP.\u003c/li>\n\u003cli>\u003cb>ECG\u003c/b>: taquicardia sinusal (lo más frecuente); S1Q3T3, BRDHH nuevo, T invertidas en V1–V4 por sobrecarga del VD.\u003c/li>\n\u003cli>Gasometría con hipoxemia y alcalosis respiratoria. La Rx suele ser casi normal (raros: Westermark, joroba de Hampton).\u003c/li>\n\u003c/ul>"},{"h":"Diagnóstico (ESC 2019)","html":"\n\u003col>\n\u003cli>\u003cb>¿Inestable?\u003c/b> (choque o hipotensión): ecocardiograma a la cabecera; si hay dilatación del VD y no puede ir a angio-TC, se trata como TEP de alto riesgo.\u003c/li>\n\u003cli>\u003cb>Estable\u003c/b>: probabilidad clínica con \u003cb>Wells\u003c/b> o Ginebra (calculadora en Más → Calculadoras).\u003c/li>\n\u003cli>Probabilidad baja/intermedia o “improbable” (Wells ≤4) → \u003cb>dímero D\u003c/b> (ajustado por edad &gt;50 años: edad × 10 µg/L). Negativo = descartado. Positivo → angio-TC.\u003c/li>\n\u003cli>Probabilidad alta o “probable” (Wells &gt;4) → \u003cb>angio-TC directa\u003c/b> (el dímero D no sirve para descartar).\u003c/li>\n\u003cli>Contraindicación al contraste o embarazo con Rx normal → \u003cb>gammagrama V/Q\u003c/b>. En el embarazo, si hay síntomas de TVP, primero USG Doppler.\u003c/li>\n\u003cli>En urgencias, con probabilidad muy baja, los criterios \u003cb>PERC\u003c/b> negativos permiten no pedir dímero D.\u003c/li>\n\u003c/ol>"},{"h":"Estratificación del riesgo","html":"\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"mini\">\n\u003ctr>\u003cth>Riesgo\u003c/th>\u003cth>Definición\u003c/th>\u003cth>Tratamiento\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Alto\u003c/b>\u003c/td>\u003ctd>Inestabilidad: paro, choque (PAS &lt;90 o vasopresor con hipoperfusión) o hipotensión persistente\u003c/td>\u003ctd>Heparina no fraccionada + \u003cb>trombólisis sistémica\u003c/b> (alteplasa 100 mg en 2 h). Si está contraindicada: embolectomía quirúrgica o por catéter\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Intermedio-alto\u003c/td>\u003ctd>sPESI ≥1 + disfunción del VD (eco o TC) + troponina elevada\u003c/td>\u003ctd>Anticoagulación y vigilancia estrecha; trombólisis de rescate si se descompensa\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Intermedio-bajo\u003c/td>\u003ctd>sPESI ≥1 con uno o ninguno de esos hallazgos\u003c/td>\u003ctd>Anticoagulación hospitalaria\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Bajo\u003c/td>\u003ctd>sPESI 0, sin disfunción del VD\u003c/td>\u003ctd>Anticoagulante oral; alta temprana o manejo ambulatorio\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>"},{"h":"Anticoagulación","html":"\n\u003cul>\n\u003cli>\u003cb>ACOD\u003c/b> de elección en la mayoría: rivaroxabán o apixabán (sin heparina previa); dabigatrán y edoxabán (tras ≥5 días de heparina).\u003c/li>\n\u003cli>\u003cb>Warfarina\u003c/b> (INR 2–3) con traslape de heparina ≥5 días y hasta INR en rango 24 h. Indicada en síndrome antifosfolípido (sobre todo triple positivo), válvulas mecánicas y ERC muy avanzada.\u003c/li>\n\u003cli>\u003cb>Embarazo\u003c/b>: heparina de bajo peso molecular (ACOD y warfarina contraindicados).\u003c/li>\n\u003cli>\u003cb>Cáncer\u003c/b>: HBPM o ACOD (edoxabán, rivaroxabán, apixabán); cuidado con tumores digestivos o urinarios por sangrado.\u003c/li>\n\u003cli>\u003cb>Filtro de vena cava\u003c/b>: solo si la anticoagulación está absolutamente contraindicada.\u003c/li>\n\u003cli>\u003cb>Duración\u003c/b>: provocada por un factor transitorio mayor (cirugía, trauma) → 3 meses. No provocada o factor persistente → se considera indefinida. Cáncer activo → mientras esté activo (≥6 meses).\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"Wells en una frase: “Pierna, Primer diagnóstico, Pulso, Paciente quieto, Previo, Pulmón sangra, Proceso maligno”","d":"Signos de TVP (3) · TEP es el diagnóstico más probable (3) · FC >100 (1.5) · inmovilización o cirugía reciente (1.5) · TVP/TEP previos (1.5) · hemoptisis (1) · cáncer (1). Más de 4 = probable."},"pearl":"El dímero D solo sirve para descartar: úsalo cuando la probabilidad es baja o intermedia. Con probabilidad alta, ve directo a la angio-TC.","trap":"Trombolizar a un TEP estable con troponina alta y VD dilatado (intermedio-alto): PEITHO mostró más sangrados sin beneficio en mortalidad. Se anticoagula y se vigila.","guide":["La ESC 2019 sigue vigente para TEP; el ajuste del dímero D por edad y el algoritmo YEARS son aceptados. ⚠️ Si tu profesor usa otro umbral de dímero D, apréndete el suyo."],"refs":["Konstantinides SV, et al. 2019 ESC Guidelines for the diagnosis and management of acute pulmonary embolism. Eur Heart J 2020.","Stevens SM, et al. Antithrombotic Therapy for VTE Disease: CHEST Guideline 2021."]},"sangrado":{"hook":"Petequias o hemartrosis: primero decide si falla la plaqueta o el factor, luego lee TP, TTPa y la prueba de mezcla. Y reconoce las trombocitopenias que matan: PTT, CID y HIT.","compare":["hemofilia-vwd"],"nn":[["coagulopathy","Coagulopathy"],["hemostasis-coagulation-cascade","Hemostasis: Coagulation Cascade"]],"yt":"bleeding disorders hemophilia von Willebrand","sections":[{"h":"Primaria vs secundaria","html":"\n\u003cul>\n\u003cli>\u003cb>Hemostasia primaria\u003c/b> (plaquetas, factor de von Willebrand): petequias, púrpura, sangrado de \u003cb>mucosas\u003c/b> (epistaxis, gingivorragia, menorragia), sangrado \u003cb>inmediato\u003c/b> tras un corte.\u003c/li>\n\u003cli>\u003cb>Hemostasia secundaria\u003c/b> (factores): \u003cb>hemartrosis\u003c/b>, hematomas musculares profundos, sangrado \u003cb>tardío\u003c/b> tras cirugía o extracción dental.\u003c/li>\n\u003cli>Estudios iniciales: BH con plaquetas y frotis, TP/INR, TTPa, fibrinógeno.\u003c/li>\n\u003c/ul>"},{"h":"Cómo leer TP y TTPa","html":"\n\u003cul>\n\u003cli>\u003cb>TP ↑, TTPa normal\u003c/b>: déficit de VII, warfarina, déficit de vitamina K o hepatopatía tempranos (el VII tiene la vida media más corta).\u003c/li>\n\u003cli>\u003cb>TP normal, TTPa ↑\u003c/b>: hemofilia A (VIII) o B (IX), déficit de XI, von Willebrand (a veces), heparina no fraccionada, anticoagulante lúpico (da \u003cb>trombosis\u003c/b>, no sangrado), déficit de XII (no sangra).\u003c/li>\n\u003cli>\u003cb>Ambos ↑\u003c/b>: CID, hepatopatía avanzada, déficit grave de vitamina K, déficit de X, V, II o fibrinógeno.\u003c/li>\n\u003cli>\u003cb>Prueba de mezcla\u003c/b> (plasma del paciente + plasma normal 1:1): si \u003cb>corrige\u003c/b> → falta un factor; si \u003cb>no corrige\u003c/b> → hay un inhibidor (anticoagulante lúpico, inhibidor adquirido del VIII, heparina).\u003c/li>\n\u003c/ul>"},{"h":"Trombocitopenias clave","html":"\n\u003cul>\n\u003cli>\u003cb>PTI\u003c/b>: trombocitopenia aislada, frotis con plaquetas grandes y sin esquistocitos; diagnóstico de exclusión (pide VIH, VHC, H. pylori). Tratar si plaquetas &lt;30,000 o sangrado: prednisona o dexametasona ± IgIV (si sangrado grave o necesitas subirlas rápido). Segunda línea: agonistas del receptor de trombopoyetina (eltrombopag, romiplostim), rituximab, esplenectomía.\u003c/li>\n\u003cli>\u003cb>PTT (MAT)\u003c/b>: anemia hemolítica microangiopática (\u003cb>esquistocitos\u003c/b>, LDH ↑, haptoglobina ↓) + trombocitopenia, ± fiebre, alteración neurológica y renal. ADAMTS13 &lt;10%. Es una urgencia: \u003cb>recambio plasmático\u003c/b> + glucocorticoides ± caplacizumab, sin esperar el resultado de ADAMTS13. Evita transfundir plaquetas salvo sangrado grave.\u003c/li>\n\u003cli>\u003cb>SUH\u003c/b>: diarrea con sangre por E. coli productora de toxina Shiga (O157:H7) + lesión renal aguda; antibióticos no recomendados.\u003c/li>\n\u003cli>\u003cb>CID\u003c/b>: sepsis, trauma, LPA, complicaciones obstétricas. Plaquetas ↓, TP y TTPa ↑, fibrinógeno ↓, dímero D ↑. Trata la causa; transfunde solo si sangra (plaquetas, plasma, crioprecipitado).\u003c/li>\n\u003cli>\u003cb>HIT\u003c/b> (trombocitopenia inducida por heparina): caída &gt;50% de plaquetas 5–10 días después de iniciar heparina, con \u003cb>trombosis\u003c/b> (no sangrado). Escala 4T + anticuerpos anti-PF4. Suspende \u003cb>toda\u003c/b> heparina (incluidos lavados) e inicia argatrobán, fondaparinux o un ACOD. No warfarina hasta que las plaquetas se recuperen ni transfusión de plaquetas.\u003c/li>\n\u003c/ul>"},{"h":"Hemofilia y von Willebrand","html":"\n\u003cul>\n\u003cli>\u003cb>Hemofilia A\u003c/b> (VIII, ~80%) y \u003cb>B\u003c/b> (IX): ligadas al X, hombres. Hemartrosis espontáneas, artropatía. TTPa ↑ con TP y plaquetas normales. Tratamiento: concentrado de factor; emicizumab como profilaxis en hemofilia A; desmopresina en hemofilia A leve.\u003c/li>\n\u003cli>\u003cb>Von Willebrand\u003c/b>: el trastorno hereditario de sangrado más común (tipo 1, autosómico dominante). Sangrado mucocutáneo y menorragia. Plaquetas normales; TTPa normal o ↑ (el FvW transporta al VIII). Pide antígeno de FvW, actividad (cofactor de ristocetina) y VIII. Tratamiento: desmopresina en el tipo 1, concentrado de FvW/VIII, ácido tranexámico.\u003c/li>\n\u003cli>Sangrado urémico: disfunción plaquetaria por uremia; desmopresina y diálisis.\u003c/li>\n\u003c/ul>"},{"h":"Revertir anticoagulantes","html":"\n\u003cul>\n\u003cli>\u003cb>Warfarina con sangrado grave\u003c/b>: vitamina K 10 mg IV + \u003cb>concentrado de complejo protrombínico de 4 factores\u003c/b> (plasma fresco si no hay).\u003c/li>\n\u003cli>INR alto sin sangrado: omitir dosis; vitamina K oral si INR &gt;10.\u003c/li>\n\u003cli>\u003cb>Heparina no fraccionada\u003c/b>: protamina (revierte parcialmente la HBPM).\u003c/li>\n\u003cli>\u003cb>Dabigatrán\u003c/b>: idarucizumab. \u003cb>Apixabán o rivaroxabán\u003c/b>: andexanet alfa o, si no hay, concentrado de complejo protrombínico.\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"Plaqueta = Piel y mucosa · Factor = Fondo","d":"Si falla la plaqueta, sangra lo superficial y al instante (petequias, encías). Si falla el factor, sangra lo profundo y tarde (articulaciones, músculo)."},"pearl":"Esquistocitos + plaquetas bajas = piensa en PTT y llama para recambio plasmático hoy. Sin tratamiento, la mortalidad del PTT es de ~90%.","trap":"En HIT y en PTT no transfundas plaquetas de rutina: “echas leña al fuego” y aumentas la trombosis.","guide":["Umbral para tratar PTI: la ASH 2019 sugiere tratar al adulto recién diagnosticado con plaquetas \u003c30,000 aunque no sangre; con más de 30,000 y sin sangrado, observar. Libros previos usaban \u003c20,000.","Reversión de anti-Xa: andexanet alfa está aprobado, pero su disponibilidad es limitada en México; en la práctica se usa concentrado de complejo protrombínico."],"refs":["Neunert C, et al. ASH 2019 guidelines for immune thrombocytopenia. Blood Adv 2019.","Zheng XL, et al. ISTH guidelines for the diagnosis and treatment of TTP. J Thromb Haemost 2020.","Cuker A, et al. ASH 2018 guidelines for heparin-induced thrombocytopenia. Blood Adv 2018.","James PD, et al. ASH/ISTH/NHF/WFH 2021 guidelines on von Willebrand disease. Blood Adv 2021."]},"hemoliticas":{"hook":"Reticulocitos altos, LDH alta, haptoglobina baja: hay hemólisis. Ahora decide dónde se rompe el eritrocito (vaso o bazo), si el Coombs es positivo y qué te dice el frotis.","compare":["intra-extra"],"nn":[["normocytic-anemia","Normocytic Anemia"]],"yt":"hemolytic anemia","sections":[{"h":"Confirma la hemólisis","html":"\n\u003cul>\n\u003cli>Anemia normocítica con \u003cb>reticulocitos ↑\u003c/b> (médula que responde).\u003c/li>\n\u003cli>\u003cb>LDH ↑\u003c/b>, \u003cb>bilirrubina indirecta ↑\u003c/b>, \u003cb>haptoglobina ↓\u003c/b> (se une a la hemoglobina libre).\u003c/li>\n\u003cli>\u003cb>Coombs directo\u003c/b> (prueba de antiglobulina directa): positivo = causa inmune.\u003c/li>\n\u003cli>El \u003cb>frotis\u003c/b> orienta: esferocitos (esferocitosis o AHAI caliente), esquistocitos (microangiopatía), células mordidas y cuerpos de Heinz (G6PD), aglutinación (crioaglutininas), drepanocitos.\u003c/li>\n\u003c/ul>"},{"h":"Intravascular vs extravascular","html":"\n\u003cul>\n\u003cli>\u003cb>Intravascular\u003c/b> (se rompe en el vaso): hemoglobinuria (orina oscura), hemosiderinuria, haptoglobina indetectable. Causas: G6PD, microangiopatías (PTT, SUH, CID, válvulas mecánicas), HPN, reacción transfusional ABO, malaria.\u003c/li>\n\u003cli>\u003cb>Extravascular\u003c/b> (macrófagos del bazo e hígado): esplenomegalia, ictericia, litiasis pigmentaria. Causas: esferocitosis hereditaria, AHAI caliente, drepanocitosis, talasemias.\u003c/li>\n\u003c/ul>"},{"h":"Hereditarias","html":"\n\u003cul>\n\u003cli>\u003cb>Esferocitosis hereditaria\u003c/b>: defecto de espectrina o anquirina (autosómica dominante). Esferocitos, \u003cb>CHCM ↑\u003c/b>, Coombs negativo, esplenomegalia, cálculos biliares. Prueba de unión a eosina-5-maleimida (EMA) por citometría o fragilidad osmótica. Crisis aplásica por parvovirus B19. Tratamiento: ácido fólico; esplenectomía en formas graves (vacunar antes).\u003c/li>\n\u003cli>\u003cb>Déficit de G6PD\u003c/b>: ligado al X. Crisis tras \u003cb>estrés oxidativo\u003c/b>: infecciones, habas, primaquina, dapsona, sulfas, nitrofurantoína, rasburicasa. Cuerpos de Heinz y células mordidas. Mide la enzima \u003cb>semanas después\u003c/b> de la crisis (los reticulocitos tienen más G6PD y dan falsos normales).\u003c/li>\n\u003cli>\u003cb>Drepanocitosis\u003c/b>: HbS; crisis vasooclusivas, síndrome torácico agudo, autoesplenectomía; hidroxiurea.\u003c/li>\n\u003c/ul>"},{"h":"Adquiridas","html":"\n\u003cul>\n\u003cli>\u003cb>AHAI caliente\u003c/b> (IgG, 37 °C): Coombs + para IgG, esferocitos, hemólisis extravascular. Asociada a LES, LLC, linfomas, fármacos. Tratamiento: prednisona 1 mg/kg; rituximab en segunda línea.\u003c/li>\n\u003cli>\u003cb>Crioaglutininas\u003c/b> (IgM, frío): Coombs + para C3. Acrocianosis, empeora con frío. Asociada a Mycoplasma, mononucleosis, linfomas. Evitar el frío; rituximab o sutimlimab; los esteroides sirven poco.\u003c/li>\n\u003cli>\u003cb>Microangiopáticas\u003c/b>: esquistocitos + trombocitopenia (PTT, SUH, CID, HELLP, HTA maligna) o hemólisis mecánica por válvula protésica.\u003c/li>\n\u003cli>\u003cb>Hemoglobinuria paroxística nocturna (HPN)\u003c/b>: pérdida de CD55 y CD59 (GPI) por mutación de PIGA. Tríada: hemólisis intravascular, \u003cb>trombosis en sitios raros\u003c/b> (Budd-Chiari, venas cerebrales) y citopenias. Diagnóstico por citometría de flujo. Tratamiento: inhibidores del complemento (eculizumab, ravulizumab) con vacuna antimeningocócica.\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"G6PD = “Habas, Sulfas, Primaquina”","d":"Imagina a un paciente comiendo habas con una pastilla de sulfa y otra de primaquina: tres oxidantes que rompen eritrocitos con poco glutatión."},"pearl":"Esferocitos con Coombs negativo = esferocitosis hereditaria. Esferocitos con Coombs positivo = AHAI caliente.","trap":"Medir G6PD durante la crisis puede dar un valor normal falso: los eritrocitos viejos (con menos enzima) ya se destruyeron.","guide":["Prueba para esferocitosis: guías recientes prefieren la prueba EMA por citometría sobre la fragilidad osmótica; muchos libros todavía mencionan la fragilidad osmótica como prueba clásica."],"refs":["Barcellini W, Fattizzo B. Autoimmune hemolytic anemias. N Engl J Med 2023 (revisión).","Hill A, et al. Paroxysmal nocturnal haemoglobinuria. Nat Rev Dis Primers 2017.","Harrison. Principios de Medicina Interna, 21e. Cap. Anemias hemolíticas."]},"leucemias":{"hook":"Pancitopenia con blastos: es una leucemia aguda hasta demostrar lo contrario. Distingue LMA de LLA, reconoce la LPA (urgencia por CID) y el SMD del adulto mayor.","compare":["lma-lla"],"nn":[["acute-leukemia","Acute Leukemia"],["acute-myelogenous-leukemia","Acute Myelogenous Leukemia"],["acute-lymphoblastic-leukemia","Acute Lymphoblastic Leukemia"]],"yt":"acute leukemia AML ALL","sections":[{"h":"Cuadro general","html":"\n\u003cul>\n\u003cli>\u003cb>Falla medular\u003c/b>: anemia (fatiga), neutropenia (infecciones, fiebre), trombocitopenia (petequias, sangrado).\u003c/li>\n\u003cli>Leucocitos altos, normales o bajos; \u003cb>blastos\u003c/b> en sangre o médula. Diagnóstico con aspirado y biopsia de médula: morfología, citometría de flujo, citogenética y biología molecular.\u003c/li>\n\u003cli>Umbral clásico: \u003cb>≥20% de blastos\u003c/b>. La OMS 2022 y la ICC 2022 permiten diagnosticar LMA con menos blastos si hay una alteración genética definitoria (ver caja de guías).\u003c/li>\n\u003cli>\u003cb>Leucostasis\u003c/b> (blastos muy altos): disnea, hipoxemia, alteración neurológica → citorreducción urgente (hidroxiurea, inducción).\u003c/li>\n\u003cli>\u003cb>Síndrome de lisis tumoral\u003c/b>: K ↑, fósforo ↑, calcio ↓, ácido úrico ↑, LRA. Prevención: hidratación + alopurinol; rasburicasa si el riesgo es alto (contraindicada en déficit de G6PD).\u003c/li>\n\u003c/ul>"},{"h":"LMA","html":"\n\u003cul>\n\u003cli>Adultos (mediana ~68 años); también secundaria a SMD, quimioterapia o radiación.\u003c/li>\n\u003cli>Mieloperoxidasa positiva, \u003cb>bastones de Auer\u003c/b>. Variantes monocíticas: hipertrofia gingival, infiltración de piel, SNC.\u003c/li>\n\u003cli>Riesgo genético (ELN 2022): \u003cb>favorable\u003c/b> t(8;21), inv(16), NPM1 sin FLT3-ITD, CEBPA bZIP; \u003cb>adverso\u003c/b> TP53, cariotipo complejo, −5/−7.\u003c/li>\n\u003cli>Tratamiento del paciente apto: inducción \u003cb>“7+3”\u003c/b> (citarabina 7 días + antraciclina 3 días); midostaurina si hay FLT3. Consolidación con citarabina en dosis altas o trasplante alogénico según riesgo.\u003c/li>\n\u003cli>No apto para quimioterapia intensiva: \u003cb>venetoclax + azacitidina\u003c/b>.\u003c/li>\n\u003c/ul>"},{"h":"LPA: la leucemia que sangra","html":"\n\u003cul>\n\u003cli>Leucemia promielocítica aguda, \u003cb>t(15;17) PML::RARA\u003c/b>. Promielocitos con muchos bastones de Auer (células en “haz de leña”).\u003c/li>\n\u003cli>Se presenta con \u003cb>CID\u003c/b> y hemorragia grave (cerebral, pulmonar).\u003c/li>\n\u003cli>Inicia \u003cb>ácido transretinoico (ATRA)\u003c/b> en cuanto la sospeches, sin esperar la confirmación genética; se combina con trióxido de arsénico. Mantén plaquetas &gt;30–50 mil y fibrinógeno &gt;100–150 mg/dL.\u003c/li>\n\u003cli>\u003cb>Síndrome de diferenciación\u003c/b>: fiebre, disnea, infiltrados, derrames, aumento de peso, LRA → dexametasona.\u003c/li>\n\u003cli>Con tratamiento, la curación supera el 90%.\u003c/li>\n\u003c/ul>"},{"h":"LLA","html":"\n\u003cul>\n\u003cli>La leucemia más común en niños (pico 2–5 años); también adultos.\u003c/li>\n\u003cli>Adenopatías, hepatoesplenomegalia, dolor óseo, infiltración de \u003cb>SNC y testículo\u003c/b>; masa mediastinal en LLA-T.\u003c/li>\n\u003cli>TdT positiva; precursora B: CD10, CD19, CD22. En adultos es común el cromosoma Filadelfia t(9;22) \u003cb>BCR::ABL1\u003c/b> → agregar inhibidor de tirosina cinasa.\u003c/li>\n\u003cli>Tratamiento por fases: inducción, consolidación, profilaxis del SNC (intratecal) y mantenimiento por ~2–3 años. Inmunoterapias: blinatumomab, inotuzumab, células CAR-T.\u003c/li>\n\u003c/ul>"},{"h":"Síndrome mielodisplásico","html":"\n\u003cul>\n\u003cli>Adulto mayor con \u003cb>citopenias\u003c/b> (sobre todo anemia macrocítica) y médula \u003cb>displásica\u003c/b> con blastos &lt;20%.\u003c/li>\n\u003cli>Frotis: neutrófilos hiposegmentados (pseudo-Pelger-Huët) e hipogranulares; sideroblastos en anillo (asociados a SF3B1).\u003c/li>\n\u003cli>Pronóstico con IPSS-R o IPSS-M. Puede progresar a LMA.\u003c/li>\n\u003cli>Bajo riesgo: soporte transfusional, eritropoyetina, luspatercept; \u003cb>lenalidomida en del(5q)\u003c/b>. Alto riesgo: hipometilantes (azacitidina); el \u003cb>trasplante alogénico\u003c/b> es el único tratamiento curativo.\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"LPA = “ATRA ya”","d":"Si ves promielocitos y CID, no esperes al PML::RARA: el ácido transretinoico salva la vida en las primeras horas."},"pearl":"Fiebre en un paciente con neutropenia (\u003c500) es urgencia: hemocultivos y antibiótico antipseudomonas (cefepime, piperacilina-tazobactam o meropenem) en menos de 60 minutos.","trap":"La rasburicasa causa hemólisis y metahemoglobinemia en déficit de G6PD: pregunta o mide antes de darla.","guide":["Umbral de blastos: la OMS 2022 elimina el 20% para LMA con alteraciones genéticas definitorias (salvo BCR::ABL1 y CEBPA); la ICC 2022 usa ≥10% para varias de ellas y crea la categoría SMD/LMA (10–19%). Para el examen, 20% sigue siendo la cifra clásica.","Clasificación de riesgo: la ELN 2022 reemplazó a la ELN 2017; algunos cambios (FLT3-ITD ya no modifica el riesgo según la carga alélica) pueden no estar en tu libro."],"refs":["Döhner H, et al. Diagnosis and management of AML in adults: 2022 ELN recommendations. Blood 2022.","Khoury JD, et al. 5th edition WHO Classification of Haematolymphoid Tumours. Leukemia 2022.","Arber DA, et al. International Consensus Classification of Myeloid Neoplasms and Acute Leukemias. Blood 2022.","Sanz MA, et al. Management of APL: updated ELN recommendations. Blood 2019."]},"erge":{"hook":"Pirosis sin datos de alarma: prueba con IBP y no pidas endoscopia. Aprende cuándo sí, cómo se clasifica la esofagitis y qué hacer con un Barrett.","nn":[["gerd","Gastroesophageal Reflux Disease (GERD)"],["esophagitis","Esophagitis"]],"yt":"GERD Barrett esophagus","sections":[{"h":"Clínica","html":"\n\u003cul>\n\u003cli>\u003cb>Típicos\u003c/b>: pirosis y regurgitación, peor después de comer y al acostarse.\u003c/li>\n\u003cli>\u003cb>Atípicos y extraesofágicos\u003c/b>: tos crónica, ronquera (laringitis), asma de difícil control, erosiones dentales, \u003cb>dolor torácico no cardiaco\u003c/b> (descarta primero origen cardiaco).\u003c/li>\n\u003cli>Factores: obesidad, hernia hiatal, embarazo, tabaco, comidas abundantes o nocturnas, fármacos que relajan el esfínter (calcioantagonistas, nitratos, anticolinérgicos).\u003c/li>\n\u003c/ul>"},{"h":"Datos de alarma → endoscopia","html":"\n\u003cul>\n\u003cli>\u003cb>Disfagia\u003c/b>, odinofagia, pérdida de peso no intencional, sangrado digestivo o anemia ferropénica, vómito persistente, masa.\u003c/li>\n\u003cli>Síntomas que no responden a IBP en 8 semanas.\u003c/li>\n\u003cli>Tamizaje de \u003cb>Barrett\u003c/b> (ACG 2022): ERGE crónica + ≥3 factores: hombre, &gt;50 años, raza blanca, obesidad central, tabaquismo, familiar de primer grado con Barrett o adenocarcinoma.\u003c/li>\n\u003cli>\u003cb>Clasificación de Los Ángeles\u003c/b> (A–D según la extensión de las erosiones). LA C o D, Barrett largo o estenosis péptica confirman ERGE.\u003c/li>\n\u003cli>\u003cb>pH-impedancia ambulatoria\u003c/b> (sin IBP): cuando el diagnóstico es dudoso, endoscopia normal con síntomas refractarios, o antes de cirugía. Tiempo de exposición al ácido &gt;6% es concluyente.\u003c/li>\n\u003c/ul>"},{"h":"Tratamiento","html":"\n\u003cul>\n\u003cli>Bajar de peso, elevar la cabecera de la cama, no cenar 2–3 h antes de acostarse, dejar de fumar. Excluir alimentos solo si provocan síntomas.\u003c/li>\n\u003cli>\u003cb>IBP\u003c/b> una vez al día, 30–60 min antes del desayuno, por 8 semanas. Si la respuesta es parcial: ajustar el horario o dar dos dosis.\u003c/li>\n\u003cli>Después: bajar a la dosis mínima eficaz o a demanda. \u003cb>Mantenimiento\u003c/b> indefinido en esofagitis LA C/D y Barrett.\u003c/li>\n\u003cli>\u003cb>Cirugía\u003c/b> (funduplicatura de Nissen, esfínter magnético): ERGE confirmada que no se controla o el paciente no quiere IBP de por vida; útil sobre todo para regurgitación. Obesidad mórbida: bypass gástrico en Y de Roux.\u003c/li>\n\u003cli>Vonoprazán (bloqueador de ácido competitivo con el potasio): opción en esofagitis erosiva grave.\u003c/li>\n\u003c/ul>"},{"h":"Esófago de Barrett","html":"\n\u003cul>\n\u003cli>Metaplasia \u003cb>intestinal\u003c/b> (células caliciformes) que reemplaza al epitelio escamoso ≥1 cm por arriba de la unión esofagogástrica. Precursor de \u003cb>adenocarcinoma\u003c/b>.\u003c/li>\n\u003cli>Sin displasia: vigilancia endoscópica cada 5 años si mide &lt;3 cm y cada 3 años si ≥3 cm (ACG 2022), con IBP.\u003c/li>\n\u003cli>Displasia de bajo grado (confirmada por segundo patólogo): terapia endoscópica de erradicación (ablación) o vigilancia a 12 meses.\u003c/li>\n\u003cli>Displasia de alto grado o cáncer intramucoso: resección endoscópica de lesiones visibles + ablación.\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"Alarma = “DOPA-V”","d":"Disfagia, Odinofagia, Pérdida de peso, Anemia o sangrado, Vómito persistente: cualquiera manda a endoscopia."},"pearl":"La respuesta a la prueba con IBP apoya el diagnóstico pero no lo confirma: sensibilidad ~70% y especificidad baja.","trap":"Dolor torácico “por reflujo” en un hombre de 58 años con factores de riesgo: primero descarta isquemia, luego piensa en el esófago.","guide":["Vigilancia de Barrett sin displasia: ACG 2022 propone 3–5 años según longitud; la BSG 2013 usa 2–5 años. Dato de examen: Barrett se vigila con endoscopia y biopsias, no se opera.","Tamizaje de Barrett: ACG 2022 pide ≥3 factores de riesgo; guías previas solo pedían hombre >50 años con ERGE crónica."],"refs":["Katz PO, et al. ACG Clinical Guideline for the Diagnosis and Management of GERD. Am J Gastroenterol 2022.","Shaheen NJ, et al. ACG Clinical Guideline: Diagnosis and Management of Barrett's Esophagus. Am J Gastroenterol 2022.","Gyawali CP, et al. Lyon Consensus 2.0. Gut 2024."]},"diarrea":{"hook":"Diarrea aguda casi siempre se resuelve sola: aprende cuándo estudiar y cuándo dar antibiótico. En la crónica, clasifica el mecanismo y no olvides la celiaca.","nn":[["diarrhea","Diarrhea"],["malabsorption","Malabsorption"]],"yt":"diarrhea malabsorption celiac disease","sections":[{"h":"Diarrea aguda (\u003c14 días)","html":"\n\u003cul>\n\u003cli>La mayoría es viral (norovirus) y autolimitada. Lo principal es la \u003cb>hidratación oral\u003c/b> (solución de rehidratación).\u003c/li>\n\u003cli>\u003cb>Estudiar\u003c/b> (coprocultivo o panel molecular) si hay: disentería (sangre), fiebre ≥38.5 °C, deshidratación grave, &gt;7 días, inmunosupresión, edad avanzada con comorbilidad, brotes, hospitalización o antibióticos recientes.\u003c/li>\n\u003cli>\u003cb>Antibiótico empírico\u003c/b> solo en casos graves, disentería febril o diarrea del viajero moderada-grave: \u003cb>azitromicina\u003c/b>. Evitarlo si se sospecha E. coli productora de toxina Shiga (O157:H7): aumenta el riesgo de SUH.\u003c/li>\n\u003cli>Loperamida: útil en diarrea acuosa sin fiebre; evitar en disentería.\u003c/li>\n\u003cli>\u003cb>C. difficile\u003c/b>: antibióticos o hospitalización recientes, ≥3 evacuaciones líquidas/24 h. Diagnóstico: PCR o toxina. Tratamiento: \u003cb>fidaxomicina\u003c/b> o \u003cb>vancomicina oral\u003c/b> (el metronidazol ya no es primera línea).\u003c/li>\n\u003c/ul>"},{"h":"Diarrea crónica (>4 semanas)","html":"\n\u003cul>\n\u003cli>\u003cb>Osmótica\u003c/b>: cede con el ayuno; brecha osmótica fecal &gt;125. Lactosa, laxantes osmóticos (magnesio, PEG), sorbitol, malabsorción.\u003c/li>\n\u003cli>\u003cb>Secretora\u003c/b>: persiste con ayuno y de noche; brecha &lt;50. Laxantes estimulantes, malabsorción de ácidos biliares, tumores neuroendocrinos (VIPoma, carcinoide), colitis microscópica.\u003c/li>\n\u003cli>\u003cb>Inflamatoria\u003c/b>: sangre, fiebre, calprotectina ↑. EII, infecciones invasivas, colitis isquémica o por radiación.\u003c/li>\n\u003cli>\u003cb>Grasa (esteatorrea)\u003c/b>: heces voluminosas, fétidas, flotan. Insuficiencia pancreática, celiaca, sobrecrecimiento bacteriano.\u003c/li>\n\u003cli>Brecha osmótica fecal = 290 − 2 × (Na + K fecales).\u003c/li>\n\u003cli>\u003cb>Colitis microscópica\u003c/b>: mujer mayor, diarrea acuosa, colonoscopia normal; se diagnostica con biopsias. Asociada a AINE, IBP, ISRS. Tratamiento: budesonida.\u003c/li>\n\u003c/ul>"},{"h":"Malabsorción","html":"\n\u003cul>\n\u003cli>Datos: esteatorrea, pérdida de peso, anemia (hierro, B12, folato), osteoporosis (vitamina D), sangrado (vitamina K), edema (hipoalbuminemia).\u003c/li>\n\u003cli>\u003cb>Insuficiencia pancreática\u003c/b>: pancreatitis crónica, fibrosis quística. Elastasa fecal baja. Tratamiento: enzimas pancreáticas.\u003c/li>\n\u003cli>\u003cb>Sobrecrecimiento bacteriano\u003c/b>: asas ciegas, dismotilidad, diabetes. \u003cb>B12 baja con folato alto\u003c/b>. Prueba de aliento; rifaximina.\u003c/li>\n\u003cli>\u003cb>Enfermedad de Whipple\u003c/b>: hombre de edad media, artralgias, diarrea, pérdida de peso, síntomas neurológicos; macrófagos PAS+ en duodeno.\u003c/li>\n\u003c/ul>"},{"h":"Enfermedad celiaca","html":"\n\u003cul>\n\u003cli>Enteropatía autoinmune por gluten (trigo, cebada, centeno) en personas con \u003cb>HLA-DQ2 o DQ8\u003c/b>.\u003c/li>\n\u003cli>Presentación: diarrea y distensión, o solo \u003cb>anemia ferropénica refractaria\u003c/b>, osteoporosis, transaminasas elevadas, infertilidad. Asociaciones: DM1, tiroiditis, síndrome de Down, déficit de IgA.\u003c/li>\n\u003cli>\u003cb>Dermatitis herpetiforme\u003c/b>: vesículas pruriginosas en codos, rodillas y glúteos.\u003c/li>\n\u003cli>\u003cb>Tamizaje\u003c/b>: anti-transglutaminasa tisular IgA + IgA total (si hay déficit de IgA → pruebas IgG). Debe estar comiendo gluten.\u003c/li>\n\u003cli>\u003cb>Confirmación\u003c/b>: biopsia duodenal (≥4 en segunda porción + 1–2 en bulbo): atrofia de vellosidades, hiperplasia de criptas, linfocitos intraepiteliales (Marsh).\u003c/li>\n\u003cli>Tratamiento: \u003cb>dieta sin gluten de por vida\u003c/b>. Complicaciones: linfoma T asociado a enteropatía, celiaca refractaria.\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"Celiaca = “TTG con gluten”","d":"Pide anti-transglutaminasa IgA con IgA total, mientras el paciente sigue comiendo gluten. Si ya lo dejó, el resultado puede salir falso negativo."},"pearl":"Anemia ferropénica que no responde al hierro oral sin sangrado evidente: busca celiaca (y H. pylori, gastritis atrófica).","trap":"Diarrea con sangre en un niño o adulto con E. coli O157:H7: no des antibióticos ni antimotilidad; aumentan el riesgo de SUH.","guide":["C. difficile: la IDSA/SHEA 2021 prefiere fidaxomicina sobre vancomicina en el episodio inicial; en México la fidaxomicina puede no estar disponible y la vancomicina oral es aceptable.","Diagnóstico de celiaca sin biopsia: la ESPGHAN lo permite en niños con anti-TTG ≥10 veces el límite; en adultos, la ACG 2023 sigue recomendando biopsia en general."],"refs":["Riddle MS, et al. ACG Clinical Guideline: Acute Diarrheal Infections in Adults. Am J Gastroenterol 2016.","Johnson S, et al. IDSA/SHEA 2021 Focused Update on C. difficile. Clin Infect Dis 2021.","Rubio-Tapia A, et al. ACG Guidelines Update: Diagnosis and Management of Celiac Disease. Am J Gastroenterol 2023.","Arasaradnam RP, et al. BSG guidelines for chronic diarrhoea in adults. Gut 2018."]},"espondilo":{"hook":"Lumbalgia en un joven que despierta de madrugada y mejora al moverse: es inflamatoria. Reconoce la espondiloartritis axial, la artritis reactiva y la psoriásica, y su tratamiento escalonado.","nn":[],"yt":"ankylosing spondylitis psoriatic arthritis","sections":[{"h":"Lumbalgia inflamatoria","html":"\n\u003cul>\n\u003cli>Inicio \u003cb>antes de los 40–45 años\u003c/b>, insidioso, de más de 3 meses.\u003c/li>\n\u003cli>\u003cb>Mejora con el ejercicio\u003c/b>, no mejora con el reposo; dolor nocturno (despierta en la segunda mitad de la noche).\u003c/li>\n\u003cli>Rigidez matutina &gt;30 min, dolor glúteo alternante.\u003c/li>\n\u003cli>Rasgos de espondiloartritis: entesitis (talón), dactilitis (“dedo en salchicha”), artritis asimétrica de miembros inferiores, \u003cb>uveítis anterior aguda\u003c/b>, psoriasis, EII, buena respuesta a AINE, familiar con espondiloartritis, \u003cb>HLA-B27\u003c/b>, PCR elevada.\u003c/li>\n\u003c/ul>"},{"h":"Espondiloartritis axial","html":"\n\u003cul>\n\u003cli>\u003cb>Criterios ASAS\u003c/b>: lumbalgia ≥3 meses con inicio &lt;45 años + (sacroileítis en imagen + ≥1 rasgo) o (HLA-B27 + ≥2 rasgos).\u003c/li>\n\u003cli>\u003cb>Radiográfica\u003c/b> (espondilitis anquilosante): sacroileítis bilateral en Rx, sindesmofitos, “columna en caña de bambú”. \u003cb>No radiográfica\u003c/b>: Rx normal con edema óseo en la RM.\u003c/li>\n\u003cli>La \u003cb>RM\u003c/b> detecta la sacroileítis temprana (edema de médula ósea).\u003c/li>\n\u003cli>Exploración: prueba de Schober modificada (flexión lumbar), expansión torácica, distancia occipucio-pared.\u003c/li>\n\u003cli>Extraarticular: uveítis anterior (la más común), insuficiencia aórtica, bloqueos de conducción, fibrosis apical, osteoporosis y fracturas vertebrales.\u003c/li>\n\u003cli>Tratamiento: \u003cb>AINE\u003c/b> + ejercicio y fisioterapia. Si no responde a 2 AINE: \u003cb>anti-TNF\u003c/b> o \u003cb>anti-IL-17\u003c/b> (secukinumab, ixekizumab), o inhibidores de JAK. Metotrexato y sulfasalazina no sirven para la enfermedad axial (sí para la periférica). Los esteroides sistémicos no se usan.\u003c/li>\n\u003c/ul>"},{"h":"Artritis reactiva","html":"\n\u003cul>\n\u003cli>1–4 semanas después de una infección \u003cb>genitourinaria\u003c/b> (Chlamydia) o \u003cb>gastrointestinal\u003c/b> (Salmonella, Shigella, Campylobacter, Yersinia).\u003c/li>\n\u003cli>Oligoartritis asimétrica de miembros inferiores, entesitis, dactilitis. Tríada clásica: artritis, uretritis y conjuntivitis.\u003c/li>\n\u003cli>Piel: queratodermia blenorrágica (palmas y plantas), balanitis circinada.\u003c/li>\n\u003cli>Tratamiento: AINE; esteroide intraarticular; tratar la Chlamydia si está activa. La mayoría se resuelve en meses.\u003c/li>\n\u003c/ul>"},{"h":"Artritis psoriásica","html":"\n\u003cul>\n\u003cli>En ~30% de las personas con psoriasis; la piel suele preceder a la artritis.\u003c/li>\n\u003cli>Patrones: oligoartritis asimétrica (el más común), predominio en \u003cb>IFD\u003c/b> (con cambios ungueales: piqueteado, onicólisis), poliartritis simétrica parecida a AR, artritis mutilante, axial.\u003c/li>\n\u003cli>Rx: “lápiz en copa”, erosiones con formación de hueso nuevo.\u003c/li>\n\u003cli>\u003cb>Criterios CASPAR\u003c/b>: enfermedad articular inflamatoria + ≥3 puntos: psoriasis actual (2), antecedente personal (1) o familiar (1), distrofia ungueal (1), FR negativo (1), dactilitis (1), hueso nuevo yuxtaarticular en Rx (1).\u003c/li>\n\u003cli>Tratamiento: AINE; periférica: \u003cb>metotrexato\u003c/b> (también ayuda a la piel); biológicos anti-TNF, anti-IL-17, anti-IL-23 (guselkumab) o IL-12/23 (ustekinumab); apremilast; JAK.\u003c/li>\n\u003c/ul>"}],"mnemo":{"t":"Espondiloartritis = “PEAR”","d":"Psoriásica, Enteropática (EII), Anquilosante (axial), Reactiva: cuatro hermanas seronegativas (FR y anti-CCP negativos) asociadas a HLA-B27."},"pearl":"Ojo rojo doloroso con fotofobia en un joven con lumbalgia: uveítis anterior aguda. Requiere oftalmología urgente y orienta a HLA-B27.","trap":"HLA-B27 positivo no diagnostica nada solo: ~8% de la población sana lo tiene. Se interpreta junto con la clínica y la imagen.","guide":["Inhibidores de JAK (tofacitinib, upadacitinib): aprobados en espondiloartritis axial y artritis psoriásica, pero con advertencias de seguridad (trombosis, eventos cardiovasculares) en mayores de 65 años o con factores de riesgo según EMA/FDA.","Anti-IL-23 (guselkumab, risankizumab): funcionan en artritis psoriásica periférica pero no han demostrado eficacia en la enfermedad axial pura."],"refs":["Ramiro S, et al. ASAS-EULAR recommendations for axial spondyloarthritis: 2022 update. Ann Rheum Dis 2023.","Gossec L, et al. EULAR recommendations for psoriatic arthritis: 2023 update. Ann Rheum Dis 2024.","Taylor W, et al. CASPAR criteria. Arthritis Rheum 2006."]},"oa":{"hook":"Dolor articular mecánico en mayores de 45 años, rigidez breve y laboratorio normal: osteoartritis. El tratamiento empieza con ejercicio y bajar de peso, no con pastillas.","compare":["ar-oa"],"nn":[],"yt":"osteoarthritis","sections":[{"h":"Clínica","html":"\n\u003cul>\n\u003cli>Dolor \u003cb>mecánico\u003c/b>: empeora con el uso, mejora con el reposo; rigidez matutina \u003cb>&lt;30 min\u003c/b> y tras inactividad (“gelificación”).\u003c/li>\n\u003cli>Crepitación, deformidad ósea, limitación del arco de movimiento, derrame frío ocasional.\u003c/li>\n\u003cli>Articulaciones: rodillas, caderas, columna, \u003cb>IFD\u003c/b> (nódulos de \u003cb>Heberden\u003c/b>), \u003cb>IFP\u003c/b> (nódulos de \u003cb>Bouchard\u003c/b>), base del pulgar (1ª carpometacarpiana, rizartrosis), 1ª MTF.\u003c/li>\n\u003cli>\u003cb>Respeta MCF, muñeca, codo y hombro\u003c/b>. Si están afectadas, piensa en otra cosa: depósito de pirofosfato, hemocromatosis (2ª y 3ª MCF), AR.\u003c/li>\n\u003cli>Factores: edad, obesidad, sexo femenino, lesiones previas, alineación, ocupación.\u003c/li>\n\u003c/ul>"},{"h":"Diagnóstico","html":"\n\u003cul>\n\u003cli>\u003cb>Clínico\u003c/b> (NICE): ≥45 años, dolor articular relacionado con la actividad y rigidez matutina ausente o &lt;30 min. No necesita imagen para diagnosticar.\u003c/li>\n\u003cli>\u003cb>Rx\u003c/b>: disminución \u003cb>asimétrica\u003c/b> del espacio articular, \u003cb>osteofitos\u003c/b>, esclerosis subcondral, quistes subcondrales (Kellgren-Lawrence 0–4). La imagen no siempre se correlaciona con el dolor.\u003c/li>\n\u003cli>Laboratorio \u003cb>normal\u003c/b> (VSG, PCR). Líquido sinovial no inflamatorio (&lt;2,000 leucocitos/µL).\u003c/li>\n\u003cli>OA erosiva de manos: IFP e IFD inflamadas, Rx en “alas de gaviota”.\u003c/li>\n\u003c/ul>"},{"h":"Tratamiento (ACR 2019)","html":"\n\u003cul>\n\u003cli>\u003cb>Base para todos\u003c/b>: educación, \u003cb>ejercicio\u003c/b> (fortalecimiento, aeróbico, tai chi), \u003cb>bajar de peso\u003c/b> (≥5% en OA de rodilla o cadera), bastón en la mano \u003cb>contraria\u003c/b> a la rodilla o cadera afectada, órtesis en la base del pulgar.\u003c/li>\n\u003cli>\u003cb>AINE tópicos\u003c/b> en rodilla (y mano): primera opción farmacológica, con menos efectos adversos.\u003c/li>\n\u003cli>\u003cb>AINE orales\u003c/b> a la dosis más baja y por el menor tiempo: los más eficaces; cuidado con riñón, estómago y corazón.\u003c/li>\n\u003cli>Esteroide intraarticular

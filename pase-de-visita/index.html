  return h;
}

/* --- Tema --- */
function viewTopic(){
  const t=TBYID[view.id],p=tpv(t.id),tab=view.tab||'learn';
  const segs=[['learn','1','Aprende',p.learn],['quiz','2','Reto',p.quiz>=4],['case','3','Caso',p.caseDone],['cards','','Tarjetas',false]];
  let body='';
  if(tab==='quiz')body=quizTab(t);
  else if(tab==='case')body=caseTab(t);
  else if(tab==='cards')body=cardsTab(t);
  else body=learnTab(t);
  return '<button class="back" data-act="go" data-v="map">← Mapa</button>'+
    '<header class="thead"><p class="eyebrow">'+esc(t.code)+' · '+esc(WBYID[t.w].name)+'</p><h1 class="h-sm">'+esc(t.title)+'</h1>'+starsHTML(stars(t.id))+'</header>'+
    '<nav class="seg" aria-label="Partes del tema">'+segs.map(([k,n,l,ok])=>'<button data-act="tab" data-tab="'+k+'"'+(tab===k?' aria-current="page"':'')+'>'+(n?'<span class="n">'+n+'</span>':'')+l+(ok?'<span class="chk" aria-label="completado">✓</span>':'')+'</button>').join('')+'</nav>'+
    '<div class="tbody">'+body+'</div>';
}

function learnTab(t){
  if(!sess.learn||sess.learn.id!==t.id)sess.learn={id:t.id,i:0};
  const cards=t.L.map(x=>({h:x[0],b:x[1]})).concat([{perla:t.perla}]);
  const n=cards.length,i=Math.min(sess.learn.i,n-1),c=cards[i];
  const p=tpv(t.id);
  return '<div class="dots" aria-hidden="true">'+cards.map((_,k)=>'<i class="'+(k<=i?'on':'')+'"></i>').join('')+'</div>'+
    '<article class="sheet lesson">'+
    (c.perla?'<span class="stamp">Perla clínica</span><p class="perla">'+esc(c.perla)+'</p>'
            :'<p class="kicker">Tarjeta '+(i+1)+' de '+(n-1)+'</p><h3>'+c.h+'</h3>'+c.b)+
    '</article>'+
    '<div class="row-btns"><button class="btn ghost" data-act="lprev"'+(i===0?' disabled':'')+'>← Anterior</button>'+
    (i<n-1?'<button class="btn" data-act="lnext">Siguiente →</button>'
          :'<button class="btn red" data-act="lfinish">'+(p.learn?'Ir al reto →':'Terminar lección · +20 XP')+'</button>')+
    '</div>';
}

function heartsHTML(l){return '<span class="hearts" aria-label="'+l+' vidas">'+[0,1,2].map(i=>'<svg viewBox="0 0 24 24" class="'+(i<l?'full':'empty')+'" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.9 3.6 4.5 7 4.5c2 0 3.6 1.1 5 2.9 1.4-1.8 3-2.9 5-2.9 3.4 0 5.6 3.4 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2Z"/></svg>').join('')+'</span>'}

function questionHTML(run,left){
  const q=QIDX[run.qs[run.i]];
  const answered=run.picked!==null;
  const correct=answered&&run.order[run.picked]===0;
  const opts=run.order.map((oi,k)=>{
    let cls='';
    if(answered){if(oi===0)cls=' ok';else if(k===run.picked)cls=' bad'}
    return '<button class="opt'+cls+'" data-act="ans" data-k="'+k+'"'+(answered?' disabled':'')+'><span class="k">'+'ABCD'[k]+'</span><span>'+esc(q.o[oi])+'</span></button>';
  }).join('');
  let ex='';
  if(answered){
    ex='<div class="explain" role="status"><p class="verdict '+(correct?'ok':'bad')+'">'+(correct?'Correcto':'Incorrecto · era la '+'ABCD'[run.order.indexOf(0)])+'</p><p>'+esc(q.e)+'</p>'+
      '<button class="btn" data-act="qnext">'+(isLastQ(run)?'Ver resultado':'Siguiente pregunta →')+'</button></div>';
  }
  const src=run.kind!=='topic'?'<span>'+esc(TBYID[q.t].title)+'</span>':'';
  return '<div class="sheet"><p class="qhead"><span>'+left+'</span>'+(run.combo>=2?'<span class="combo">Racha ×'+run.combo+'</span>':src)+'</p>'+
    '<p class="qtext">'+esc(q.q)+'</p><div class="opts">'+opts+'</div>'+ex+'</div>';
}

function quizTab(t){
  if(!sess.quiz||sess.quiz.topicId!==t.id)sess.quiz=newQuizRun('topic',t.Q.map(q=>q.id),t.id);
  const run=sess.quiz;
  if(run.done){
    const won=run.score>=4;
    return '<div class="sheet result"><p class="kicker">Resultado del reto</p><p class="score">'+run.score+'<small>/'+run.qs.length+'</small></p>'+
      '<p>'+(won?'Ganaste la estrella del reto.'+(run.score===5?' Sin un solo error.':''):'Necesitas 4 de 5 para la estrella. Repasa la lección y vuelve a intentarlo.')+'</p>'+
      '<div class="row-btns"><button class="btn ghost" data-act="qretry">Repetir reto</button><button class="btn" data-act="tab" data-tab="case">Ir al caso →</button></div></div>';
  }
  return questionHTML(run,'Pregunta '+(run.i+1)+' de '+run.qs.length);
}

function caseTab(t){
  if(!sess.case||sess.case.topicId!==t.id)sess.case=newCaseRun(t);
  const run=sess.case,K=t.K;
  let h='<article class="sheet chart"><p class="kicker">Caso clínico</p><p>'+esc(K.pres)+'</p><div class="vitals">'+K.vit.map(v=>'<span>'+esc(v)+'</span>').join('')+'</div></article>';
  for(let s=0;s<run.step&&s<K.steps.length;s++){
    const st=K.steps[s];
    h+='<div class="past"><p class="kicker">Decisión '+(s+1)+' de '+K.steps.length+'</p><p>'+esc(st.q)+'</p><p class="ans">✓ '+esc(st.o[0])+'</p>'+(st.ev?'<p class="ev"><b>Evolución:</b> '+esc(st.ev)+'</p>':'')+'</div>';
  }
  if(run.done){
    const i=TOPICS.indexOf(t),nt=TOPICS[i+1];
    h+='<div class="sheet result case-done" style="margin-top:16px"><p class="kicker">Caso resuelto</p>'+
      '<p>'+(run.perfect?'Sin errores. Ganaste la estrella del caso y el logro de ojo clínico.':'Ganaste la estrella del caso. Repítelo para sacarlo sin errores.')+'</p>'+
      '<div class="row-btns"><button class="btn ghost" data-act="cretry">Repetir caso</button>'+
      (nt?'<button class="btn" data-act="open" data-id="'+nt.id+'" data-tab="learn">Siguiente tema →</button>':'<button class="btn" data-act="go" data-v="boss">Reta al jefe →</button>')+
      '</div></div>';
    return h;
  }
  const st=K.steps[run.step];
  const opts=run.order.map((oi,k)=>{
    let cls='';
    if(run.wrong.indexOf(k)>=0)cls=' bad';
    if(run.solved&&oi===0)cls=' ok';
    const dis=run.solved||run.wrong.indexOf(k)>=0;
    return '<button class="opt'+cls+'" data-act="pick" data-k="'+k+'"'+(dis?' disabled':'')+'><span class="k">'+'ABCD'[k]+'</span><span>'+esc(st.o[oi])+'</span></button>';
  }).join('');
  let ex='';
  if(run.last!==null){
    const oi=run.order[run.last],ok=oi===0;
    ex='<div class="explain" role="status"><p class="verdict '+(ok?'ok':'bad')+'">'+(ok?'Bien decidido':'No es la mejor decisión')+'</p><p>'+esc(st.f[oi])+'</p>'+
      (ok?(st.ev?'<p class="ev"><b>Evolución:</b> '+esc(st.ev)+'</p>':'')+'<button class="btn" data-act="cnext">'+(run.step===K.steps.length-1?'Terminar caso':'Continuar →')+'</button>':'<p class="ev">Elige otra opción.</p>')+
      '</div>';
  }
  h+='<div class="step current sheet"><p class="kicker">Decisión '+(run.step+1)+' de '+K.steps.length+'</p><p class="qtext">'+esc(st.q)+'</p><div class="opts">'+opts+'</div>'+ex+'</div>';
  return h;
}

function cardRunHTML(r,title){
  if(r.done){
    return '<div class="sheet result"><p class="kicker">'+esc(title)+'</p><p class="score">'+r.known+'<small>/'+r.total+'</small></p><p>'+(r.total?'Tarjetas que sabías a la primera o al repetirlas. Las que fallaste vuelven pronto.':'No hay tarjetas pendientes por ahora.')+'</p>'+
      '<div class="row-btns"><button class="btn ghost" data-act="cardsAgain">Otra ronda</button><button class="btn" data-act="go" data-v="map">Volver al mapa</button></div></div>';
  }
  const c=CIDX[r.ids[r.i]];
  return '<p class="qhead"><span>Tarjeta '+(r.i+1)+' de '+r.ids.length+'</span><span>'+esc(TBYID[c.t].title)+'</span></p>'+
    '<div class="flip"><button class="card3d'+(r.flipped?' flipped':'')+'" data-act="flip" aria-label="'+(r.flipped?'Respuesta: ':'Pregunta: ')+esc(r.flipped?c.b:c.f)+'. Toca para voltear.">'+
    '<span class="face front"><span class="side">Pregunta</span><span class="txt">'+esc(c.f)+'</span><span class="hint">Toca para ver la respuesta</span></span>'+
    '<span class="face back"><span class="side">Respuesta</span><span class="txt">'+esc(c.b)+'</span></span></button></div>'+
    (r.flipped?'<div class="row-btns"><button class="btn ghost" data-act="rate" data-k="0">No lo sabía</button><button class="btn" data-act="rate" data-k="1">Lo sabía</button></div>'
              :'<div class="row-btns"><button class="btn ghost" data-act="flip">Ver respuesta</button></div>');
}
function cardsTab(t){
  if(!sess.cards||sess.cards.topicId!==t.id)sess.cards=newCardRun(t.C.map((_,i)=>t.id+'-c'+i),'topic',t.id);
  return cardRunHTML(sess.cards,'Tarjetas del tema');
}

/* --- Repaso --- */
function viewReview(){
  let h='<p class="eyebrow">Repaso espaciado</p><h1 class="h-sm">Repaso</h1>';
  if(sess.review){
    const back='<button class="back" data-act="endReview">← Terminar repaso</button>';
    if(sess.review.kind==='cards')return back+cardRunHTML(sess.review.run,'Repaso de hoy');
    const run=sess.review.run;
    if(run.done){
      return back+'<div class="sheet result"><p class="kicker">Mis errores</p><p class="score">'+run.score+'<small>/'+run.qs.length+'</small></p><p>'+(S.wrong.length?'Te quedan '+S.wrong.length+' preguntas por corregir.':'Ya no tienes errores pendientes.')+'</p>'+
        '<div class="row-btns"><button class="btn ghost" data-act="endReview">Volver</button>'+(S.wrong.length?'<button class="btn" data-act="startErrors">Otra ronda</button>':'')+'</div></div>';
    }
    return back+questionHTML(run,'Error '+(run.i+1)+' de '+run.qs.length);
  }
  const q=dailyQueue();
  const due=q.filter(id=>S.cards[id]).length,fresh=q.length-due;
  h+='<p class="lede">Las tarjetas que sabes regresan en 1, 2, 4, 7 y 15 días. Las que fallas vuelven a empezar. Así se queda en la memoria de largo plazo.</p>'+
    '<div class="panel">'+
    '<div class="sheet"><h3>Tarjetas de hoy</h3><p>'+(q.length?due+' para repasar y '+fresh+' nuevas'+(TOPICS.some(x=>tpv(x.id).learn)?' de los temas que ya estudiaste.':' de los primeros temas.'):'Terminaste el repaso de hoy. Vuelve mañana.')+'</p>'+
    '<button class="btn" data-act="startReview"'+(q.length?'':' disabled')+'>Empezar repaso · '+q.length+'</button></div>'+
    '<div class="sheet"><h3>Mis errores</h3><p>'+(S.wrong.length?S.wrong.length+' preguntas que fallaste. Contéstalas bien y salen de la lista.':'No tienes errores pendientes. Las preguntas que falles en retos y en el examen aparecerán aquí.')+'</p>'+
    '<button class="btn ghost" data-act="startErrors"'+(S.wrong.length?'':' disabled')+'>Corregir errores · '+S.wrong.length+'</button></div>'+
    '</div>';
  return h;
}

/* --- Jefe --- */
function viewBoss(){
  const run=sess.boss;
  let h='<p class="eyebrow">Examen relámpago</p><h1 class="h-sm">El jefe de residentes pregunta</h1>';
  if(!run){
    const learned=TOPICS.filter(t=>tpv(t.id).learn).length;
    const only=!!sess.bossOnly&&learned>0;
    h+='<p class="lede">15 preguntas al azar de todos los temas. Tienes 3 vidas. Cada acierto vale 15 XP y a partir de 3 seguidas valen el doble.</p>'+
      '<div class="panel"><div class="sheet">'+
      '<p class="kicker">Mejor puntaje</p><p class="score" style="text-align:left">'+S.boss.best+'<small>/15</small></p>'+
      '<label class="toggle"><input type="checkbox" id="bossOnly" data-act="bossToggle"'+(only?' checked':'')+(learned?'':' disabled')+'> Solo temas que ya estudié'+(learned?' ('+learned+')':'')+'</label>'+
      '<button class="btn red" data-act="bossStart">Empezar examen</button></div></div>';
    return h;
  }
  if(run.done){
    h+='<div class="sheet result"><p class="kicker">'+(run.lives<=0?'Te quedaste sin vidas':'Examen terminado')+'</p><p class="score">'+run.score+'<small>/15</small></p>'+
      '<p>'+(run.record?'Nuevo récord personal.':'Mejor puntaje: '+S.boss.best+'/15.')+(run.score>=10?' El jefe está impresionado.':' Repasa tus errores y vuelve a intentarlo.')+'</p>'+
      '<div class="row-btns"><button class="btn ghost" data-act="bossEnd">Salir</button><button class="btn red" data-act="bossStart">Otra vez</button></div></div>';
    return h;
  }
  return h+questionHTML(run,heartsHTML(run.lives)+' &nbsp;'+(run.i+1)+'/'+run.qs.length+' · '+run.score+' aciertos');
}

/* --- Logros --- */
function viewBadges(){
  const acc=S.stats.ans?Math.round(S.stats.ok/S.stats.ans*100)+'%':'—';
  let h='<p class="eyebrow">Tu expediente</p><h1 class="h-sm">Logros</h1>'+
    '<section class="labs" aria-label="Estadísticas">'+
    '<div><span>Preguntas</span><b>'+S.stats.ans+'</b></div>'+
    '<div><span>Precisión</span><b>'+acc+'</b></div>'+
    '<div><span>Tarjetas repasadas</span><b>'+S.stats.rev+'</b></div>'+
    '</section>'+
    '<div class="badges">'+BADGES.map(b=>{const on=!!S.badges[b.id];return '<div class="badge'+(on?'':' locked')+'"><span class="seal">'+esc(b.seal)+'</span><b>'+esc(b.name)+'</b><span>'+esc(b.desc)+'</span>'+(on?'<span>Obtenido el '+esc(S.badges[b.id])+'</span>':'')+'</div>'}).join('')+'</div>'+
    '<p class="note">'+(syncMode==='cuenta'?'Tu progreso se guarda en tu cuenta y te sigue en cualquier dispositivo donde abras esta página.':'Tu progreso se guarda en este navegador.')+'</p>'+
    '<div class="danger">';
  if(sess.confirmReset){
    h+='<p><b>¿Borrar todo tu progreso?</b> Se pierden XP, estrellas, tarjetas y logros. No se puede deshacer.</p><div class="row-btns"><button class="btn ghost" data-act="resetNo">Cancelar</button><button class="btn red" data-act="resetYes">Sí, borrar todo</button></div>';
  }else{
    h+='<button class="btn ghost" data-act="resetAsk">Borrar mi progreso</button>';
  }
  return h+'</div>';
}

/* ====================== MODAL, TOAST, ECG ====================== */
function ecgPath(width,height,beats){
  const w=width/beats,mid=height*0.62;
  const pts=[[0,0],[.16,0],[.21,-.16],[.26,0],[.34,0],[.37,.12],[.41,-.88],[.45,.42],[.48,0],[.58,0],[.66,-.26],[.74,0],[1,0]];
  let d='';
  for(let b=0;b<beats;b++){
    pts.forEach((p,i)=>{if(b>0&&i===0)return;d+=(b===0&&i===0?'M':'L')+(b*w+p[0]*w).toFixed(1)+' '+(mid+p[1]*height*0.5).toFixed(1)+' '});
  }
  return d;
}
function drawECG(){
  const svg=$('ecg');const W=Math.max(200,Math.round(svg.clientWidth||600)),H=26;
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  const d=ecgPath(W,H,Math.max(3,Math.round(W/120)));
  $('ecgBase').setAttribute('d',d);$('pulse').setAttribute('d',d);
}
function beat(){
  if(reduced)return;
  const p=$('pulse');
  if(!p||!p.animate)return;
  p.animate([{strokeDashoffset:7,opacity:1},{strokeDashoffset:-100,opacity:1}],{duration:1300,easing:'linear'});
}
function toast(msg,cls){
  const el=document.createElement('div');
  el.className='toast'+(cls?' '+cls:'');
  el.textContent=msg;
  toastsEl.appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),320)},1700);
}
function renderModal(){
  if(!sess.modal){modalEl.innerHTML='';return}
  const r=RANKS[sess.modal.r],n=RANKS[sess.modal.r+1];
  modalEl.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle"><div class="box">'+
    '<p class="v-lab">Ascenso</p><p class="m-rank">'+r.code+'</p><h2 id="mtitle">'+esc(r.name)+'</h2>'+
    '<svg viewBox="0 0 300 60" aria-hidden="true"><path pathLength="1" d="'+ecgPath(300,60,3)+'"/></svg>'+
    '<p>Llevas '+S.xp+' XP. '+(n?'Siguiente rango: '+esc(n.name)+' a los '+n.xp+' XP.':'Llegaste al rango más alto.')+'</p>'+
    '<button class="btn red" data-act="closeModal" id="mclose">Seguir estudiando</button></div></div>';
  const b=$('mclose');if(b)b.focus();
}

/* ====================== ACCIONES ====================== */
function nav(v){view=v;sess.confirmReset=false;render();scrollTop()}
const A={
  go(d){if(d.v==='boss'&&sess.boss&&sess.boss.done)sess.boss=null;nav({name:d.v})},
  open(d){nav({name:'topic',id:d.id,tab:d.tab||'learn'})},
  tab(d){
    view.tab=d.tab;
    if(d.tab==='quiz'&&sess.quiz&&sess.quiz.done)sess.quiz=null;
    if(d.tab==='cards'&&sess.cards&&sess.cards.done)sess.cards=null;
    render();scrollTop();
  },
  lprev(){sess.learn.i=Math.max(0,sess.learn.i-1);render();scrollTop()},
  lnext(){sess.learn.i++;render();scrollTop()},
  lfinish(){
    const p=tp(view.id);
    if(!p.learn){p.learn=true;gain(20,'lección');checkBadges();persist()}
    view.tab='quiz';sess.quiz=null;render();scrollTop();
  },
  ans(d){answer(+d.k)},
  qnext(){nextQ()},
  qretry(){sess.quiz=null;render();scrollTop()},
  pick(d){casePick(+d.k)},
  cnext(){caseNext()},
  cretry(){sess.case=null;render();scrollTop()},
  flip(){const r=curCardRun();if(r&&!r.done){r.flipped=!r.flipped;render()}},
  rate(d){rateCard(d.k==='1')},
  cardsAgain(){
    if(view.name==='topic'){sess.cards=null}
    else{sess.review={kind:'cards',run:newCardRun(dailyQueue(),'daily')}}
    render();scrollTop();
  },
  startReview(){sess.review={kind:'cards',run:newCardRun(dailyQueue(),'daily')};render();scrollTop()},
  startErrors(){if(!S.wrong.length)return;sess.review={kind:'errors',run:newQuizRun('errors',shuffle(S.wrong).slice(0,15))};render();scrollTop()},
  endReview(){sess.review=null;render();scrollTop()},
  bossToggle(){sess.bossOnly=!sess.bossOnly;render()},
  bossStart(){
    const learned=TOPICS.filter(t=>tpv(t.id).learn);
    const src=(sess.bossOnly&&learned.length)?learned:TOPICS;
    const pool=[];src.forEach(t=>t.Q.forEach(q=>pool.push(q.id)));
    sess.boss=newQuizRun('boss',shuffle(pool).slice(0,15));
    render();scrollTop();
  },
  bossEnd(){sess.boss=null;render();scrollTop()},
  closeModal(){sess.modal=null;renderModal()},
  resetAsk(){sess.confirmReset=true;render()},
  resetNo(){sess.confirmReset=false;render()},
  resetYes(){S=blank();sess={};persist();render();scrollTop();toast('Progreso borrado')}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el||el.disabled)return;
  const fn=A[el.dataset.act];
  if(fn)fn(el.dataset,el);
});
document.addEventListener('keydown',e=>{
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;
  if(e.key==='Escape'&&sess.modal){A.closeModal();return}
  const k='1234'.indexOf(e.key)>=0?'1234'.indexOf(e.key):'abcd'.indexOf(e.key.toLowerCase());
  if(k>=0&&e.key.length===1){
    const b=document.querySelector('.opt[data-k="'+k+'"]:not([disabled])');
    if(b){e.preventDefault();b.click()}
  }
});
let rz=null;
window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(drawECG,150)});

/* ====================== ARRANQUE ====================== */
function boot(data){
  if(data&&data.view&&data.view.name)view=data.view;
  drawECG();
  render();
  setTimeout(initRemote,0);
}
try{const hot=window.claude&&window.claude.hot;if(hot&&typeof hot.snapshot==='function')hot.snapshot(()=>({view:view}))}catch(e){}
const hot=window.claude&&window.claude.hot;
if(hot&&typeof hot.ready==='function')hot.ready(boot);
else boot((hot&&hot.data)||{});
})();
</script>
